<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Praxys</title>
  <style>
    :root { color-scheme: light dark; --paper: oklch(0.975 0.008 85); --ink: oklch(0.18 0.02 260); --primary: oklch(0.35 0.14 155); --button-ink: oklch(0.975 0.008 85); }
    @media (prefers-color-scheme: dark) { :root { --paper: oklch(0.17 0.013 260); --ink: oklch(0.96 0.006 260); --primary: oklch(0.82 0.18 155); --button-ink: oklch(0.17 0.013 260); } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; line-height: 1.5; }
    main { max-width: 32rem; margin: 12vh auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; line-height: 1.2; margin: 2rem 0 1rem; }
    button { font: inherit; font-weight: 600; min-height: 3rem; padding: 0.75rem 1.5rem; border: 0; border-radius: 0.375rem; background: var(--primary); color: var(--button-ink); cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    button:disabled { opacity: 0.7; cursor: wait; }
    #status { min-height: 3rem; }
  </style>
</head>
<body>
  <main>
    <strong>Praxys</strong>
    <h1 id="heading">更新页面</h1>
    <p id="description">重新获取最新版页面，保留本站的登录信息和设置。</p>
    <button id="update" type="button">更新并打开设置</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    // Legacy workers excluded /api/ navigations. This is a static document
    // on the frontend host, not a backend API or an account operation.
    const zh = navigator.language.toLowerCase().startsWith('zh');
    const copy = zh ? {
      heading: '更新页面', description: '重新获取最新版页面，保留本站的登录信息和设置。',
      button: '更新并打开设置', pending: '正在更新…', offline: '连接网络后再试。',
      error: '更新未完成，请重试。',
    } : {
      heading: 'Update this page', description: 'Get the current page while keeping your sign-in and settings for this site.',
      button: 'Update and open Settings', pending: 'Updating…', offline: 'Connect to the internet and try again.',
      error: 'The update did not finish. Please try again.',
    };
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    document.getElementById('heading').textContent = copy.heading;
    document.getElementById('description').textContent = copy.description;
    const button = document.getElementById('update');
    const status = document.getElementById('status');
    button.textContent = copy.button;
    button.addEventListener('click', async () => {
      if (!navigator.onLine) { status.textContent = copy.offline; return; }
      button.disabled = true;
      status.textContent = copy.pending;
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            const worker = registration.active || registration.waiting || registration.installing;
            if (!worker) continue;
            const source = new URL(worker.scriptURL);
            if (registration.scope === location.origin + '/' && source.origin === location.origin && source.pathname === '/sw.js') {
              if (!await registration.unregister()) throw new Error('unregister failed');
            }
          }
        }
        location.replace('/settings');
      } catch {
        status.textContent = copy.error;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
