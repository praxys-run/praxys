# Canonical translations for Praxys domain terminology.
# Injected into the translate_missing.py system prompt so CI runs stay
# terminology-consistent across months. Add a row here before merging a PR
# that introduces a new term; never change an existing row in a way that
# reinterprets it without also sweeping the catalog.
#
# Format: one row per term. Leave a locale empty if the English form is
# canonical (e.g., "HRV", "TSB", "CP" are acronyms that stay English in zh).

style:
  principles:
    - 面向中国大陆耐力运动用户，写自然的产品中文，不照搬英文语序。
    - 语气简洁、直接、专业但不官僚；按钮用明确动作，说明文字像教练在解释。
    - 能省略主语和物主代词时就省略；确需指代用户时用“你”，不用过度正式的“您”。
    - 标签要和同一页面的相邻标签结构平行，避免同一概念在不同页面换词。
    - 使用中文标点和中文排版；技术缩写、品牌名、公式、单位及占位符保持原样。
    - 优先表达用户能做什么或看到什么，避免“进行”“实现”“提供方”等翻译腔。
  forbidden_target:
    - term: 您
      prefer: 省略主语；确需指代时用“你”
    - term: 账户
      prefer: 账号
    - term: 电子邮件
      prefer: 邮箱
    - term: 等候名单
      prefer: 候补名单
    - term: 等待名单
      prefer: 候补名单
    - term: 仪表盘
      prefer: 主页
    - term: 仪表板
      prefer: 主页
    - term: 拉取
      prefer: 同步或获取
    - term: 速率限制
      prefer: 访问频率限制或限流
    - term: 合规度
      prefer: 计划完成度
    - term: 提供方
      prefer: 数据来源
    - term: 恢复度
      prefer: 准备度
  exact_translations:
    - source: Follow Plan
      target: 按计划训练
    - source: Go Easy
      target: 轻松训练
    - source: No Data
      target: 暂无数据
    - source: Waitlist
      target: 候补名单
    - source: Dashboard
      target: 主页
    - source: Weekly volume
      target: 周里程
    - source: Weekly Volume
      target: 周里程
    - source: Sleep Score
      target: 睡眠评分
    - source: Training Zones
      target: 训练区间
    - source: Public status
      target: 公开状态页
    - source: Comfortable
      target: 稳妥目标
    - source: Stretch
      target: 挑战目标
    - source: Activities
      target: 活动
    - source: Weekly Load Compliance
      target: 周训练负荷完成度
    - source: Change Goal
      target: 调整目标
    - source: Target Time
      target: 目标完赛时间
    - source: optional
      target: 选填
    - source: Sub-3 marathon · 100K · stay healthy…
      target: 全马破三 · 100K · 保持健康…
  allowed_same_as_source:
    - Praxys
    - Garmin
    - Stryd
    - Oura
    - Strava
    - COROS
    - HRV
    - TSB
    - CTL
    - ATL
    - CP
    - FTP
    - VO2max
    - RSS
    - rTSS
    - TRIMP
    - LTHR
    - MFA
    - MAU
    - WAU
    - Web
    - Azure Monitor
    - demo-password
    - km
    - W
    - bpm

semantic_rules:
  # Blocking terminology invariants. A human_review_category also routes the
  # matched entry into the generated PR's review manifest; it is not approval.
  - id: training-base
    source_contains: training base
    required_target_terms: [训练基准]
    forbidden_target_terms: [训练依据, 训练基础]
  - id: average-work-metric
    source_equals: "Avg Work {intensityLabel}"
    required_target_terms: [工作段平均, "{intensityLabel}"]
    forbidden_target_terms: [强度, 平均工作]
  - id: canonical-plan
    source_contains: canonical plan
    required_target_terms: [主计划]
    forbidden_target_terms: [原始计划, 规范计划]
    human_review_category: plan-authority
  - id: managed-delivery
    source_contains: managed delivery
    required_target_terms: [托管下发]
    forbidden_target_terms: [自动下发, 托管交付]
    human_review_category: plan-authority
  - id: managed-delivery-hyphenated
    source_contains: managed-delivery
    required_target_terms: [托管下发]
    forbidden_target_terms: [自动下发, 托管交付, 托管投递]
    human_review_category: plan-authority
  - id: symptom-stop
    source_contains: symptom stop
    required_target_terms: [症状停止]
    forbidden_target_terms: [症状中止]
    human_review_category: safety
  - id: reference-band
    source_contains: reference band
    required_target_terms: [参考区间]
    forbidden_target_terms: [参考范围]
    human_review_category: science
  - id: all-out-5k
    source_equals: Not an all-out 5K effort
    required_target_terms: [5 公里]
    forbidden_target_terms: [全力 5K]
    human_review_category: safety
  - id: direct-10k-baseline
    source_equals: 10K direct baseline
    required_target_terms: [直接基线]
    forbidden_target_terms: [直接基准]
    human_review_category: science
  - id: peer-metrics
    source_equals: Peer metrics
    required_target_terms: [训练指标]
    forbidden_target_terms: [对比指标]
  - id: policy-unavailable
    source_equals: Policy unavailable
    required_target_terms: [政策]
    forbidden_target_terms: [策略]
    human_review_category: plan-authority
  - id: privacy-copy
    source_contains: privacy
    human_review_category: privacy
  - id: private-copy
    source_contains: private
    human_review_category: privacy
  - id: diagnosis-boundary
    source_contains: diagnosis
    source_paths: ["src/components/**", "src/pages/**"]
    human_review_category: safety
  - id: science-surface
    source_contains: science
    source_paths: ["src/components/**", "src/pages/**"]
    human_review_category: science

terms:
  # Agentic change-loop operations
  - en: Agent
    zh: 智能体
    note: Autonomous coding or operations agent, not a human representative.
  - en: Policy gate
    zh: 策略门禁
    note: Automated policy enforcement before approval or merge.

  # Training signals / categories
  - en: Recovery
    zh: 恢复
    note: Also means "rest zone" in Coggan 5-zone. Distinct from "rest" (休息).
  - en: Rest
    zh: 休息
  - en: Fresh
    zh: 充分恢复
    note: HRV-based status (Plews SWC), not "fresh" as in "just arrived".
  - en: Fatigued
    zh: 疲劳
  - en: Normal
    zh: 正常
  - en: No Data
    zh: 暂无数据
  - en: Follow Plan
    zh: 按计划训练
  - en: Go Easy
    zh: 轻松训练
  - en: Modify
    zh: 调整
  - en: Adjust Workout
    zh: 调整训练
  - en: Reduce Intensity
    zh: 降低强度
  - en: Recovery Day
    zh: 恢复日

  # Training zones (Coggan 5-zone names)
  - en: Endurance
    zh: 耐力
  - en: Tempo
    zh: 节奏跑
    note: Sustained sub-threshold pace.
  - en: Threshold
    zh: 乳酸阈
    note: The physiological boundary, not the configuration setting.
  - en: VO2max
    zh: VO2max
    note: Keep English in tight UI labels / chart legends. Use 最大摄氧量 inline in prose
      where space allows and it reads more naturally.

  # Workout phases (parsed workout structure)
  - en: Warmup
    zh: 热身
  - en: Cooldown
    zh: 放松
  - en: Easy Run
    zh: 轻松跑
  - en: Steady
    zh: 匀速
  - en: Aerobic
    zh: 有氧
  - en: Rep
    zh: 组
    note: As in "Rep 1", "Rep 2" of an interval set.
  - en: Main
    zh: 主训练
  - en: Run
    zh: 跑步

  # Metrics / training base
  - en: Power
    zh: 功率
  - en: Pace
    zh: 配速
  - en: Heart Rate
    zh: 心率
  - en: Critical Power
    zh: 阈值功率
    note: Threshold-family naming (parallels 乳酸阈值心率 / 阈值配速). The academically
      literal 临界功率 was rejected as too clinical for self-coached runners.
  - en: Lactate Threshold HR
    zh: 乳酸阈值心率
  - en: Threshold Pace
    zh: 阈值配速
  - en: Max HR
    zh: 最大心率
  - en: Resting HR
    zh: 静息心率
  - en: RHR
    zh: 静息心率
    note: Spell out in zh rather than keeping the English abbreviation — Chinese readers
      don't recognize RHR the way they recognize HRV/TSB.
  - en: Baseline
    zh: 基准
    note: Recovery context only (HRV baseline, RHR baseline). 基线 reads too literal.
  - en: Backfill
    zh: 同步历史数据
    note: 回填 is a direct translation but feels database-ish; 同步历史数据 reads as a
      natural product action.
  - en: Distance
    zh: 距离
  - en: Duration
    zh: 时长
  - en: Elevation
    zh: 爬升
  - en: Volume
    zh: 里程
    note: Context-dependent; "weekly volume" = 周里程.
  - en: Weekly volume
    zh: 周里程
  - en: Training volume
    zh: 训练量
    note: Use 训练量 only when the concept is broader than running distance.
  - en: Training load
    zh: 训练负荷
  - en: Compliance
    zh: 计划完成度
    note: A comparison with the planned load, not regulatory compliance.
  - en: Readiness
    zh: 准备度
    note: Wearable/training metric. Do not alternate with 恢复度.

  # Acronyms — keep English
  - en: HRV
    zh: HRV
  - en: TSB
    zh: TSB
    note: Training Stress Balance. The Chinese rendering "训练压力平衡" is
      too verbose for tight UI labels; keep English and let surrounding
      context carry the meaning.
  - en: CTL
    zh: CTL
  - en: ATL
    zh: ATL
  - en: RSS
    zh: RSS
  - en: rTSS
    zh: rTSS
  - en: TRIMP
    zh: TRIMP
  - en: LTHR
    zh: LTHR
    note: Used interchangeably with "Lactate Threshold HR"; when standalone
      as a label keep English, when inside a sentence use 乳酸阈值心率.
  - en: CP
    zh: CP
  - en: FTP
    zh: FTP
  - en: VO2max
    zh: VO2max

  # Race distances
  - en: Marathon
    zh: 马拉松
  - en: Half Marathon
    zh: 半程马拉松
  - en: 5K
    zh: 5公里
  - en: 10K
    zh: 10公里
  - en: 50K
    zh: 50公里
  - en: 100K
    zh: 100公里

  # UI chrome
  - en: Settings
    zh: 设置
  - en: Today
    zh: 今日
  - en: Training
    zh: 训练
  - en: Goal
    zh: 目标
  - en: Science
    zh: 科学
    note: The app section name. In body prose, "training science" = 训练科学.
  - en: Activities
    zh: 活动
  - en: Setup
    zh: 设置向导
    note: Disambiguate from "Settings" (设置) — Setup is the onboarding flow.
  - en: Admin
    zh: 管理
  - en: Account
    zh: 账号
    note: Mainland consumer-product wording; 账户 sounds financial or bureaucratic.
  - en: Email
    zh: 邮箱
  - en: Waitlist
    zh: 候补名单
  - en: Dashboard
    zh: 主页
    note: The main product screen, not an analytics dashboard for operators.
  - en: Insight
    zh: 训练解读
    note: Product coaching content. Use 分析 only when referring to the analysis process.
  - en: Invitation code
    zh: 邀请码
  - en: Data provider
    zh: 数据来源
    note: Prefer 数据来源 in user-facing UI; 提供方 is technical implementation language.
  - en: Edit
    zh: 编辑
  - en: Cancel
    zh: 取消
  - en: Save
    zh: 保存
  - en: Retry
    zh: 重试
  - en: Connect
    zh: 连接
  - en: Disconnect
    zh: 断开连接
  - en: Sync
    zh: 同步

# Tone guidelines (also injected into the prompt):
# - Prefer 您 over 你 for user-facing prose — this app is a professional
#   training tool, not a casual product.
# - Keep English technical names inline where Chinese rendering is verbose
#   or unestablished (HRV, VO2max, CP).
# - Match source punctuation style (ellipses, quote marks).
# - Do not translate brand names: Praxys, Garmin, Stryd, Oura, Strava.
