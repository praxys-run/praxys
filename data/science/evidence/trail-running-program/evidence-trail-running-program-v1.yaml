known_gaps:
- Validated first-50-km admission, longest-run/back-to-back/vertical progression and full-course workload
  prescription.
- Outdoor descent initiation without prior comparable exposure, negative-incline treadmill and technical-ground
  progression.
- Direct comparative effectiveness of the proposed home bodyweight template, reported-history bridge and
  exact run/walk ratios.
- Individual fuel/hydration needs, heat/altitude exposure and complete event-day nutrition policy.
- Performance-specific quality progression and an integrated automated full-cycle trial across all intents.
conflicting_findings:
- Strength literature supports selected adaptations but a first-marathon programme did not prevent noncompletion
  injuries.
- Reduced downhill soreness does not necessarily reduce neuromuscular fatigue or improve running economy.
- Session-distance injury association and absence of preventive effect of a weekly 10% rule concern different
  exposures; neither yields a safe threshold.
- Ultra carbohydrate guidance ranges differ by exercise duration, intensity and tolerance; high intake
  is not automatically tolerated or required.
- Concurrent-training reviews differ by outcome and subgroup; an overall absence of sequence effect does
  not make every same-day arrangement equivalent.
follow_up_questions:
- Which supported module combinations can a representative no-gym/sparse-history population execute and
  understand without mistaking support for race readiness?
- What externally reviewed long-duration and course-specific doses can complete the 50-km policy without
  importing non-ultra approvals?
