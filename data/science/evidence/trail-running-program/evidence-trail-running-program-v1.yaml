  inclusion_criteria:
  - Peer-reviewed adult human studies, systematic reviews and authoritative position statements relevant
    to one of the ten domains
  - Prefer direct runner and terrain evidence; retain explicitly labelled indirect healthy-adult resistance
    and endurance guidance
  - Verified DOI/PMID/title/year and actual abstract or relevant full-text access for all cited sources
  exclusion_criteria:
  - Animal, pediatric, clinical/rehabilitation and unrelated records used as direct adult running prescription
    evidence
  - Commercial plans, inaccessible effects, exact personal safe thresholds or source protocols transplanted
    without appraisal
  quality_appraisal: Claim-level appraisal considers design, comparators, bias, sample size, population
    and sex representation, protocol duration, supervision, source-specific outcomes and directness. Strongest
    direct support is general resistance and endurance direction; home templates, calendar rules and trail
    transfer are indirect. Downhill studies are small laboratory protocols, nutrition statements are heterogeneous
    guidance, and first-50-km full-plan validation is absent from the selected evidence. All exact candidate
    prescriptions are guardrails; published source ranges are kept in a non-prescribing context group.
  method_limitations:
  - Single-agent selection and extraction; independent exact science review remains required.
  - Discovery retrieves the first 20 records per initial query and first 30 per refined query in API default
    order; unretrieved hits are not exclusions.
  - Some query families were noisy or sparse; targeted identifier and title verification was used. Negative
    findings are bounded to selected evidence, not proof no study exists.
  - Europe PMC/PMC only; no independent SPORTDiscus, Scopus, Embase, Web of Science search or new quantitative
    synthesis.
  - Eleven citations were read in relevant full-text paragraphs; thirteen were abstract-only. Full-text
    retrieval is not a claim to have read every paragraph or supplement.
  - Protocol documented during review; not prospectively registered. See adjacent manifest for all counts,
    results, source levels and failed-query limitations.
claims:
- id: trail-program.base-transfer-is-partial
  statement: Aerobic capacity and other conventional endurance characteristics relate to trail performance,
    so established general running can support a basic module. Trail performance is multifactorial; road
    fitness does not establish descent skill, comparable exposure or a finish forecast.
  source_ids:
  - de-waal-2021-performance-review
  - van-hooren-2020-treadmill-biomechanics
  evidence_strength: moderate
  applicable_population:
  - Adult runners in heterogeneous trail studies and acute treadmill/overground comparisons
  domain:
  - General running reuse
  - Daily training
  limitations:
  - The trail review includes seven studies and correlational models, not a validated automated prescription.
  - Treadmill comparisons are acute and mainly level; no universal grade or outdoor-equivalence conversion
    follows.
- id: trail-program.sparse-records-need-provenance
  statement: Running history and changes in exposure are relevant to planning; absent device data cannot
    be equated with a novice biological state. A structured athlete-reported bridge is an explicit Praxys
    option, not a validated evidence-equivalence or safety classifier.
  source_ids:
  - frandsen-2025
  - buist-2008
  evidence_strength: low
  applicable_population:
  - Adult recreational runners in a device-based observational cohort; novice runners in a randomized
    graded-training study
  domain:
  - Sparse history
  - Eligibility
  - Progression
  limitations:
  - Neither source directly validates self-report admission, a 28-day lookback, a session count, or the
    proposed bridge.
  - The 5205-person cohort was device-selected and only 22% female; associations do not establish causality
    or safety below a threshold.
  - The novice trial did not show injury prevention from the 10% rule; this does not contradict a session-distance
    association in a different population.
- id: trail-program.strength-support-with-protocol-limits
  statement: Resistance training improves muscle function in healthy adults; selected runner programmes
    improve running economy or performance over multiweek interventions. A low-dose introduction is a
    plausible support module, without a two-week efficacy or injury-prevention promise.
  source_ids:
  - currier-2026-resistance-position-stand
  - llanos-lagos-2024
  - blagrove-2018-running-strength
  - toresdahl-2020
  evidence_strength: moderate
  applicable_population:
  - Healthy adults, predominantly inexperienced strength trainees; runners in source-specific interventions;
    first-time marathon runners
  domain:
  - Strength inclusion
  - First finish
  limitations:
  - ACSM eligibility spans 6–52 weeks; the proposed introductory actions and doses have not been tested
    as a complete programme.
  - Runner protocols often involve heavier resistance or plyometrics; results do not validate a low-load
    home template.
  - One 720-person first-marathon trial found no reduction in overuse injuries causing noncompletion;
    no personal protective guarantee is allowed.
- id: trail-program.eccentric-control-not-descent-equivalence
  statement: Eccentric and isometric preconditioning can attenuate some subsequent laboratory downhill
    soreness or strength-loss outcomes. This supports evaluating controlled lower-limb strength as a distinct
    module, while withholding equivalence to outdoor descent practice or proven race transfer.
  source_ids:
  - bontemps-2020-downhill-review
  - eston-1996-eccentric-preconditioning
  - lima-2018-isometric-preconditioning
  - bontemps-2025-downhill-fatigue
  - tallis-2024-downhill-female
  evidence_strength: low
  applicable_population:
  - Small adult laboratory samples; predominantly young men, with one ten-woman downhill study
  domain:
  - Downhill-related strength
  - Eccentric control
  - Descent limits
  limitations:
  - Eston used maximal isokinetic knee extension in ten men; Lima used maximal isometric leg press in
    thirty untrained men. Neither tests the proposed squat/calf/bridge programme.
  - Lima did not find protection of running economy; it is an isometric study, not an eccentric strength
    trial.
  - Reduced soreness after repeated downhill bouts did not imply reduced neuromuscular fatigue in Bontemps
    2025.
  - No validated initial outdoor descent dose or progression law was identified in this bounded search.
- id: trail-program.home-access-not-equivalent-load
  statement: Home-based and elastic resistance training can improve strength; a gym location is not a
    physiological prerequisite. Equipment, available resistance and exercise skill remain material, and
    an arbitrary bodyweight sequence is not proven equivalent to machine or high-load training.
  source_ids:
  - currier-2026-resistance-position-stand
  - lopes-2019-elastic-resistance
  evidence_strength: moderate
  applicable_population:
  - Healthy adults in ACSM synthesis; mixed populations in eight elastic-resistance comparison studies
  domain:
  - No gym
  - Equipment substitution
  limitations:
  - ACSM explicitly states bodyweight-supported exercise was not evaluated as a standalone intervention
    except Nordic hamstring curl; the exact all-bodyweight template therefore remains a guardrail.
  - Elastic review had heterogeneous protocols, load standardization gaps and low-quality studies; similar
    pooled strength changes do not prove interchangeability of every exercise.
  - No maximal-strength or running-performance equivalence is claimed for the proposed no-equipment module.
- id: trail-program.stairs-and-incline-are-distinct
  statement: Stair ascent can provide an aerobic stimulus and controlled positive-incline treadmill work
    provides a practical running or walking context. Descending stairs is eccentric exposure; low cardiovascular
    effort does not erase its muscle loading.
  source_ids:
  - allison-2017-stair-climbing
  - paschalis-2013-stair-descending
  - van-hooren-2020-treadmill-biomechanics
  - bontemps-2020-downhill-review
  evidence_strength: low
  applicable_population:
  - Sedentary women in small intense stair trials; twenty healthy men using a specialized escalator; adults
    in treadmill comparisons
  domain:
  - Stairs
  - Treadmill
  - Ascent/descent separation
  limitations:
  - The intense stair study does not validate the easy introductory candidate or a trail-performance benefit.
    Its indexed erratum was found; no quantitative efficacy claim is extracted.
  - Paschalis used a purpose-built automatic escalator; do not copy its dose into ordinary stairs.
  - A positive-incline module cannot count as outdoor ascent observation, technical terrain or downhill
    adaptation. Negative-incline prescription remains separately unresolved.
- id: trail-program.dual-sessions-are-feasible-not-universal-spacing
  statement: Concurrent aerobic and strength programmes can improve both capacities. Session proximity
    may matter, particularly for explosive strength; separating sessions is a reasonable scheduling option,
    but no single interval guarantees recovery or superiority.
  source_ids:
  - schumann-2022-concurrent-training
  - concurrent-2026-umbrella
  - blagrove-2018-running-strength
  evidence_strength: moderate
  applicable_population:
  - Healthy adult concurrent-training participants, mainly recreationally trained; runner-specific programmes
  domain:
  - Dual sessions
  - Joint budget
  limitations:
  - The 2022 meta-analysis included 43 supervised studies; explosive-strength attenuation was more evident
    within the same session, with at-least-three-hour subgroup separation. This is not a validated safety
    cutoff.
  - The 2026 umbrella review found no significant sequence effect overall and limited highly trained evidence.
  - Four-hour candidate separation and 48/72-hour buffers are Praxys guardrails, not biological laws.
  - Running time and strength time share calendar capacity but are not physiologically interchangeable.
- id: trail-program.run-walk-is-a-practice-option
  statement: A run/walk strategy may reduce perceived discomfort while preserving similar completion times
    in a small non-elite road-marathon trial. It can be offered as a practice format; it does not establish
    reduced cardiac stress, an optimal ratio or first-trail completion readiness.
  source_ids:
  - hottenrott-2016-run-walk
  - de-waal-2021-performance-review
  evidence_strength: low
  applicable_population:
  - Forty-two non-elite road-marathon participants; indirect transfer to adult trail novices with a running
    base
  domain:
  - First finish
  - Run/walk
  - Hiking
  limitations:
  - Only indexed abstract was read for the run/walk trial; exact study pacing intervals are not reconstructed.
  - No direct validation of the proposed 4:1/2:1/1:1 introductory ratios or a first-50-km schedule.
  - Walking on technical or steep terrain still has distinct demands; comfortable effort does not establish
    safe footing.
- id: trail-program.fifty-km-needs-duration-specific-coverage
  statement: Single-stage ultramarathon preparation requires attention to duration, terrain, intake tolerance
    and environmental context. A 50,000-m goal belongs within the requested product scope but cannot be
    covered by relabelling a 49,999-m non-ultra contract or by distance alone.
  source_ids:
  - costa-2019-ultramarathon-nutrition
  - tiller-2019-ultra-nutrition
  - bontemps-2020-downhill-review
  evidence_strength: low
  applicable_population:
  - Adults described in single-stage ultramarathon nutrition syntheses and downhill research
  domain:
  - 50 km inclusive
  - Long-duration preparation
  limitations:
  - The sources do not validate a complete first-50-km programme, longest-run prescription, back-to-back
    dose, vertical progression or personal finish probability.
  - Ultra nutrition literature spans distances and durations beyond 50 km; transport to a particular course
    must remain explicit.
  - General support modules can be prescribed as candidates; unresolved long-duration and course-specific
    coverage prevents a full race-preparation claim.
- id: trail-program.fuel-practice-is-individual
  statement: Practising a tolerable nutrition strategy during prolonged training is evidence-consistent.
    Published carbohydrate guidance varies with context; a starter practice target must not be advertised
    as a complete personal race nutrition plan.
  source_ids:
  - tiller-2019-ultra-nutrition
  - costa-2019-ultramarathon-nutrition
  - jeukendrup-2017-gut-training
  evidence_strength: moderate
  applicable_population:
  - Adult endurance and ultramarathon runners represented in guidance; some gut-mechanism evidence is
    animal-based
  domain:
  - Fuel practice
  - Long-duration support
  limitations:
  - ISSN reports 30–50 g/h carbohydrate for single-stage ultra racing as category C guidance; Costa discusses
    approximately 90 g/h for prolonged exercise while explicitly questioning ultra tolerability.
  - The 2017 gut review relies partly on animal mechanistic extrapolation; no promise of adaptation after
    fourteen days.
  - Exact starter timing and progression are candidate guardrails; no fixed fluid or sodium dose, restrictive
    diet, supplement or clinical GI treatment is inferred.
  - Thirst-based practical advice is not assurance against heat illness or a rehydration prescription
    between closely spaced sessions.
- id: trail-program.taper-direction-transfers-with-limits
  statement: Reducing training volume before competition while retaining familiar intensity and frequency
    can improve endurance time-trial performance in studied athletes. This supports a reviewable taper
    option, with explicit uncertainty for first-time trail and 50-km goals.
  source_ids:
  - wang-2023
  evidence_strength: moderate
  applicable_population:
  - Well-trained endurance athletes in fourteen studies, predominantly male
  domain:
  - Taper
  - Preparation cycle
  limitations:
  - The review required VO2max above 55 ml/kg/min or at least well-trained classification; recreational
    first-finish applicability is indirect.
  - The review reports effective 41–60% volume reduction and durations up to 21 days; exact fourteen-day
    60%/40% remaining volumes are a Praxys choice.
  - No overload before taper is prescribed; study-level overload effects do not authorize novel workload.
  - Running volume evidence does not quantify trail vertical or strength taper dose; those stay distinct
    guardrails or unavailable modules.
- id: trail-program.feedback-does-not-measure-adaptation
  statement: Load changes and non-medical interruptions warrant reassessment. Fitness outcomes change
    at different rates, and symptom feedback is useful for adjustment without quantifying adaptation,
    recovered strength or personal injury risk.
  source_ids:
  - frandsen-2025
  - buist-2008
  - barbieri-2023
  - bontemps-2025-downhill-fatigue
  evidence_strength: low
  applicable_population:
  - Adult recreational runners and heterogeneous trained endurance populations
  domain:
  - Progression
  - Regression
  - Restart
  - Review
  limitations:
  - No reviewed source validates exact 7/14-day review cadence, completion fractions, five-minute increments,
    percentage restart doses or a safe ACWR zone.
  - The candidate uses no fixed fitness-loss estimate and no automated return after illness/injury.
  - Absence of soreness is insufficient for descent progression or race readiness.
