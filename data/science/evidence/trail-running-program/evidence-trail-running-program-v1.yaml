schema_version: 1
id: evidence-trail-running-program-v1
version: 1
title: 'Universal trail-running preparation: exact candidate modules and unresolved race coverage'
research_question: For nonclinical adults with an existing running base, including sparse device history
  and no gym, what supports executable daily, first-finish and performance preparation modules through
  single-day 50,000 m goals, and which exact long-duration, descent and full-cycle prescriptions remain
  unsupported?
topic: trail-running-program
status: draft
approval_mode: artifact
authors:
- agent:codex
human_reviewers: []
created_on: '2026-09-14'
reviewed_on: null
intended_product_purpose: 'Provide a successor review package for Issue #798 with positive executable
  candidates across the ten requested research domains, exact guardrails, explicit partial support and
  immutable history. This is not evidence or prescription acceptance.'
scope:
  population:
  - Adults aged at least 18 with an established running base; nonclinical daily, first-trail/first-distance
    finish or performance goals
  - Different resource access and strength experience, including no gym and sparse device history
  intervention_or_exposure:
  - General running reuse, structured history bridge, eccentric-control/home strength, positive-incline
    treadmill and stairs
  - Concurrent running and strength, run/walk, fuel practice, taper, feedback and non-medical restart
  comparator:
  - Running-only or conventional resistance programmes
  - Different equipment, session placement, continuous running, pre-taper training and cessation
  outcomes:
  - Muscle function, running performance, fatigue and soreness, tolerance and practical applicability
  - Uncertainty in automated doses, terrain transfer and complete first-50-km preparation
