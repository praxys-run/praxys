      - S. W. Bredeweg
      - W. van Mechelen
      - K. A. P. M. Lemmink
      - G. J. Pepping
      - R. L. Diercks
    year: 2008
    journal: The American Journal of Sports Medicine
    doi: 10.1177/0363546507307505
    pmid: "17940147"
  - id: impellizzeri-2020
    title: "Acute:Chronic Workload Ratio: Conceptual Issues and Fundamental Pitfalls"
    authors:
