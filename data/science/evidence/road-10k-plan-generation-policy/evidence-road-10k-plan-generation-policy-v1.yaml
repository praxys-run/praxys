known_gaps:
  - A prospectively evaluated deterministic road 10 km plan-generation policy
  - Direct adult recreational road 10 km evidence distinguishing useful threshold and interval session structures
  - A validated 42-day generation horizon or 14-day reassessment interval
  - A validated minimum recent-history requirement for safe dose anchoring
  - A validated 75 percent low-intensity floor or three-to-six-day running range
  - A direct recreational 10 km long-run dose or progression rule
  - A validated deterministic mapping from personal history and availability to exact workout steps
  - A validated 56-day direct-baseline freshness cutoff
  - Agreement and repeatability for one standardized unsupervised outdoor road 10 km test
  - Representation and subgroup precision for women, older adults, low-frequency runners, and different providers
conflicting_findings:
  - Direct recreational evidence shows improvement under different intensity distributions without a universal performance winner.
  - More weekly distance and frequency are associated with faster 10 km performance, while observational data do not establish a safe or optimal prescription.
  - A standardized 10 km time trial can agree with race speed under one protocol, while time of day and other context can materially affect repeated results.
  - Taper evidence supports lower volume with maintained intensity and frequency, while its directness varies by sport, event, and prior training.
follow_up_questions:
  - Does a 42-day stable-load block improve 10 km proposal relevance without increasing burden or adverse events?
  - Which recent-history counts and frequency bounds minimize unsupported extrapolation?
  - Is a 75 percent planned low-intensity floor understandable and useful without becoming a universal claim?
  - Which threshold and 10 km-specific interval templates can be validated as product guardrails?
  - Should a maximal 10 km test be offered at all, or should stale and missing direct evidence remain readiness-only?
  - How should route, time of day, environment, assistance, and recovery affect longitudinal comparability?
  - Do outcomes, acceptance, edits, and safety exits differ by sex, age, frequency, provider, or missingness?
