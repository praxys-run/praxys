known_gaps:
  - Test-retest repeatability, absolute error, learning effect, and sensitivity for one unsupervised outdoor 5 km protocol in adult recreational runners
  - Agreement between a standardized solo 5 km time trial and a measured 5 km road race
  - Prospective evidence linking baseline age to materially changed plan decisions or outcomes
  - Environment, surface, elevation, footwear, pacing, and recovery tolerances that preserve comparability
  - Representation and subgroup precision by sex, age, training history, performance level, and sparse-data status
  - Validated low-exertion alternatives for runners who decline or should not attempt a maximal 5 km test
conflicting_findings:
  - Fixed-distance time trials can be reproducible under controlled protocols, while outdoor and race contexts improve task directness but add environmental, pacing, and motivation variation.
  - Critical-speed methods can be reliable within one protocol yet transfer poorly across trial selection, mathematical model, treadmill, track, and road settings.
  - A shorter field test can reduce duration while increasing construct translation and does not necessarily reduce physiological or safety burden.
follow_up_questions:
  - What prospectively defined precision and agreement criteria would be sufficient to promote the 5 km pilot from supporting to equivalent evidence?
  - Which environmental and protocol deviations should invalidate a baseline rather than merely lower confidence?
  - Does baseline age add predictive or decision value after intervening training, interruption, and illness are modeled?
  - Which safer goal contract should be offered when a maximal test is declined or inappropriate?
