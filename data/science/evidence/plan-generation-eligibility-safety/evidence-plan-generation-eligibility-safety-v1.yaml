    pmid: "34819869"
known_gaps:
  - A validated recent-history depth threshold for automatic dose anchoring
  - A universal recreational-running frequency or long-run prescription
  - Direct plan-generation trials comparing beginner, sparse-history, history-rich, and masters policy states
  - A validated dynamic training-context pattern vocabulary and transition rule
  - A validated no-event completion or performance-goal capstone workflow
  - A validated race-dense event-calendar prioritization and conflict policy
  - A minimal provider-profile and user-confirmation contract with field-level consent and retention evidence
  - Prospective evidence that a masters modifier improves decisions without unnecessary exclusion
  - Representative evidence for women, older women, low-frequency runners, and provider-specific missingness
  - A validated minimal context vocabulary that improves fit without pressuring athletes to disclose why training was missed
  - Calibrated individual plan-achievement probabilities for any supported population
conflicting_findings:
  - Recent distance changes are associated with injury in some windows and exposure definitions, while weekly ratios and longer follow-up did not consistently retain associations.
  - Mostly low-intensity organization is supported, while studies do not identify one universally superior polarized or pyramidal distribution.
  - Older age changes performance and recovery physiology, while highly capable masters athletes show that age alone is not a capability classification.
  - Studies use novice, recreational, trained, and elite cohort labels, while those labels do not establish stable product identities or deterministic individual plan routes.
follow_up_questions:
  - Which recent-history states and minimum anchors best prevent unsupported dose extrapolation?
  - When should sparse-history or masters status become a separate policy family rather than a modifier?
  - Which dynamic patterns improve routing without becoming permanent labels or opaque scores?
  - When should a no-event goal use a controlled completion activity, an opt-in performance benchmark, or continued rolling training?
  - Which imported event and profile fields materially improve planning, and which should remain point-of-use questions?
  - How should primary, supporting, and training events alter quality-session, recovery, and taper decisions?
  - Which exact distance-specific values can be prospectively tested without being presented as published safety thresholds?
  - How often do clarification requests improve plan fit versus increase privacy burden or abandonment?
  - Which false-stop, false-safe, adverse-exit, and subgroup criteria should stop or narrow a future policy?
