known_gaps:
  - Direct longitudinal runner studies matching same-provider sample power across environmental conditions
  - Prospective validation of fixed and athlete-specific comparable-power support bands
  - Representative distributions of stable-segment percent Critical Power across the target population
  - Sensitivity of released curve shape and availability to support-band width
  - Effects of device, firmware, Critical Power estimate error, terrain, wind, duration, hydration, and acclimation
conflicting_findings:
  - Moderate fixed-work heat studies establish cardiovascular-drift plausibility but do not identify an exact running-power band
  - Critical Power distinguishes intensity domains, but its fraction of VO2max varies across people and contexts
  - A wider band increases data support while potentially mixing less comparable exercise domains
follow_up_questions:
  - Does a prespecified athlete-specific band improve release stability without increasing misleading curves?
  - What minimum band width remains robust when the training median is near the model boundary?
  - How sensitive are supported bins to Critical Power estimate error and model-version changes?
  - Does a cohort pilot reproduce the single-athlete sensitivity result across sex, training history, climate, and terrain?
