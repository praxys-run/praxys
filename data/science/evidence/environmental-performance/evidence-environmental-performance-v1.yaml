known_gaps:
  - Personal matched-workload response models with adequate temperature and vapor-pressure spread
  - Discipline-specific effects for trail running, cycling, and interval training
  - Direct solar, wind, clothing, and route-exposure data in ordinary activity records
  - Validation of environmental proxies at altitude and across weather providers
conflicting_findings:
  - El Helou 2012 did not find an independent humidity effect in mass marathons, while Mantzios 2022 found all four weather parameters informative in elite events
  - A small humid-heat cycling study found earlier central motor-drive reduction, but it cannot establish a population humidity coefficient
follow_up_questions:
  - What minimum history and environmental spread support a personal pace-at-power or heart-rate-at-power observation?
  - Which provider inputs are sufficient for full outdoor WBGT rather than a degraded proxy?
  - How should discipline and terrain applicability be represented in future environmental context?
review_notes:
  - Product scope was maintainer-vetted in issues #444 and #459.
  - Population effects are recorded as context and must not alter recorded performance or existing forecasts.
