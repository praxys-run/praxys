schema_version: 1
id: evidence-environmental-performance-v1
version: 1
title: "Environmental heat and endurance performance"
research_question: >
  What does human evidence support about temperature, humidity or vapor
  pressure, wind, solar load, and their use in interpreting endurance
  performance?
topic: environmental-performance
status: accepted
authors:
  - agent:github-copilot
human_reviewers:
  - github:dddtc2005
created_on: 2026-07-25
reviewed_on: 2026-07-25
intended_product_purpose: >
  Bound environmental context and proxy claims, distinguish psychrometric wet
  bulb from outdoor WBGT, and prevent one population coefficient from becoming
  a universal personal performance correction.
scope:
  population:
    - Adults exercising in heat
    - Elite and mass-participation endurance athletes
    - Heat-acclimated trained cyclists in one controlled study
  intervention_or_exposure:
    - Air temperature, atmospheric moisture, wind, and solar radiation
    - Hot-dry and hot-humid exercise
  comparator:
    - Neutral or more favorable environmental conditions
    - Air temperature alone versus composite environmental indices
  outcomes:
    - Endurance performance or completion
    - Heat exchange and evaporative capacity
    - Wet-bulb and WBGT estimation accuracy
method:
  review_type: rapid
  search_date: 2026-07-25
  sources:
    - name: Crossref DOI API
      search_string: >
        GET /works/{doi} for 10.1175/JAMC-D-11-0143.1,
        10.1016/j.autneu.2016.03.001, 10.1152/physrev.00038.2020,
        10.1249/MSS.0000000000002769,
        10.1371/journal.pone.0037407, 10.3390/life11111149, and
        10.1080/15459620802310770
    - name: PubMed E-utilities
      search_string: >
        10.1016/j.autneu.2016.03.001[aid] OR
        10.1152/physrev.00038.2020[aid] OR
        10.1249/MSS.0000000000002769[aid] OR
        10.1371/journal.pone.0037407[aid] OR
        10.3390/life11111149[aid] OR
        10.1080/15459620802310770[aid]
  inclusion_criteria:
    - Human thermoregulation or endurance-performance research
    - Large observational, controlled, integrative-review, or validated environmental-model evidence
    - Explicit treatment of at least one requested environmental input
    - Stable DOI metadata and an abstract or indexed record
  exclusion_criteria:
    - Universal personal pace corrections without individual validation
    - Indoor-condition inference from outdoor weather alone
    - Medical heat-risk diagnosis from performance data
  quality_appraisal: >
    Mechanistic heat-transfer claims are separated from observational
    performance associations and small laboratory results. Population,
    discipline, weather resolution, and model-input requirements constrain each
    claim.
  method_limitations:
    - Known-source verification rather than a comprehensive discovery search
    - Claims were checked against indexed abstracts and metadata, not every full text
    - Discipline-specific coefficients and interaction effects need deeper extraction
claims:
  - id: environment.heat-balance-multifactor
    statement: >
      Exercise heat balance depends on air temperature, ambient water-vapor
      pressure, air movement, radiant load, clothing, body characteristics, and
      metabolic heat production; no single weather value captures all pathways.
    source_ids:
      - cramer-jay-2016
      - periard-2021
    evidence_strength: high
    applicable_population:
      - Humans exercising or working in heat
    domain:
      - Thermoregulation
      - Environmental heat exchange
    limitations:
      - Reviews synthesize mechanisms rather than one field-effect coefficient
      - Actual heat transfer depends on clothing, posture, morphology, and work rate
  - id: environment.relative-humidity-insufficient
    statement: >
      Relative humidity must be interpreted with air temperature because
      evaporative capacity depends on the water-vapor pressure gradient between
      skin and ambient air; relative humidity alone is not a complete measure
      of evaporative constraint.
    source_ids:
      - cramer-jay-2016
      - periard-2021
    evidence_strength: high
    applicable_population:
      - Humans exercising in environments where evaporation contributes to cooling
    domain:
      - Humidity and vapor pressure
      - Evaporative heat loss
    limitations:
      - Field magnitude still depends on wind, clothing, sweating, and metabolic heat
  - id: environment.wbgt-population-performance
    statement: >
      In 1,258 elite endurance races, WBGT predicted performance better than air
      temperature alone; the observed optimal WBGT and performance slopes are
      population and discipline associations, not personal correction factors.
    source_ids:
      - mantzios-2022
    evidence_strength: moderate
    effect_estimates:
      - metric: Observed optimal WBGT
        range_low: 7.5
        range_high: 15
        unit: degrees C WBGT
        context: Elite endurance events across several disciplines
      - metric: Performance change outside the observed optimal WBGT range
        range_low: 0.3
        range_high: 0.4
        unit: percent decline per degree C WBGT
        context: Observational, discipline-dependent association
      - metric: Weather-model explanatory power
        range_low: 0.21
        range_high: 0.58
        unit: R-squared
        context: Discipline-dependent decision-tree models
    applicable_population:
      - Elite and competitive marathon, race-walking, and track athletes represented in the study
    domain:
      - Population endurance performance
      - Composite environmental indices
    limitations:
      - Observational decision-tree analysis does not establish causality
      - Weather stations averaged 8.9 km from venues with substantial variation
      - Results differ by discipline and should not be applied to trail, cycling, or intervals without validation
  - id: environment.temperature-nonlinear
    statement: >
      Across roughly 1.79 million marathon performances, the
      temperature-performance relationship was nonlinear, optimal temperature
      differed by performance level, and slowing and withdrawals increased
      above the optimum.
    source_ids:
      - el-helou-2012
    evidence_strength: moderate
    applicable_population:
      - Mass-participation finishers in six major road marathons
    domain:
      - Road-marathon performance
      - Air temperature
    limitations:
      - Observational race-level evidence
      - Single race-time weather measurements do not capture within-race variation
      - Separate factor analyses may not resolve temperature-humidity interactions
      - Road-marathon findings are not a universal training or trail correction
  - id: environment.hot-dry-and-humid
    statement: >
      In ten heat-acclimated cyclists, both hot-dry and hot-humid conditions
      impaired 20 km time-trial performance versus neutral conditions, while
      reduced neuromuscular activation appeared earlier in the humid trial.
    source_ids:
      - baillot-2021
    evidence_strength: very_low
    applicable_population:
      - Heat-acclimated trained cyclists similar to the ten-person sample
    domain:
      - Controlled hot-dry and hot-humid exercise
      - Cycling performance
    limitations:
      - Ten participants from a tropical environment
      - Cycling only and no environmental dose-response
      - Fixed conditions cannot identify a general humidity coefficient
  - id: environment.stull-wet-bulb-proxy
    statement: >
      Stull's empirical equation estimates psychrometric wet-bulb temperature
      from air temperature and relative humidity at standard sea-level pressure;
      it is not natural wet bulb and cannot by itself produce outdoor WBGT.
    source_ids:
      - stull-2011
    evidence_strength: high
    effect_estimates:
      - metric: Published approximation error
        range_low: -1
        range_high: 0.65
        unit: degrees C
        context: Published validity domain, excluding the low-humidity cold corner
      - metric: Mean absolute error
        estimate: 0.3
        unit: degrees C or less
        context: Published validity domain
      - metric: Air-temperature validity range
        range_low: -20
        range_high: 50
        unit: degrees C
        context: Standard sea-level pressure
      - metric: Relative-humidity validity range
        range_low: 5
        range_high: 99
        unit: percent
        context: Standard sea-level pressure
    applicable_population:
      - Meteorological and engineering use within the published input domain
    domain:
      - Psychrometric wet-bulb estimation
      - Environmental proxy computation
    limitations:
      - Empirical approximation should not be extrapolated beyond its domain
      - Sea-level pressure assumption reduces altitude validity
      - Psychrometric wet bulb is not the natural wet bulb used by WBGT
  - id: environment.full-wbgt-inputs
    statement: >
      A validated outdoor WBGT model requires air temperature, moisture or dew
      point, wind speed, solar radiation, and the required pressure assumptions
      to model natural wet-bulb and globe temperatures; temperature and relative
      humidity alone are insufficient.
    source_ids:
      - liljegren-2008
    evidence_strength: high
    effect_estimates:
      - metric: Modeled WBGT validation accuracy
        estimate: 1
        unit: degrees C or less
        context: Multiple outdoor U.S. Army industrial sites
    applicable_population:
      - Outdoor environmental monitoring with the required meteorological inputs
    domain:
      - Outdoor WBGT modeling
      - Environmental data requirements
    limitations:
      - Solar radiation and wind inputs are not always available
      - Validation sites were primarily U.S. industrial locations
      - WBGT context does not prove an individual performance or illness response
  - id: environment.no-universal-personal-correction
    statement: >
      Environmental performance effects vary by discipline, performance level,
      acclimation, and data method; the reviewed evidence does not support one
      universal personal heat-adjustment coefficient.
    source_ids:
      - mantzios-2022
      - el-helou-2012
      - baillot-2021
    evidence_strength: moderate
    applicable_population:
      - Endurance athletes interpreting population evidence
    domain:
      - Product claim boundary
      - Personal performance interpretation
    limitations:
      - Absence of a universal coefficient does not rule out validated discipline-specific or personal models
