schema_version: 1
id: evidence-road-marathon-plan-generation-policy-v1
version: 1
title: "History-anchored adult outdoor road-marathon performance planning"
research_question: >
  For adults aged 18 years or older with current direct outdoor road-marathon
  capability, stable recent running history that anchors their own exposure,
  within-recent load, performance intent, optional target time or date, and
  confirmed event context, what evidence supports and limits a suggestion-only
  modular road-marathon performance policy covering readiness, history and
  load, long-run durability, intensity and race-specific work, fueling and
  hydration practice, taper and recovery, environment and altitude, and
  reassessment and outcomes?
topic: road-marathon-plan-generation-policy
status: draft
approval_mode: artifact
authors:
  - agent:github-copilot
human_reviewers: []
created_on: 2026-08-15
reviewed_on:
intended_product_purpose: >
  Define the evidence boundary for one currently-capable, history-rich adult
  outdoor road-marathon performance policy without inheriting any 5 km, 10 km,
  or half-marathon numeric rule. Separate direct marathon observations and
  bounded source findings from Praxys guardrails. Preserve goal capture when no
  generator route matches, keep imported profile and event fields
  source-labelled until athlete confirmation, and identify every unresolved
  baseline, dose, long-run, race-specific, taper, recovery, fueling, hydration,
  environmental, altitude, subgroup, outcome, pilot, implementation, and
  activation decision.
scope:
  population:
    - Adults aged 18 years or older
    - Runners with current direct outdoor road-marathon capability
    - Runners with stable recent history sufficient to anchor their own exposure
    - Runners whose current load remains within their recent observed pattern
    - Outdoor road-marathon performance intent with optional target time or date
    - Runners with athlete-confirmed event context
    - Recreational, amateur, female, male, faster, and well-trained cohorts as evidence populations rather than permanent runner identities
  intervention_or_exposure:
    - Same-task marathon results, prediction inputs, pacing, and capability confirmation
    - Weekly running volume, frequency, longest-run exposure, and durability
    - Mostly-low-intensity organization, race-specific work, and training-intensity distribution
    - Pre-race volume reduction, taper organization, and post-marathon reassessment
    - Carbohydrate availability, prior-practice or gut-training, fluid, and sodium context
    - Heat, humidity, wind, solar load, altitude, and adaptation context
    - Suggestion-only modular planning and athlete-confirmed adoption
  comparator:
    - Direct same-task history versus prediction, shorter-distance conversion, laboratory markers, or passive segments
    - Lower versus higher observed weekly volume, frequency, or longest-run exposure
    - Pyramidal, polarized, threshold-heavy, or other intensity organizations
    - Disciplined versus minimal pre-race volume reduction
    - Practiced versus unpracticed fueling and gastrointestinal exposure
    - Under-replacement, individualized replacement, and overdrinking
    - Sea-level versus acute altitude exposure or post-hypoxic adaptation
  outcomes:
    - Marathon finish time, race speed, pacing, and prediction error
    - Running-economy durability and fatigue resistance
    - Training organization, taper association, and uncertainty
    - Endurance performance and gastrointestinal tolerance
    - Hydration and exercise-associated hyponatremia boundaries
    - Acute altitude exercise capacity and transfer limits
    - Post-marathon recovery, readiness, applicability, and implementation risk
method:
  review_type: rigorous
  search_date: 2026-08-15
