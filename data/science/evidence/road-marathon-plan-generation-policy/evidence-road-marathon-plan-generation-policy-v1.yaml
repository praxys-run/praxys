  inclusion_criteria:
    - Adult human evidence relevant to outdoor road-marathon performance policy
    - Direct marathon observational or prediction studies, systematic reviews, meta-analyses, or authoritative position and consensus statements
    - Stable DOI and PMID metadata verified against indexed records
    - Direct marathon evidence preferred and broader endurance transfer labelled explicitly
    - Numeric source findings included only when verified in an accessible full text or explicitly bounded indexed abstract
  exclusion_criteria:
    - First-marathon or completion plans used as direct evidence for this performance policy
    - Sparse-history, returning, clinical, rehabilitation, pregnancy-specific, trail, ultra, or unsupported-context prescriptions
    - Coaching plans, vendor material, blogs, search snippets, or uncited conventions
    - Metadata-only or inaccessible papers used for effect estimates or strong conclusions
    - Shorter-distance schedule values treated as marathon prescriptions
  quality_appraisal: >
    Claims were appraised for directness to currently-capable adult outdoor
    road-marathon runners, study design, sample size, sex and performance-level
    representation, self-reported versus measured exposure, course specificity,
    zone definition, ecological validity, confounding, and whether a source
    supports an individual prescription or only a population association.
    Direct training-dose and taper evidence is predominantly observational.
    Broader taper, carbohydrate, fluid, sodium, environmental, and altitude
    evidence is more mature but does not select marathon product parameters.
    Evidence, product guardrails, safety boundaries, and implementation choices
    remain separate. The versioned search and screening manifest at
    data/science/evidence/road-marathon-plan-generation-policy/search-manifest-road-marathon-plan-generation-policy-v1.json
    retains the complete focused PubMed result sets, counts, digests, and one
    inclusion rationale for every cited record.
  method_limitations:
    - Screening and extraction were performed by agents rather than independent duplicate human reviewers.
    - SPORTDiscus, Scopus, Embase, and Web of Science were not directly screened.
    - This bounded rigorous product review is not a systematic review and does not claim a PRISMA flow.
    - The bounded web-discovery interface did not expose stable result counts or a complete ranked result set; the versioned manifest retains complete focused PubMed result sets instead.
    - Several marathon prediction, pacing, taper, carbohydrate, altitude, and hypoxia sources were verified at abstract level only.
    - The 2025 marathon intensity-distribution claim is abstract-bounded despite accepted-manuscript discovery.
    - The 2026 durability study is abstract-bounded and includes only 26 well-trained men.
    - Direct female evidence is limited, and no reviewed source validates sex-specific automatic dose changes.
    - No reviewed source validates one automated marathon baseline, plan length, dose, long-run rule, taper, fueling, hydration, altitude, recovery, race-density, or outcome window.
claims:
  - id: road-marathon.task-specific-capability-baseline-multifactorial
    statement: >
      Road-marathon capability and performance are multifactorial. Recent
      athlete-confirmed same-task history is the most direct available baseline
      for this policy, while anthropometric, training, physiological, pacing,
      and course-specific models retain unexplained variation and do not
      establish one universal qualification threshold.
    source_ids:
      - nikolaidis-2021-athens-marathon
      - schmid-2012-female-marathon
      - salinero-2017-marathon-prediction
      - swain-2020-marathon-pacing
    evidence_strength: low
    effect_estimates:
      - metric: Athens race-speed model explained variance
        estimate: 0.61
        unit: R-squared
        context: Male runners from one course with internal data splitting
      - metric: Athens race-speed model standard error
        estimate: 1.19
        unit: kilometres_per_hour
        context: Male runners from one course with internal data splitting
      - metric: Female recreational-runner model explained variance
        estimate: 0.50
        unit: R-squared
        context: Twenty-nine recreational female marathon runners
    applicable_population:
      - Adult road-marathon runners
      - Male single-course and small female recreational cohorts represented by the direct models
    domain:
      - Capability confirmation
      - Direct baseline hierarchy
      - Performance prediction
    limitations:
      - Prediction models do not establish causal training prescriptions or eligibility cutoffs.
      - The Athens model is male, single-course, and internally split rather than externally generalizable.
      - The female model includes 29 runners and does not establish a general threshold.
      - Same-task history can still be stale, contextually different, or incomplete.
  - id: road-marathon.volume-frequency-longest-run-associative
    statement: >
      Weekly volume, training frequency, and longest-run exposure are
      associated with marathon performance and pacing, but the reviewed
      observational evidence does not validate exact individual weekly volume,
      frequency, longest-run, progression, or safety prescriptions.
    source_ids:
      - fokkema-2020
      - swain-2020-marathon-pacing
    evidence_strength: moderate
    effect_estimates:
      - metric: Finish-time coefficient below 40 kilometres per week
        estimate: 6.33
        range_low: 0.18
        range_high: 12.48
        unit: minutes
        context: Adjusted observational comparison with 40 to 65 kilometres per week
      - metric: Finish-time coefficient above 65 kilometres per week
        estimate: -14.09
        range_low: -22.47
        range_high: -5.72
        unit: minutes
        context: Adjusted observational comparison with 40 to 65 kilometres per week
      - metric: Finish-time coefficient for longest run below 25 kilometres
        estimate: 13.44
        range_low: 5.34
        range_high: 21.55
        unit: minutes
        context: Adjusted observational marathon model
    applicable_population:
      - Adult recreational marathon entrants
      - Male marathoners represented by the pacing study
    domain:
      - Weekly volume
      - Training frequency
      - Longest-run exposure
      - Pacing
    limitations:
      - Training exposure was observational and partly self-reported.
      - Categories do not establish causality, optimality, progression, or injury safety.
      - A longest run above 35 kilometres was not significantly better than 30 to 35 kilometres in the reviewed cohort.
      - Associations cannot be converted into entry gates or individual dose.
  - id: road-marathon.durability-relevant-no-field-cutoff
    statement: >
      Fatigue resistance and running-economy durability are relevant marathon
      concepts, and one small cross-sectional male study associated regular
      long runs and higher volume with less running-economy deterioration.
      The evidence does not validate a standardized product-ready field,
      protocol, cutoff, or mandatory long-run rule.
    source_ids:
      - zanini-2026-durability
    evidence_strength: very_low
    effect_estimates:
      - metric: Running-economy deterioration in the better-durability group
        estimate: 3.1
        unit: percent
        context: Cross-sectional comparison in 26 performance-matched well-trained men
      - metric: Running-economy deterioration in the lower-durability group
        estimate: 6.0
        unit: percent
        context: Cross-sectional comparison in 26 performance-matched well-trained men
      - metric: Longest-run association with running-economy deterioration
        estimate: -0.67
        unit: correlation_coefficient
        context: Cross-sectional association in 26 well-trained men
      - metric: Training-volume association with running-economy deterioration
        estimate: -0.48
        unit: correlation_coefficient
        context: Cross-sectional association in 26 well-trained men
    applicable_population:
      - Performance-matched well-trained male runners similar to the study cohort
    domain:
      - Durability
      - Running economy
      - Long-run context
    limitations:
      - Cross-sectional design cannot establish that changing volume or long runs causes improved durability.
      - The sample included 26 men and does not validate subgroup transfer.
      - The abstract does not provide a product-ready field-test qualification rule.
  - id: road-marathon.marathon-tid-mostly-low-observational
    statement: >
      Direct marathon training-intensity-distribution data describe greater
      zone-one volume among faster runners and pyramidal organization in more
      than 80 percent of the fastest group across 151,813 marathons from
      119,452 runners. The observational, zone-definition-dependent analysis
      does not establish an individual low-intensity percentage, session count,
      spacing rule, race-specific dose, or causal optimum.
    source_ids:
      - muniz-pumares-2025-marathon-tid
    evidence_strength: low
    applicable_population:
      - Marathon runners represented in the large training-data analysis
    domain:
      - Training-intensity distribution
      - Mostly-low organization
      - Performance-level association
    limitations:
      - Observational training data cannot establish causal superiority.
      - Zone definitions and data quality affect classification.
      - Performance groups are evidence cohorts rather than permanent runner identities.
      - Abstract-bounded extraction cannot support exact schedule parameters.
  - id: road-marathon.taper-support-exact-parameters-uncertain
    statement: >
      Disciplined pre-race volume reduction is associated with better marathon
      performance, while mixed-endurance taper evidence more strongly supports
      reduced volume with maintained intensity and frequency. Exact marathon
      taper window, reduction, intensity exposure, frequency, accounting, and
      personal benefit remain uncertain.
    source_ids:
      - smyth-lawlor-2021
      - hug-2014-marathon-taper
      - wang-2023
    evidence_strength: moderate
    effect_estimates:
      - metric: Median strict three-week taper association
        estimate: 332.4
        unit: seconds
        context: Observational marathon comparison with minimal taper
      - metric: Median strict three-week taper association
        estimate: 2.6
        unit: percent
        context: Observational marathon comparison with minimal taper
      - metric: Time-trial performance after taper
        estimate: -0.45
        range_low: -0.68
        range_high: -0.23
        unit: standardized_mean_difference
        context: Mixed-endurance meta-analysis; 95 percent confidence interval
      - metric: Performance with 41 to 60 percent volume reduction
        estimate: -0.77
        range_low: -1.23
        range_high: -0.30
        unit: standardized_mean_difference
        context: Mixed-endurance taper subgroup; 95 percent confidence interval
      - metric: Performance with 8 to 14 day taper
        estimate: -1.47
        range_low: -2.75
        range_high: -0.19
        unit: standardized_mean_difference
        context: Mixed-endurance taper-duration subgroup; 95 percent confidence interval
    applicable_population:
      - Recreational marathon runners in the observational study
      - Endurance athletes in the broader meta-analysis
    domain:
      - Taper
      - Pre-race volume reduction
      - Event preparation
    limitations:
      - The marathon taper study is observational and cannot prove a fixed benefit.
      - Mixed sports and distances make the meta-analysis indirect to road-marathon automation.
      - Autonomic findings do not select a performance taper template.
      - No source validates one personal taper percentage or guaranteed gain.
  - id: road-marathon.pacing-prediction-retains-individual-error
    statement: >
      Marathon pacing and prediction models retain material individual error.
      Raw-training critical-speed estimation did not prove that source sessions
      were maximal, and model output cannot create a personal success
      probability or justify target-gap dose escalation.
    source_ids:
      - smyth-muniz-pumares-2020
      - nikolaidis-2021-athens-marathon
      - schmid-2012-female-marathon
      - salinero-2017-marathon-prediction
      - swain-2020-marathon-pacing
    evidence_strength: low
    effect_estimates:
      - metric: Best raw-training critical-speed marathon prediction error
        estimate: 7.67
        unit: percent
        context: Recreational marathon runners
      - metric: Approximate error around the cohort average finish time
        estimate: 18
        unit: minutes
        context: Approximately 18 minutes around an average 230-minute marathon
    applicable_population:
      - Recreational and amateur marathon runners represented by the prediction studies
    domain:
      - Prediction error
      - Pacing
      - Target communication
    limitations:
      - Models use different populations, courses, inputs, and validation approaches.
      - Raw sessions were not proven maximal efforts.
      - Group error does not calibrate one athlete's success probability.
      - Prediction does not establish readiness, safety, or a training dose.
  - id: road-marathon.carbohydrate-support-contextual
    statement: >
      Acute carbohydrate feeding supports prolonged endurance performance at
      population level, but loading and during-exercise intake depend on event
      duration, practiced tolerance, feeding opportunity, environment, and
      athlete context. The marathon distance label alone does not validate an
      exact personal loading or intake rule.
    source_ids:
      - ramos-campo-2024
      - burke-2011
      - podlogar-2022
    evidence_strength: moderate
    applicable_population:
      - Adult endurance athletes represented by the systematic review and sports-nutrition literature
    domain:
      - Carbohydrate availability
      - Endurance performance
      - Fueling context
    limitations:
      - Protocols, exercise duration, carbohydrate form, and baseline nutrition vary.
      - Broader endurance evidence is not a marathon-only prescription.
      - Population ergogenic effects do not establish an individual minimum, maximum, or guarantee.
  - id: road-marathon.gut-training-tolerance-not-universal
    statement: >
      Repeated feeding practice or gut-training may reduce gastrointestinal
      discomfort and carbohydrate malabsorption in some endurance athletes,
      but protocols are heterogeneous and no universal schedule, dose,
      guaranteed adaptation, or race-day tolerance exists.
    source_ids:
      - martinez-2023
      - podlogar-2022
    evidence_strength: low
    effect_estimates:
      - metric: Gastrointestinal discomfort reduction
        estimate: 47
        unit: percent
        context: Two repeated-carbohydrate-feeding protocols summarized in Martinez et al. 2023
      - metric: Carbohydrate malabsorption reduction
        range_low: 45
        range_high: 54
        unit: percent
        context: Two gut-training studies summarized in Martinez et al. 2023
    applicable_population:
      - Adult endurance athletes represented by the reviewed feeding-practice studies
    domain:
      - Fueling practice
      - Gastrointestinal tolerance
      - Gut training
    limitations:
      - Few heterogeneous protocols support the numeric findings.
      - Tolerance improvement is not guaranteed and may not transfer to race context.
      - No source selects one automated marathon gut-training protocol.
  - id: road-marathon.fluid-sodium-needs-variable
    statement: >
      Fluid and sodium needs vary within and between athletes and contexts.
      Both inadequate replacement and overdrinking matter, including
      exercise-associated hyponatremia risk. No distance-only millilitres-per-
      hour, sodium, body-mass-loss, or replacement rule is safe or validated
      for individualized marathon automation.
    source_ids:
      - mcdermott-2017-fluid
      - hew-butler-2015-eah
      - baker-2017-sweat
    evidence_strength: moderate
    applicable_population:
      - Physically active adults and endurance athletes covered by the position statement, consensus, and review
    domain:
      - Fluid replacement
      - Sodium
      - Sweat variability
      - Exercise-associated hyponatremia
    limitations:
      - Position and consensus statements bound safety but do not validate one product prescription.
      - Sweat rate and sodium concentration vary by method, athlete, environment, and acclimation.
      - Medical diagnosis and treatment remain outside this performance policy.
  - id: road-marathon.altitude-capacity-no-personal-correction
    statement: >
      Acute altitude reduces aerobic capacity and fixed-speed endurance in
      controlled conditions, while hypoxic adaptation evidence does not
      validate an individualized marathon altitude correction or acclimation
      schedule. Chamber findings must not be converted into a personal race
      time or pace adjustment.
    source_ids:
      - wehrlin-2006-altitude
      - bonetti-hopkins-2009
    evidence_strength: moderate
    effect_estimates:
      - metric: Acute maximum-oxygen-uptake change per 1000 metres
        estimate: -6.3
        unit: percent
        context: Acute hypobaric-chamber exposure in endurance athletes
      - metric: Fixed-speed time-to-exhaustion change per 1000 metres
        estimate: -14.5
        unit: percent
        context: Acute hypobaric-chamber exposure in endurance athletes
    applicable_population:
      - Endurance athletes represented by the acute chamber study and hypoxia meta-analysis
    domain:
      - Altitude
      - Acute exercise capacity
      - Acclimation and adaptation limits
    limitations:
      - Fixed-speed time to exhaustion is not self-paced marathon performance.
      - Acute chamber exposure does not define race-course altitude effects.
      - The hypoxia meta-analysis does not select an individual marathon acclimation schedule.
  - id: road-marathon.recovery-subgroup-outcome-rules-unvalidated
    statement: >
      Post-marathon recovery, subgroup-specific dose changes, race-density
      thresholds, and fixed outcome windows remain unvalidated for automation.
      Renal recovery findings after a marathon concern one physiological domain
      and do not establish general readiness, workout spacing, or medical
      clearance.
    source_ids:
      - hernando-2022-marathon-recovery
      - schmid-2012-female-marathon
      - fokkema-2020
    evidence_strength: very_low
    applicable_population:
      - Amateur marathon runners represented by the renal recovery study
      - Female and mixed recreational cohorts represented by the prediction and training studies
    domain:
      - Post-marathon recovery
      - Subgroup applicability
      - Race density
      - Outcome interpretation
    limitations:
      - Renal recovery is not a general readiness measure.
      - Prediction and observational cohort differences do not establish subgroup dose modifiers.
      - No reviewed source validates one race-priority threshold, reassessment cadence, or meaningful-change window.
