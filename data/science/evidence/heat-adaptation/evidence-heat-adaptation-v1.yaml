known_gaps:
  - Minimum effective exposure intensity and duration for variable outdoor field training
  - Validation of wearable-derived effective heat minutes against physiological adaptation
  - Sex-differentiated decay and re-induction evidence
  - Recreational and older-athlete protocol evidence
conflicting_findings:
  - Male-dominated literature often reports plasma-volume expansion, while Kelly 2023 found no significant female plasma-volume change
  - Longer protocols generally produce greater adaptation, so a single day-count boundary cannot represent all response systems
follow_up_questions:
  - Which field measurements can validate that an exposure-count model tracks individual response?
  - What low-confidence evidence path is appropriate when compatible power data is unavailable?
  - Do the Tyler 2016 or Casa 2015 errata alter any values later used by Praxys?
review_notes:
  - Product scope was maintainer-vetted in issues #457 and #459.
  - The shipped qualitative tracker originated in PR #446 and was refined in PRs #449 and #451.
