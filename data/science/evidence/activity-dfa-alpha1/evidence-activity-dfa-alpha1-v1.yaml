known_gaps:
- No across-device physiological validation of this complete pipeline.
- Native HRV messages lack direct sensor attribution; factual owner confirmation cannot
  establish device accuracy.
- A real recording with AlphaHRV disabled remains unverified.
conflicting_findings:
- Protocol and preprocessing differences limit transfer of threshold agreement.
follow_up_questions:
- How often do real archived running files pass source, time and quality checks across
  devices?
