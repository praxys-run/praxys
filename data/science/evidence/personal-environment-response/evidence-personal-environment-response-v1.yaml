known_gaps:
  - Direct longitudinal runner studies matching same-provider sample power across environmental conditions
  - Validated minimum activities, segments, power overlap, and environmental spread for personal descriptive curves
  - Field measurements of solar load, wind, clothing, hydration, and within-activity environmental exposure
  - Device and firmware continuity effects on running-power comparability
  - Seasonality, fitness change, illness, medication, and acclimation confounding
  - User comprehension of a historical association that explicitly failed predictive validation
  - Peer-reviewed validation of modern Garmin native wrist-only running power
  - A validated pace or grade-adjusted-pace matching rule for this environmental association
conflicting_findings:
  - Controlled physiology supports heat-related heart-rate drift, but no identified field study validates a personal Stull-wet-bulb response curve
  - A coefficient can be directionally stable while adding no chronological predictive value
  - Running power carries workload information but does not establish complete workload equivalence
  - Pace is observable across more activities, but heat can change pace and no reviewed grade tolerance establishes equivalent effort
follow_up_questions:
  - Which prespecified descriptive-stability gates best control false or misleading curve display?
  - Should substantial chronological instability withhold the fitted line entirely?
  - How should sparse environmental tails and incomplete power overlap be suppressed?
  - Can repeated preregistered temporal validations establish stability before broader enrollment?
  - Which comprehension test demonstrates that users distinguish association from prediction?
  - What separate validation could support a pace or grade-adjusted-pace workload path?
supersedes: []
review_notes:
  - >
    Independent pass ownership: research agent
    environment-response-evidence performed the first screen; research agent
    environment-response-evidence-check performed the second screen and
    metadata challenge.
  - >
    Screening reconciliation: twenty-three unique candidate sources were
    reviewed; seventeen were included in this additive review. Minson 1997 and
    Wingo 2019 were
    excluded as small protocol-specific additions already bounded by the
    retained physiology claims. Collins 2024 was excluded as clinical
    prediction guidance broader than the retrospective product question.
    Ciszewski 2024/2025 was excluded because generic permutation testing did
    not establish exchangeability for activity clusters. Stull 2011 remains in
    evidence-environmental-performance-v1. Periard 2016 was not added because
    the accepted adaptation evidence already sets the required modifier
    boundary.
  - >
    Existing evidence-environmental-performance-v1 remains unchanged and
    continues to govern Stull-proxy, WBGT, multifactor heat-balance, safety, and
    universal-correction boundaries.
  - >
    The private production result from #523 is an internal validation artifact,
    not a literature citation or a population effect estimate.
