schema_version: 1
id: evidence-personal-environment-response-v1
version: 1
title: "Personal retrospective environmental and heart-rate associations"
research_question: >
  For adult endurance athletes, what evidence and methodological guidance
  support or limit displaying a retrospective within-person association
  between environmental heat or moisture and heart rate at comparable external
  workload?
topic: personal-environment-response
status: accepted
authors:
  - agent:github-copilot
human_reviewers:
  - github:dddtc2005
created_on: 2026-08-08
reviewed_on: 2026-08-08
intended_product_purpose: >
  Bound an opt-in Praxys Labs display of historical heart-rate observations
  across a Stull psychrometric wet-bulb proxy without presenting the result as
  causal, predictive, physiological, safety-related, or prescriptive.
scope:
  population:
    - Adult endurance athletes with repeated heart-rate and external-workload observations
    - Runners where same-provider sample-derived power is available
    - Controlled cycling populations used only for physiological plausibility
  intervention_or_exposure:
    - Exercise in warmer or more humid environments
    - Stull psychrometric wet-bulb proxy derived from air temperature and relative humidity
  comparator:
    - Lower environmental heat or moisture at comparable recorded workload
    - An otherwise-identical analysis without the environmental predictor
    - Structure-preserving environmental permutation controls
  outcomes:
    - Heart rate during stable sample-derived workload segments
    - Stability of the retrospective environmental association
    - Chronological out-of-sample prediction error
    - User interpretation of uncertainty
method:
  review_type: rigorous
  search_date: 2026-08-08
