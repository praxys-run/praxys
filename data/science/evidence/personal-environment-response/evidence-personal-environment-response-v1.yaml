  inclusion_criteria:
    - Adult human exercise evidence at fixed or comparable external workload
    - Endurance-relevant cycling or running protocols
    - Reviews or primary studies reporting cardiovascular drift, heart rate, hydration, or heat response
    - Methods directly relevant to temporal validation, hierarchical resampling, negative controls, or uncertainty communication
    - Stable DOI or PMID metadata and at least an abstract or indexed record
  exclusion_criteria:
    - Animal or pediatric-only studies
    - Studies without heart rate or meaningful external-workload information
    - Universal personal correction equations without individual validation
    - Heat-safety diagnosis, training prescription, or forecast models
    - Preprints or case reports as primary physiological evidence when stronger sources were available
  quality_appraisal: >
    Two independently assigned research passes searched and checked the
    candidate set, then reconciled source roles, metadata, access level, and
    claim limits. Pass one screened fourteen candidate citations from sixteen
    recorded discovery queries. Pass two re-ran broad and exact-identifier
    searches and expanded the unique candidate set to eighteen. A third
    targeted workload-proxy pass added five unique pace, grade, wind, surface,
    and Garmin-comparison candidates. Seventeen sources were retained for new
    claims; six were excluded or left in the accepted predecessor because they
    were redundant, population-specific, methodologically overbroad, or already
    governed.
    Controlled physiology studies are mostly small, male, and cycling-based;
    they establish plausibility rather than a personal running coefficient.
    Method papers support analysis structure and communication guardrails but
    do not validate Praxys thresholds. Running-power evidence supports cautious
    within-device workload matching, not complete metabolic equivalence.
  method_limitations:
    - This is a bounded product review rather than a systematic review or meta-analysis
    - Search-result counts were not exported from every database query
    - Direct longitudinal field studies matching one runner's power across environmental conditions were not identified
    - Most physiological sources were verified from abstracts rather than full text
    - No paper validates Stull wet bulb as the causal exposure for a personal heart-rate curve
    - No source validates the Praxys segment filters, ridge specification, display thresholds, or product labels
claims:
  - id: personal-environment-response.cardiovascular-drift-plausible
    statement: >
      During prolonged exercise at unchanged or comparable prescribed workload,
      heart rate can rise while stroke volume falls, and heat can increase this
      cardiovascular drift.
    source_ids:
      - wingo-2012
      - montain-coyle-1992
      - periard-2021
    evidence_strength: moderate
    applicable_population:
      - Adults performing prolonged moderate-intensity endurance exercise
    domain:
      - Cardiovascular drift
      - Exercise heat physiology
    limitations:
      - Evidence is predominantly controlled cycling research
      - The claim does not establish one individual's response per degree
      - The claim does not validate Stull wet bulb as the operative exposure
      - Heart-rate drift is not interchangeable with a cross-activity environmental association
  - id: personal-environment-response.duration-hydration-confounding
    statement: >
      Exercise duration and hydration status materially affect heart-rate and
      stroke-volume drift, so an observational environmental association cannot
      be interpreted as heat alone when those factors are unmeasured or
      incompletely controlled.
    source_ids:
      - montain-coyle-1992
      - periard-2021
    evidence_strength: moderate
    applicable_population:
      - Adults exercising for prolonged periods in warm conditions
    domain:
      - Hydration
      - Time-varying confounding
    limitations:
      - Hydration cannot be inferred reliably from ordinary activity records
      - Clothing, solar load, wind, acclimation, fatigue, illness, and morphology remain additional modifiers
      - This claim does not authorize imputation of missing physiology
  - id: personal-environment-response.running-power-limited-proxy
    statement: >
      Commercial running-power estimates can carry useful within-device
      workload information, but available validation does not establish
      complete mechanical or metabolic equivalence across providers, devices,
      algorithms, terrain, wind, fatigue, or environmental conditions.
    source_ids:
      - imbach-2020
      - cerezuela-espejo-2020
      - berzosa-2024
      - van-rassel-2023
    evidence_strength: low
    effect_estimates:
      - metric: Association with oxygen consumption
        estimate: 0.82
        unit: R-squared
        context: Six recreational runners in an indoor incremental protocol
      - metric: Association with estimated external mechanical power
        estimate: 0.88
        unit: R-squared
        context: Six recreational runners in an indoor incremental protocol
    applicable_population:
      - Runners using the studied commercial running-power devices and protocols
    domain:
      - Running power
      - Workload matching
    limitations:
      - Six-runner indoor study without heat manipulation
      - Garmin comparative studies used earlier or accessory-based GarminRP implementations rather than validating modern native wrist-only power
      - Absolute power and inter-device agreement differed
      - Proprietary algorithm, firmware, device, and source continuity remain relevant
      - The evidence does not support cross-provider power matching
  - id: personal-environment-response.pace-grade-insufficient
    statement: >
      Equal pace does not establish equal physiological workload across grade,
      wind, surface, fatigue, or heat, and the reviewed evidence does not define
      a universal grade tolerance that makes pace an interchangeable substitute
      for provider-verified sample power.
    source_ids:
      - minetti-2002
      - pugh-1971
      - gantz-derrick-2017
      - leslie-2024
    evidence_strength: moderate
    applicable_population:
      - Adult runners across controlled slope, wind, irregular-surface, and heat protocols
    domain:
      - Pace-based workload matching
      - Grade and environmental confounding
    limitations:
      - Population metabolic-cost relationships do not validate individual outdoor equivalence
      - Net elevation gain can hide repeated uphill and downhill costs
      - Consumer segment pace and grade include GPS and elevation error
      - Heat can change sustainable pace, making pace partly an outcome of the exposure under study
      - No reviewed source establishes an acceptable within-X-percent grade threshold
  - id: personal-environment-response.association-not-prediction
    statement: >
      A stable fitted association and useful out-of-sample prediction are
      different objectives; an observed coefficient can coexist with no
      incremental predictive value.
    source_ids:
      - shmueli-2010
    evidence_strength: moderate
    applicable_population:
      - Observational model interpretation
    domain:
      - Association
      - Prediction
    limitations:
      - This methodological distinction does not prove that a fitted association is causal or unbiased
      - Predictive failure forbids forecast or correction language
      - Descriptive display still requires prespecified stability and communication gates
  - id: personal-environment-response.structured-validation
    statement: >
      Validation splits should respect temporal and hierarchical dependence
      when the intended claim concerns later activities; random row-level
      splitting can underestimate error.
    source_ids:
      - roberts-2017
    evidence_strength: moderate
    applicable_population:
      - Longitudinal or hierarchically structured observational data
    domain:
      - Chronological validation
      - Hierarchical dependence
    limitations:
      - The source is methodological and not specific to exercise physiology
      - One chronological split does not establish transportability
      - Seasonality and longer-term fitness trends can remain confounded
  - id: personal-environment-response.activity-cluster-uncertainty
    statement: >
      For segments nested within activities, resampling whole activities rather
      than individual segments preserves the primary dependence structure and
      avoids treating correlated segments as independent observations.
    source_ids:
      - deen-2020
    evidence_strength: moderate
    applicable_population:
      - Hierarchical data with repeated observations within clusters
    domain:
      - Cluster bootstrap
      - Uncertainty estimation
    limitations:
      - The source focuses on generalized linear models rather than the complete Praxys pipeline
      - The full filtering and fitting pipeline must be repeated inside each resample
      - Serial dependence between nearby activities may require coarser blocks
  - id: personal-environment-response.negative-controls-limited
    statement: >
      Negative controls and structure-preserving permutation distributions can
      reveal confounding, measurement, selection, or pipeline artifacts, but
      passing them does not prove causality.
    source_ids:
      - lipsitch-2010
    evidence_strength: moderate
    applicable_population:
      - Observational analyses with plausible negative-control designs
    domain:
      - Negative controls
      - Bias detection
    limitations:
      - Exchangeability must be justified at the activity level
      - Naive segment shuffling can destroy the dependence structure
      - A null negative control cannot validate a physiological mechanism
  - id: personal-environment-response.uncertainty-can-be-misread
    statement: >
      Non-expert users can construe uncertain visual estimates as deterministic,
      so uncertainty displays require explicit explanation and comprehension
      testing rather than a confidence band alone.
    source_ids:
      - joslyn-savelli-2021
      - weiskopf-2022
    evidence_strength: moderate
    applicable_population:
      - Non-expert users viewing modeled quantitative information
    domain:
      - Uncertainty visualization
      - Product comprehension
    limitations:
      - The sources do not test the proposed Praxys chart
      - Visual uncertainty does not correct scientific model bias
      - Product copy and interaction design require direct user testing
