known_gaps:
  - A prospectively evaluated deterministic plan-generation policy for the accepted outdoor 5 km population
  - A validated 28-day generation horizon or weekly reassessment interval
  - A validated minimum recent-history requirement for safe dose anchoring
  - Direct evidence for a universal three-build/one-recovery cycle or 60 to 70 percent recovery week
  - Direct evidence for a universal recreational 5 km long-run progression rule
  - A universal consumer running-power target envelope by workout type
  - A validated deterministic mapping from personal history and availability to exact interval-session structure
  - Representation and subgroup precision for women, older adults, low-frequency runners, sparse-history users, and different data providers
conflicting_findings:
  - Structured and mostly low-intensity programs can improve performance, while evidence does not identify one universally superior polarized or pyramidal distribution.
  - Taper evidence supports lower volume with maintained intensity and frequency, but its directness varies by sport, event, and prior training.
  - Training history is useful for context, while 10 percent and workload-ratio rules are not validated causal safety thresholds.
follow_up_questions:
  - Does the proposed 28-day stable-load guardrail improve plan relevance without increasing burden or adverse events?
  - Which exact recent-history and schedule constraints minimize unsupported extrapolation?
  - Which session templates can be validated without turning common coaching convention into published science?
  - How should the policy behave when current capability is qualified but recent training history is sparse?
  - Do outcomes, acceptance, edits, and safety exits differ by sex, age, training frequency, threshold availability, provider, or missingness?
