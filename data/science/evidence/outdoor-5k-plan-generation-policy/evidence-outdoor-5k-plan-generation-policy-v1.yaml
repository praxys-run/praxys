schema_version: 1
id: evidence-outdoor-5k-plan-generation-policy-v1
version: 1
title: "Adult recreational outdoor 5 km plan generation"
research_question: >
  For adults aged 18 years or older who are self-coached recreational road
  runners, can already complete 5 km, and have an outdoor road 5 km
  elapsed-time goal, what evidence supports and limits a conservative,
  suggestion-only multi-week plan-generation policy?
topic: outdoor-5k-plan-generation-policy
status: draft
authors:
  - agent:github-copilot
human_reviewers: []
created_on: 2026-08-11
reviewed_on:
intended_product_purpose: >
  Bound the first Praxys plan-generation proposal to one accepted baseline and
  goal population. Separate evidence for structured training, training-
  intensity distribution, quality-session frequency, tapering, progression,
  and individual-response interpretation from Praxys guardrails such as the
  plan horizon, recent-history requirement, and deterministic validation
  envelope. This draft does not authorize implementation or change user-facing
  behavior until an identified human science reviewer accepts the decision.
scope:
  population:
    - Adults aged 18 years or older
    - Self-coached recreational road runners already able to complete 5 km
    - Outdoor road 5 km elapsed-time performance goals
  intervention_or_exposure:
    - Structured and periodized endurance-running programs
    - Polarized, pyramidal, threshold-heavy, and other training-intensity distributions
    - Continuous, interval, and high-intensity training used by recreational runners
    - Pre-event tapering in endurance athletes
    - Fixed weekly progression and workload-ratio rules
    - Classification of individual training response
  comparator:
    - Nonperiodized or control training
    - Alternative structured training-intensity distributions
    - Standard versus 10 percent graded novice-running progression
    - Maintained versus reduced taper intensity, frequency, or volume
    - Error-aware versus naive individual-response classification
  outcomes:
    - 5,000 m or closely applicable endurance performance
    - Time-trial performance and physiological adaptation
    - Running-related injury incidence
    - Training tolerance and burden
    - Validity of individual prediction and fixed prescription rules
method:
  review_type: rigorous
  search_date: 2026-08-11
  sources:
    - name: PubMed - training-intensity distribution and periodization
      search_string: >
        (training intensity distribution[Title/Abstract] OR
        polarized[Title/Abstract] OR pyramidal[Title/Abstract] OR
        periodization[Title/Abstract] OR "interval training"[Title/Abstract])
        AND (running[Title/Abstract] OR runner*[Title/Abstract] OR
        endurance[Title/Abstract]) AND
        (recreational[Title/Abstract] OR adult[MeSH Terms])
    - name: PubMed - frequency, taper, recovery, and long run
      search_string: >
        (running[Title/Abstract] OR runner*[Title/Abstract]) AND
        (frequency[Title/Abstract] OR "weekly sessions"[Title/Abstract] OR
        "rest day"[Title/Abstract] OR "recovery week"[Title/Abstract] OR
        taper[Title/Abstract] OR "long run"[Title/Abstract] OR
        periodization[Title/Abstract]) AND
        (performance[Title/Abstract] OR "5 k"[Title/Abstract] OR
        "5000 m"[Title/Abstract])
    - name: PubMed - structured recreational 5 km training
      search_string: >
        (recreational runner*[Title/Abstract]) AND
        (structured training[Title/Abstract] OR
        periodization[Title/Abstract] OR
        nonperiodized[Title/Abstract]) AND
        (5000 m[Title/Abstract] OR 5 km[Title/Abstract] OR
        performance[Title/Abstract])
    - name: PubMed - progression and workload limits
      search_string: >
        (running[Title/Abstract] OR endurance[Title/Abstract]) AND
        (progression[Title/Abstract] OR
        "acute chronic workload"[Title/Abstract] OR
        "10% rule"[Title/Abstract]) AND adult[MeSH Terms]
    - name: PubMed exact identifier verification
      search_string: >
        30161090[PMID] OR 23752040[PMID] OR 34749417[PMID] OR
        39888556[PMID] OR 32183425[PMID] OR 37163550[PMID] OR
        17940147[PMID] OR 32502973[PMID] OR 34819869[PMID]
    - name: PubMed Central full text
      search_string: >
        PMC7183043 OR PMC10171681 OR PMC8606564
    - name: Crossref exact DOI metadata
      search_string: >
        GET /works/{doi} for 10.1519/JSC.0000000000002805,
        10.1123/ijspp.2012-0350, 10.1055/a-1559-3623,
        10.1007/s40279-024-02149-3, 10.3390/sports8030035,
        10.1371/journal.pone.0282838,
        10.1177/0363546507307505, 10.1123/ijspp.2019-0864,
        and 10.3389/fphys.2021.665044
    - name: University of Stirling publication record
      search_string: "https://www.stir.ac.uk/research/hub/publication/2095779"
  inclusion_criteria:
    - Systematic reviews, meta-analyses, controlled studies, or authoritative methodological reviews relevant to adult endurance running
    - Recreational-running studies with performance outcomes
    - Evidence that directly challenges a proposed progression, workload, or individual-response rule
    - Stable DOI or PMID metadata and an accessible abstract or full text
  exclusion_criteria:
    - Vendor plans, coaching blogs, LLM output, and uncited training conventions
    - Team-sport workload associations presented as direct running prescriptions
    - Children-only, clinical rehabilitation, treatment, return-to-sport, or pregnancy-specific prescription
    - Studies without a reproducible method or a relevant performance, safety, or inference boundary
    - Inaccessible findings used to supply an effect estimate or strong conclusion
  quality_appraisal: >
    Two agent passes independently checked the included citations and claim
    boundaries. Claims were appraised for design, sample size, directness to
    recreational road runners and 5 km performance, intervention detail,
    outcome validity, risk of subgroup or adherence bias, population transfer,
    and whether a finding can justify an individual product threshold.
    Abstract-only sources support only their reported abstract conclusions.
    Full-text reviews were inspected for the specific recommendation or effect
    used. No source was treated as evidence for a fixed Praxys value merely
    because the value is conventional.
  method_limitations:
    - Screening and extraction were performed by agents rather than independent human reviewers.
    - SPORTDiscus, Scopus, and Web of Science were not searched directly in this run.
    - Bradbury 2020, Munoz 2014, Campos 2022, Rosenblat 2025, Buist 2008, and Impellizzeri 2020 were verified at abstract level, so detailed risk-of-bias assessment was not possible.
    - Boullosa 2020 is a narrative review and its one-to-two quality-session recommendation is expert synthesis rather than a pooled causal threshold.
    - Taper evidence combines multiple endurance sports and performance levels; directness to a self-coached recreational 5 km plan is limited.
    - Women, older adults, sparse-history runners, low-frequency runners, and consumer running-power users are underrepresented.
    - No reviewed source validates a 28-day generation horizon, a three-build/one-recovery cycle, a 60 to 70 percent recovery week, a universal long-run progression rule, or a generic threshold-power percentage envelope.
claims:
  - id: outdoor-5k-plan.structured-periodization-bounded-benefit
    statement: >
      A structured periodized running program can improve 5,000 m performance
      in recreational runners compared with nonperiodized control training, but
      the reviewed evidence does not establish one superior periodization
      sequence or a complete Praxys schedule.
    source_ids:
      - bradbury-2020
    evidence_strength: moderate
    effect_estimates:
      - metric: 5,000 m time-trial improvement
        range_low: 76.8
        range_high: 112.8
        unit: seconds
        context: >
          Mean improvement in the two periodized groups after 12 weeks and
          three sessions per week; the control improved 3.6 seconds.
    applicable_population:
      - Recreational adult runners similar to the 30-person controlled study
    domain:
      - Structured training
      - Periodization
      - 5,000 m performance
    limitations:
      - The study was small and verified from its abstract.
      - Testing used a 400 m grass track, not the accepted outdoor-road protocol.
      - Linear and reverse-linear periodization did not differ significantly.
      - The study does not validate a four-week horizon, a deterministic generator, or an individual outcome guarantee.
  - id: outdoor-5k-plan.mostly-low-intensity-no-universal-winner
    statement: >
      The reviewed running and endurance evidence supports a majority of
      training volume at low intensity and does not establish one universally
      superior polarized or pyramidal distribution for recreational runners.
      Threshold-heavy training is not supported as the default.
    source_ids:
      - munoz-2014
      - campos-2022
      - rosenblat-2025
    evidence_strength: moderate
    effect_estimates:
      - metric: Polarized versus between-threshold 10 km improvement
        range_low: 3.6
        range_high: 5.0
        unit: percent
        context: >
          Both recreational-runner groups improved; the between-group
          difference was not significant in the primary analysis.
      - metric: Polarized versus pyramidal time-trial performance
        estimate: -0.05
        unit: standardized mean difference
        context: >
          Network meta-analysis found no significant overall difference;
          p=0.34.
    applicable_population:
      - Recreational runners in the 10 km controlled study
      - Middle- and long-distance runners in the systematic review
      - Recreational and competitive endurance athletes in the network meta-analysis
    domain:
      - Training-intensity distribution
      - Low-intensity volume
      - Performance
    limitations:
      - Only one included controlled study was directly recreational-running specific.
      - Zone quantification methods differ across studies.
      - The evidence does not validate one exact percentage for every athlete.
      - Rosenblat subgroup findings concerned VO2max and performance level, not direct individualized 5 km prescriptions.
  - id: outdoor-5k-plan.one-to-two-quality-sessions-indirect
    statement: >
      A full-text narrative review of recreational endurance running generally
      recommends combining one to two high-intensity interval sessions per week
      with more moderate- and low-intensity continuous running. This supports a
      conservative product ceiling, not a universal biological threshold.
    source_ids:
      - boullosa-2020
    evidence_strength: low
    applicable_population:
      - Recreational endurance runners represented by the reviewed literature
    domain:
      - Session frequency
      - High-intensity training
      - Product guardrail input
    limitations:
      - The source is a narrative review with heterogeneous underlying studies.
      - It does not compare exactly one versus two quality sessions.
      - It does not define quality-session taxonomy, spacing, duration, or a safety limit.
  - id: outdoor-5k-plan.taper-volume-reduction-supported
    statement: >
      Across mixed endurance sports, tapering can improve time-trial
      performance. The strongest reviewed strategy reduced volume by 41 to 60
      percent while maintaining intensity and frequency; 8 to 14 days produced
      the largest subgroup effect, although other durations up to 21 days also
      improved performance.
    source_ids:
      - wang-2023
    evidence_strength: moderate
    effect_estimates:
      - metric: Time-trial performance after taper
        estimate: -0.45
        unit: standardized mean difference
        context: Overall pre- versus post-taper result across 14 studies
      - metric: Time-trial performance with 41 to 60 percent volume reduction
        estimate: -0.77
        unit: standardized mean difference
        context: Subgroup effect; 95% CI -1.23 to -0.30
      - metric: Time-trial performance with 8 to 14 day taper
        estimate: -1.47
        unit: standardized mean difference
        context: Largest duration subgroup effect; 95% CI -2.75 to -0.19
    applicable_population:
      - Endurance athletes represented by the meta-analysis
      - Recreational 5 km runners only as an indirect taper population
    domain:
      - Taper
      - Volume
      - Intensity
      - Frequency
    limitations:
      - Sports, performance levels, and event distances were mixed.
      - The analysis does not validate a universal recreational 5 km taper.
      - Taper effects depend on prior training and interactions among load variables.
  - id: outdoor-5k-plan.fixed-progression-not-safety-threshold
    statement: >
      A novice-runner program based on the 10 percent rule did not reduce
      running-related injury compared with a standard program, and acute-to-
      chronic workload ratio zones lack established causal support for training
      recommendations. Neither should be used as an individual safety law.
    source_ids:
      - buist-2008
      - impellizzeri-2020
    evidence_strength: moderate
    effect_estimates:
      - metric: Running-related injury incidence
        range_low: 20.3
        range_high: 20.8
        unit: percent
        context: Standard 8-week versus 10-percent-rule 13-week novice programs; p=0.90
    applicable_population:
      - Novice adult runners in the randomized trial
      - Athletic workload-monitoring populations for the methodological critique
    domain:
      - Progression
      - Injury-prevention claim limits
      - Workload monitoring
    limitations:
      - Injury incidence does not determine optimal performance progression.
      - The trial does not prove that every faster progression is safe.
      - The critique does not make training history irrelevant or validate a replacement threshold.
  - id: outdoor-5k-plan.individual-outcomes-require-error-aware-validation
    statement: >
      Group-average training effects cannot by themselves establish an
      individual response, success probability, or meaningful change. Error,
      within-person variability, and a predeclared worthwhile-change rule must
      be addressed before individual classifications are made.
    source_ids:
      - bonafiglia-2021
    evidence_strength: moderate
    effect_estimates:
      - metric: Studies statistically estimating interindividual trainability
        estimate: 9
        unit: studies
        context: 9 of 149 studies in the systematic review
    applicable_population:
      - Adults in standardized exercise-training studies
      - Recreational 5 km runners only as a future validation population
    domain:
      - Individual response
      - Measurement error
      - Probability and outcome claim limits
    limitations:
      - The review was not a running-plan or 5 km prediction study.
      - It supplies no target, progression, session-count, or probability threshold.
