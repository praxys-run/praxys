known_gaps:
  - A prospectively evaluated, reproducible outdoor 5 km plan-generation policy for adult recreational runners
  - A valid individual mapping from current capability, training history, context, and threshold estimates to workout dose, progression, or success probability
  - Direct evidence for the existing 35-day, 40 to 130 percent, three-quality-session, rest, eight-week, 28-day, and 3 percent heuristics
  - Safety-event, adverse-symptom, and discontinuation rates for any proposed unsupervised outdoor 5 km policy
  - Protocol-specific outdoor 5 km baseline repeatability, meaningful-change, and race-agreement evidence in the target population
  - Fairness, missingness, and performance assessment across sex, age, training history, threshold availability, provider provenance, and sparse-data status
  - An evaluation of LLM output reliability, prompt sensitivity, hallucination, or unsafe-plan rate for this use case
conflicting_findings:
  - Structured-training studies can report improvement while differing in intensity distribution, adherence, protocol, and population; the retained evidence does not identify one transferable policy.
  - A workload history can be descriptively useful while workload-ratio thresholds remain unsuitable as causal injury limits.
  - Fixed-distance performance tests can be useful under a defined protocol while outdoor context can weaken direct before/after comparability.
follow_up_questions:
  - Can a human-reviewed, pre-registered, suggestion-only policy outperform a no-change comparator without increasing adverse events or coercion?
  - Which proposal inputs can be minimized while retaining reproducibility and allowing athletes to correct, exclude, or delete context?
  - Which protocol, outcomes, error model, and stopping rules would support a future outdoor 5 km validation study?
  - Do proposed rules remain calibrated and equitable across predefined subgroups and missing-data patterns?
  - Does independently repeating the documented PubMed and Crossref searches change the source set or claim strength?
