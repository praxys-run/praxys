schema_version: 1
id: evidence-road-half-marathon-plan-generation-policy-v1
version: 1
title: "History-anchored adult outdoor road half-marathon performance planning"
research_question: >
  For adults aged 18 years or older whose current training-context pattern
  shows direct half-marathon capability and stable recent running history, what
  evidence supports and limits suggestion-only outdoor road half-marathon
  performance planning with optional target time and date, confirmed event
  context, durability and long-run inputs, tapering, and fueling practice?
topic: road-half-marathon-plan-generation-policy
status: accepted
approval_mode: artifact
authors:
  - agent:github-copilot
human_reviewers: []
created_on: 2026-08-14
reviewed_on: 2026-08-14
intended_product_purpose: >
  Define the evidence boundary for one history-rich outdoor road
  half-marathon performance policy without inheriting 5 km or 10 km schedule
  numbers. Separate direct half-marathon capability and observational training
  associations from mixed-endurance taper, intensity-distribution, recovery,
  and sports-nutrition evidence. Identify where Praxys still needs explicit
  product guardrails for history depth, baseline freshness, long-run exposure,
  quality spacing, progression, execution windows, target communication,
  fueling prompts, and post-plan evaluation.
scope:
  population:
    - Adults aged 18 years or older
    - Runners with current direct outdoor road half-marathon capability
    - Runners with stable recent history sufficient to anchor their own training exposure
    - Outdoor road half-marathon performance intent with or without a confirmed target event
    - Recreational and amateur cohorts as evidence populations, not permanent user identities
  intervention_or_exposure:
    - Half-marathon performance demands, pacing, and prediction inputs
    - Weekly running volume, frequency, and longest-run exposure
    - Mostly-low-intensity, threshold, interval, and race-specific training organization
    - Long-run, recovery, and quality-session spacing
    - Pre-event tapering
    - During-run carbohydrate intake and fueling-practice or gut-training exposure
    - Same-task field results, field tests, laboratory markers, and outcome comparability
  comparator:
    - Lower versus higher observed weekly volume or longest-run exposure
    - Polarized, pyramidal, threshold-heavy, or other intensity distributions
    - Reduced versus maintained training volume, intensity, or frequency during taper
    - Field performance versus laboratory or multivariable prediction
    - Practiced versus unpracticed during-exercise fueling
    - Rest versus different post-half-marathon recovery-running intensities
  outcomes:
    - Half-marathon finish time and pacing decline
    - Time-trial or endurance performance
    - Prediction error and comparability
    - Recovery time course
    - Gastrointestinal discomfort and carbohydrate malabsorption
    - Applicability, adherence burden, and uncertainty
method:
  review_type: rigorous
  search_date: 2026-08-14
  sources:
    - name: Europe PMC
      search_string: '("half-marathon" OR "half marathon") AND (training OR performance OR predictor* OR pacing OR physiology) AND (runner* OR running)'
    - name: Europe PMC
      search_string: '("half-marathon" OR "half marathon") AND ("long run" OR "longest endurance run")'
    - name: Europe PMC
      search_string: '("half-marathon" OR "half marathon") AND (threshold OR tempo OR interval OR "race pace") AND training'
    - name: Europe PMC
      search_string: '(recreational runners OR runners) AND (threshold training OR interval training OR training intensity distribution OR polarized) AND (systematic review OR randomized)'
    - name: Europe PMC
      search_string: '("endurance athletes" OR runners) AND taper AND (systematic review OR meta-analysis)'
    - name: Europe PMC
      search_string: '"Carbohydrates for training and competition"'
    - name: Europe PMC
      search_string: '"International Association of Athletics Federations Consensus Statement 2019: Nutrition for Athletics"'
    - name: Europe PMC
      search_string: '"The Effect of Gut-Training and Feeding-Challenge on Markers of Gastrointestinal Status in Response to Endurance Exercise: A Systematic Literature Review"'
    - name: Europe PMC
      search_string: '"New Horizons in Carbohydrate Research and Application for Endurance Athletes"'
    - name: Europe PMC
      search_string: '("half-marathon" OR "half marathon") AND (women OR female) AND (training OR performance predict*)'
    - name: Europe PMC
      search_string: '("half-marathon" OR "half marathon") AND (older OR masters OR age) AND training'
    - name: PubMed Central
      search_string: "Full-text retrieval for included PMCID records discovered through Europe PMC"
    - name: Bounded web discovery
      search_string: "Candidate-source discovery only; effect claims required Europe PMC, PubMed, PMC, DOI, or publisher verification"
  inclusion_criteria:
    - Adult human evidence relevant to outdoor road half-marathon performance planning
    - Systematic reviews, meta-analyses, controlled studies, observational half-marathon studies, or authoritative sports-nutrition consensus
    - Stable DOI, PMID, or publisher metadata
    - Direct half-marathon evidence preferred; broader endurance transfer labelled explicitly
  exclusion_criteria:
    - Beginner or sparse-history plans used as direct evidence for this policy
    - Trail, ultra, multisport, rehabilitation, pregnancy-specific, return-to-sport, or medical prescription
    - Coaching plans, vendor material, blogs, or uncited conventions
    - Metadata-only or inaccessible sources used for strong effect or dosing claims
  quality_appraisal: >
    Claims were appraised for directness to adult outdoor road half-marathon
    planning, study design, self-reported versus measured training, sample
    size, sex and age representation, ecological validity, and whether results
    support individual prescription or only population association. Direct
    half-marathon training-dose evidence is predominantly observational;
    mixed-endurance taper and nutrition evidence is more mature but indirect.
  method_limitations:
    - SPORTDiscus, Embase, and Web of Science were not directly screened in this run
    - Much half-marathon-specific evidence is observational and several predictor studies are male-only
    - Several intensity-distribution and nutrition sources were verified at abstract level only
    - No direct female-specific or masters-specific half-marathon planning trial was identified
    - Modern durability constructs have little direct adult half-marathon planning evidence
claims:
  - id: road-half-marathon.task-specific-capability-is-multifactor
    statement: >
      Half-marathon performance and pacing reflect multiple interacting
      training, physiological, anthropometric, biomechanical, age, and sex
      factors rather than one marker. This supports task-specific capability
      matching but not a universal durability score or single-marker gate.
    source_ids:
      - ogueta-alday-2018
      - gomez-molina-2017
      - nikolaidis-2019-ljubljana
      - cuk-2019-vienna
    evidence_strength: low
    effect_estimates:
      - metric: Performance-model explained variance
        range_low: 90.3
        range_high: 96.2
        unit: percent
        context: Four male half-marathon prediction models in Gomez-Molina et al. 2017
    applicable_population:
      - Adult half-marathon runners
      - Mechanistic and prediction evidence primarily from men
    domain:
      - Capability matching
      - Pacing
      - Performance prediction
    limitations:
      - Predictor studies do not establish causal training prescriptions
      - Direct durability mechanisms and individual thresholds were not validated
      - Male-heavy samples limit subgroup transfer
  - id: road-half-marathon.volume-and-long-run-are-associative
    statement: >
      Higher recent weekly running volume and longer single-run exposure are
      associated with faster half-marathon finish time and less pace decline,
      but the observational evidence does not establish a universal weekly
      dose, frequency, longest-run minimum, or injury-safe prescription.
    source_ids:
      - fokkema-2020
    evidence_strength: moderate
    effect_estimates:
      - metric: Finish-time coefficient for more than 32 km per week
        estimate: -4.19
        range_low: -6.52
        range_high: -1.85
        unit: minutes
        context: Adjusted observational half-marathon model in 556 runners
      - metric: Finish-time coefficient for longest run above 21 km
        estimate: -3.87
        range_low: -6.31
        range_high: -1.44
        unit: minutes
        context: Adjusted observational half-marathon model in 556 runners
    applicable_population:
      - Adult recreational half-marathon entrants
    domain:
      - Weekly volume
      - Longest-run exposure
      - Pacing decline
    limitations:
      - Self-reported training exposure
      - Categorical observational comparisons rather than randomized dose response
      - No causal proof of safety, optimality, or progression rate
  - id: road-half-marathon.taper-is-indirectly-supported
    statement: >
      Mixed-endurance evidence supports reducing training volume while
      maintaining intensity and usually frequency before a key event, with the
      strongest pooled subgroup signal around 8 to 14 days. The evidence does
      not validate one half-marathon-specific taper template or personal gain.
    source_ids:
      - wang-2023
    evidence_strength: moderate
    effect_estimates:
      - metric: Time-trial performance after taper
        estimate: -0.45
        range_low: -0.68
        range_high: -0.23
        unit: standardized_mean_difference
        context: Mixed-endurance meta-analysis; 95% confidence interval
      - metric: Performance with 41 to 60 percent volume reduction
        estimate: -0.77
        range_low: -1.23
        range_high: -0.30
        unit: standardized_mean_difference
        context: Mixed-endurance taper subgroup; 95% confidence interval
      - metric: Performance with 8 to 14 day taper
        estimate: -1.47
        range_low: -2.75
        range_high: -0.19
        unit: standardized_mean_difference
        context: Mixed-endurance taper-duration subgroup; 95% confidence interval
    applicable_population:
      - Endurance athletes, indirectly including road runners
    domain:
      - Taper
      - Event preparation
    limitations:
      - Mixed sports and event distances
      - Not a direct adult road half-marathon taper trial set
      - Heterogeneous prior training and protocols
  - id: road-half-marathon.fueling-and-gut-practice-supported
    statement: >
      Carbohydrate intake during exercise is supported around
      half-marathon-duration efforts, with small amounts or mouth rinse useful
      around one hour and 30 to 60 grams per hour supported for longer
      endurance exercise. Practicing intake can reduce gastrointestinal
      discomfort and carbohydrate malabsorption, but tolerance and race
      duration remain individual and gut-training performance effects are
      uncertain.
    source_ids:
      - burke-2011
      - burke-2019-iaaf
      - martinez-2023
      - podlogar-2022
    evidence_strength: moderate
    effect_estimates:
      - metric: Gastrointestinal discomfort reduction
        estimate: 47
        unit: percent
        context: Two repeated-carbohydrate-feeding protocols summarized in Martinez et al. 2023
      - metric: Carbohydrate malabsorption reduction
        range_low: 45
        range_high: 54
        unit: percent
        context: Two gut-training studies summarized in Martinez et al. 2023
    applicable_population:
      - Adult endurance athletes
      - Half-marathon runners whose expected duration and tolerance make intake relevant
    domain:
      - During-run fueling
      - Gastrointestinal tolerance
      - Fueling practice
    limitations:
      - Most numeric guidance is broader endurance evidence rather than half-marathon-only evidence
      - Expected duration varies substantially within the same race distance
      - No universal carbohydrate-loading rule applies to every half-marathon runner
  - id: road-half-marathon.direct-field-baseline-preferred-with-error
    statement: >
      Recent same-task or closely comparable field performance is more direct
      for half-marathon capability than laboratory markers or multivariable
      predictions alone. Even validated prediction models retain meaningful
      error and do not support a personal success probability.
    source_ids:
      - alvero-cruz-2019
      - nikolaidis-knechtle-2023-hm-predictors
      - gomez-molina-2017
    evidence_strength: low
    effect_estimates:
      - metric: Cooper-test half-marathon prediction standard error
        estimate: 3.78
        unit: minutes
        context: 23 recreational male runners in Alvero-Cruz et al. 2019
      - metric: Laboratory-model half-marathon prediction standard error
        estimate: 5.28
        unit: minutes
        context: 23 recreational male runners in Alvero-Cruz et al. 2019
      - metric: Validation standard deviation around prediction bias
        estimate: 12.8
        unit: minutes
        context: 134 male recreational runners in Nikolaidis and Knechtle 2023
    applicable_population:
      - Recreational male runners in the direct predictor studies
    domain:
      - Baseline hierarchy
      - Target communication
      - Outcome uncertainty
    limitations:
      - Small or male-only samples
      - Field-test equations are not universal replacements for same-task results
      - Prediction error remains material for an individual goal
  - id: road-half-marathon.exact-long-run-dose-unproven
    statement: >
      Meaningful longest-run exposure is associated with half-marathon
      performance, but no reviewed randomized evidence establishes an exact
      longest-run share of weekly volume, exact ceiling, mandatory distance,
      or universal progression rule.
    source_ids:
      - fokkema-2020
    evidence_strength: low
    applicable_population:
      - Adult recreational half-marathon entrants
    domain:
      - Long run
      - Progression
    limitations:
      - One categorical observational half-marathon study anchors the direct evidence
      - A longest run above race distance cannot be generalized as a requirement
      - Injury non-association in the cohort is not a safety guarantee
  - id: road-half-marathon.intensity-distribution-no-universal-winner
    statement: >
      Mostly-low-intensity organization with some threshold, interval, or
      race-specific work is broadly supported, but direct and mixed-distance
      evidence does not establish one universally superior polarized,
      pyramidal, threshold-heavy, quality-session count, or race-pace
      distribution for half-marathon planning. In the cited 10 km trial, both
      groups improved and the primary between-group difference was not
      statistically significant.
    source_ids:
      - munoz-2014
      - campos-2022
      - rosenblat-2025
      - boullosa-2020
    evidence_strength: moderate
    effect_estimates:
      - metric: Within-group ten-kilometre improvement under polarized training
        estimate: 5
        unit: percent
        context: Recreational-runner trial; primary between-group difference was not significant
      - metric: Within-group ten-kilometre improvement under between-threshold training
        estimate: 3.6
        unit: percent
        context: Recreational-runner trial; primary between-group difference was not significant
    applicable_population:
      - Recreational and trained endurance runners
      - Indirect transfer to adult road half-marathon planning
    domain:
      - Intensity distribution
      - Threshold and interval work
    limitations:
      - Different zone definitions, event distances, and sports
      - No direct adult road half-marathon intervention establishes an exact distribution
      - One to two quality sessions per week remains an indirect coaching-oriented recommendation
      - The cited 5.0 versus 3.6 percent trial changes did not differ significantly in the primary comparison
  - id: road-half-marathon.recovery-spacing-unresolved
    statement: >
      Direct evidence does not establish one optimal recovery strategy or
      exact spacing rule between half-marathon training sessions. Post-race
      studies suggest different outcomes may recover over roughly one to three
      days and that higher-intensity recovery running can delay recovery, but
      these findings do not define a universal schedule rule.
    source_ids:
      - li-2024
      - wang-2025-hm-recovery
      - zhou-2026-hm-mri-recovery
    evidence_strength: low
    applicable_population:
      - Adult endurance athletes
      - Recreational runners after simulated or completed half-marathon efforts
    domain:
      - Recovery
      - Quality-session spacing
      - Post-event behavior
    limitations:
      - Small direct half-marathon samples
      - Outcomes differ across biomechanics, proprioception, and MRI markers
      - Post-race recovery does not directly prescribe routine training-session spacing
  - id: road-half-marathon.subgroup-dose-rules-unproven
    statement: >
      Women and older adults are represented in large half-marathon pacing and
      performance datasets, but direct training-response and prediction
      studies remain male-heavy. Observed age or sex differences do not
      establish subgroup-specific automatic training doses.
    source_ids:
      - leyk-2007
      - nikolaidis-2019-ljubljana
      - cuk-2019-vienna
      - gomez-molina-2017
      - alvero-cruz-2019
      - nikolaidis-knechtle-2023-hm-predictors
    evidence_strength: low
    effect_estimates:
      - metric: Observed performance decline from age 50 to 69
        range_low: 2.6
        range_high: 4.4
        unit: percent_per_decade
        context: Large marathon and half-marathon observational dataset in Leyk et al. 2007
    applicable_population:
      - Adult women and men across age groups in observational race datasets
    domain:
      - Subgroup applicability
      - Age context
      - Sex context
    limitations:
      - Observational pacing and participation data do not establish dose response
      - Direct predictor studies are predominantly male
      - Unknown sex or age cannot be converted into a hidden default
