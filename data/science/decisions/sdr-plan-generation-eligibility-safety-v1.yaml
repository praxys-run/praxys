schema_version: 1
id: sdr-plan-generation-eligibility-safety-v1
version: 1
title: "Match plan generation by capability, history, and non-medical safety state"
status: draft
decision_date: 2026-08-14
owners:
  - team:praxys
human_reviewers: []
model_version: plan-generation-eligibility-safety-v1
evidence_review_ids:
  - evidence-plan-generation-eligibility-safety-v1
evidence_claim_ids:
  - eligibility.novice-recreational-different-evidence-family
  - eligibility.recent-history-anchor-without-universal-threshold
  - eligibility.fixed-progression-and-acwr-not-safety-laws
  - eligibility.goal-relevant-current-capability-task-specific
  - eligibility.intensity-mostly-low-no-universal-winner
  - eligibility.one-to-two-quality-sessions-indirect
  - eligibility.masters-modifier-not-age-exclusion
  - eligibility.current-symptoms-support-stop-not-clearance
  - eligibility.evidence-quality-no-personal-probability
accepted_interpretation: >
  If accepted, every Praxys training-plan flow would separate goal capture from
  plan generation. A user may record a supported discipline, distance, surface,
  completion or performance intent, and optional target date even when no
  accepted generator policy currently matches. A shared deterministic router
  would then evaluate current goal-relevant capability, history depth, recent
  consistency, event context, time-bounded training patterns, evidence
  directness, adult scope, non-medical safety state, and athlete-stated
  constraints before selecting an independently accepted sport-, distance-,
  intent-, and context-specific policy. Beginner, currently capable, returning,
  sparse-history, high-load, race-dense, and other states would describe the
  current evidence window rather than label the person as recreational,
  serious, professional, or elite. Imported events and profile fields would
  remain source-labelled candidates until their product purpose is disclosed
  and the athlete confirms or corrects them. Adult eligibility or another
  truly policy-critical field may block the dependent plan path; missing
  optional age, sex, or other modifiers would instead remain unknown and
  disable only the dependent adjustment or metric. Unknown sex may never
  silently become male. A no-event goal may route to rolling training and a
  separately accepted, explicitly chosen completion activity or performance
  benchmark. Confirmed races and maximal efforts count as training load and
  must be reconciled before schedule generation; no calendar data may be
  interpreted as proof that no events exist. The shared policy does not choose
  exact history counts, running-day ranges, intensity percentages, quality
  ceilings, long-run limits, horizons, progression, taper, event priorities, or
  workout templates. Fixed 10 percent progression, ACWR prescription zones,
  automatic catch-up, personal success probabilities, causal missed-training
  explanations, and activity average power for intensity analysis remain
  prohibited. Optional AI may explain or structure reviewable inputs but
  cannot invent identity, event, profile, capability, history, or safety
  context; broaden eligibility; weaken validation; approve; adopt; mutate; or
  deliver a plan. This draft authorizes no product behavior until explicit
  human science acceptance and a separately reviewed implementation.
rejected_alternatives:
  - alternative: "Hide or reject a goal because no accepted generator policy currently matches"
    rationale: >
      Goal intent is durable user choice, while policy availability is a
      versioned product capability. Conflating them prevents honest readiness
      and future routing and makes unsupported science look like an invalid
      user goal.
  - alternative: "Match plan-generation capability by goal distance alone"
    rationale: >
      Distance does not establish current capability, training-history depth,
      recent consistency, age-related context, evidence directness, or safety
      state. Distance-only matching would silently route unsupported
      populations into an accepted policy.
  - alternative: "Classify a runner as recreational, serious, professional, or elite and route permanently from that identity"
    rationale: >
      Study cohort labels describe sampled populations, not stable product
      identities. Capability, history, load, event density, recovery, and
      constraints can change within the same athlete and must be re-evaluated.
  - alternative: "Assume an empty calendar means the athlete has no races or maximal efforts"
    rationale: >
      Missing event data is unknown. Unrecorded races can conflict with quality
      sessions, recovery, and taper decisions, especially for race-dense
      runners.
  - alternative: "Treat an OAuth-accessible provider profile as confirmed canonical truth"
    rationale: >
      Technical access does not establish current accuracy, product-purpose
      understanding, minimum-necessary retention, or permission to overwrite a
      user-confirmed Praxys value.
  - alternative: "Require every demographic profile field before generating any plan"
    rationale: >
      Missing optional modifiers should affect only the dependent adjustment or
      metric. Blocking an otherwise supported plan would increase privacy
      burden without evidence that every field materially improves it.
  - alternative: "Reuse the accepted outdoor 5 km history and schedule numbers as shared defaults"
    rationale: >
      The 5 km horizon, history counts, frequency range, low-intensity floor,
      quality ceiling, long-run bound, and taper choice are policy-specific
      guardrails. The review found no evidence that makes them universal.
  - alternative: "Scale the first accepted performance policy down for beginners or novel-distance runners"
    rationale: >
      Novice runners have a different evidence and injury-incidence profile.
      A plan reviewed for already-capable recreational runners cannot be made
      applicable by reducing duration or volume without a separate decision.
      Direct evidence for grouping goal-distance novelty with beginners is
      absent; that routing is a conservative guardrail for human review.
  - alternative: "Exclude masters and older runners from automatic generation by age"
    rationale: >
      Age changes performance and training capacity, while masters athletes can
      retain high capability. Actual capability, history, constraints, and
      safety state are more defensible than a universal age cutoff.
  - alternative: "Use a fixed 10 percent rule or ACWR zone as the shared safety gate"
    rationale: >
      The reviewed randomized trial did not reduce injury with the 10 percent
      rule, and ACWR zones do not establish causal individual prescriptions.
  - alternative: "Treat current symptoms as a warning while still generating a vigorous plan"
    rationale: >
      The safety boundary should stop performance optimization rather than
      produce a success-shaped plan that could be misread as clearance.
  - alternative: "Require personal narrative explaining missed training before eligibility can be assessed"
    rationale: >
      Narrative is unnecessary for the deterministic path, increases privacy
      burden, and invites unsupported causal inference. Missing context remains
      unknown.
  - alternative: "Let an LLM choose the closest policy and validate the plan afterward"
    rationale: >
      Post-hoc validation cannot make eligibility deterministic or prevent the
      model from broadening population, inventing context, or hiding a failed
      precondition.
  - alternative: "Publish a personal success probability or responder category"
    rationale: >
      No prospectively calibrated, externally validated model exists for the
      supported goal and population tuples, and group evidence does not justify
      an individual probability.
model_parameters:
  - name: activation_and_authority
    value:
      active_behavior: false
      human_acceptance_required: true
      shared_precondition_only: true
      accepted_distance_policy_required: true
      goal_capture_is_independent_from_plan_availability: true
      goal_capture_is_not_plan_adoption: true
      suggestion_only: true
      canonical_adoption_requires_separate_explicit_consent: true
      managed_provider_delivery_requires_separate_explicit_consent: true
    classification: guardrail
    rationale: >
      A draft cross-cutting policy cannot activate generation. Separate
      proposal, adoption, and delivery authority preserves athlete control and
      prevents this shared classifier from becoming a planner.
    applies_to: plan-generation-eligibility-safety-v1
  - name: goal_intent_and_policy_separation
    value:
      goal_may_be_recorded_without_matching_plan_policy: true
      supported_goal_fields:
        - discipline
        - distance
        - surface
        - intent
        - optional_target_time
        - optional_target_date
      intent_states:
        - completion
        - performance
        - continuous_development
        - unknown
      goal_record_state_is_not_eligibility_state: true
      unavailable_policy_result: goal_recorded_plan_policy_unavailable
      unsupported_goal_syntax_result: goal_clarification_required
      distance_policy_must_declare_supported_intents: true
      no_goal_time_or_date_default_inference: true
    classification: guardrail
    evidence_claim_ids:
      - eligibility.goal-relevant-current-capability-task-specific
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      A goal expresses athlete intent; an accepted policy expresses current
      product evidence and capability. Keeping those states separate lets every
      plan flow route completion, performance, and undated goals honestly
      without manufacturing a schedule or rejecting a valid aspiration.
    applies_to: goal capture, capability discovery, and every training-plan entry
  - name: existing_policy_alignment_gate
    value:
      accepted_records_requiring_successor_alignment:
        - sdr-preplan-baseline-policy-v1
        - sdr-outdoor-5k-plan-generation-policy-v1
      draft_records_requiring_alignment_before_acceptance:
        - sdr-adaptive-plan-feasibility-and-adjustment-v1
      alignment_topics:
        - goal_recording_independent_from_policy_availability
        - dynamic_patterns_instead_of_static_runner_identity
        - event_context_and_no_event_routing
        - profile_provenance_and_field_level_missingness
      accepted_records_remain_unchanged_in_this_draft: true
      shared_router_activation_before_successor_acceptance: false
    classification: guardrail
    rationale: >
      Existing accepted records preserve review history and cannot be silently
      rewritten. Their self-coached recreational scope and earlier goal-flow
      assumptions require coordinated successor decisions before this shared
      router can govern shipped 5 km or baseline behavior.
    applies_to: science lifecycle migration and shared-router activation
  - name: capability_match_axes
    value:
      required:
        - adult_scope
        - discipline
        - goal_intent
        - goal_kind
        - goal_distance
        - goal_surface
        - goal_outcome
        - event_context
        - goal_relevant_current_capability
        - history_depth
        - recent_consistency
        - training_context_patterns
        - evidence_directness
        - masters_modifier
        - athlete_reported_safety_stop
        - athlete_stated_constraints
      distance_is_history_proxy: false
      distance_is_capability_proxy: false
      study_cohort_label_is_user_identity: false
      missing_material_axis_result: clarification_required
    classification: guardrail
    evidence_claim_ids:
      - eligibility.novice-recreational-different-evidence-family
      - eligibility.recent-history-anchor-without-universal-threshold
      - eligibility.goal-relevant-current-capability-task-specific
      - eligibility.masters-modifier-not-age-exclusion
    rationale: >
      Independent axes prevent a matching goal label from erasing population,
      history, capability, event, evidence, or safety differences and prevent a
      static runner label from replacing current data.
    applies_to: shared capability discovery and generator entry
  - name: capability_and_history_routing
    value:
      currently_capable_history_rich: continue_to_matching_intent_and_distance_policy
      currently_capable_sparse_history:
        with_usable_recent_anchor: eligible_with_uncertainty
        without_usable_recent_anchor: insufficient_recent_history_anchor
      first_distance_completion: separate_accepted_completion_policy_required
      goal_distance_novel_performance: conservative_separate_policy_route_pending_validation
      returning_after_interruption: separate_supported_state_or_readiness_only
      outside_reviewed_training_envelope: evidence_indirect_or_no_matching_policy
      masters_or_older_adult: modifier_not_exclusion
      child_or_adolescent: unsupported_by_adult_policy
      medical_rehabilitation_treatment_pregnancy_specific_or_return_to_sport: unsupported_intent
      static_identity_labels_used_for_routing: false
    classification: guardrail
    evidence_claim_ids:
      - eligibility.novice-recreational-different-evidence-family
      - eligibility.recent-history-anchor-without-universal-threshold
      - eligibility.masters-modifier-not-age-exclusion
    rationale: >
      The routing preserves applicability without inventing exact age, history,
      dose, or identity cutoffs. States describe the current evidence window
      and can change over time. First-completion and goal-distance-novel routes
      remain separate product guardrails rather than evidence-backed
      equivalences.
    applies_to: plan-generation capability matching
  - name: history_depth_states
    value:
      states:
        - beginner_or_goal_distance_novel
        - sparse_history
        - history_rich
        - unknown
      cross_cutting_minimum_weeks: none_defined
      cross_cutting_minimum_sessions: none_defined
      cross_cutting_latest_run_days: none_defined
      distance_policy_must_define_any_numeric_boundary: true
      no_usable_recent_anchor_result: insufficient_recent_history_anchor
    classification: guardrail
    evidence_claim_ids:
      - eligibility.recent-history-anchor-without-universal-threshold
    rationale: >
      Recent history matters for extrapolation, but the review did not validate
      one universal count. Numeric values must be justified and versioned by
      each distance and population policy.
    applies_to: shared history sufficiency classification
  - name: dynamic_training_context_patterns
    value:
      pattern_axes:
        capability:
          - first_attempt
          - currently_capable
          - returning
          - unknown
        history:
          - stable
          - sparse
          - interrupted
          - unknown
        load_relative_to_self:
          - below_recent
          - within_recent
          - above_recent
          - unknown
        event_context:
          - confirmed_none
          - single_target
          - race_dense
          - unknown
        intensity_structure:
          - mostly_low
          - quality_dense
          - mixed
          - unknown
        recovery_context:
          - stable
          - constrained
          - unknown
        evidence_directness:
          - direct
          - supporting
          - indirect
          - missing
          - contradictory
      pattern_is_person_identity: false
      time_bounded: true
      evaluation_window_and_version_required: true
      provenance_and_confidence_required: true
      same_athlete_may_change_patterns: true
      athlete_may_confirm_or_correct: true
      correction_changes_provenance_not_observed_history: true
      safety_or_policy_boundary_override_by_correction: false
    classification: guardrail
    evidence_claim_ids:
      - eligibility.recent-history-anchor-without-universal-threshold
      - eligibility.goal-relevant-current-capability-task-specific
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      Current capability and training context can improve, regress, or become
      uncertain. A versioned multidimensional pattern preserves that change and
      its evidence instead of assigning a permanent recreational,
      professional, beginner, or elite identity.
    applies_to: shared plan routing, explanation, and replay
  - name: event_context_and_calendar
    value:
      context_states:
        - confirmed_none
        - single_target
        - race_dense
        - unknown
      event_sources:
        - athlete_entered
        - provider_imported_candidate
      provider_import_requires_athlete_confirmation: true
      minimum_event_fields:
        - date
        - discipline
        - distance_or_duration
        - surface_or_format
        - intent
        - priority
        - source
      priority_states:
        - primary
        - supporting
        - training
        - unknown
      no_calendar_records_means_no_events: false
      point_of_use_future_event_confirmation_required: true
      no_event_completion_route: separately_accepted_controlled_goal_activity
      no_event_performance_route: separately_accepted_opt_in_benchmark
      no_automatic_goal_activity_date: true
      race_or_maximal_effort_counts_as_training_load: true
      distance_policy_must_reconcile:
        - quality_session_count
        - spacing
        - recovery
        - taper
        - schedule_conflicts
      material_unknown_event_context_result: clarification_or_limited_guidance
    classification: guardrail
    evidence_claim_ids:
      - eligibility.recent-history-anchor-without-universal-threshold
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      The review validates no universal calendar or priority schema. Event
      context is nevertheless a material schedule input: confirmed races and
      maximal efforts consume load, while missing records remain unknown.
      Completion activities, benchmarks, priorities, and conflict handling
      require explicit distance-policy decisions and athlete confirmation.
    applies_to: every dated, undated, and race-dense training-plan route
  - name: goal_relevant_current_capability_states
    value:
      - direct_current
      - supporting_uncertain
      - missing
      - contradictory
      - not_required_by_distance_policy
      - out_of_scope
    classification: guardrail
    evidence_claim_ids:
      - eligibility.goal-relevant-current-capability-task-specific
    rationale: >
      Task-specific evidence and supporting evidence have different roles.
      Each distance policy decides which state is sufficient without silently
      converting an unlike protocol or performance into direct capability.
    applies_to: shared current-capability classification
  - name: evidence_directness_states
    value:
      - direct
      - supporting
      - indirect
      - missing
      - contradictory
    classification: guardrail
    evidence_claim_ids:
      - eligibility.goal-relevant-current-capability-task-specific
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      Explicit directness prevents heterogeneous or low-quality evidence from
      becoming a confidence score, probability, or hidden substitute.
    applies_to: capability and proposal evidence snapshots
  - name: eligibility_outcomes
    value:
      goal_recorded_plan_policy_unavailable: valid_goal_without_matching_accepted_policy
      ready_for_distance_policy: all_shared_preconditions_satisfied
      eligible_with_uncertainty: usable_evidence_with_explicit_nonblocking_limits
      clarification_required: material_goal_constraint_or_provenance_field_missing
      limited_guidance: optional_or_event_context_missing_but_no_safety_stop
      no_matching_policy: no_accepted_policy_for_current_intent_and_pattern
      current_symptom_stop: athlete_reported_non_medical_safety_boundary
      insufficient_goal_relevant_capability: required_capability_not_established
      insufficient_recent_history_anchor: no_usable_recent_anchor_for_dose
      unresolved_event_context: material_race_or_maximal_effort_context_unknown
      contradictory_evidence: material_inputs_cannot_be_reconciled
      no_accepted_distance_policy: shared_policy_passed_but_goal_policy_inactive
    classification: guardrail
    rationale: >
      Typed outcomes keep a valid recorded goal separate from uncertainty,
      unavailable science, event clarification, safety, and service errors.
      Missing a policy cannot retroactively make the athlete's goal invalid.
    applies_to: shared eligibility API and all plan-generation clients
  - name: athlete_reported_safety_stop
    value:
      stop_reasons:
        - acute_illness
        - injury_or_pain_altering_running
        - chest_pain_or_pressure
        - fainting_or_near_fainting
        - unusual_severe_breathlessness
        - confusion_or_loss_of_coordination
        - other_red_flag_symptom
        - known_medical_restriction_or_reported_clinician_advice_against_vigorous_exercise
        - self_reported_inadequate_recovery_or_unresolved_substantial_fatigue
        - unsafe_heat_cold_lightning_air_quality_visibility_traffic_footing_or_course
      result: current_symptom_stop
      diagnosis_treatment_or_clearance: prohibited
      automatic_return_to_sport: prohibited
      absent_report_means_risk_free: false
    classification: guardrail
    evidence_claim_ids:
      - eligibility.current-symptoms-support-stop-not-clearance
    rationale: >
      The reviewed screening guidance supports attention to current symptoms,
      not a diagnostic or clearance tool. The structured list makes the stop
      auditable while preserving the non-medical boundary.
    applies_to: vigorous plan and optional maximal-test entry
  - name: cross_cutting_schedule_values
    value:
      weekly_running_frequency: not_defined
      recent_history_count: not_defined
      minimum_low_intensity_fraction: not_defined
      maximum_quality_sessions: not_defined
      quality_spacing: not_defined
      longest_run_limit: not_defined
      weekly_progression: not_defined
      taper: not_defined
      block_horizon: not_defined
      target_date_required: not_defined
      rolling_execution_window: not_defined
      reassessment_cadence: not_defined
      event_priority_effect: not_defined
      no_event_goal_activity: not_defined
      exact_workout_templates: not_defined
      accepted_5_km_values_are_defaults: false
    classification: guardrail
    evidence_claim_ids:
      - eligibility.recent-history-anchor-without-universal-threshold
      - eligibility.intensity-mostly-low-no-universal-winner
      - eligibility.one-to-two-quality-sessions-indirect
    rationale: >
      The evidence supports dimensions and broad tendencies, not one schedule
      envelope for every population and goal. Each distance policy must classify
      its exact values as published, estimate, or guardrail.
    applies_to: every distance-specific generation policy
  - name: progression_and_workload_rules
    value:
      fixed_10_percent_rule_allowed: false
      acwr_prescription_zones_allowed: false
      automatic_missed_session_catch_up_allowed: false
      recent_history_may_be_descriptive: true
      distance_policy_replacement_threshold_required_if_used: true
    classification: guardrail
    evidence_claim_ids:
      - eligibility.fixed-progression-and-acwr-not-safety-laws
      - eligibility.recent-history-anchor-without-universal-threshold
    rationale: >
      Rejecting invalid universal rules does not make training history
      irrelevant. Any replacement must have explicit provenance and cannot be
      smuggled in as an unlabelled safety law.
    applies_to: every distance-specific generation and adjustment policy
  - name: historical_intensity_evidence_source
    value:
      allowed:
        - activity_splits
        - activity_samples
      prohibited:
        - activity_avg_power
      whole_activity_average_can_establish_interval_intensity: false
    classification: guardrail
    evidence_claim_ids:
      - eligibility.intensity-mostly-low-no-universal-winner
    rationale: >
      Whole-activity averages are diluted by warm-up, cool-down, and recovery.
      The repository-wide intensity boundary requires split- or sample-level
      evidence and is independent of the selected goal distance.
    applies_to: history-derived intensity inputs
  - name: masters_modifier
    value:
      automatic_age_exclusion: false
      universal_masters_age_cutoff: none_defined
      exact_date_of_birth_required: false
      acceptable_age_context:
        - athlete_confirmed_adult_scope
        - athlete_confirmed_age_band
        - athlete_confirmed_birth_year
        - unknown
      age_may_be_inferred_from_performance: false
      unknown_age_blocks_only:
        - adult_policy_when_adult_scope_is_unconfirmed
        - accepted_age_dependent_adjustment
      evaluate_with:
        - goal_relevant_current_capability
        - recent_history
        - athlete_stated_availability
        - session_time_limits
        - evidence_directness
        - athlete_reported_safety_stop
      can_be_promoted_to_separate_family_after_validation: true
    classification: guardrail
    evidence_claim_ids:
      - eligibility.masters-modifier-not-age-exclusion
    rationale: >
      Age affects physiology without determining individual capability. A
      modifier keeps uncertainty visible while avoiding unsupported exclusion
      or exact recovery prescriptions.
    applies_to: capability matching and distance-policy validation
  - name: profile_fields_and_missingness
    value:
      profile_layers:
        durable_athlete_confirmed_profile:
          - adult_scope_or_age_context
          - optional_physiology_fields
          - stable_preferences
        dynamic_training_context:
          - capability_pattern
          - history_pattern
          - load_pattern
          - event_pattern
          - recovery_pattern
          - evidence_directness
      field_sources:
        - athlete_entered
        - athlete_confirmed_provider_value
        - provider_imported_candidate
        - derived
        - unknown
      provider_technical_access_is_blanket_product_consent: false
      provider_import_requirements:
        - disclosed_product_purpose
        - minimum_necessary_field
        - source_and_observed_at
        - athlete_confirmation_before_canonical_use
        - no_silent_overwrite
      conflicting_provider_or_user_values_result: clarification_required
      exact_birth_date_storage_required: false
      preferred_age_storage:
        - age_band
        - birth_year
      optional_physiological_sex:
        collected_only_for_accepted_dependent_model: true
        user_may_decline: true
        unknown_may_default_to_male: false
      missing_field_policy:
        adult_scope_for_adult_only_policy: block_dependent_plan_path
        current_safety_state: block_vigorous_plan_path
        material_event_context: clarification_or_limited_guidance
        age_modifier: continue_without_age_adjustment
        physiological_sex_modifier: disable_dependent_metric_or_use_separately_accepted_neutral_method
        unrelated_optional_profile_field: does_not_block_plan
      athlete_controls:
        - view
        - confirm
        - correct
        - decline
        - delete
    classification: guardrail
    evidence_claim_ids:
      - eligibility.masters-modifier-not-age-exclusion
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      The review does not show that every demographic field improves every
      plan. Purpose-bound provenance and field-level consequences minimize
      privacy burden, prevent provider data from becoming silent truth, and
      prevent unknown sex from becoming a hidden male default.
    applies_to: profile, provider imports, plan eligibility, and dependent metrics
  - name: context_provenance_and_privacy
    value:
      provenance_classes:
        - observed
        - athlete_stated
        - athlete_confirmed_provider_value
        - provider_imported_candidate
        - inferred
        - assumed
        - unknown
      free_text_personal_context_required: false
      purpose_bounded_structured_context_preferred: true
      missed_training_reason_inference: prohibited
      missing_context_means_unknown: true
      imported_event_or_profile_candidate_is_confirmed: false
      dynamic_pattern_requires_source_window_and_version: true
      athlete_can_correct_exclude_or_delete_context: true
    classification: guardrail
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      Provenance and optional context prevent behavior from becoming an
      invented personal or medical explanation and minimize collection beyond
      what eligibility needs.
    applies_to: eligibility input, proposal evidence, and decision traces
  - name: deterministic_matching_and_optional_ai
    value:
      complete_non_ai_path_required: true
      deterministic_given_same_versioned_inputs: true
      ai_allowed:
        - explain_eligibility_result
        - compare_already_valid_policy_options
        - translate_athlete_text_into_reviewable_structured_fields
      ai_prohibited:
        - select_an_unaccepted_policy
        - broaden_population
        - assign_static_runner_identity
        - invent_current_capability
        - invent_history_or_personal_context
        - invent_or_confirm_event_context
        - confirm_or_overwrite_provider_profile
        - weaken_or_skip_validation
        - diagnose_or_clear
        - approve_adopt_mutate_or_deliver_plan
      all_ai_structured_output_revalidated: true
    classification: guardrail
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      AI may improve explanation without becoming a second eligibility or
      planning authority.
    applies_to: API, web, miniapp, plugin, and MCP plan-start clients
  - name: personal_success_probability
    value: disabled
    classification: guardrail
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      No accepted and externally validated model estimates goal achievement
      for the matched population, history, and goal tuple.
    applies_to: eligibility, feasibility, proposal, and outcome presentation
  - name: validation_order
    value:
      - goal_recorded_and_normalized
      - accepted_shared_policy
      - accepted_matching_sport_distance_and_intent_policy
      - adult_scope_and_supported_intent
      - athlete_reported_safety_stop
      - material_event_context_and_schedule_conflicts
      - goal_relevant_current_capability
      - history_depth_and_recent_anchor
      - dynamic_training_context_patterns
      - evidence_directness_and_contradiction
      - optional_profile_modifiers_and_stated_constraints
      - distance_specific_schedule_validation
      - deterministic_replay_hash
    classification: guardrail
    rationale: >
      The order prevents schedule construction from preceding policy,
      population, safety, capability, or evidence checks.
    applies_to: shared eligibility and distance-specific generator orchestration
  - name: replay_and_audit_record
    value:
      persist:
        - shared_policy_version
        - distance_policy_version
        - matched_capability_id
        - normalized_goal_tuple
        - goal_record_state
        - matched_intent_policy
        - dynamic_pattern_snapshot
        - pattern_evaluation_window
        - event_context_state
        - confirmed_event_snapshot
        - profile_field_provenance
        - missing_field_effects
        - current_capability_state
        - history_depth_state
        - recent_consistency_state
        - masters_modifier
        - evidence_directness_state
        - safety_stop_state
        - athlete_stated_constraint_snapshot
        - eligibility_result
        - failed_rule_id
        - clarification_fields
        - deterministic_input_hash
      same_inputs_and_versions_require_same_result: true
      changed_material_input_requires_new_evaluation: true
    classification: guardrail
    rationale: >
      Versioned replay is required to audit false stops, false-safe routing,
      subgroup effects, edits, and policy drift without retaining unrestricted
      narrative.
    applies_to: eligibility evidence snapshots and proposal audit
applicability:
  - Applies as the shared goal-capture and plan-routing contract for every Praxys training plan, while the reviewed evidence remains running-specific.
  - Does not itself enable a sport, distance, intent, surface, horizon, workout, goal activity, benchmark, event-priority rule, or provider-delivery capability.
  - A syntactically valid goal may remain recorded when no accepted plan policy matches.
  - First-completion runners require a separate accepted intent and distance policy.
  - Goal-distance-novel performance runners conservatively require a separate policy pending direct validation; this is a Praxys guardrail, not an identity label.
  - Sparse-history runners require an explicit usable recent anchor and a distance policy that supports uncertainty; otherwise generation fails closed.
  - Masters and older-adult runners are not excluded by age alone.
  - No recreational, serious, professional, elite, beginner, or other cohort term becomes a permanent user identity or sole routing variable.
  - No-event, single-target, and race-dense context remain separate dynamic states and require confirmed event information when scheduling would materially differ.
  - Provider-imported profile and event fields remain candidates until purpose-bounded confirmation.
  - Missing optional demographic modifiers affect only their dependent adjustment or metric; adult-scope uncertainty may still block an adult-only plan path.
  - Medical rehabilitation, treatment, pregnancy-specific prescription, diagnosis, clearance, and return-to-sport remain unsupported intents.
  - Distance-specific policies remain responsible for exact baseline, history, schedule, intensity, progression, long-run, taper, and reassessment values.
  - Existing accepted outdoor 5 km values remain specific to that accepted policy.
  - Existing accepted baseline and outdoor 5 km records require coordinated successor alignment before this shared router can activate.
user_facing_claim_limits:
  - Do not hide or invalidate a goal merely because no accepted generator policy currently matches.
  - Do not call a runner eligible merely because the selected distance matches an available policy.
  - Explain whether the limiting state is population, current capability, history, evidence quality, safety, constraints, or unavailable accepted science.
  - Describe completion, capability, history, load, event, recovery, and evidence states as current time-bounded patterns, not personal identities.
  - Do not describe first-attempt, sparse-history, history-rich, race-dense, high-load, or masters states as diagnoses or personal risk probabilities.
  - Do not call a user recreational, serious, professional, or elite from an opaque score or permanent classification.
  - Do not imply that masters or older runners are incapable based on age alone.
  - Do not imply that missing age or sex makes every plan invalid, or that unknown sex means male.
  - Do not present imported provider fields as user-confirmed facts before confirmation.
  - Do not treat an empty event calendar as confirmation that no races or maximal efforts exist.
  - Do not present recent-history counts, frequency ranges, intensity percentages, quality ceilings, progression, or long-run limits as cross-cutting published safety thresholds.
  - Do not transfer an accepted 5 km number or template to another distance without a separate accepted decision.
  - Do not present the 10 percent rule or ACWR as a causal safety zone.
  - Do not infer why training was missed or require personal narrative for the deterministic path.
  - Do not promise goal achievement, assign a personal probability, or label an athlete a responder.
  - Do not present a symptom stop as diagnosis, treatment, clearance, or return-to-sport advice.
safety_implications:
  - Current athlete-reported illness, injury, red-flag symptoms, substantial unresolved fatigue, reported restriction, or unsafe conditions stop performance-plan generation.
  - An unsupported medical, rehabilitation, pregnancy-specific, or return-to-sport request exits the performance-planning flow.
  - Absence of a reported stop does not constitute medical clearance or proof that vigorous exercise is risk-free.
  - No automatic catch-up, doubling, compression, or compensatory increase follows missed training.
  - Confirmed races, benchmarks, and maximal efforts count as training load and must be reconciled with quality-session and recovery limits.
  - Material unknown future-event context prevents a full conflict-sensitive schedule, but does not invalidate the underlying goal.
  - No distance policy may bypass shared safety, capability, history, or evidence checks.
  - Use activity splits or samples, never activity average power, when historical intensity matters.
privacy_implications:
  - Collect only the owner-scoped structured fields needed to match, explain, replay, and audit eligibility.
  - Personal narrative is optional and unnecessary for the deterministic path.
  - Keep observed, athlete-stated, athlete-confirmed provider, provider-candidate, inferred, assumed, and unknown inputs distinct.
  - Technical provider access does not authorize unrestricted retention, repurposing, or silent canonical use of every available profile field.
  - Prefer adult attestation, age band, or birth year over exact birth date when exact date is unnecessary.
  - Collect physiological sex only for an accepted dependent model with disclosed purpose; declining it must not silently select a male default.
  - Do not infer medical state, family, employment, identity, or reasons for missed training from behavior.
  - Allow athlete correction, exclusion, and deletion of stated context and derived eligibility traces under existing account controls.
  - Do not place raw context, exact location, symptoms, or unrestricted prompts in generic logs, public trackers, or evaluation corpora.
validation_plan:
  - Human science review must accept, revise, or reject this Evidence Review and SDR before any shared eligibility behavior cites them.
  - Implement first in offline shadow mode against versioned goal and history snapshots without exposing or adopting a plan.
  - Measure goal-recording success separately from matched-policy, limited-guidance, clarification, and no-plan distributions.
  - Measure clarification burden, event conflicts, false-stop review, contradictory-input handling, pattern transitions, and deterministic replay stability.
  - Verify the same athlete can change patterns across versioned windows without historical observations being rewritten.
  - Validate no-event completion and performance routes separately before enabling a controlled goal activity or benchmark.
  - Validate single-target and race-dense schedules with confirmed event priorities before any automated taper or recovery behavior.
  - Segment results by current pattern, age band, sex, provider, and missingness only when the data was lawfully collected and sample size permits.
  - Compare candidate recent-history anchors without presenting any candidate as a causal injury threshold.
  - Audit provider imports for purpose disclosure, minimum fields, confirmation, conflict handling, deletion, and no silent overwrite.
  - Verify missing optional age or sex disables only the dependent modifier or metric and never selects a hidden male default.
  - Verify every enabled capability also references an accepted distance-specific SDR and cannot inherit another policy's numeric values.
  - Require draft successor coverage for accepted baseline and outdoor 5 km records before shared-router activation; do not edit or supersede accepted history without human approval.
  - Audit every UI, API, plugin, and MCP response for personal probabilities, hidden policy relaxation, invented context, or diagnosis-shaped wording.
  - Pre-register safety exits, adverse reports, acceptance, edits, rejection, burden, and subgroup stop criteria before any suggestion-first pilot.
  - Require a successor decision before promoting sparse-history or masters status to a separate policy family or adding autonomous permissions.
falsification_conditions:
  - A valid goal cannot be recorded because no accepted plan policy matches.
  - The shared router activates while accepted baseline or outdoor 5 km records still rely on unaligned static identity or goal-flow assumptions.
  - A goal-distance match alone enables generation despite a population, capability, history, evidence, or safety mismatch.
  - A beginner enters an already-capable policy without a separately accepted family.
  - A goal-distance-novel runner enters an already-capable policy despite the draft conservative routing guardrail.
  - A static recreational, serious, professional, elite, or beginner identity determines routing after current data changes.
  - A dynamic pattern lacks an evaluation window, version, provenance, or correction path.
  - An empty or unavailable event calendar is treated as proof that no race or maximal effort exists.
  - A confirmed race or benchmark is omitted from quality-session, load, recovery, or schedule-conflict validation.
  - Provider profile or event data becomes canonical or overwrites a user-confirmed value without disclosed purpose and confirmation.
  - Missing optional age or sex blocks an unrelated plan, or unknown sex silently selects a male coefficient.
  - A runner with no usable recent history anchor receives a dose-shaped plan.
  - Masters or older runners are rejected solely because of age, or age is used to infer a fixed recovery need.
  - Current symptoms produce a plan, or the stop response is presented as medical diagnosis or clearance.
  - Any accepted outdoor 5 km numeric value becomes a cross-cutting default without a new decision.
  - Fixed 10 percent progression, ACWR zones, automatic catch-up, or activity average power enters generation.
  - Missing context is invented, narrative is required, or a reason for missed training is inferred.
  - Optional AI can select an unaccepted policy or bypass deterministic eligibility validation.
  - The same versioned inputs produce a different eligibility result.
  - A user-facing surface emits a personal success probability, responder label, or guarantee.
  - Prospective review shows material false-safe routing, subgroup exclusion, privacy burden, or unsafe behavior that cannot be bounded.
affected_surfaces:
  models:
    - Future plan-generation-eligibility-safety-v1 pure policy model
    - Plan-generation capability registry and matcher
    - Goal intent, dynamic pattern, event, profile, evidence, and eligibility snapshots
    - Event-calendar confirmation and conflict model
    - Purpose-bounded profile provenance and missing-field model
    - Adaptive-plan proposal audit and deterministic replay record
  apis:
    - Shared owner-scoped goal capture and plan-generation capability discovery
    - Shared eligibility evaluation and typed no-plan contract
    - Profile and event candidate confirmation, correction, and deletion
    - Distance-specific readiness and proposal APIs
  clients:
    - Web Goal, profile, event-calendar, and Training plan-start flows
    - WeChat miniapp plan-start parity
    - Plugin and MCP capability discovery and proposal tools
    - English and Simplified Chinese eligibility, uncertainty, and safety copy
  science_notes:
    - Why goal choice remains separate from current plan availability
    - Why current capability, history, event context, and patterns are separate routing dimensions
    - Why patterns describe a time-bounded state rather than the athlete's identity
    - Why provider profile access still requires purpose-bounded confirmation
    - Why optional demographic missingness affects only dependent behavior
    - Why exact schedule values remain distance-specific guardrails
    - Why masters status modifies uncertainty without excluding by age
    - Why symptoms stop generation without diagnosis or clearance
