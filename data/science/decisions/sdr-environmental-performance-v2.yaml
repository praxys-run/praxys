  - environment.wbgt-population-performance
  - environment.temperature-nonlinear
  - environment.marathon-wbgt-performance-level
  - environment.humidity-fixed-temperature-capacity
  - environment.solar-radiation-first-order
  - environment.stull-wet-bulb-proxy
  - environment.full-wbgt-inputs
  - environment.wet-bulb-not-safety-boundary
  - environment.morphology-not-sex-coefficient
  - environment.no-universal-personal-correction
  - personal-environment-response.cardiovascular-drift-plausible
  - personal-environment-response.duration-hydration-confounding
  - personal-environment-response.running-power-limited-proxy
  - personal-environment-response.pace-grade-insufficient
  - personal-environment-response.association-not-prediction
  - personal-environment-response.structured-validation
  - personal-environment-response.activity-cluster-uncertainty
