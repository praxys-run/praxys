decision_notes:
  - This is Decision proposal mode. Both the Evidence Review and SDR remain draft, with no human reviewer recorded and no active behavior.
  - "Rule disposition: retain 28 days only as a rolling workflow guardrail, not as an optimal training duration."
  - "Rule disposition: reject the fixed three-build/one-recovery cycle."
  - "Rule disposition: reject plus or minus 10 percent progression as a safety law; v1 programs no progression beyond the recent typical complete week."
  - "Rule disposition: reject a fixed 60 to 70 percent recovery week."
  - "Rule disposition: replace the plugin's maximum of three quality sessions with at most two nonconsecutive quality days."
  - "Rule disposition: three to five running days inherently leave at least two non-running days, while quality spacing separately requires an easy or rest day."
  - "Rule disposition: keep at most one longest easy run only when recent history supports it and never progress it beyond the recent longest completed run."
  - "Rule disposition: reject generic 40 to 130 percent threshold-power bounds; power is optional and tied to the active athlete-specific zone model."
  - Exact interval repeat structure remains a product-template guardrail and evidence gap. Human acceptance of this envelope does not turn a future template into published science.
  - Keep active_behavior false while this record is draft. Human acceptance is necessary but not sufficient for shipping.
  - After acceptance, implement the deterministic policy as a pure versioned analysis service with no I/O or global state.
  - Load current baseline evidence, six completed weeks of running history, split or sample intensity evidence, active zone models, and explicit athlete constraints through the data layer.
  - Return a versioned non-canonical proposal or a typed no-plan outcome; generation must not write canonical workouts.
  - Validate proposal freshness and adopt atomically through the adaptive-plan proposal domain while keeping provider delivery separate.
  - Use the same generator and validator for web, miniapp, plugin, and MCP clients.
  - Register exact deterministic workout-template IDs and steps with the model version; they remain product guardrails and must not be described as published optima.
  - Human science review is required before issue 670 implements active generation.
  - No generation implementation, active model behavior, theory change, API response, or user-facing claim is authorized by this draft alone.
