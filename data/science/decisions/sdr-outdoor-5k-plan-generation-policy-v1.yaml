schema_version: 1
id: sdr-outdoor-5k-plan-generation-policy-v1
version: 1
title: "Propose a history-anchored 28-day outdoor 5 km plan block"
status: draft
decision_date: 2026-08-11
owners:
  - team:praxys
human_reviewers: []
model_version: outdoor-5k-plan-generation-policy-v1
evidence_review_ids:
  - evidence-preplan-baseline-policy-v1
  - evidence-outdoor-5k-plan-generation-policy-v1
evidence_claim_ids:
  - baseline.goal-protocol-match
  - baseline.current-capability-not-change-comparability
  - baseline.freshness-cutoff-not-validated
  - baseline.vigorous-test-symptom-screen
  - outdoor-5k-plan.structured-periodization-bounded-benefit
  - outdoor-5k-plan.mostly-low-intensity-no-universal-winner
  - outdoor-5k-plan.one-to-two-quality-sessions-indirect
  - outdoor-5k-plan.taper-volume-reduction-supported
  - outdoor-5k-plan.fixed-progression-not-safety-threshold
  - outdoor-5k-plan.individual-outcomes-require-error-aware-validation
accepted_interpretation: >
  This draft proposes a suggestion-only, deterministic 28-day adaptive plan
  block for adults aged 18 years or older who match the accepted outdoor road
  5 km baseline population, hold a current qualified 5 km baseline, and have
  enough recent complete running history to anchor dose. The block is a
  versioned planning horizon, not a claim that four weeks is biologically
  optimal or sufficient to achieve a target. It uses three to five running
  days without exceeding recent modal frequency, at least 70 percent planned
  low-intensity minutes, at most two nonconsecutive quality days, no planned
  progression beyond the recent typical complete week, no week beyond the
  recent maximum complete week, and no longest run beyond recent completed
  history. A supported taper applies only when a target event or same-protocol
  test is in the evidence-backed window. Generic threshold-power percentages,
  the plugin's 3-build/1-recovery cycle, a 60 to 70 percent recovery week,
  universal 10 percent progression, and ACWR prescription zones are rejected.
  Power targets are optional and require a current athlete-specific threshold
  and active zone model. The deterministic service is the complete non-AI
  path; optional AI may explain or compare already-valid variants but cannot
  broaden eligibility, alter the envelope, approve, adopt, mutate, or deliver
  a plan. Missing, stale, incomparable, unsafe, ambiguous, or contradictory
  inputs yield a typed no-plan outcome and a bounded alternative rather than
  extrapolation. The proposal makes no efficacy guarantee, personal success
  probability, medical inference, causal adherence diagnosis, or automatic
  catch-up recommendation. It becomes active only after an identified human
  science reviewer accepts this SDR and a separate implementation is reviewed.
rejected_alternatives:
  - alternative: "Keep the plugin's current 28-day prompt and validator unchanged"
    rationale: >
      The prompt combines a 3-build/1-recovery cycle, plus or minus 10 percent
      progression, a 60 to 70 percent recovery week, up to three quality
      sessions, long-run progression, and generic threshold-power bounds
      without direct validating evidence.
  - alternative: "Generate a generic static 5 km template for any user"
    rationale: >
      A static template ignores current qualified capability, recent dose,
      availability, and explicit constraints and would extrapolate into
      populations outside the accepted baseline decision.
  - alternative: "Let an LLM create the schedule and validate it afterward"
    rationale: >
      Post-hoc validation cannot make opaque generation deterministic or
      prevent unsupported assumptions. The policy service must create or
      validate the complete schedule before any proposal is persisted.
  - alternative: "Generate a complete goal plan through the target date"
    rationale: >
      Long goal horizons amplify unsupported progression assumptions and
      conflict with the intended observe-and-reassess loop. V1 uses a rolling
      block and requires a successor proposal for continued planning.
  - alternative: "Require a new maximal 5 km test before every generated plan"
    rationale: >
      The accepted baseline policy is history-first and treats a test as an
      optional safety-screened fallback, never a required burden.
  - alternative: "Use a fixed 10 percent progression or ACWR safe zone"
    rationale: >
      The 10 percent rule did not reduce injury in the reviewed randomized
      novice-running trial, and ACWR zones do not establish causal individual
      prescriptions.
  - alternative: "Choose polarized training as the universally optimal distribution"
    rationale: >
      The reviewed evidence supports mostly low-intensity organization but
      does not identify a universal polarized or pyramidal winner.
  - alternative: "Disable generation until every interval template is directly validated"
    rationale: >
      Exact session structure remains an evidence gap, but a conservative,
      transparent, versioned product envelope can be piloted without claiming
      that its templates are published biological optima.
model_parameters:
  - name: activation_and_authority
    value:
      active_behavior: false
      human_acceptance_required: true
      suggestion_only: true
      canonical_adoption_requires_separate_explicit_consent: true
      managed_provider_delivery_requires_separate_explicit_consent: true
    classification: guardrail
    evidence_claim_ids: []
    rationale: >
      Draft science records do not authorize behavior. Separating proposal,
      adoption, and delivery preserves athlete control and the canonical plan
      boundary.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: eligible_goal_and_population
    value:
      minimum_age_years: 18
      population: self_coached_recreational_road_runner
      current_capability: can_complete_5_km
      goal_distance_meters: 5000
      goal_surface: outdoor_road
      goal_outcome: elapsed_time_performance
      excluded:
        - children
        - clinical_rehabilitation
        - return_to_sport
        - pregnancy_specific_prescription
        - unable_to_safely_complete_5_km
        - trail_or_ultra_goal
        - beginner_to_5_km_goal
    classification: guardrail
    evidence_claim_ids:
      - baseline.goal-protocol-match
    rationale: >
      This intentionally reuses the accepted first baseline population and
      goal contract rather than transferring evidence to unreviewed goals or
      populations.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: current_baseline_prerequisite
    value:
      required_status: current
      accepted_evidence:
        - qualified_measured_5_km_race
        - athlete_confirmed_intentional_all_out_5_km_effort
      current_through_completed_days: 42
      rejected_or_deferred_statuses:
        - missing
        - stale
        - incomparable
        - declined
        - unsafe
        - insufficient
      fallback: accepted_history_refresh_or_opt_in_test_path
    classification: guardrail
    evidence_claim_ids:
      - baseline.current-capability-not-change-comparability
      - baseline.freshness-cutoff-not-validated
      - baseline.vigorous-test-symptom-screen
    rationale: >
      The generator shapes a performance plan and therefore requires the
      current-capability state already defined by the accepted baseline
      decision. Forty-two days remains a versioned product cutoff rather than
      a biological law. A no-plan result does not block other product use.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: goal_target_and_feasibility_handling
    value:
      target_elapsed_time_optional: true
      target_event_or_test_date_optional: true
      target_time_can_increase_frequency_minutes_or_intensity: false
      personal_success_probability_generated: false
      causal_goal_feasibility_claim_generated: false
      target_event_less_than_8_days_away_result: insufficient_goal_horizon
      performance_gap_outside_history_anchored_envelope_result: goal_gap_not_actionable_v1
      bounded_alternatives:
        - accept_history_anchored_block_with_feasibility_unknown
        - revise_target_time_or_date
        - defer_plan_generation
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.structured-periodization-bounded-benefit
      - outdoor-5k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      The reviewed evidence supports neither translating an individual time gap
      into extra training dose nor a personal probability of success. V1 may
      structure a conservative block around the goal while leaving feasibility
      explicitly unknown.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: recent_history_prerequisite
    value:
      lookback_completed_weeks: 6
      minimum_usable_completed_weeks: 3
      minimum_running_sessions_per_usable_week: 2
      latest_run_within_days: 14
      usable_week_requires:
        - completed_running_sessions
        - positive_duration
        - sufficient_timestamps_for_week_assignment
      sparse_history_result: insufficient_recent_history
      fallback: future_consistency_or_base_policy
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.fixed-progression-not-safety-threshold
    rationale: >
      The exact counts are conservative Praxys pilot boundaries, not published
      biological thresholds. They are intended to prevent dose extrapolation
      while avoiding the false safety of fixed percentage progression.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: plan_horizon_and_reassessment
    value:
      block_days: 28
      reassessment_interval_days: 7
      complete_goal_plan: false
      continued_goal_horizon_requires_successor_block: true
      automatic_successor_adoption: false
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.structured-periodization-bounded-benefit
      - outdoor-5k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      Twenty-eight days and weekly reassessment are versioned workflow choices
      for a bounded adaptive loop. The evidence supports structured multi-week
      training but does not establish four weeks as optimal or sufficient.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: running_day_frequency
    value:
      minimum_running_days_per_7_days: 3
      maximum_running_days_per_7_days: 5
      maximum_is_recent_modal_frequency: true
      maximum_is_athlete_stated_availability: true
      fewer_than_3_available_or_recent_modal_days_result: unsupported_frequency
      more_than_5_requested_days_result: clarification_required
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.structured-periodization-bounded-benefit
      - outdoor-5k-plan.one-to-two-quality-sessions-indirect
    rationale: >
      The range covers the directly studied three-session program and permits
      personalization without increasing initial frequency beyond recent
      behavior. It is not a universal optimal frequency.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: session_taxonomy_and_mix
    value:
      allowed_running_session_types:
        - easy
        - longest_easy
        - controlled_quality
        - short_interval_quality
        - target_event_or_same_protocol_test
      run_day_templates:
        "3":
          maximum_quality_days: 1
          easy_days_including_longest: 2
        "4":
          maximum_quality_days: 1
          easy_days_including_longest: 3
        "5":
          maximum_quality_days: 2
          easy_days_including_longest: 3
      maximum_longest_easy_sessions_per_7_days: 1
      exact_step_templates_are_versioned_product_guardrails: true
      unsupported_session_types:
        - unbounded_free_text_workout
        - generic_threshold_power_percentage_workout
        - medical_rehabilitation_workout
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.structured-periodization-bounded-benefit
      - outdoor-5k-plan.one-to-two-quality-sessions-indirect
    rationale: >
      The mix limits quality exposure while retaining a simple, deterministic
      structure. Exact interval repeats and work-recovery durations are not
      established by the review and must remain explicit versioned product
      parameters inside the accepted envelope, never a science claim.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: quality_day_spacing
    value:
      maximum_quality_days_per_7_days: 2
      consecutive_quality_days_allowed: false
      minimum_intervening_days: 1
      intervening_day_types:
        - easy
        - rest
      reduce_quality_before_adding_running_minutes: true
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.one-to-two-quality-sessions-indirect
    rationale: >
      One to two quality sessions is an indirect review recommendation. The
      ceiling and spacing are conservative product choices rather than a
      validated individual safety threshold.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: planned_intensity_distribution
    value:
      minimum_low_intensity_running_minutes_fraction: 0.70
      measurement_unit: planned_running_minutes
      intensity_source_order:
        - active_athlete_zone_model
        - coarse_session_type_mapping
      historical_intensity_source:
        - activity_splits
        - activity_samples
      prohibited_historical_intensity_source:
        - activity_avg_power
      threshold_heavy_default_allowed: false
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.mostly-low-intensity-no-universal-winner
    rationale: >
      Mostly low-intensity organization is supported, but 70 percent and the
      coarse mapping are transparent pilot guardrails rather than universal
      biological thresholds.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: weekly_running_minutes
    value:
      recent_typical_week_statistic: median
      recent_maximum_week_statistic: maximum
      generated_non_taper_week_minutes_not_above_recent_typical: true
      generated_week_minutes_not_above_recent_maximum: true
      planned_week_over_week_progression: none
      fixed_10_percent_rule_allowed: false
      acwr_prescription_zone_allowed: false
      lower_minutes_to_fit_availability: true
      raise_minutes_above_history_to_chase_goal: false
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.fixed-progression-not-safety-threshold
    rationale: >
      V1 tests whether better structure is useful before testing progression.
      Median and maximum are reproducible history anchors, not claims that
      historical load is safe or optimal.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: session_duration_and_longest_easy_run
    value:
      every_session_respects_athlete_stated_time_limit: true
      every_session_not_above_recent_longest_completed_run: true
      longest_easy_not_above_recent_longest_completed_run: true
      maximum_longest_easy_sessions_per_7_days: 1
      automatic_long_run_progression: false
      no_supported_longest_run_result: omit_longest_easy_designation
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.fixed-progression-not-safety-threshold
    rationale: >
      Recent history and stated availability bound session burden without
      turning either into a medical clearance or an optimal-dose claim.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: published_taper_findings
    value:
      largest_duration_subgroup_effect_days:
        minimum: 8
        maximum: 14
      significant_volume_reduction_subgroup_fraction:
        minimum: 0.41
        maximum: 0.60
      other_improving_duration_days:
        maximum: 21
      maintained_intensity_strategy_supported: true
      maintained_frequency_strategy_supported: true
    classification: published
    evidence_claim_ids:
      - outdoor-5k-plan.taper-volume-reduction-supported
    rationale: >
      These are reported findings from a mixed-endurance meta-analysis, not an
      exclusive eligibility rule. Directness to recreational 5 km runners
      remains limited and must be stated.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: v1_taper_choice
    value:
      volume_reduction_fraction: 0.50
      apply_only_when_target_is_8_to_14_days_from_block_start_or_reassessment: true
      no_target_in_window_result: no_taper
      maintain_intensity: true
      maintain_frequency_when_athlete_constraints_allow: true
      preserve_one_allowed_quality_exposure_when_constraints_allow: true
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.taper-volume-reduction-supported
    rationale: >
      Fifty percent is a reproducible midpoint inside the published 41 to 60
      percent range, not a personalized optimum.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: power_and_zone_targets
    value:
      power_targets_optional: true
      prerequisites:
        - current_athlete_specific_threshold
        - active_versioned_zone_model
      missing_prerequisite_behavior: duration_and_session_type_only
      generic_threshold_percentage_range_allowed: false
      zone_model_can_be_broadened_by_ai: false
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.mostly-low-intensity-no-universal-winner
    rationale: >
      The review does not validate generic 40 to 130 percent threshold-power
      bounds. Current athlete-specific zones may express an already-valid
      session, but power must not create eligibility or intensity evidence.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: context_provenance_and_privacy
    value:
      observed_inputs:
        - qualified_baseline_evidence
        - completed_running_dates
        - completed_running_duration
        - activity_splits_or_samples_when_intensity_is_used
        - active_threshold_and_zone_model_when_power_is_used
      athlete_stated_inputs:
        - available_running_days
        - maximum_session_duration
        - unavailable_dates
        - preferred_longest_run_day
        - target_event_or_test_date
        - terrain_or_equipment_constraints
        - current_illness_injury_or_red_flag_stop
      inferred_inputs:
        - recent_modal_running_frequency
        - recent_typical_complete_week_minutes
        - recent_maximum_complete_week_minutes
        - recent_longest_completed_run
        - recent_intensity_distribution_when_supported
      assumed_inputs: []
      free_text_personal_context_required: false
      free_text_may_not_be_used_to_infer_medical_or_causal_state: true
      retain_only_purpose_bounded_structured_constraints: true
      missing_context_means_unknown: true
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      Explicit provenance prevents the system from inventing availability,
      causes, capability, or safety state. V1 can be fully useful without
      retaining sensitive narrative context.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: deterministic_generation_and_optional_ai
    value:
      complete_non_ai_path_required: true
      deterministic_given_same_versioned_inputs: true
      ai_allowed:
        - explain_assumptions
        - compare_policy_valid_variants
        - draft_athlete_facing_prose
        - translate_athlete_stated_constraints_into_reviewable_structured_fields
      ai_prohibited:
        - broaden_population
        - weaken_or_skip_validation
        - invent_missing_context
        - assign_medical_state
        - create_out_of_envelope_workout
        - approve_or_adopt_plan
        - mutate_canonical_plan
        - deliver_to_provider
      all_ai_output_revalidated_by_policy_service: true
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      Optional prose assistance must not become a second planning authority.
      The same service contract must serve UI, miniapp, plugin, and MCP clients.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: validation_order_and_no_plan_states
    value:
      validation_order:
        - draft_policy_not_active
        - eligible_goal_and_population
        - athlete_reported_safety_stop
        - current_qualified_baseline
        - goal_target_and_feasibility
        - recent_history_completeness
        - stated_availability_and_constraints
        - schedule_frequency_and_spacing
        - weekly_and_session_duration_bounds
        - intensity_distribution
        - zone_or_power_prerequisites
        - taper_eligibility
        - deterministic_replay_hash
      typed_no_plan_states:
        - unsupported_goal_or_population
        - safety_stop
        - insufficient_or_stale_baseline
        - insufficient_goal_horizon
        - goal_gap_not_actionable_v1
        - insufficient_recent_history
        - clarification_required
        - unsupported_frequency
        - contradictory_constraints
        - unsupported_power_target
        - no_schedule_within_envelope
      no_plan_response_requires:
        - failed_rule_id
        - observed_or_stated_reason
        - uncertainty_or_missing_field
        - bounded_next_step
      automatic_relaxation_allowed: false
    classification: guardrail
    evidence_claim_ids:
      - baseline.vigorous-test-symptom-screen
      - outdoor-5k-plan.fixed-progression-not-safety-threshold
      - outdoor-5k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      Fail-closed typed outcomes keep unsupported generation distinguishable
      from errors and prevent hidden relaxation when constraints do not fit.
    applies_to: outdoor-5k-plan-generation-policy-v1
  - name: replay_and_audit_record
    value:
      persist:
        - policy_version
        - generator_version
        - evidence_review_ids
        - evidence_claim_ids
        - baseline_snapshot_id
        - observed_input_snapshot
        - athlete_stated_constraint_snapshot
        - derived_history_statistics
        - plan_proposal
        - validation_results
        - deterministic_input_hash
        - ai_explanation_present
      same_inputs_and_versions_require_same_plan: true
      changed_input_requires_new_proposal_version: true
    classification: guardrail
    evidence_claim_ids:
      - outdoor-5k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      Versioned replay is required to investigate acceptance, edits, drift,
      safety reports, and future outcome claims without reconstructing hidden
      model behavior.
    applies_to: outdoor-5k-plan-generation-policy-v1
applicability:
  - Applies only to adults aged 18 years or older who are self-coached recreational road runners already able to complete 5 km.
  - Applies only to an outdoor road 5 km elapsed-time performance goal with a current qualified baseline and sufficient recent complete history.
  - Excludes children, clinical rehabilitation, treatment, return-to-sport, pregnancy-specific prescription, and athletes unable to safely complete 5 km.
  - Excludes beginner-to-5K, consistency/base, trail, ultra, treadmill, elite, highly trained, and non-5 km goal policies.
  - Missing, stale, incomparable, declined, unsafe, or insufficient baseline state yields no performance-shaped plan.
  - Sparse or internally inconsistent history yields a future consistency/base alternative rather than extrapolation.
  - No reviewed source validates 28 days or weekly reassessment as an optimal biological horizon.
  - The history counts, frequency range, session mix, 70 percent floor, and exact templates are transparent pilot guardrails rather than proven individual optima.
  - Taper evidence is indirect across mixed endurance sports and performance levels.
  - Women, older adults, low-frequency runners, sparse-history users, and provider-specific missingness require prospective subgroup assessment.
user_facing_claim_limits:
  - >
    Allowed summary: "Praxys built this four-week proposal from your current
    5K evidence, recent running, and stated availability. It is a conservative
    starting block that will be reassessed; it is not a guarantee of your
    goal."
  - A ScienceNote may state that structured training can improve 5 km performance in a bounded recreational-runner study.
  - A ScienceNote may state that mostly low-intensity organization is supported and no universal polarized or pyramidal winner was established.
  - The 28-day horizon, history requirements, 3-to-5-day range, 70 percent floor, quality-session ceiling, and exact templates must be labelled Praxys pilot guardrails.
  - The 41 to 60 percent taper range and 8 to 14 day window must be described as mixed-endurance evidence with limited directness to recreational 5 km runners.
  - Do not promise goal achievement, assign a personal probability, classify an athlete as a responder, or attribute an outcome to the plan without a predeclared comparator and error-aware analysis.
  - Do not describe recent load, 10 percent progression, ACWR, low-intensity fraction, quality spacing, or power zones as medical or causal safety laws.
  - Do not infer why a workout was missed or why a plan did or did not work.
safety_implications:
  - Do not generate for children, clinical rehabilitation, return-to-sport, pregnancy-specific prescription, or athletes unable to safely complete 5 km.
  - Athlete-reported illness, injury, red flags, inadequate recovery, or unsafe conditions produce a non-medical safety stop and defer generation.
  - Never diagnose, clear, treat, or infer a cause from adherence, missed workouts, symptoms, or personal context.
  - Never require a maximal test; use the accepted history-first baseline and opt-in safety-screened fallback.
  - Do not progress beyond recent typical weekly minutes or exceed the recent maximum complete week in v1.
  - Do not exceed recent modal frequency, stated availability, recent longest completed run, or stated session-duration limits.
  - Use activity splits or samples, never activity average power, when historical intensity matters.
  - Keep quality days nonconsecutive and preserve at least one easy or rest day between them.
  - Never present 10 percent progression, ACWR zones, 70 percent low intensity, or recent-history caps as medical or causal safety laws.
  - Do not auto-catch-up missed training by compressing, stacking, or increasing later workouts.
  - Do not make a personal success probability, performance guarantee, or exact detraining-loss claim.
privacy_implications:
  - Retain only purpose-bounded structured constraints needed to generate, explain, replay, and audit the proposal.
  - Free-text personal context is optional and is not required by the deterministic path.
  - Missing personal context remains unknown; neither deterministic code nor AI may invent capability, availability, medical state, or a causal explanation.
  - Keep observed, athlete-stated, inferred, and assumed inputs separate; the v1 assumed-input list is empty.
  - Do not expose sensitive narrative context to provider delivery or public issue tracking.
  - Store the policy version, input snapshot, derived statistics, validation results, and proposal under existing authenticated per-user access, export, and deletion controls.
validation_plan:
  - Pre-register a policy-v1 offline replay before enabling proposals. Compare generated blocks with a no-change continuation of recent complete-week structure and the current plugin heuristic bundle, but do not expose or randomize athletes to the unsupported plugin bundle.
  - In offline replay, measure eligibility and no-plan reasons, constraint satisfaction, deterministic hash stability, schedule collisions, low-intensity fraction, quality-day spacing, history-limit violations, taper eligibility, and provider/missingness differences.
  - Enable only a suggestion-first process and safety pilot after the science decision and implementation are separately approved. Pre-register acceptance, edits, rejection, adoption reversal, burden, safety exits, adverse reports, no-plan outcomes, and replay mismatches.
  - Treat edits as evidence about fit, not proof of physiological benefit. Capture which rule or athlete constraint caused each edit without inferring why the athlete made it.
  - If enough comparable same-protocol 5 km outcomes accrue, analyze change with measurement-error-aware methods and report distributions and uncertainty, not personal responder labels or guarantees.
  - Report outcomes by sex, age band, baseline performance, recent running frequency, available days, provider, missingness, and power-zone availability when sample size permits. Small subgroups remain descriptive.
  - Monitor policy and generator versions, acceptance and edit distributions, no-plan rates, safety-stop rates, replay mismatches, and missing-data patterns for drift.
  - Do not claim effectiveness from the process/safety pilot. A later efficacy comparison against a versioned minimal static template requires a separate pre-registered protocol, human science approval, adequate sample size, and guardrail outcomes.
  - Expansion to other distances, beginner plans, progression rules, autonomous revision, or personal outcome probabilities requires a new Evidence Review and SDR.
falsification_conditions:
  - Any implementation activates this draft before explicit human acceptance.
  - A proposal is generated outside the eligible population, baseline, or recent-history prerequisites.
  - Any client, AI path, or direct API call can bypass deterministic validation.
  - The same versioned inputs produce a different schedule.
  - A plan exceeds recent modal frequency, recent typical or maximum weekly minutes, recent longest completed run, or stated time limits.
  - Planned low-intensity minutes fall below 70 percent or quality days are consecutive.
  - Generic threshold-power percentages are emitted without a current athlete-specific threshold and active zone model.
  - Missing context is inferred, sensitive narrative context is required, or a causal or medical explanation is generated.
  - Proposal, canonical adoption, and provider delivery are collapsed into one consent action.
  - User-facing copy promises goal achievement, assigns a personal probability, or presents guardrails as universal science.
  - Safety exits, adverse reports, replay mismatches, burden, or subgroup failures cannot be audited.
  - The policy must be narrowed or stopped if plan burden or unsafe behavior is material, a subgroup is systematically excluded or harmed, or outside-envelope edits are frequent.
  - Any efficacy claim is falsified or withheld when comparable 5 km outcomes do not support it under the predeclared error-aware analysis.
