schema_version: 1
id: sdr-road-10k-plan-generation-policy-v1
version: 1
title: "History-rich adult recreational outdoor road 10 km plan policy"
status: draft
decision_date: 2026-08-14
owners:
  - team:praxys
human_reviewers: []
model_version: road-10k-plan-generation-policy-v1
evidence_review_ids:
  - evidence-plan-generation-eligibility-safety-v1
  - evidence-road-10k-plan-generation-policy-v1
evidence_claim_ids:
  - eligibility.recent-history-anchor-without-universal-threshold
  - eligibility.fixed-progression-and-acwr-not-safety-laws
  - eligibility.goal-relevant-current-capability-task-specific
  - eligibility.current-symptoms-support-stop-not-clearance
  - eligibility.evidence-quality-no-personal-probability
  - road-10k-plan.task-specific-capability-not-single-marker
  - road-10k-plan.mostly-low-intensity-no-universal-winner
  - road-10k-plan.one-to-two-quality-sessions-indirect
  - road-10k-plan.volume-frequency-associated-not-prescriptive
  - road-10k-plan.fixed-progression-not-safety-law
  - road-10k-plan.taper-volume-reduction-supported
  - road-10k-baseline.same-distance-direct-capability
  - road-10k-baseline.comparability-time-of-day-matters
  - road-10k-baseline.freshness-cutoff-not-validated
  - road-10k-plan.individual-outcomes-require-error-aware-validation
  - road-10k-plan.symptom-based-test-stop-boundary
model_parameters:
  - name: road_10k_activation_and_dependency
    classification: guardrail
    value:
      active_behavior: false
      shared_policy_dependency:
        sdr_id: sdr-plan-generation-eligibility-safety-v1
        required_status_before_activation: accepted
      distance_policy_required_status_before_activation: accepted
      human_science_review_required: true
      capability_registry_entry_default_enabled: false
      generator_api_web_and_miniapp_activation_in_this_record: false
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      The shared eligibility proposal and this distance-specific decision are
      both draft. No generator, route, registry availability, web control, or
      miniapp control may activate before coordinated human acceptance and
      implementation review.
  - name: road_10k_goal_tuple
    classification: guardrail
    value:
      goal_kind: performance_10k
      sport: running
      distance_m: 10000
      surface: outdoor_road
      primary_outcome: elapsed_time
      target_time_required: true
      target_date_optional: true
      unsupported_goal_variants:
        - first_10k_completion
        - sparse_history_10k
        - indoor_treadmill_10k
        - trail_10k
        - cross_country_10k
        - obstacle_10k
        - multisport_run_leg
        - medically_directed_rehabilitation
    evidence_claim_ids:
      - eligibility.goal-relevant-current-capability-task-specific
      - road-10k-plan.task-specific-capability-not-single-marker
    rationale: >
      The first capability is intentionally one exact population-and-goal
      tuple. Other 10 km intents and surfaces require separate evidence and
      policy rather than silent fallback.
  - name: road_10k_supported_population
    classification: guardrail
    value:
      minimum_age_years: 18
      coaching_context: self_coached_recreational
      current_distance_status: already_able_to_complete_10k
      history_class: history_rich
      current_symptoms: absent
      explicit_exclusions:
        - minor
        - first_10k_or_beginner_progression
        - sparse_or_missing_recent_history
        - current_injury_illness_or_concerning_symptoms
        - return_to_sport_or_rehabilitation
        - medical_clearance_or_treatment_intent
        - pregnancy_specific_prescription
        - elite_or_professional_programming
        - unsupported_surface_or_distance
    evidence_claim_ids:
      - eligibility.current-symptoms-support-stop-not-clearance
      - road-10k-plan.symptom-based-test-stop-boundary
      - road-10k-plan.volume-frequency-associated-not-prescriptive
    rationale: >
      Direct generation evidence is sparse. Restricting v1 to established adult
      recreational 10 km runners with usable history limits extrapolation and
      keeps beginner, clinical, and elite contexts outside the model.
  - name: road_10k_direct_baseline_hierarchy
    classification: guardrail
    value:
      required: true
      accepted_evidence_order:
        - organized_outdoor_road_10k_race_with_elapsed_time
        - explicit_all_out_standardized_outdoor_road_or_track_10k_time_trial
      required_metadata:
        - completed_at
        - elapsed_time_seconds
        - distance_m
        - surface_or_protocol
        - route_or_venue_identifier
        - intentional_all_out_or_race_flag
        - assistance_status
        - source_provider
      excluded_as_direct_baseline:
        - five_k_result_or_conversion
        - race_prediction
        - personal_best_without_source_activity
        - passive_fastest_10k_split
        - threshold_or_lactate_speed_alone
        - critical_power_or_critical_velocity_estimate_alone
        - activity_average_power
        - vendor_readiness_or_race_score
      supporting_only:
        - standardized_laboratory_10k_time_trial
        - current_threshold_estimate
        - critical_power_or_critical_velocity
        - recent_split_or_sample_distribution
        - race_forecast_with_uncertainty
    evidence_claim_ids:
      - eligibility.goal-relevant-current-capability-task-specific
      - road-10k-plan.task-specific-capability-not-single-marker
      - road-10k-baseline.same-distance-direct-capability
    rationale: >
      Same-distance elapsed time is the most task-direct anchor. Indirect
      markers can inform context but cannot silently manufacture a current
      10 km baseline or authorize generation.
  - name: road_10k_baseline_freshness
    classification: guardrail
    value:
      current_through_completed_days: 56
      stale_from_completed_days: 57
      future_timestamp_outcome: invalid_direct_baseline
      unknown_timestamp_outcome: insufficient_direct_baseline
      no_biological_expiry_claim: true
    evidence_claim_ids:
      - road-10k-baseline.freshness-cutoff-not-validated
      - road-10k-baseline.same-distance-direct-capability
    rationale: >
      No source validates an expiry cutoff. Fifty-six completed days align the
      direct result with the policy's eight-week history window while reducing
      pressure to repeat a burdensome maximal 10 km test. The value is a
      falsifiable v1 workflow guardrail, not a physiological fact.
  - name: road_10k_optional_baseline_test
    classification: guardrail
    value:
      offered_only_when:
        - shared_safety_eligibility_passes
        - direct_baseline_is_missing_or_stale
        - runner_already_completes_10k
        - recent_history_supports_the_effort
        - athlete_explicitly_opts_in
      protocol:
        distance_m: 10000
        intent: all_out_elapsed_time
        surface: safe_outdoor_road_or_track
        standardized_warmup_required: true
        route_and_context_metadata_required: true
      stop_before_start_when:
        - current_symptoms_or_health_concern
        - unsafe_route_or_environment
        - contradictory_eligibility_input
      stop_during_when:
        - concerning_symptom_or_safety_event
      alternatives:
        - provide_no_plan_readiness_outcome
        - wait_for_a_qualified_10k_race
      never_auto_schedule: true
      no_clearance_or_risk_free_claim: true
    evidence_claim_ids:
      - eligibility.current-symptoms-support-stop-not-clearance
      - road-10k-baseline.same-distance-direct-capability
      - road-10k-plan.symptom-based-test-stop-boundary
    rationale: >
      A maximal 10 km effort is burdensome and not a harmless data-collection
      step. History-first routing, explicit consent, stop conditions, and a
      no-test alternative are required.
  - name: road_10k_recent_history_prerequisite
    classification: guardrail
    value:
      completed_weeks_lookback: 8
      minimum_usable_completed_weeks: 4
      minimum_runs_per_usable_week: 3
      latest_run_within_completed_days: 10
      usable_run_requirements:
        - completed_running_activity
        - positive_duration
        - valid_timestamp
        - not_user_excluded
      intensity_usable_when_any:
        - activity_splits_available
        - activity_samples_available
      disallowed_intensity_source:
        - activity_avg_power
      unknown_or_insufficient_outcome: insufficient_recent_history
    evidence_claim_ids:
      - eligibility.recent-history-anchor-without-universal-threshold
      - road-10k-plan.volume-frequency-associated-not-prescriptive
    rationale: >
      Eight weeks, four usable weeks, three runs per usable week, and a run in
      the latest ten completed days intentionally define a stricter
      history-rich cohort than the outdoor 5 km pilot. They are conservative
      implementation guards for dose anchoring, not published eligibility
      thresholds.
  - name: road_10k_block_and_reassessment
    classification: guardrail
    value:
      full_block_days: 42
      calendar_schedule_unit_days: 7
      reassessment_interval_days: 14
      checkpoints_at_completed_days:
        - 14
        - 28
      each_checkpoint_requires:
        - fresh_eligibility_evaluation
        - updated_completed_history
        - explicit_review_before_replacing_adopted_future_days
      no_automatic_progression_between_checkpoints: true
    evidence_claim_ids:
      - eligibility.recent-history-anchor-without-universal-threshold
      - road-10k-plan.volume-frequency-associated-not-prescriptive
      - road-10k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      No source validates a 10 km horizon or reassessment cadence. A six-week
      proposal permits a distinct threshold-and-specificity structure, while
      two-week checkpoints limit stale scheduling and avoid daily automatic
      churn. Both values require prospective falsification.
  - name: road_10k_target_date_routing
    classification: guardrail
    value:
      no_target_date: generate_one_42_day_block
      target_at_least_42_completed_days_away: generate_one_42_day_block
      target_15_to_41_completed_days_away: insufficient_full_block_horizon
      target_8_to_14_completed_days_away: taper_only_proposal_if_all_other_inputs_pass
      target_0_to_7_completed_days_away: insufficient_policy_horizon
      past_or_invalid_target_date: invalid_goal_context
      target_time_may_increase_dose: false
    evidence_claim_ids:
      - road-10k-plan.taper-volume-reduction-supported
      - road-10k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      V1 avoids compressing an unvalidated full block to fit an imminent event.
      The taper-only window reflects indirect published duration evidence; all
      routing thresholds remain conservative product guards.
  - name: road_10k_running_frequency
    classification: guardrail
    value:
      minimum_running_days_per_7_day_unit: 3
      maximum_running_days_per_7_day_unit: 6
      selected_days_must_not_exceed:
        - athlete_stated_availability
        - recent_modal_completed_running_days
      lower_than_minimum_outcome: insufficient_history_rich_frequency
      higher_requested_frequency_outcome: cap_to_policy_history_and_availability
      no_automatic_extra_running_day: true
    evidence_claim_ids:
      - road-10k-plan.volume-frequency-associated-not-prescriptive
      - road-10k-plan.fixed-progression-not-safety-law
    rationale: >
      Three to six days define this history-rich capability and differ from the
      outdoor 5 km pilot's envelope. Observational associations do not prove
      the range; availability and recent modal frequency remain hard caps.
  - name: road_10k_session_taxonomy_and_mix
    classification: guardrail
    value:
      allowed_session_types:
        - easy
        - longest_easy
        - controlled_threshold_quality
        - ten_k_specific_interval_quality
        - event_or_opt_in_baseline_test
      per_7_day_unit:
        three_running_days:
          maximum_quality_sessions: 1
          remaining_sessions: easy_or_longest_easy
        four_running_days:
          maximum_quality_sessions: 1
          remaining_sessions: easy_or_longest_easy
        five_running_days:
          maximum_quality_sessions: 2
          remaining_sessions: easy_or_longest_easy
        six_running_days:
          maximum_quality_sessions: 2
          remaining_sessions: easy_or_longest_easy
      quality_type_rules:
        three_or_four_days:
          use_both_quality_types_in_same_7_day_unit: false
          alternate_types_across_schedule_units_when_history_supports: true
        five_or_six_days:
          maximum_controlled_threshold_sessions: 1
          maximum_ten_k_specific_interval_sessions: 1
      maximum_longest_easy_designations: 1
      longest_easy_is_mandatory: false
      exact_step_templates:
        inherited_from_outdoor_5k: false
        require_versioned_10k_guardrail_registration_before_activation: true
    evidence_claim_ids:
      - road-10k-plan.task-specific-capability-not-single-marker
      - road-10k-plan.one-to-two-quality-sessions-indirect
      - road-10k-plan.volume-frequency-associated-not-prescriptive
    rationale: >
      The taxonomy reflects threshold-associated 10 km demands and the indirect
      one-to-two-quality-session ceiling. Exact step durations and recoveries
      are not established by the review and may not be copied from 5 km; they
      require separate versioned 10 km implementation guardrails before
      activation.
  - name: road_10k_quality_spacing
    classification: guardrail
    value:
      maximum_quality_sessions_per_7_day_unit: 2
      consecutive_quality_running_days_allowed: false
      minimum_between_quality_sessions:
        one_easy_rest_or_non_running_day: true
      optional_maximal_10k_test_counts_as_quality: true
      target_event_counts_as_quality: true
      missed_quality_makeup_allowed: false
    evidence_claim_ids:
      - road-10k-plan.one-to-two-quality-sessions-indirect
      - road-10k-plan.symptom-based-test-stop-boundary
    rationale: >
      One to two quality sessions have only indirect support. Nonconsecutive
      placement, treating tests and events as quality, and prohibiting makeup
      stacking are conservative schedule guards rather than proven universal
      recovery laws.
  - name: road_10k_low_intensity_floor
    classification: guardrail
    value:
      minimum_planned_low_intensity_fraction: 0.75
      denominator: planned_running_minutes
      numerator: planned_low_intensity_running_minutes
      quality_warmup_and_cooldown_classification:
        use_actual_intended_intensity: true
      historical_intensity_source_priority:
        - activity_splits
        - activity_samples
      disallowed_historical_intensity_source:
        - activity_avg_power
      universal_optimum_claim: false
    evidence_claim_ids:
      - road-10k-plan.mostly-low-intensity-no-universal-winner
    rationale: >
      The evidence supports mostly low-intensity training without one universal
      optimum. Seventy-five percent is a transparent v1 safeguard chosen for
      the 10 km policy, not copied from the 5 km pilot and not presented as a
      physiological threshold.
  - name: road_10k_history_anchored_load
    classification: guardrail
    value:
      every_non_taper_weekly_minutes_must_not_exceed:
        - recent_median_usable_weekly_running_minutes
        - athlete_stated_weekly_time_limit
      every_weekly_minutes_must_not_exceed:
        - recent_maximum_usable_weekly_running_minutes
        - athlete_stated_weekly_time_limit
      session_duration_must_not_exceed:
        - recent_maximum_completed_running_session_duration
        - athlete_stated_single_session_time_limit
      session_distance_must_not_exceed:
        - recent_maximum_completed_running_session_distance
      planned_progression_above_recent_typical_in_v1: false
      target_time_gap_may_raise_load: false
      ten_percent_rule_used: false
      acwr_prescription_zone_used: false
      missing_cap_outcome: insufficient_recent_history
    evidence_claim_ids:
      - eligibility.fixed-progression-and-acwr-not-safety-laws
      - road-10k-plan.volume-frequency-associated-not-prescriptive
      - road-10k-plan.fixed-progression-not-safety-law
    rationale: >
      Direct 10 km evidence does not establish an optimal progression. The
      first block therefore tests schedule structure without prescribing more
      than the runner's recent typical or completed maximum exposure.
  - name: road_10k_longest_easy_boundary
    classification: guardrail
    value:
      mandatory_long_run: false
      automatic_long_run_progression: false
      optional_longest_easy_session:
        maximum_per_7_day_unit: 1
        must_be_selected_from_existing_running_day: true
        may_not_exceed_recent_completed_duration_or_distance_caps: true
      target_time_gap_may_lengthen_session: false
    evidence_claim_ids:
      - road-10k-plan.volume-frequency-associated-not-prescriptive
      - road-10k-plan.fixed-progression-not-safety-law
    rationale: >
      The review found no direct randomized recreational 10 km long-run
      prescription. V1 may identify one already-supported easy session as the
      week's longest but may not require or automatically extend a long run.
  - name: road_10k_power_and_intensity_targets
    classification: guardrail
    value:
      generic_percent_of_threshold_or_cp_targets: false
      allowed_only_when:
        - athlete_has_current_accepted_threshold_or_critical_power
        - active_zone_model_exists
        - target_uses_that_model_without_distance_conversion
      missing_zone_model_behavior: duration_and_session_type_only
      activity_avg_power_allowed_for_intensity_analysis: false
      source_priority:
        - activity_splits
        - activity_samples
      minimum_required_historical_intensity_sources: 1
    evidence_claim_ids:
      - road-10k-plan.task-specific-capability-not-single-marker
      - road-10k-plan.mostly-low-intensity-no-universal-winner
    rationale: >
      No reviewed source validates a generic consumer running-power percentage
      for every 10 km session. Existing accepted zone semantics may be used
      when available; otherwise v1 stays duration- and session-type-based.
  - name: road_10k_published_taper_findings
    classification: published
    value:
      evidence_population: mixed_endurance_athletes
      strongest_reviewed_volume_reduction_percent:
        minimum: 41
        maximum: 60
      maintain_intensity: true
      maintain_frequency: true
      strongest_duration_subgroup_days:
        minimum: 8
        maximum: 14
      improvement_reported_through_days: 21
      direct_recreational_road_10k_validation: false
    evidence_claim_ids:
      - road-10k-plan.taper-volume-reduction-supported
    rationale: >
      These values reproduce the reviewed meta-analysis and remain explicitly
      indirect to recreational road 10 km planning.
  - name: road_10k_selected_taper_guardrail
    classification: guardrail
    value:
      apply_only_when:
        - fixed_target_date_exists
        - target_is_8_to_14_completed_days_away_at_taper_start
        - recent_history_and_constraints_remain_valid
      planned_volume_reduction_percent: 50
      rounding_note: rounded_product_guardrail_from_50_5_percent_range_midpoint
      taper_window_days_before_event:
        minimum: 8
        maximum: 14
      reference_daily_running_minutes: recent_median_non_taper_weekly_running_minutes_divided_by_7
      reference_minutes_for_window: reference_daily_running_minutes_times_actual_taper_window_days
      planned_pre_event_training_minutes: reference_minutes_for_window_times_0_50
      target_event_elapsed_time_included_in_planned_training_minutes: false
      maintain_recent_frequency_when_constraints_allow: true
      maintain_intensity_exposure_without_adding_quality: true
      no_makeup_or_extra_sharpening: true
      no_personal_performance_gain_claim: true
    evidence_claim_ids:
      - road-10k-plan.taper-volume-reduction-supported
    rationale: >
      Fifty percent is the rounded whole-percentage guardrail derived from the
      50.5 percent midpoint of the strongest reviewed 41-to-60-percent subgroup
      and is independently reviewed here rather than inherited from the 5 km
      policy. Direct 10 km certainty remains insufficient, so the choice is not
      a promised optimum.
  - name: road_10k_protocol_comparability
    classification: guardrail
    value:
      direct_before_after_claim_requires:
        - distance_within_same_registered_10k_protocol
        - same_result_type_race_or_time_trial
        - known_route_or_venue
        - known_surface
        - known_assistance_status
        - known_time_of_day
        - known_environment_context_when_available
        - no_material_protocol_change
      no_time_of_day_correction: true
      incomparable_result_usage:
        - contextual_only
        - no_causal_plan_effect_claim
      missing_metadata_outcome: outcome_comparison_unavailable
      plan_generation_eligibility_affected: false
    evidence_claim_ids:
      - road-10k-baseline.same-distance-direct-capability
      - road-10k-baseline.comparability-time-of-day-matters
    rationale: >
      Direct comparisons need more than identical distance. The exact metadata
      fields are product guardrails, while no unsupported environmental or
      time-of-day correction is applied.
  - name: road_10k_goal_and_probability_limits
    classification: guardrail
    value:
      target_time_may:
        - label_the_goal
        - compute_descriptive_gap_to_qualified_baseline
      target_time_may_not:
        - increase_frequency
        - increase_weekly_minutes
        - lengthen_longest_session
        - add_quality
        - override_history_or_safety_caps
      personal_goal_achievement_probability: disabled
      personal_injury_probability: disabled
      personal_adaptation_probability: disabled
      confidence_score_that_implies_probability: disabled
      causal_success_claim: disabled
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
      - road-10k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      The review does not validate personal probabilities or gap-based dose
      escalation. The target remains descriptive rather than a license to
      exceed current evidence.
  - name: road_10k_typed_outcomes
    classification: guardrail
    value:
      outcomes:
        eligible_full_block:
          plan_returned: true
          adoption_required: true
        eligible_taper_only:
          plan_returned: true
          adoption_required: true
        unsupported_goal_tuple:
          plan_returned: false
        unsupported_population:
          plan_returned: false
        safety_stop:
          plan_returned: false
        insufficient_direct_baseline:
          plan_returned: false
        stale_direct_baseline:
          plan_returned: false
        insufficient_recent_history:
          plan_returned: false
        insufficient_history_rich_frequency:
          plan_returned: false
        insufficient_full_block_horizon:
          plan_returned: false
        insufficient_policy_horizon:
          plan_returned: false
        contradictory_input:
          plan_returned: false
        unsupported_capability:
          plan_returned: false
      unknown_values_are_not_false_or_zero: true
      unsupported_distance_fallback: none
    evidence_claim_ids:
      - eligibility.recent-history-anchor-without-universal-threshold
      - eligibility.current-symptoms-support-stop-not-clearance
      - eligibility.evidence-quality-no-personal-probability
      - road-10k-baseline.comparability-time-of-day-matters
    rationale: >
      Typed no-plan outcomes preserve uncertainty and prevent a request for an
      unsupported 10 km context from looking like successful generation.
  - name: road_10k_suggestion_only_state_transition
    classification: guardrail
    value:
      generated_state: proposed
      user_may:
        - review
        - edit
        - reject
        - explicitly_adopt
      generator_may_not:
        - write_adopted_plan_without_consent
        - deliver_or_publish_without_consent
        - overwrite_adopted_future_days_at_reassessment
        - schedule_a_missed_workout_makeup
        - infer_why_a_workout_was_missed
      AI_may_not:
        - widen_eligibility
        - invent_missing_context
        - reinterpret_unknown_as_safe_or_eligible
        - override_deterministic_validation
        - adopt_deliver_or_publish
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
      - road-10k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      Human consent and deterministic validation remain the authority boundary.
      AI may explain a proposal but cannot change eligibility, evidence, state,
      or execution.
  - name: road_10k_privacy_and_audit
    classification: guardrail
    value:
      minimum_necessary_inputs_only: true
      no_inference_of:
        - diagnosis
        - injury_cause
        - missed_workout_reason
        - pregnancy_status
        - mental_state
        - external_life_event
      no_publication_of:
        - raw_health_data
        - private_activity_data
        - inferred_sensitive_context
      replay_record_must_include:
        - user_config_version
        - capability_registry_version
        - shared_policy_version
        - distance_policy_version
        - baseline_source_reference
        - history_cutoff
        - normalized_constraints
        - selected_template_ids
        - typed_outcome_code
        - proposal_hash
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
      - road-10k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      Generation should consume only necessary training context and remain
      reproducible without inventing or publishing sensitive explanations.
  - name: road_10k_pilot_falsification_thresholds
    classification: guardrail
    value:
      deterministic_invariant_breach_tolerance: 0
      deterministic_replay_mismatch_tolerance: 0
      dry_run:
        maximum_single_guardrail_exclusion_fraction: 0.50
        maximum_absolute_subgroup_exclusion_gap: 0.20
        minimum_subgroup_size_for_gap_check: 30
      opt_in_pilot:
        maximum_major_edit_fraction: 0.30
        major_edit_definition:
          absolute_planned_minutes_change_fraction_greater_than: 0.20
          or_scheduled_running_days_changed_at_least: 2
          evaluation_window_days: 14
        maximum_symptom_stop_fraction: 0.10
        maximum_optional_baseline_test_stop_or_noncompletion_fraction: 0.10
        serious_adverse_events_triggering_immediate_pause: 1
        serious_event_relationship:
          - plausibly_related
          - unknown
        maximum_median_absolute_repeat_10k_difference_fraction: 0.05
        maximum_taper_vs_full_block_rejection_or_major_edit_gap: 0.15
      threshold_breach_action:
        - pause_activation_or_pilot
        - inspect_missingness_and_subgroups
        - revise_or_remove_the_implicated_guardrail
        - require_new_human_go_no_go
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
      - road-10k-plan.individual-outcomes-require-error-aware-validation
    rationale: >
      These are predeclared product decision thresholds for an inactive v1
      dry run and opt-in pilot, not published physiological cutoffs. They make
      the falsification plan operational and require a pause rather than
      success-shaped interpretation when a threshold is crossed.
  - name: road_10k_user_facing_uncertainty
    classification: guardrail
    value:
      always_show:
        - proposal_not_guarantee
        - exact_counts_percentages_and_horizons_are_product_guardrails
        - direct_and_indirect_evidence_boundary
        - unresolved_long_run_and_template_evidence
        - baseline_source_and_comparability_status
        - assumptions
        - unknowns
        - risks
        - alternatives
        - deterministic_no_plan_reason
      forbidden_copy:
        - scientifically_optimal_10k_plan
        - safe_because_within_recent_history
        - guaranteed_goal_time
        - personalized_success_probability
        - medically_cleared
        - exact_5k_to_10k_conversion
    evidence_claim_ids:
      - road-10k-plan.mostly-low-intensity-no-universal-winner
      - road-10k-plan.individual-outcomes-require-error-aware-validation
      - road-10k-plan.symptom-based-test-stop-boundary
    rationale: >
      The interface must distinguish evidence, uncertainty, and Praxys policy
      choices instead of presenting a deterministic schedule as certainty.
rejected_alternatives:
  - alternative: "Copy the accepted outdoor 5 km generator and substitute 10 km labels"
    rationale: >
      The 5 km horizon, history counts, frequency envelope, low-intensity
      percentage, long-run rule, workout templates, and protocol assumptions
      were not accepted for 10 km and cannot be silently generalized.
  - alternative: "Use a 5 km result or critical-power estimate to synthesize a current 10 km baseline"
    rationale: >
      Threshold-associated markers are relevant but do not establish a direct
      10 km elapsed-time result or validated individual conversion.
  - alternative: "Generate a progressive generic 10 km plan from target-time gap"
    rationale: >
      Direct progression and gap-to-dose evidence is absent, and personal
      success probabilities are not validated.
  - alternative: "Require or progressively extend a weekly long run"
    rationale: >
      The dedicated search found no direct randomized recreational 10 km
      long-run prescription. V1 only identifies an in-history longest easy day.
  - alternative: "Offer readiness only and defer every schedule"
    rationale: >
      The selected proposal tests a narrower deterministic schedule path, but
      readiness-only remains the required fallback if human reviewers reject
      any history, horizon, intensity, or schedule guardrail.
  - alternative: "Let an LLM choose frequency, progression, or templates case by case"
    rationale: >
      A language model cannot repair missing evidence, validate safety, or
      provide deterministic replay and falsification.
applicability:
  - Adults aged 18 years or older
  - Self-coached recreational runners already able to complete 10 km
  - History-rich runners with a qualified recent same-distance result
  - Outdoor road 10 km elapsed-time goals only
  - Suggestion-only deterministic proposals after shared eligibility passes
user_facing_claim_limits:
  - >
    The proposal is a conservative product policy, not a scientifically optimal
    10 km plan, medical advice, safety guarantee, or goal-time guarantee.
  - >
    Exact counts, percentages, horizons, freshness windows, and schedule
    mappings must be labelled as Praxys guardrails with linked rationale.
  - >
    The product may describe a gap to a qualified baseline but may not show a
    personal goal-achievement, adaptation, injury, or adherence probability.
  - >
    Before-and-after improvement is descriptive only when the registered
    protocol and context are sufficiently comparable and a worthwhile-change
    rule is predeclared.
  - >
    No 5 km result, percentage, template, or conversion may be represented as
    accepted 10 km evidence.
safety_implications:
  - >
    Current concerning symptoms, illness, injury, rehabilitation intent,
    medical-clearance intent, or contradictory safety inputs stop the maximal
    test and vigorous-plan paths without diagnosis or treatment advice.
  - >
    Absence of symptoms, completion of 10 km, and staying within recent history
    do not establish medical clearance or guarantee freedom from harm.
  - >
    A maximal 10 km test is optional, never auto-scheduled, counts as a quality
    effort, and requires an explicit no-test alternative.
  - >
    No missed-workout makeup, consecutive quality days, target-gap dose
    escalation, 10 percent rule, ACWR prescription zone, or activity-average
    power intensity analysis is allowed.
privacy_implications:
  - >
    Use the minimum necessary authenticated user's goal, direct-result
    metadata, completed history, accepted zone model, constraints, symptoms,
    and consent state.
  - >
    Do not infer diagnoses, injury causes, missed-workout reasons, pregnancy
    status, mental state, or external life circumstances from training data.
  - >
    Do not expose private health or activity context in public output,
    telemetry, screenshots, issues, model prompts, or delivery artifacts.
validation_plan:
  - >
    Registry validation must prove exact Evidence Review and claim links,
    globally unique IDs, draft lifecycle validity, parameter classifications,
    conditional accepted wording, and inactive behavior.
  - >
    Unit tests must cover the exact goal tuple, adult history-rich population,
    direct-baseline hierarchy, 56-day freshness guardrail, eight-week history
    rule, 42-day block, 14-day reassessment, three-to-six-day frequency, 75
    percent low-intensity floor, quality spacing, no mandatory long run,
    history caps, taper routing, and every typed no-plan outcome.
  - >
    Tests must prove that only road or track 10 km results qualify as direct
    baselines, laboratory tests remain supporting evidence, and missing
    longitudinal-comparison metadata suppresses outcome claims without
    invalidating an otherwise qualified generation baseline.
  - >
    Tests must prove no 5 km fallback, no copied 5 km template, no generic
    power percentage, no activity-average power intensity analysis, no target-
    gap dose escalation, no personal probability, no missed-workout inference,
    and no AI adoption or validation override.
  - >
    Tests must prove any-of split-or-sample intensity semantics, deterministic
    frequency capping, every non-taper week at or below recent median minutes,
    the normalized 8-to-14-day taper calculation excluding event time, and the
    predeclared dry-run and pilot falsification thresholds.
  - >
    Property tests must establish deterministic replay, no invalid or duplicate
    schedule dates, no frequency or history-cap breach, nonconsecutive quality
    sessions, and stable output for identical normalized inputs and versions.
  - >
    Before any activation, exact 10 km workout templates must be versioned as
    guardrails and reviewed against this SDR; implementation may not import the
    outdoor 5 km template registry.
  - >
    Retrospective dry runs must report eligible and no-plan rates, baseline and
    comparability missingness, history-rule exclusions, frequency and duration
    cap effects, taper-only frequency, edits, rejections, and subgroup slices
    without publishing private athlete data.
  - >
    A prospective opt-in pilot must predeclare relevance, adherence,
    acceptance, edit distance, quality stacking, symptom exits, adverse events,
    comparable 10 km outcomes, uncertainty, and withdrawal criteria. Group
    average improvement alone is insufficient to claim individual efficacy.
falsification_conditions:
  - >
    Pause activation after any deterministic invariant breach, replay mismatch,
    schedule beyond availability or policy frequency, non-taper week above
    recent median minutes, session beyond a recent maximum, or plan returned
    for unsupported, stale-baseline, symptomatic, contradictory, or
    sparse-history input.
  - >
    Revisit the implicated history, horizon, frequency, or intensity guardrail
    if it alone excludes more than 50 percent of otherwise eligible dry-run
    cases, or if its absolute exclusion gap exceeds 20 percentage points across
    a predeclared subgroup with at least 30 cases per comparison group.
  - >
    Pause the optional baseline-test path if stop or non-completion exceeds 10
    percent, if one serious adverse event is plausibly related or has unknown
    relationship to the test, or if the median absolute difference between
    repeated qualified 10 km tests exceeds 5 percent.
  - >
    Revisit the schedule mapping if more than 30 percent of adopted proposals
    need a major 14-day edit, defined as more than 20 percent absolute planned-
    minute change or at least two scheduled running days changed. Revisit the
    taper if its rejection-or-major-edit rate exceeds the full-block rate by
    more than 15 percentage points.
  - >
    Pause the pilot if symptom stops exceed 10 percent. Do not claim personal
    response or causal plan benefit unless a separately approved, predeclared
    error-aware design distinguishes true variation from measurement noise and
    within-person variability.
affected_surfaces:
  models:
    - road-10k-plan-generation-policy-v1
  apis:
    - future authenticated 10 km plan capability and typed proposal endpoints
  clients:
    - future web 10 km proposal, consent, no-plan, and ScienceNote states
    - future miniapp feature, type, write, state, i18n, and consent parity
  science_notes:
    - Explain direct versus indirect evidence and every product guardrail.
    - Show baseline source, comparability, assumptions, unknowns, risks, and alternatives.
supersedes: []
superseded_by:
accepted_interpretation: >
  If accepted by identified human science reviewers, this SDR would authorize
  only the bounded, inactive-by-default, history-rich adult recreational
  outdoor road 10 km proposal described above. It would not by itself activate
  a generator, accept exact workout templates, validate personal probabilities,
  authorize beginner or clinical planning, or generalize the policy to another
  distance or surface.
decision_notes:
  - >
    This is a stacked decision proposal for issue #686 and depends on the draft
    shared eligibility and safety policy from issue #685.
  - >
    The preferred recommendation is the narrow generation option. If reviewers
    do not accept the required guardrails, the product recommendation falls
    back to readiness-only rather than copying the outdoor 5 km generator.
  - >
    The main unresolved scientific gaps are exact 10 km workout templates,
    direct long-run prescription, schedule horizon, reassessment cadence,
    recent-history counts, baseline freshness, and subgroup validity.
  - >
    The 42-day block, 14-day reassessment, eight-week/four-week/three-run/ten-day
    history rule, three-to-six-day envelope, 75 percent low-intensity floor,
    and pilot decision thresholds are product guardrails, not published
    biology or inherited 5 km defaults.
  - >
    No runtime behavior changes while this record is draft. If accepted and
    implemented later, rollout must remain default-off, suggestion-only, and
    reversible without substituting the 5 km policy.
  - >
    Human science approval is required before lifecycle transition,
    implementation activation, pilot authorization, or user-facing claims.
