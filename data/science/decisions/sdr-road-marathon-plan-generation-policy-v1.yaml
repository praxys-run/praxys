accepted_interpretation: >
  If accepted by a digest-bound human decision approver, this SDR would
  authorize only an inactive policy boundary for adults aged 18 years or older
  with current direct outdoor road-marathon capability, stable recent history
  that anchors their own exposure, within-recent load, performance intent,
  optional target time or date, and athlete-confirmed event context. Goal
  capture remains independent from generator availability. Missing optional
  age, sex, or profile modifiers disable only dependent adjustments and never
  default to male; imported profile and event data remain source-labelled until
  athlete confirmation. The proposed policy is suggestion-only and modular:
  entry/readiness; history/load; long-run/durability; intensity/race-specific
  work; fueling/hydration practice; taper/recovery; environment/altitude; and
  reassessment/outcomes. Population associations and source findings may
  support bounded explanation and validation but not personal probability,
  causal dose, or target-gap escalation. No plan length, baseline algorithm,
  history count, weekly frequency, progression, volume, long-run dose,
  durability cutoff, intensity distribution, race-specific dose, workout,
  taper, recovery, fueling, hydration, environment, altitude, race-density,
  subgroup, outcome, pilot, implementation, or activation rule is selected.
  No 5 km, 10 km, or half-marathon numeric rule is inherited. This proposal
  does not authorize first-marathon or completion intent, sparse history,
  returning, clinical, rehabilitation, pregnancy-specific, trail, ultra, or
  unsupported contexts. A no-event rolling preparation or simulation route
  requires a separately accepted completion or benchmark policy and may not
  invent an automatic maximal marathon simulation.
decision_review:
  reviewer_task: >
    Decide whether the four proposed boundaries are acceptable and whether the
    five listed implementation areas should remain explicitly deferred.
    Approve the sheet as a unit or request changes by item ID. The audit
    appendix is traceability, not the primary review task.
  approval_statement: >
    I approve the narrow currently-capable adult outdoor road-marathon
    performance scope, bounded evidence use, hard suggestion-only and
    athlete-control boundaries, and qualitative mostly-low, durability,
    practiced-fueling, and environmental context. I agree that baseline and
    history qualification, all dose and race-specific work, taper and recovery,
    fueling, hydration and environment numbers, and secondary rollout choices
    remain deferred. This approval would not approve implementation, runtime
    activation, a plan length, or any unresolved value.
  items:
    - id: narrow-modular-scope
      title: Accept the narrow population tuple and modular boundary
      disposition: approve
      question: >
        Should V1 recognize only currently-capable adults with stable recent
        history, within-recent load, road-marathon performance intent, and
        confirmed event context, while preserving goals when no route matches?
      proposed_decision: >
        Accept that narrow tuple and the eight-module boundary. Keep
        first-marathon/completion, sparse-history, returning or clinical,
        pregnancy-specific, trail, ultra, and unsupported contexts in separate
        policies. A no-event rolling preparation or simulation route requires
        a separately accepted completion or benchmark policy.
      approval_effect:
        - The narrow performance tuple and eight-module policy structure become reviewable boundaries.
        - Goal capture remains available when this policy is unavailable or inactive.
        - Typed no-plan and limited-guidance outcomes preserve the athlete's goal without substituting another policy.
      does_not_authorize:
        - A plan length, generated schedule, automatic marathon benchmark, implementation, or activation.
        - Reusing a shorter-distance numeric rule or treating a cohort label as a permanent runner identity.
      parameter_names:
        - road_marathon_activation_and_dependency
        - road_marathon_goal_and_event_tuple
        - road_marathon_supported_training_pattern
        - road_marathon_modular_policy_structure
        - road_marathon_typed_outcomes_and_suggestion_only_state
      evidence_claim_ids:
        - eligibility.goal-relevant-current-capability-task-specific
        - eligibility.masters-age-change-not-automatic-exclusion
        - road-marathon.task-specific-capability-baseline-multifactorial
    - id: evidence-use
      title: Accept bounded use of population findings and uncertainty
      disposition: approve
      question: >
        Should the reviewed marathon and broader-endurance findings be retained
        only as source findings, qualitative context, and future validation
        inputs rather than personal probabilities or causal prescriptions?
      proposed_decision: >
        Retain the observed prediction error, volume and longest-run
        associations, durability, training-intensity distribution, taper,
        carbohydrate, gut-tolerance, fluid, sodium, environment, and altitude
        findings with their directness and uncertainty labels.
      approval_effect:
        - Published findings may appear in review notes, source explanations, and validation design.
        - Outcome comparisons remain descriptive and require comparable protocols and context.
      does_not_authorize:
        - Turning any reported category, coefficient, percentage, correlation, or subgroup observation into an individual rule.
        - A personal success, injury, safety, responder, hydration, fueling, or environmental probability.
      parameter_names:
        - road_marathon_published_volume_and_long_run_findings
        - road_marathon_published_durability_findings
        - road_marathon_published_intensity_distribution_findings
        - road_marathon_published_taper_findings
        - road_marathon_published_fueling_and_gut_findings
        - road_marathon_published_fluid_and_sodium_findings
        - road_marathon_published_environment_and_altitude_findings
        - road_marathon_reassessment_and_outcome_policy
      evidence_claim_ids:
        - eligibility.evidence-quality-no-personal-probability
        - road-marathon.volume-frequency-longest-run-associative
        - road-marathon.durability-relevant-no-field-cutoff
        - road-marathon.marathon-tid-mostly-low-observational
        - road-marathon.taper-support-exact-parameters-uncertain
        - road-marathon.pacing-prediction-retains-individual-error
        - road-marathon.carbohydrate-support-contextual
        - road-marathon.gut-training-tolerance-not-universal
        - road-marathon.fluid-sodium-needs-variable
        - road-marathon.altitude-capacity-no-personal-correction
        - environment.no-universal-personal-correction
    - id: hard-boundaries
      title: Accept hard control, consent, data, and automation boundaries
      disposition: approve
      question: >
        Should every future proposal remain athlete-editable and explicitly
        adopted, with no automatic maximal marathon test, target-gap
        escalation, catch-up, activity-average-power intensity analysis, hidden
        demographic default, unconfirmed imported context, or AI authority
        expansion?
      proposed_decision: >
        Accept those prohibitions. Require direct confirmed capability,
        source-labelled inputs, activity splits or samples for intensity,
        deterministic validation, symptom stops, minimum-necessary data, and
        separate evidence, decision, implementation, and activation authority.
      approval_effect:
        - Missing context produces a typed no-plan or limited-guidance result rather than an invented value.
        - AI may explain reviewable inputs but cannot choose unresolved values, approve, activate, adopt, deliver, or publish.
        - Athlete constraints and consent remain authoritative.
      does_not_authorize:
        - Any unresolved numeric or algorithmic value in the same contract groups.
        - Medical diagnosis, treatment, clearance, sensitive inference, or a safety guarantee.
      parameter_names:
        - road_marathon_profile_and_source_provenance
        - road_marathon_direct_baseline_hierarchy
        - road_marathon_readiness_and_history_qualification
        - road_marathon_history_anchored_load_policy
        - road_marathon_long_run_and_durability_policy
        - road_marathon_intensity_and_race_specific_policy
        - road_marathon_taper_and_recovery_policy
        - road_marathon_fueling_and_hydration_policy
        - road_marathon_environment_and_altitude_policy
        - road_marathon_reassessment_and_outcome_policy
        - road_marathon_typed_outcomes_and_suggestion_only_state
        - road_marathon_validation_privacy_and_open_decisions
      evidence_claim_ids:
        - eligibility.fixed-progression-and-acwr-not-safety-laws
        - eligibility.current-symptoms-support-stop-not-clearance
        - eligibility.evidence-quality-no-personal-probability
        - road-marathon.task-specific-capability-baseline-multifactorial
        - road-marathon.pacing-prediction-retains-individual-error
        - road-marathon.fluid-sodium-needs-variable
        - heat-safety.separate-from-adaptation
    - id: qualitative-organization-context
      title: Accept only qualitative organization and context
      disposition: approve
      question: >
        Should V1 approve only broad mostly-low organization, durability as
        descriptive context, practiced fueling, and descriptive environmental
        context while leaving every exact value unresolved?
      proposed_decision: >
        Accept those qualitative boundaries only. Do not select a percentage,
        session count, spacing, long-run or durability cutoff, fueling or fluid
        number, environmental correction, or altitude schedule.
      approval_effect:
        - A future implementation must preserve mostly-low organization without claiming one causal optimum.
        - Durability, practiced fueling, hydration variability, heat, and altitude remain visible context rather than hidden prescriptions.
      does_not_authorize:
        - Exact values, named training-intensity distributions, race-specific workouts, or distance-only nutrition rules.
        - A personal environmental correction, acclimation schedule, or readiness conclusion.
      parameter_names:
        - road_marathon_published_durability_findings
        - road_marathon_long_run_and_durability_policy
        - road_marathon_published_intensity_distribution_findings
        - road_marathon_intensity_and_race_specific_policy
        - road_marathon_published_fueling_and_gut_findings
        - road_marathon_fueling_and_hydration_policy
        - road_marathon_published_fluid_and_sodium_findings
        - road_marathon_published_environment_and_altitude_findings
        - road_marathon_environment_and_altitude_policy
      evidence_claim_ids:
        - road-marathon.durability-relevant-no-field-cutoff
        - road-marathon.marathon-tid-mostly-low-observational
        - road-marathon.carbohydrate-support-contextual
        - road-marathon.gut-training-tolerance-not-universal
        - road-marathon.fluid-sodium-needs-variable
        - road-marathon.altitude-capacity-no-personal-correction
        - environment.heat-balance-multifactor
        - heat-adaptation.repeated-exposure
    - id: defer-baseline-history
      title: Defer qualification, freshness, history counts, and capability algorithm
      disposition: defer
      question: >
        Should exact direct-result qualification, freshness, distance and event
        validation, lookback, minimum history counts, and current-load
        qualification remain unresolved?
      proposed_decision: >
        Keep every baseline and history algorithm unaccepted until a later
        decision compares options, missingness, and validation consequences.
      approval_effect:
        - Missing or unconfirmed capability returns capability_confirmation_required.
        - Insufficient stable recent history returns insufficient_history.
      does_not_authorize:
        - A result expiry, distance tolerance, event qualification rule, minimum week or run count, or automatic maximal marathon test.
        - A shorter-distance conversion as direct current marathon capability.
      parameter_names:
        - road_marathon_direct_baseline_hierarchy
        - road_marathon_readiness_and_history_qualification
      evidence_claim_ids:
        - eligibility.recent-history-anchor-without-universal-threshold
        - eligibility.goal-relevant-current-capability-task-specific
        - road-marathon.task-specific-capability-baseline-multifactorial
        - road-marathon.pacing-prediction-retains-individual-error
    - id: defer-dose-specific-work
      title: Defer plan length, dose, long-run, intensity, and race-specific work
      disposition: defer
      question: >
        Should plan length, frequency, progression, volume, long-run
        distance/duration/share/cap, durability cutoff, marathon-pace or
        race-specific work, quality ceiling and spacing, and exact workouts
        remain unresolved?
      proposed_decision: >
        Keep every dose and schedule value unaccepted. Retain only the approved
        qualitative organization and hard prohibitions.
      approval_effect:
        - A future decision must select and validate each behavior-driving value explicitly.
        - Target gap and missed sessions cannot create escalation or catch-up.
      does_not_authorize:
        - A plan horizon, weekly frequency or volume, progression, long-run prescription, quality count, spacing, session mix, or workout template.
        - A durability score or activity-average-power intensity rule.
      parameter_names:
        - road_marathon_history_anchored_load_policy
        - road_marathon_long_run_and_durability_policy
        - road_marathon_intensity_and_race_specific_policy
      evidence_claim_ids:
        - eligibility.fixed-progression-and-acwr-not-safety-laws
        - road-marathon.volume-frequency-longest-run-associative
        - road-marathon.durability-relevant-no-field-cutoff
        - road-marathon.marathon-tid-mostly-low-observational
    - id: defer-taper-recovery
      title: Defer taper, event accounting, recovery, and reassessment cadence
      disposition: defer
      question: >
        Should taper window and reduction, intensity and frequency handling,
        short-horizon alternative, event-minute accounting, recovery spacing,
        reassessment cadence, and fixed outcome windows remain unresolved?
      proposed_decision: >
        Keep exact taper, recovery, reassessment, and outcome timing unaccepted
        while preserving the no-makeup and post-event reassessment boundaries.
      approval_effect:
        - A completed marathon triggers reassessment without claiming general readiness.
        - Observational taper effects remain source findings only.
      does_not_authorize:
        - A three-week taper prescription, fixed percentage reduction, recovery interval, event-minute formula, or meaningful-change window.
        - Treating renal recovery as medical clearance or general training readiness.
      parameter_names:
        - road_marathon_taper_and_recovery_policy
        - road_marathon_reassessment_and_outcome_policy
      evidence_claim_ids:
        - road-marathon.taper-support-exact-parameters-uncertain
        - road-marathon.recovery-subgroup-outcome-rules-unvalidated
    - id: defer-fueling-hydration-environment
      title: Defer fueling, hydration, environmental, and altitude values
      disposition: defer
      question: >
        Should loading, duration, intake, fluid, sodium, gut-training numbers
        and prompts, plus environmental and altitude corrections and
        acclimation schedules, remain unresolved?
      proposed_decision: >
        Keep every behavior-driving nutrition, hydration, environmental, and
        altitude value unaccepted. Require practiced context and complete
        environmental inputs before any future dependent suggestion.
      approval_effect:
        - Missing fueling context returns fueling_context_required.
        - Missing material environmental context returns environment_context_incomplete.
      does_not_authorize:
        - A distance-only intake, fluid, sodium, loading, sweat, or gut-training rule.
        - A personal pace correction, finish-time correction, or altitude acclimation schedule.
      parameter_names:
        - road_marathon_fueling_and_hydration_policy
        - road_marathon_environment_and_altitude_policy
      evidence_claim_ids:
        - road-marathon.carbohydrate-support-contextual
        - road-marathon.gut-training-tolerance-not-universal
        - road-marathon.fluid-sodium-needs-variable
        - road-marathon.altitude-capacity-no-personal-correction
        - environment.full-wbgt-inputs
        - environment.no-universal-personal-correction
        - heat-adaptation.repeated-exposure
        - heat-safety.separate-from-adaptation
    - id: defer-secondary-rollout
      title: Defer target risk, race density, subgroup, outcomes, pilot, implementation, and activation
      disposition: defer
      question: >
        Should target-risk thresholds, race-density and priority rules,
        subgroup dose modifiers, outcome windows and meaningful-change
        thresholds, pilot criteria, implementation mapping, and activation
        remain unresolved?
      proposed_decision: >
        Keep the contract inactive and require separate human review of every
        secondary rule, deterministic implementation mapping, and opt-in pilot
        threshold before runtime use.
      approval_effect:
        - Deterministic invariant and replay tolerance remain zero.
        - Every statistical, subgroup, event-density, outcome, implementation, and activation choice remains explicit future work.
      does_not_authorize:
        - Implementing unresolved values, advertising capability, starting a pilot, or activating any runtime surface.
        - Treating science decision approval as implementation or activation approval.
      parameter_names:
        - road_marathon_supported_training_pattern
        - road_marathon_reassessment_and_outcome_policy
        - road_marathon_validation_privacy_and_open_decisions
      evidence_claim_ids:
        - eligibility.evidence-quality-no-personal-probability
        - eligibility.masters-age-change-not-automatic-exclusion
        - road-marathon.recovery-subgroup-outcome-rules-unvalidated
rejected_alternatives:
  - alternative: "Copy a 5 km, 10 km, or half-marathon policy and replace the distance label"
    rationale: >
      Marathon duration, direct capability, long-run durability, fueling,
      hydration, taper, recovery, environment, and event demands differ.
      Existing numeric guardrails are policy-specific and not universal
      evidence.
  - alternative: "Generate a performance plan for first-marathon or completion intent"
    rationale: >
      Current direct same-task capability and stable history define this
      proposal. Completion and sparse-history populations need separately
      reviewed policies.
  - alternative: "Treat a prediction, critical speed, or shorter race as direct marathon capability"
    rationale: >
      Models retain material individual error and do not manufacture same-task
      history, personal probability, or readiness.
  - alternative: "Schedule a maximal marathon simulation when direct capability is missing"
    rationale: >
      A maximal simulation is burdensome and is not validated here. A no-event
      rolling preparation or benchmark route requires a separately accepted
      completion or benchmark policy.
  - alternative: "Convert observed volume, longest-run, durability, or taper values into prescriptions"
    rationale: >
      The direct findings are observational, cross-sectional, or indirect and
      do not establish an optimal or safe individual dose.
  - alternative: "Select a universal pyramidal distribution or marathon-pace dose"
    rationale: >
      The direct dataset is observational and zone-definition dependent. It
      does not establish a causal percentage, session count, spacing, or
      workout mix.
  - alternative: "Escalate dose to close a target-time gap or make up missed work"
    rationale: >
      Prediction error and population associations cannot justify compressed
      progression, catch-up, or hidden dose escalation.
  - alternative: "Use one marathon fueling, fluid, or sodium rule"
    rationale: >
      Duration, prior practice, tolerance, sweat response, environment, and
      athlete preference vary; both inadequate replacement and overdrinking
      matter.
  - alternative: "Apply an altitude or weather coefficient to personal marathon pace"
    rationale: >
      Acute chamber effects and population weather associations are not
      individualized corrections or acclimation schedules.
  - alternative: "Let AI fill missing context or choose deferred values"
    rationale: >
      AI cannot repair missing evidence, confirm athlete inputs, broaden
      eligibility, create approvals, activate runtime, or replace deterministic
      review.
model_parameters:
  - name: road_marathon_activation_and_dependency
    classification: guardrail
    value:
      active_behavior: false
      runtime_state: inactive
      shared_policy_dependency:
        sdr_id: sdr-plan-generation-eligibility-safety-v1
        required_status_before_activation: accepted
      distance_evidence_required_status_before_activation: accepted
      distance_decision_required_status_before_activation: accepted
      evidence_review_approval_artifact_required: true
      decision_approval_artifact_required: true
      implementation_approval_artifact_required: true
      capability_registry_entry_default_enabled: false
      generator_api_web_miniapp_plugin_and_mcp_activation_in_this_record: false
    evidence_claim_ids:
      - eligibility.evidence-quality-no-personal-probability
    rationale: >
      Draft records, generated packets, and a science decision cannot activate
      product behavior. Evidence, decision, implementation, and runtime
      authority remain distinct.
    applies_to: policy lifecycle and capability discovery
  - name: road_marathon_goal_and_event_tuple
    classification: guardrail
    value:
      goal_kind: distance_marathon
      goal_intent: performance
      sport: running
      surface: outdoor_road
      primary_outcome: elapsed_time
      target_time_optional: true
      target_date_optional: true
      goal_capture_independent_from_generator_availability: true
      unavailable_policy_result: goal_recorded_plan_policy_unavailable
      event_context_must_be_athlete_confirmed: true
      no_event_goal:
        goal_remains_recorded: true
        rolling_preparation_or_simulation_requires_separately_accepted_completion_or_benchmark_policy: true
        automatic_maximal_marathon_simulation: prohibited
      separate_policy_variants:
        - first_marathon_or_completion_intent
        - sparse_or_missing_history
        - returning_after_interruption
        - clinical_rehabilitation_or_return_to_sport
        - pregnancy_specific_planning
        - trail_marathon
        - ultramarathon
        - unsupported_surface_event_or_context
    evidence_claim_ids:
      - eligibility.goal-relevant-current-capability-task-specific
      - road-marathon.task-specific-capability-baseline-multifactorial
    rationale: >
      Goal choice is durable user state. This policy is a narrow capability,
      intent, surface, and evidence route rather than the definition of a valid
      goal.
    applies_to: goal normalization and marathon policy selection
  - name: road_marathon_supported_training_pattern
    classification: guardrail
    value:
      adult_scope: confirmed
      capability_pattern: current_direct_outdoor_road_marathon
      history_pattern: stable_recent
      load_pattern: within_recent
      intent_pattern: performance
      event_context:
        - confirmed_none
        - single_target
        - race_dense
      race_dense_requires_resolved_conflicts: true
      current_concerning_symptoms: absent
      evidence_directness:
        - direct
        - supporting
      explicit_exclusions:
        - adult_scope_unconfirmed
        - capability_unconfirmed
        - first_marathon_or_completion_intent
        - sparse_interrupted_or_missing_history
        - outside_recent_load_pattern
        - current_injury_illness_or_concerning_symptoms
        - clinical_rehabilitation_return_to_sport_or_medical_clearance
        - pregnancy_specific_prescription
        - unresolved_material_event_conflict
        - unsupported_surface_distance_or_intent
      cohort_labels_are_permanent_runner_identities: false
    evidence_claim_ids:
      - eligibility.current-symptoms-support-stop-not-clearance
      - eligibility.masters-age-change-not-automatic-exclusion
      - road-marathon.recovery-subgroup-outcome-rules-unvalidated
    rationale: >
      The route matches a time-bounded evidence pattern rather than a permanent
      recreational, amateur, female, male, faster, elite, or masters identity.
    applies_to: shared eligibility and distance-policy routing
  - name: road_marathon_profile_and_source_provenance
    classification: guardrail
    value:
      adult_scope_confirmation_required: true
      optional_modifier_fields:
        - age_or_age_band
        - sex
        - profile_attributes
        - prior_marathon_count
        - environmental_history
        - fueling_and_gastrointestinal_history
      missing_optional_modifier_effect: disable_dependent_adjustment_only
      unknown_sex_defaults_to_male: false
      imported_profile_and_event_fields:
        remain_source_labelled_until_athlete_confirmation: true
        may_not_overwrite_athlete_confirmed_value: true
        missing_is_unknown_not_false: true
      minimum_necessary_inputs_only: true
    evidence_claim_ids:
      - eligibility.masters-age-change-not-automatic-exclusion
      - eligibility.evidence-quality-no-personal-probability
      - road-marathon.recovery-subgroup-outcome-rules-unvalidated
    rationale: >
      Optional modifiers cannot become hidden demographic assumptions or
      unnecessary eligibility barriers. Athlete confirmation and field-level
      provenance preserve accuracy and control.
    applies_to: profile, event, and missing-data handling
  - name: road_marathon_direct_baseline_hierarchy
    classification: guardrail
    value:
      direct_current_capability_required: true
      preferred_direct_evidence:
        - athlete_confirmed_official_or_organized_outdoor_road_marathon_result
      required_metadata:
        - completed_at
        - elapsed_time_seconds
        - measured_distance_m
        - route_or_event_identifier
        - surface
        - assistance_status
        - source_provider
        - athlete_confirmation_state
      supporting_only:
        - shorter_distance_race_result
        - critical_speed_or_threshold
        - current_vo2max_or_vvo2max
        - weekly_training_volume_and_frequency
        - recent_longest_run
        - marathon_prediction_with_error
        - split_or_sample_pacing_distribution
      excluded_as_direct:
        - shorter_distance_conversion
        - critical_speed_prediction
        - passive_marathon_segment_within_ultra
        - unconfirmed_provider_personal_best
        - activity_average_power
        - vendor_readiness_or_race_score
        - policy_generated_maximal_marathon_simulation
      automatic_maximal_marathon_baseline_test: prohibited
      baseline_qualification_algorithm: not_accepted
      baseline_freshness_completed_days: not_accepted
      distance_match_tolerance_m: not_accepted
      accepted_event_qualification: not_accepted
      accepted_assistance_statuses: not_accepted
      missing_or_unconfirmed_outcome: capability_confirmation_required
    evidence_claim_ids:
      - eligibility.goal-relevant-current-capability-task-specific
      - road-marathon.task-specific-capability-baseline-multifactorial
      - road-marathon.pacing-prediction-retains-individual-error
    rationale: >
      Same-task confirmed history is most direct. Predictions and supporting
      markers retain material individual error and cannot silently qualify a
      runner or trigger a maximal marathon effort.
