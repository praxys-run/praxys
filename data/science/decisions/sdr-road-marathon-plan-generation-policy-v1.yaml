applicability:
  - Adults aged 18 years or older with adult scope confirmed
  - Current direct athlete-confirmed outdoor road-marathon capability
  - Stable recent running history and within-recent load
  - Performance intent with optional target time or date
  - Athlete-confirmed event context with unresolved conflicts excluded from a full proposal
  - Suggestion-only future behavior after every unresolved value and implementation review is accepted
  - Cohort labels describe evidence populations and never permanent runner identities
user_facing_claim_limits:
  - >
    This draft is an evidence and decision proposal, not a usable marathon
    generator, optimal plan, safety guarantee, medical advice, target-time
    guarantee, or personal probability.
  - >
    Fokkema volume and longest-run categories, durability correlations,
    training-intensity distributions, taper effects, gut-tolerance findings,
    and altitude chamber effects are source findings only.
  - >
    No plan length or 5 km, 10 km, or half-marathon numeric rule is accepted
    for marathon use through this record.
  - >
    Missing optional age, sex, profile, fueling, hydration, or environmental
    detail affects only the dependent adjustment and unknown sex never
    defaults to male.
  - >
    No-event rolling preparation or simulation requires a separately accepted
    completion or benchmark policy and cannot silently create a maximal
    marathon.
  - >
    Environmental and altitude context may explain uncertainty but cannot
    produce a personal pace, finish-time, acclimation, or safety correction.
safety_implications:
  - >
    Current concerning symptoms, illness, injury, rehabilitation,
    return-to-sport, medical-clearance, pregnancy-specific, or contradictory
    safety context stops the vigorous-plan path without diagnosis or treatment.
  - >
    Prior marathon completion, within-recent history, renal recovery, practiced
    fueling, or heat adaptation does not establish medical clearance or
    guarantee freedom from harm.
  - >
    No maximal marathon benchmark, target-gap escalation, catch-up, fixed
    progression law, ACWR prescription zone, distance-only hydration rule, or
    activity-average-power intensity analysis is allowed.
  - >
    Both inadequate replacement and overdrinking matter; medical hydration,
    sodium, heat-illness, or hyponatremia diagnosis and treatment remain
    outside this performance policy.
  - >
    Confirmed races and maximal efforts must count as quality and load, and
    unresolved event conflicts prevent a full proposal.
privacy_implications:
  - >
    Use only the authenticated athlete's minimum necessary goal, activity,
    event, profile, constraints, fueling, hydration, environment, and optional
    symptom context.
  - >
    Provider-imported profile, event, weather, and course fields remain
    source-labelled candidates until the athlete confirms or corrects them.
  - >
    Do not infer or publish diagnosis, injury cause, pregnancy status,
    gastrointestinal or hydration diagnosis, mental state, missed-training
    reason, or external life circumstance.
validation_plan:
  - >
    Registry validation must prove the exact draft Evidence Review and claim
    links, globally consistent citation metadata, rigorous verification notes,
    four approve and five defer items, complete parameter coverage, literal
    `not_accepted` deferrals, and inactive artifact policy.
  - >
    Artifact validation must prove that generated Evidence Review and SDR
    packets carry current digests and that the exact inactive machine contract
    embedded in the SDR packet matches the generated JSON contract.
  - >
    Tests must lock the narrow population tuple, modular structure, direct
    baseline hierarchy, goal-policy separation, no-event benchmark boundary,
    source-labelled profile and event data, typed outcomes, and
    activity-split/sample intensity rule.
  - >
    Tests must prove no plan length or shorter-distance numeric rule is
    inherited and that key observed values remain published source findings,
    not guardrail values.
  - >
    Before implementation, separate human decisions must select every
    baseline, history, dose, long-run, durability, intensity, race-specific,
    taper, recovery, fueling, hydration, environment, altitude, reassessment,
    subgroup, outcome, pilot, and activation value.
  - >
    Offline dry runs must report exclusions, missingness, source confirmation,
    event conflicts, subgroup gaps, edit and rejection burden, fueling,
    hydration and environment context, quality and event stacking, and
    deterministic replay without publishing private athlete data.
  - >
    A prospective opt-in pilot must predeclare human-reviewed go/no-go and
    pause thresholds before any activation.
falsification_conditions:
  - >
    Reject the policy if any implementation emits a plan while the decision or
    contract is draft or inactive, consumes an unaccepted value, or omits a
    code-consumed field from the human review packet.
  - >
    Reject routing if prediction, critical speed, shorter-distance conversion,
    passive segment, unconfirmed provider result, or activity average power is
    treated as direct current marathon capability or intensity evidence.
  - >
    Reject schedule mapping if observational source categories, durability
    correlations, pyramidal prevalence, taper effects, or target gap become
    eligibility or dose rules.
  - >
    Reject no-event routing if it creates a maximal marathon simulation without
    a separately accepted completion or benchmark policy.
  - >
    Reject fueling or hydration behavior if distance alone selects loading,
    intake, fluid, sodium, gut-training, or race-day strategy.
  - >
    Reject environmental behavior if population weather or chamber altitude
    findings become a personal correction, acclimation schedule, clearance, or
    guarantee.
  - >
    Pause future activation after any deterministic invariant or replay breach,
    symptom-stop override, hidden demographic default, unconfirmed source use,
    unresolved event conflict, unsupported population, consent bypass, or
    approval-digest mismatch.
