applicability:
  - Adult scope confirmed by the accepted shared router
  - Current direct outdoor road half-marathon capability
  - Stable recent history and within-recent load pattern
  - Performance intent with optional target time and target date
  - Confirmed-none, single-target, or conflict-resolved race-dense event context
  - Suggestion-only future behavior after all open guardrails and implementation reviews are accepted
  - Evidence cohorts include recreational and amateur runners without assigning a permanent identity
user_facing_claim_limits:
  - >
    This draft is an evidence and product-decision boundary, not a usable
    half-marathon generator, optimal plan, safety guarantee, medical advice, or
    goal-time guarantee.
  - >
    Observed 32 km weekly volume and over-21 km longest-run categories must not
    be presented as requirements, safe thresholds, or optimal doses.
  - >
    Taper and fueling values must be labelled as broader-endurance evidence
    with half-marathon-specific uncertainty.
  - >
    Target time and indirect predictions may describe uncertainty but may not
    create a personal success probability or justify higher dose.
  - >
    Missing optional age, sex, or fueling-tolerance detail affects only the
    dependent communication or feature and never silently defaults to male.
  - >
    No 5 km or 10 km count, percentage, window, template, or progression rule
    is accepted for half-marathon use through this record.
safety_implications:
  - >
    Current concerning symptoms, illness, injury, rehabilitation,
    return-to-sport, medical-clearance, pregnancy-specific, or contradictory
    safety context stops the vigorous-plan path without diagnosis or treatment.
  - >
    Completing a half-marathon, staying within recent history, or lacking
    symptoms does not establish medical clearance or guarantee freedom from
    harm.
  - >
    No maximal half-marathon benchmark is automatically proposed when direct
    capability is missing or stale.
  - >
    Confirmed races and maximal efforts count as quality and load; unresolved
    dense-event conflicts prevent a full proposal.
  - >
    No target-gap escalation, catch-up, ten-percent rule, ACWR prescription
    zone, high-intensity recovery prescription, or activity-average-power
    intensity analysis is allowed.
privacy_implications:
  - >
    Use only the authenticated athlete's minimum necessary goal, activity,
    event, profile, constraints, fueling-practice, and optional symptom context.
  - >
    Provider fields remain source-labelled candidates until their purpose is
    disclosed and the athlete confirms or corrects them.
  - >
    Do not infer or publish diagnosis, injury cause, pregnancy status,
    gastrointestinal diagnosis, mental state, missed-training reason, or
    external life circumstance.
validation_plan:
  - >
    Registry validation must prove exact Evidence Review and claim links,
    globally unique IDs, draft lifecycle validity, parameter classifications,
    exact citation verification notes, and inactive artifact policy.
  - >
    Artifact validation must prove that the generated Evidence Review and SDR
    packets carry current digests and that the exact machine contract embedded
    in the SDR packet matches the generated JSON contract.
  - >
    Tests must lock the exact supported tuple, current-capability and stable-
    history patterns, official distance, direct-baseline hierarchy, event
    accounting, activity-split/sample boundary, and typed no-plan states.
  - >
    Tests must prove every behavior-driving open choice remains
    `not_accepted`, no 5 km or 10 km numeric rule is inherited, and runtime
    state remains inactive without evidence, decision, and implementation
    approval artifacts.
  - >
    Before activation, separately reviewed decisions must select direct
    baseline qualification and freshness, history qualification, load and
    long-run caps, intensity and quality structure, taper and event-minute
    accounting, fueling duration/intake rules and prompts, execution windows,
    exact templates, and pilot thresholds.
  - >
    Offline dry runs must report exclusion, missingness, event conflict,
    edit/rejection burden, subgroup gaps, fueling-context availability, and
    deterministic replay without publishing private athlete data.
  - >
    A prospective opt-in pilot must predeclare adoption, adherence, edit
    distance, quality stacking, symptom and adverse-event exits, fueling
    tolerance, comparable outcomes, withdrawal, and human go/no-go thresholds.
falsification_conditions:
  - >
    Reject the policy if any implementation emits a plan while the contract is
    draft or inactive, consumes an unapproved parameter, or omits a
    code-consumed field from the human review packet.
  - >
    Reject routing if a shorter-distance conversion, prediction, threshold,
    activity-average power, or passive segment is treated as direct current
    half-marathon capability.
  - >
    Reject schedule mapping if observational 32 km or 21 km categories become
    universal eligibility or dose requirements.
  - >
    Reject target routing if a short horizon invalidates the goal, increases
    dose, schedules catch-up, or produces a personal probability.
  - >
    Reject fueling behavior if distance alone triggers carbohydrate loading or
    a new race-day intake strategy without prior practice and consent.
  - >
    Pause future activation after any deterministic invariant or replay breach,
    unconfirmed event use, quality/load event omission, unsupported population,
    hidden demographic default, symptom-stop override, or approval-digest
    mismatch.
  - >
    Revise or reject candidate guardrails when predeclared dry-run or pilot
    thresholds are breached; those thresholds are themselves not accepted by
    this draft.
affected_surfaces:
  models:
    - road-half-marathon-plan-generation-policy-v1
    - shared dynamic training-pattern and confirmed event snapshots
  apis:
    - future authenticated half-marathon capability and typed proposal endpoints
    - future event, fueling-practice, and confirmation inputs
  clients:
    - generated human Evidence Review and SDR packets
    - future web half-marathon goal, readiness, event, fueling, proposal, consent, and no-plan states
    - future miniapp feature, write, type, state, i18n, and consent parity
    - future plugin and MCP capability discovery and proposal parity
  science_notes:
    - Explain direct, associative, and broader-endurance evidence separately.
    - Show every unresolved guardrail, baseline source, event state, fueling assumption, risk, and alternative.
artifact_policy:
  runtime_state: inactive
supersedes: []
superseded_by:
decision_notes:
  - "This artifact-mode decision proposal addresses issue #688 and remains draft and inactive."
  - >
    Human review should use the generated packet rather than raw YAML. The
    packet includes the exact machine contract and digest-bound approval
    templates.
  - >
    The core proposed scope is history-rich, currently capable adult outdoor
    road half-marathon performance planning; completion and sparse-history
    policies remain separate.
  - >
    Direct evidence supports task-specific capability, observational volume
    and longest-run associations, and error-aware target communication.
    Taper, intensity distribution, recovery, and fueling transfer from broader
    endurance evidence with explicit limits.
  - >
    Every unresolved schedule, dose, taper, fueling, and pilot choice is
    encoded as `not_accepted`; implementation may not infer a value.
  - "Impact map: draft Evidence Review -> generated evidence packet -> draft SDR -> generated decision packet and inactive contract -> role-scoped approvals -> future pure routing and policy implementation -> API -> web and miniapp parity -> ScienceNote and localization -> offline validation -> opt-in pilot."
