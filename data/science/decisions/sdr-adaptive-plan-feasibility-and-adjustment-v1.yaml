schema_version: 1
id: sdr-adaptive-plan-feasibility-and-adjustment-v1
version: 1
title: "Bound adaptive-plan feasibility, adjustment, and outcome interpretation"
status: draft
decision_date: 2026-08-08
owners:
  - team:praxys
human_reviewers: []
model_version: adaptive-plan-policy-v1
