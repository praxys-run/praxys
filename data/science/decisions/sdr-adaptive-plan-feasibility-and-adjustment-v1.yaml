supersedes: []
superseded_by:
decision_notes:
  - This is a decision proposal for #607, not an accepted policy or implementation authorization.
  - No exact action trigger is included because the reviewed evidence does not validate one.
  - Existing accepted environmental-performance and heat-adaptation SDRs are not superseded; their evidence remains independently applicable when environmental context is used.
  - Human review should focus on claim directness, category language, medical boundaries, and the first prospective policy evaluation.
