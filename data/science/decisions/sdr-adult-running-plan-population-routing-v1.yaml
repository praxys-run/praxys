accepted_interpretation: >
  If accepted by digest-bound human review, this inactive Science decision
  would establish only evidence applicability, uncertainty, claim limits, and
  safety scope. Novice and first-completion populations are a distinct
  evidence and applicability family from history-rich performance populations;
  the evidence establishes neither a universal schedule nor a permanent
  identity. Sparse or missing records do not prove cessation or detraining,
  and detraining evidence does not establish a universal restart dose. Age is
  relevant context, but the evidence establishes no universal age exclusion,
  cutoff, or fixed recovery delay. Evidence concerning physiological sex,
  reproductive context, menopause, transgender and nonbinary people, and
  gender identity is construct-specific and validates neither a general plan
  family nor a universal dose rule. Strength and cycling evidence is bounded
  and does not establish injury prevention, running equivalence, or a
  universal dose. The scope remains adult and nonclinical, and historical
  intensity evidence must use splits or samples rather than activity-average
  power. All exact values remain not_accepted. Product promises, route
  semantics, interaction and profile-data behavior, system architecture,
  metrics, implementation, pilot, rollout, and activation are outside Science
  authority and remain deferred to linked Product, Design, Trust,
  Architecture, and Delivery decisions.
decision_review:
  reviewer_task: >
    Review the six scientific applicability boundaries and the two explicit
    deferrals below. Approve the sheet as a unit or request changes by item ID.
    Do not treat this Science review as a Product, Design, Trust, Architecture,
    Delivery, pilot, rollout, or activation decision.
  approval_statement: >
    I approve only these inactive scientific boundaries: first-completion
    applicability is distinct from history-rich performance applicability;
    sparse or missing records do not prove cessation or detraining; age is
    relevant without establishing a universal exclusion, cutoff, or fixed
    recovery delay; sex, reproductive, menopause, transgender/nonbinary, and
    gender evidence remains construct-specific; strength and cycling evidence
    remains bounded; and scope remains adult, nonclinical, and split-level for
    intensity. I agree that all exact values remain not_accepted and that every
    Product, Design, Trust, Architecture, implementation, pilot, rollout, and
    activation decision remains outside Science authority and deferred to a
    linked decision with human review. This approval would not implement or
    activate behavior.
  items:
    - id: first-completion-applicability
      title: Bound first-completion applicability
      disposition: approve
      question: >
        Does the evidence distinguish novice and first-completion applicability
        from history-rich performance applicability without establishing a
        universal schedule or permanent identity?
      proposed_decision: >
        Yes. Treat novice and first-completion evidence as a distinct
        applicability family. The reviewed evidence establishes neither one
        universal schedule nor a permanent beginner identity.
      approval_effect:
        - The scientific contract records a distinct evidence and applicability family.
        - Universal schedules and permanent identities remain unsupported.
      does_not_authorize:
        - A universal schedule or permanent identity claim.
      parameter_names:
        - first_completion_applicability
      evidence_claim_ids:
        - eligibility.novice-recreational-different-evidence-family
        - population.beginner-evidence-family-not-permanent-identity
        - population.no-universal-beginner-schedule
    - id: history-detraining-inference
      title: Limit history and detraining inference
      disposition: approve
      question: >
        Do sparse or missing records establish cessation or detraining, and
        does detraining evidence establish one restart dose?
      proposed_decision: >
        No. Sparse or missing records do not prove cessation or detraining.
        Detraining evidence does not establish a universal restart dose.
      approval_effect:
        - Record missingness remains insufficient evidence of cessation or detraining.
        - No universal restart dose is scientifically accepted.
      does_not_authorize:
        - A cessation or detraining conclusion from missingness or a universal restart dose.
      parameter_names:
        - history_and_detraining_inference
      evidence_claim_ids:
        - eligibility.recent-history-anchor-without-universal-threshold
        - population.sparse-history-not-detraining-proof
        - population.no-universal-returning-dose
    - id: masters-applicability
      title: Bound masters applicability
      disposition: approve
      question: >
        Does age establish a universal exclusion, cutoff, or fixed recovery
        delay for adult running plans?
      proposed_decision: >
        No. Age is relevant context, but the reviewed evidence establishes no
        universal age exclusion, biological cutoff, or fixed recovery delay.
      approval_effect:
        - Age remains scientifically relevant context.
        - Universal age exclusions, cutoffs, and fixed recovery delays remain unsupported.
      does_not_authorize:
        - A universal exclusion, cutoff, or fixed recovery claim based on age.
      parameter_names:
        - masters_applicability
      evidence_claim_ids:
        - eligibility.masters-age-change-not-automatic-exclusion
        - population.masters-context-not-age-exclusion
        - population.masters-recovery-not-fixed-delay
    - id: construct-specific-profile-evidence
      title: Keep profile evidence construct-specific
      disposition: approve
      question: >
        Does evidence about sex, reproductive context, menopause,
        transgender/nonbinary populations, or gender identity validate a
        general plan family or universal dose rule?
      proposed_decision: >
        No. These are distinct constructs with construct-specific evidence.
        The review validates neither a general plan family nor a universal dose
        rule for any combined profile category.
      approval_effect:
        - Scientific claims remain tied to the construct actually studied.
        - General profile-based plan families and universal dose rules remain unsupported.
      does_not_authorize:
        - Combining distinct constructs into a general family or universal dose claim.
      parameter_names:
        - construct_specific_profile_evidence
      evidence_claim_ids:
        - population.sex-effects-are-construct-specific
        - population.no-general-sex-or-gender-plan-family
    - id: strength-cross-training-evidence
      title: Bound strength and cross-training evidence
      disposition: approve
      question: >
        Does the reviewed strength or cycling evidence establish injury
        prevention, equivalence to running, or a universal dose?
      proposed_decision: >
        No. Strength and cycling evidence is bounded. It does not establish an
        injury-prevention guarantee, running equivalence, or a universal dose.
      approval_effect:
        - Strength and cycling claims remain within the reviewed evidence.
        - Injury prevention, equivalence, and universal dose remain unsupported.
      does_not_authorize:
        - An injury-prevention, running-equivalence, or universal-dose claim.
      parameter_names:
        - strength_and_cross_training_evidence
      evidence_claim_ids:
        - population.strength-and-cross-training-bounded-support
    - id: adult-nonclinical-scope
      title: Preserve adult nonclinical scope
      disposition: approve
      question: >
        Should this evidence decision remain limited to adult nonclinical
        planning and split- or sample-level intensity evidence?
      proposed_decision: >
        Yes. Pediatric planning, diagnosis, treatment, rehabilitation,
        pregnancy-specific prescription, clearance, and return-to-sport remain
        outside scope. Activity-average power is not valid intensity evidence;
        use activity splits or samples.
      approval_effect:
        - The scientific applicability boundary remains adult and nonclinical.
        - The split-level power invariant remains explicit.
      does_not_authorize:
        - Medical or pediatric guidance, a safety guarantee, or any runtime response.
      parameter_names:
        - adult_nonclinical_scope
      evidence_claim_ids: []
    - id: all-exact-values
      title: Defer all exact values
      disposition: defer
      question: >
        Should every exact schedule, threshold, restart, age, recovery, profile,
        strength, and cycling value remain unaccepted?
      proposed_decision: >
        Yes. Keep every exact value literal not_accepted. Study protocols,
        common practice, another population, prose, or AI output do not supply
        a universal value.
      approval_effect:
        - Every listed exact value remains visibly unresolved.
        - Future values require separately reviewed evidence and decisions.
      does_not_authorize:
        - Inferring, defaulting, or implementing any exact value.
      parameter_names:
        - exact_values
      evidence_claim_ids:
        - population.no-universal-beginner-schedule
        - population.no-universal-returning-dose
        - population.masters-recovery-not-fixed-delay
        - population.strength-and-cross-training-bounded-support
        - population.no-general-sex-or-gender-plan-family
    - id: all-non-science-decisions
      title: Defer all non-Science decisions
      disposition: defer
      question: >
        Should Product, Design, Trust, Architecture, implementation, pilot,
        rollout, and activation decisions remain outside this Science record?
      proposed_decision: >
        Yes. Defer Product promises, goal and intent behavior, route semantics,
        metrics, and pilot choices; Design clarification and confirmation
        experiences; Trust profile-data and privacy behavior; Architecture
        feedback-system and contract choices; and Delivery implementation,
        client behavior, rollout, and activation. Each requires its own linked
        decision and human review.
      approval_effect:
        - The Science contract remains limited to evidence, uncertainty, claim limits, and safety scope.
        - Later role-owned outputs remain explicit structured handoffs.
      does_not_authorize:
        - Any Product, Design, Trust, Architecture, Delivery, pilot, rollout, activation, or runtime choice.
      parameter_names:
        - non_science_authority_boundary
      evidence_claim_ids: []
rejected_alternatives:
  - alternative: "Collapse novice or first-completion evidence into history-rich performance evidence"
    rationale: >
      The reviewed populations and applicability differ, while no universal
      schedule or permanent identity is established.
  - alternative: "Treat sparse or missing records as proven cessation or detraining"
    rationale: >
      Record missingness does not establish the exposure studied in detraining
      research, and the evidence does not yield a universal restart dose.
  - alternative: "Use chronological age as a universal exclusion, cutoff, or recovery delay"
    rationale: >
      Age is relevant context, but capability and recovery vary and no
      universal behavior-driving value was validated.
  - alternative: "Turn sex, reproductive, menopause, transgender/nonbinary, or gender evidence into one plan family"
    rationale: >
      These are distinct constructs, and the evidence does not validate a
      general family or universal dose rule.
  - alternative: "Claim strength prevents injury or cycling is equivalent to running"
    rationale: >
      The evidence supports only bounded conclusions and no universal dose,
      equivalence, or individual injury-prevention guarantee.
  - alternative: "Let Science choose the Product response or implementation"
    rationale: >
      Evidence constrains later choices but does not own product promises,
      interaction, privacy, architecture, delivery, pilot, rollout, or
      activation decisions.
