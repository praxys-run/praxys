accepted_interpretation: >
  If accepted by a digest-bound human decision approver, this SDR would
  supersede the accepted but generator-incomplete V1 boundary with one
  inactive, generator-ready policy for adult outdoor-road 10 km performance
  intent. The supported pattern remains currently capable, history-rich,
  within-recent load, and free of current symptom-stop inputs. A deterministic
  proposal would commit fourteen athlete-local calendar days, present an
  advisory reassessment after seven completed days, and require explicit
  adoption before any successor replaces future adopted days. The initial
  schedule would use one quality session in each seven-day unit, never exceed
  recent typical load or athlete-stated constraints, preserve at least
  seventy-five percent low-intensity running minutes, and use only the two
  versioned 10 km quality templates defined here. Confirmed-none and
  single-target event states could receive a full proposal; race-dense,
  unsupported, stale, missing, contradictory, or symptom-stop states would
  fail closed to typed readiness, clarification, limited-guidance, or
  unavailable outcomes. The fourteen-day window, seven-day advisory cadence,
  one-quality choice, exact template steps, allocation rules, and pilot
  thresholds are transparent Praxys product guardrails, not published optima.
  This decision would not implement or activate a generator, adopt or deliver
  a plan, schedule a benchmark automatically, create a personal probability,
  or authorize first-completion, return-to-consistency, sparse-history,
  clinical, trail, marathon, or ultra planning.
decision_review:
  reviewer_task: >
    Review the six proposed inactive policy decisions and the two explicit
    deferrals below. Approve the decision sheet as a unit or request changes
    by item ID. The exact contract is included in the audit appendix. This
    review does not approve implementation or runtime activation.
  approval_statement: >
    I approve this inactive road 10 km performance policy as one bounded
    generator contract: the history-rich adult outdoor-road scope and typed
    readiness inputs; a fourteen-day committed proposal with a seven-day
    advisory reassessment and explicit successor adoption; one quality session
    per seven-day unit using the exact versioned 10 km templates; confirmed-none
    and single-target event handling with a bounded taper and race-dense
    limited guidance; the stated claim, demographic, consent, AI, privacy, and
    audit limits; and the predeclared runtime evaluation gates. I agree that
    broader dose, race-density, population, targeting, automation, and
    activation choices remain deferred. I understand that every exact schedule
    and template value is a Praxys guardrail rather than a published optimum,
    and that this approval does not implement or activate behavior.
  items:
    - id: supported-capability
      title: Accept the exact supported capability and readiness contract
      disposition: approve
      question: >
        Should V2 remain limited to the stated adult, currently capable,
        history-rich outdoor-road 10 km performance tuple and require the
        listed direct baseline, recent history, event, symptom, and constraint
        inputs?
      proposed_decision: >
        Accept that exact tuple and its fail-closed input contract. Preserve
        every valid Goal when the policy does not match, and never manufacture
        eligibility from predictions, sparse records, another distance, a
        permanent runner label, or missing demographic context.
      approval_effect:
        - The exact 10 km performance capability tuple becomes an accepted inactive decision input.
        - Missing, stale, contradictory, unsupported, and symptom-stop states remain typed non-success outcomes.
        - The predecessor and shared policy dependencies remain explicit.
      does_not_authorize:
        - Any generator implementation, registry activation, plan adoption, or provider delivery.
        - First-completion, return-to-consistency, sparse-history, other-surface, or clinical planning.
      parameter_names:
        - road_10k_v2_activation_and_dependencies
        - road_10k_v2_capability_tuple
        - road_10k_v2_required_inputs
        - road_10k_v2_readiness_and_missingness
      evidence_claim_ids:
        - eligibility.recent-history-anchor-without-universal-threshold
        - eligibility.goal-relevant-current-capability-task-specific
        - eligibility.current-symptoms-support-stop-not-clearance
        - population.sparse-history-not-detraining-proof
        - road-10k-baseline.same-distance-direct-capability
        - road-10k-baseline.freshness-cutoff-not-validated
    - id: rolling-execution
      title: Accept the fourteen-day rolling execution contract
      disposition: approve
      question: >
        Should the first generator commit fourteen days, show an advisory
        reassessment after seven completed days, and require explicit adoption
        before a successor changes future adopted days?
      proposed_decision: >
        Accept fourteen days as the minimum valuable reversible product window
        and seven days as an advisory review cadence. Treat both as
        operational guardrails rather than physiological claims.
      approval_effect:
        - Dated and undated goals may receive a bounded rolling proposal.
        - Material changes can produce a successor candidate without silently overwriting adopted days.
      does_not_authorize:
        - Automatic progression, automatic successor adoption, or a claim that fourteen or seven days is biologically optimal.
      parameter_names:
        - road_10k_v2_execution_window_and_reassessment
      evidence_claim_ids:
        - eligibility.recent-history-anchor-without-universal-threshold
        - road-10k-plan.volume-frequency-associated-not-prescriptive
        - road-10k-plan.individual-outcomes-require-error-aware-validation
    - id: deterministic-schedule
      title: Accept the initial deterministic schedule and templates
      disposition: approve
      question: >
        Should V2 use one quality session in each seven-day unit, history-capped
        easy running, at least seventy-five percent low-intensity minutes, and
        the exact two versioned 10 km quality templates?
      proposed_decision: >
        Accept the simplest useful schedule: one quality session per week,
        alternating threshold and 10 km interval templates across a normal
        fourteen-day proposal, with all duration and load bounded by recent
        completed history and athlete-stated constraints.
      approval_effect:
        - A future deterministic generator has complete schedule, allocation, intensity, spacing, and template inputs.
        - Exact template IDs and steps become reviewable guardrails with deterministic replay.
      does_not_authorize:
        - Describing the templates as evidence-backed optima.
        - Copying 5 km templates, adding a second planned quality session, or exceeding history and constraint caps.
      parameter_names:
        - road_10k_v2_schedule_construction
        - road_10k_v2_workout_templates
        - road_10k_v2_intensity_quality_and_spacing
      evidence_claim_ids:
        - road-10k-plan.task-specific-capability-not-single-marker
        - road-10k-plan.mostly-low-intensity-no-universal-winner
        - road-10k-plan.one-to-two-quality-sessions-indirect
        - road-10k-plan.volume-frequency-associated-not-prescriptive
        - road-10k-plan.fixed-progression-not-safety-law
    - id: event-and-taper
      title: Accept bounded event, benchmark, and taper routing
      disposition: approve
      question: >
        Should full proposals remain limited to confirmed-none and
        single-target event states, use the accepted indirect taper range for a
        confirmed primary event eight to fourteen days away, and return
        limited guidance for race-dense or shorter-horizon cases?
      proposed_decision: >
        Accept that boundary. Never auto-schedule a benchmark, treat every race
        or maximal effort as quality and load, and stop the generated schedule
        before the event.
      approval_effect:
        - Undated goals can roll without a forced benchmark.
        - A confirmed primary event may receive one deterministic taper path.
        - Race-dense and very short horizons remain fail-closed.
      does_not_authorize:
        - Automatic event confirmation or priority, race-dense optimization, or a promised taper benefit.
      parameter_names:
        - road_10k_v2_event_benchmark_and_taper
      evidence_claim_ids:
        - road-10k-plan.taper-volume-reduction-supported
        - road-10k-baseline.same-distance-direct-capability
        - road-10k-plan.one-to-two-quality-sessions-indirect
    - id: hard-boundaries
      title: Accept honest outcomes and hard control boundaries
      disposition: approve
      question: >
        Should the generator preserve typed non-success outcomes, avoid
        demographic modifiers and personal probabilities, require explicit
        adoption, constrain AI to explanation, and record only minimized
        replay and audit data?
      proposed_decision: >
        Accept those boundaries. Unknown age beyond adult confirmation, sex,
        gender, reproductive context, symptoms, events, and constraints may
        not be defaulted or inferred into eligibility or dose.
      approval_effect:
        - Runtime outcomes remain honest and deterministic.
        - Consent, privacy, missingness, and AI authority remain bounded.
      does_not_authorize:
        - Medical inference, sensitive-trait inference, personal success or injury probability, auto-adoption, or content logging.
      parameter_names:
        - road_10k_v2_typed_outcomes
        - road_10k_v2_demographic_and_claim_limits
        - road_10k_v2_consent_ai_and_state
        - road_10k_v2_privacy_and_audit
      evidence_claim_ids:
        - eligibility.evidence-quality-no-personal-probability
        - eligibility.masters-age-change-not-automatic-exclusion
        - population.masters-context-not-age-exclusion
        - population.sex-effects-are-construct-specific
        - population.no-general-sex-or-gender-plan-family
        - road-10k-plan.individual-outcomes-require-error-aware-validation
        - road-10k-plan.symptom-based-test-stop-boundary
    - id: evaluation-gates
      title: Accept the predeclared runtime evaluation gates
      disposition: approve
      question: >
        Should dry-run and opt-in rollout pause or revisit the policy when the
        stated deterministic, exclusion, edit, taper, subgroup, symptom,
        benchmark, or serious-event thresholds are crossed?
      proposed_decision: >
        Accept the thresholds as reversible pilot decision rules. They do not
        establish efficacy or medical safety.
      approval_effect:
        - Runtime learning has explicit pause and revision triggers before activation.
        - Cross-capability learning can be compared without success-shaped interpretation.
      does_not_authorize:
        - A claim that the policy improves performance, prevents injury, or is safe for an individual.
      parameter_names:
        - road_10k_v2_runtime_evaluation
      evidence_claim_ids:
        - eligibility.evidence-quality-no-personal-probability
        - road-10k-plan.individual-outcomes-require-error-aware-validation
    - id: broader-capabilities
      title: Defer broader dose, population, and automation choices
      disposition: defer
      question: >
        Should two-quality weeks, progression, mandatory long runs, race-dense
        optimization, other populations, exact power or pace targets,
        automatic benchmarks, personal probabilities, and AI planning authority
        remain unaccepted?
      proposed_decision: >
        Yes. Keep every listed capability explicitly not accepted until its own
        evidence, Product rationale, science decision, and review are complete.
      approval_effect:
        - The contract exposes rather than hides every deferred capability.
        - Implementation cannot infer a deferred value from V1, 5 km behavior, prose, or AI output.
      does_not_authorize:
        - Any deferred capability or fallback policy.
      parameter_names:
        - road_10k_v2_deferred_scope
      evidence_claim_ids:
        - road-10k-plan.one-to-two-quality-sessions-indirect
        - road-10k-plan.volume-frequency-associated-not-prescriptive
        - road-10k-plan.fixed-progression-not-safety-law
        - road-10k-plan.individual-outcomes-require-error-aware-validation
    - id: implementation-and-activation
      title: Defer implementation and runtime activation
      disposition: defer
      question: >
        Should generator code, API and client behavior, capability
        registration, rollout, adoption, and delivery remain outside this
        science approval?
      proposed_decision: >
        Yes. Keep the generated contract inactive. Require separate
        implementation review bound to the exact code diff and validation
        evidence before any activation.
      approval_effect:
        - Science acceptance remains separate from implementation and activation.
      does_not_authorize:
        - Code changes, runtime availability, plan adoption, provider delivery, or publication.
      parameter_names:
        - road_10k_v2_implementation_and_activation
      evidence_claim_ids: []
rejected_alternatives:
  - alternative: "Implement directly from the accepted V1 boundary"
    rationale: >
      V1 deliberately leaves the execution window and exact workout templates
      unresolved. Delivery may not fill those values from convention or code.
  - alternative: "Commit only seven days"
    rationale: >
      Seven days is highly reversible but does not provide the smallest
      complete two-unit 10 km experience and would create unnecessary review
      and adoption churn. No source establishes it as biologically superior.
  - alternative: "Copy the 5 km twenty-eight-day block and templates"
    rationale: >
      The 5 km horizon, history, session, and exact template guardrails are
      distance-specific and cannot authorize a 10 km policy.
  - alternative: "Use up to two planned quality sessions whenever history permits"
    rationale: >
      Two is an indirect ceiling, not a requirement. The first capability
      chooses one planned quality session per week to reduce complexity and
      event-conflict risk while runtime evidence is absent.
  - alternative: "Generate a full plan for race-dense calendars"
    rationale: >
      No accepted event-priority, taper, and recovery algorithm resolves
      multiple material events without guessing athlete intent.
  - alternative: "Use target-time gap, age, sex, or permanent runner level to select dose"
    rationale: >
      The evidence does not validate personal dose escalation or a general
      demographic or identity-based plan family.
  - alternative: "Let AI choose missing schedules or templates"
    rationale: >
      AI cannot create evidence, confirm context, choose deferred product
      values, weaken deterministic validation, approve, adopt, or activate a
      plan.
