schema_version: 1
id: sdr-trail-running-program-policy-v1
version: 1
title: 'Universal trail-running programme: inactive candidate modules through inclusive 50-km goal context'
status: draft
approval_mode: artifact
decision_date: '2026-09-14'
owners:
- team:praxys
human_reviewers: []
model_version: trail-running-program-policy-v1
evidence_review_ids:
- evidence-trail-running-program-v1
evidence_claim_ids:
- trail-program.base-transfer-is-partial
- trail-program.sparse-records-need-provenance
- trail-program.strength-support-with-protocol-limits
- trail-program.eccentric-control-not-descent-equivalence
- trail-program.home-access-not-equivalent-load
- trail-program.stairs-and-incline-are-distinct
- trail-program.dual-sessions-are-feasible-not-universal-spacing
- trail-program.run-walk-is-a-practice-option
- trail-program.fifty-km-needs-duration-specific-coverage
- trail-program.fuel-practice-is-individual
- trail-program.taper-direction-transfers-with-limits
- trail-program.feedback-does-not-measure-adaptation
accepted_interpretation: 'PROPOSED, NOT ACCEPTED: Combine an explicit general-running/history bridge,
  optional home/gym lower-limb control, bounded incline/stair ascent, observed terrain maintenance, same-day
  running and strength, run/walk, fuel practice and a taper candidate. Keep daily, first-finish and performance
  goals through 50,000 m visible without pretending all event-specific doses are supported. Exact executable
  values are Praxys guardrails; first-50-km long-duration, novel descent and complete race prescriptions
  remain explicitly unresolved. The entire contract is inactive and no predecessor approval is reused.'
decision_review:
  reviewer_task: Review the affirmative module rules and explicit deferrals, source applicability and
    every guardrail. Read the decision sheet before the audit appendix. This sheet records proposed decisions
    only, not approval.
  approval_statement: I approve the scientific interpretation and exact parameter groups in sdr-trail-running-program-policy-v1
    at the displayed immutable decision digest, only as a candidate for separately reviewed inactive implementation.
    I understand the guardrails are not validated personal safe doses or a complete first-50-km programme.
    I do not approve runtime activation, predecessor supersession, provider delivery or deployment.
  items:
  - id: scope-and-authority
    title: Review daily, first-finish and performance goals through 50,000 m without importing v2/v3 authority
    disposition: approve
    question: Review daily, first-finish and performance goals through 50,000 m without importing v2/v3
      authority — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: All three goals and the inclusive 50,000-m boundary are reviewable product context.
      They do not certify admission to every module. This is a new topic and inactive contract; no accepted
      or draft predecessor is changed.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - scope_and_authority
    evidence_claim_ids: &id001
    - trail-program.base-transfer-is-partial
    - trail-program.fifty-km-needs-duration-specific-coverage
  - id: history-admission
    title: Allow an explicit reported-history bridge without manufacturing observed training
    disposition: approve
    question: Allow an explicit reported-history bridge without manufacturing observed training — adopt
      this exact candidate boundary for separate implementation review?
    proposed_decision: The four-week and six-session observed gate and the two 20-minute reported bridge
      are deliberate low-complexity candidate guardrails. They are not published eligibility or safety
      thresholds. Reported history keeps its provenance and enables limited basic support; it never supplies
      measured descent or a full race plan.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - history_admission
    evidence_claim_ids: &id002
    - trail-program.sparse-records-need-provenance
    - trail-program.base-transfer-is-partial
  - id: basic-running
    title: Prescribe bounded easy running and repeat existing sessions within a separate running budget
    disposition: approve
    question: Prescribe bounded easy running and repeat existing sessions within a separate running budget
      — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: 'Reuse original general-running references while maintaining two separate ceilings:
      total run/walk time T0+P and actual running time R0+P. Each accepted five-minute basic-running increment
      raises both by five; capacity and single-session limits still apply. Original references and cumulative
      progression persist across proposals, restarts and refreshed history; no rolling rebase defeats
      the 10-minute-per-14-days or 20-minute lifetime ceiling.'
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - basic_running
    evidence_claim_ids: &id003
    - trail-program.base-transfer-is-partial
    - trail-program.sparse-records-need-provenance
  - id: strength-and-control
    title: Offer a concrete home or gym introduction with lower-limb control and no descent-equivalence
      claim
    disposition: approve
    question: Offer a concrete home or gym introduction with lower-limb control and no descent-equivalence
      claim — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Freeze a small introductory sequence and select the initial template once. An established
      2x6 template requires pre-programme evidence of that dose in every dynamic pattern and separately
      known frequency. Completing introductory sessions preserves acquired dose state; it never upgrades
      all patterns or resets to the familiar template. Repetitions, sets and frequency change only through
      the authoritative reviewed transitions. All doses remain guardrails, not proven safe or descent-equivalent.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - strength_and_control
    evidence_claim_ids: &id004
    - trail-program.strength-support-with-protocol-limits
    - trail-program.eccentric-control-not-descent-equivalence
    - trail-program.home-access-not-equivalent-load
  - id: equipment-substitutions
    title: Make every strength pattern executable without a gym and show missing-action limits
    disposition: approve
    question: Make every strength pattern executable without a gym and show missing-action limits — adopt
      this exact candidate boundary for separate implementation review?
    proposed_decision: Home substitutions remove gym location as an admission gate. They preserve a movement
      purpose, not a proven equal dose or training effect. Variant-specific tolerance is checked; an unavailable
      pattern remains visible instead of being hidden by more work elsewhere.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - equipment_substitutions
    evidence_claim_ids: &id005
    - trail-program.home-access-not-equivalent-load
    - trail-program.eccentric-control-not-descent-equivalence
  - id: uphill-indoor-modules
    title: Provide positive-incline and stair-ascent introductions with explicit return-path constraints
    disposition: approve
    question: Provide positive-incline and stair-ascent introductions with explicit return-path constraints
      — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: A small easy exposure is a candidate familiarization choice, distinct from the
      intense stair trials. The machine range never supplies training grade, and stair descent cannot
      be hidden in recovery. Exact time/grade values are guardrails; no vertical equivalence is assigned.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - uphill_indoor_modules
    evidence_claim_ids: &id006
    - trail-program.stairs-and-incline-are-distinct
    - trail-program.feedback-does-not-measure-adaptation
  - id: observed-terrain-maintenance
    title: Repeat qualified outdoor exposure while leaving novel descent and technical progression unresolved
    disposition: approve
    question: Repeat qualified outdoor exposure while leaving novel descent and technical progression
      unresolved — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Constrain an optional maintenance module to actual comparable outdoor observations.
      These windows and budgets are reviewable operational guardrails, not proof of conditioning. No reference
      data means this module is unavailable while basic and strength work can continue.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - observed_terrain_maintenance
    evidence_claim_ids: &id007
    - trail-program.eccentric-control-not-descent-equivalence
    - trail-program.base-transfer-is-partial
  - id: joint-schedule
    title: Schedule at most one running-type and one strength session per day with independent time and
      load accounting
    disposition: approve
    question: Schedule at most one running-type and one strength session per day with independent time
      and load accounting — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Allow independent short easy-running and qualified strength sessions without selecting
      a higher strength template. Every 48/72-hour recovery pair is symmetric and measured from the earlier
      session end to the later start in elapsed UTC time, including across days and proposal boundaries.
      The largest matching interval applies; unknown time leaves dependent sessions unplaced. These buffers
      remain scheduling guardrails, not personal recovery guarantees.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - joint_schedule
    evidence_claim_ids: &id008
    - trail-program.dual-sessions-are-feasible-not-universal-spacing
    - trail-program.eccentric-control-not-descent-equivalence
  - id: progression-and-review
    title: Use feedback to permit one small change, hold or regress; never infer recovered capacity from
      no soreness
    disposition: approve
    question: Use feedback to permit one small change, hold or regress; never infer recovered capacity
      from no soreness — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Use one authoritative upward transition per rolling seven days, including strength
      frequency. Introductory strength stays once weekly for the first fourteen days; a reviewed second
      session requires two tolerated sessions at the current dose and consumes the sole transition. This
      doubles weekly strength exposure without changing per-session dose and is an explicit guardrail,
      not a no-load-change claim. Acquired doses persist, and synchronized running ceilings retain immutable
      original references.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - progression_and_review
    evidence_claim_ids: &id009
    - trail-program.feedback-does-not-measure-adaptation
    - trail-program.strength-support-with-protocol-limits
  - id: interruption-restart
    title: Reassess non-medical missed training with exact restart actions and no fitness-loss percentage
    disposition: approve
    question: Reassess non-medical missed training with exact restart actions and no fitness-loss percentage
      — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Interruption-day boundaries trigger reassessment rather than an inferred loss of
      fitness. The bridge provides a concrete non-medical restart candidate; illness, injury and unclear
      reasons require separate assessment and do not automatically re-enter training.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - interruption_restart
    evidence_claim_ids: &id010
    - trail-program.feedback-does-not-measure-adaptation
    - trail-program.sparse-records-need-provenance
  - id: run-walk-practice
    title: Offer first-finish practice ratios without turning them into a finish or cardiac-safety prediction
    disposition: approve
    question: Offer first-finish practice ratios without turning them into a finish or cardiac-safety
      prediction — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Provide an executable 20-minute practice option and a way to reduce running within
      the same duration. Ratios are new guardrails, not copied from the abstract-only trial. This supports
      preparation activity without asserting first-event readiness.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - run_walk_practice
    evidence_claim_ids: &id011
    - trail-program.run-walk-is-a-practice-option
    - trail-program.base-transfer-is-partial
  - id: fuel-practice
    title: Introduce tolerable carbohydrate practice while withholding a complete race nutrition or hydration
      prescription
    disposition: approve
    question: Introduce tolerable carbohydrate practice while withholding a complete race nutrition or
      hydration prescription — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Select a modest practice target within published ultra guidance and test tolerability
      without extending exercise. Exact portions and advancement are candidate guardrails. Complete race
      energy/fluid/electrolyte needs, high-intake protocols and environmental adaptation remain unresolved.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - fuel_practice
    evidence_claim_ids: &id012
    - trail-program.fuel-practice-is-individual
    - trail-program.fifty-km-needs-duration-specific-coverage
  - id: taper-candidate
    title: Provide a bounded volume-reduction template and preserve first-finish/50-km applicability limits
    disposition: approve
    question: Provide a bounded volume-reduction template and preserve first-finish/50-km applicability
      limits — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: The 14-day 60%/40% remaining-running-volume template is an explicit transfer guardrail.
      It does not claim the same benefit in untrained or first-50-km users and does not manufacture missing
      long-duration or vertical policy. It omits novel eccentric work and does not prescribe pre-taper
      overload.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - taper_candidate
    evidence_claim_ids: &id013
    - trail-program.taper-direction-transfers-with-limits
    - trail-program.eccentric-control-not-descent-equivalence
  - id: cycle-and-coverage
    title: Keep 14/7 operation and a course-to-race roadmap without claiming unsupported phases are prescribed
    disposition: approve
    question: Keep 14/7 operation and a course-to-race roadmap without claiming unsupported phases are
      prescribed — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: Specify the operational cycle and objective transition checks. A roadmap is useful
      for explaining remaining preparation, but is not a generated full-cycle schedule. Missing first-50-km
      long-duration prescriptions are visible blockers and prevent a completeness claim.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - cycle_and_coverage
    evidence_claim_ids: &id014
    - trail-program.base-transfer-is-partial
    - trail-program.fifty-km-needs-duration-specific-coverage
    - trail-program.feedback-does-not-measure-adaptation
  - id: published-reference-context
    title: Keep source ranges as review context, never personal targets
    disposition: approve
    question: Keep source ranges as review context, never personal targets — adopt this exact candidate
      boundary for separate implementation review?
    proposed_decision: These are verified source study/guidance characteristics. Every behavior-driving
      candidate number elsewhere is classified separately as a guardrail. Published group averages or
      recommendation ranges do not automatically become personal targets.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group as a candidate for a separately
      reviewed implementation.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - published_reference_context
    evidence_claim_ids: &id015
    - trail-program.strength-support-with-protocol-limits
    - trail-program.dual-sessions-are-feasible-not-universal-spacing
    - trail-program.taper-direction-transfers-with-limits
    - trail-program.fuel-practice-is-individual
  - id: unresolved-modules-and-activation
    title: Defer specific unsupported prescriptions while exposing exactly which outputs they block
    disposition: defer
    question: Defer specific unsupported prescriptions while exposing exactly which outputs they block
      — adopt this exact candidate boundary for separate implementation review?
    proposed_decision: 'Research produced affirmative executable candidates for common modules. It did
      not validate the first-50-km long-run/vertical backbone, initial descent, technical progression
      or a complete race nutrition plan. These precise modules remain unavailable and #798 cannot close
      on this draft alone.'
    approval_effect:
    - Keep the named unsupported modules unavailable; preserve supported general modules with an explicit
      incomplete-coverage reason.
    does_not_authorize:
    - Runtime activation, acceptance of other roles, provider access/delivery, deployment, human self-approval,
      predecessor supersession or a complete 50-km preparation claim.
    parameter_names:
    - unresolved_modules_and_activation
    evidence_claim_ids: &id016
    - trail-program.fifty-km-needs-duration-specific-coverage
    - trail-program.eccentric-control-not-descent-equivalence
    - trail-program.fuel-practice-is-individual
rejected_alternatives:
- alternative: Reuse accepted v2 or draft v3 approval for general goals, same-day sessions and exactly
    50,000 m
  rationale: Both scope and exact parameters differ; history and authority remain immutable.
- alternative: Require a gym or treat disconnected devices as zero running history
  rationale: Location and observed data are distinct from biological capacity. A labelled bridge and qualified
    home variants preserve useful options with limits.
- alternative: Translate treadmill, stairs or strength into outdoor descent meters
  rationale: These stimuli and observed terrain exposure are not interchangeable.
- alternative: Invent a first-50-km long-run/back-to-back/vertical schedule to declare P1 complete
  rationale: Selected evidence cannot support those exact prescriptions; module-specific deferral is required.
- alternative: Call every exact guardrail evidence-based safety or infer clearance from no soreness
  rationale: Population evidence and symptom response do not validate individual safety or recovered neuromuscular
    function.
model_parameters:
- name: scope_and_authority
  value:
    minimum_age_years: 18
    clinical_rehabilitation_scope: false
    goal_modes:
    - daily
    - race
    race_intents:
    - first_finish
    - performance
    daily_intent: continuous_development
    race_format: single_day
    distance_meters:
      exclusive_minimum: 0
      inclusive_maximum: 50000
      exact_50000_supported_as_goal: true
      distance_alone_is_admission: false
    event_date_required_for_daily: false
    event_date_required_for_race: true
    resource_presets:
    - frequent_trail
    - city_occasional_trail
    - road_gym
    presets_editable: true
    gym_required: false
    presets_imply_history_or_equipment: false
    review_candidate_states:
    - candidate_supported
    - candidate_limited
    - candidate_unavailable
    runtime_eligibility_from_candidate_state: false
    history_v2_v3_unchanged: true
    no_accepted_supersession_links: true
    required_race_context:
    - date
    - distance_meters
    - single_day_format
    - intent
    - planning_duration_range_min
    - ascent_m
    - descent_m
    - footing
    - hands_assist
    - fixed_rope
    - environment_requirements
    unknown_race_context: limit_dependent_race_modules_preserve_general_modules
    hands_assist_or_fixed_rope_true: course_specific_modules_unavailable
    current_symptom_stop_true_or_unknown: all_exercise_candidates_unavailable
    unknown_adult_or_nonclinical_confirmation: all_exercise_candidates_unavailable
  classification: guardrail
  evidence_claim_ids: *id001
  rationale: All three goals and the inclusive 50,000-m boundary are reviewable product context. They
    do not certify admission to every module. This is a new topic and inactive contract; no accepted or
    draft predecessor is changed.
  applies_to: New draft review candidates only; runtime inactive; no predecessor authority reused
- name: history_admission
  value:
    provenance_states:
    - unknown
    - confirmed_no_exposure
    - athlete_reported
    - observed
    device_disconnection_means_zero: false
    client_can_assert_observed: false
    all_records_include_source_and_confirmation_revision: true
    observed_general:
      lookback_days: 28
      complete_calendar_weeks: 4
      minimum_qualifying_sessions: 6
      minimum_weeks_with_two_qualifying_sessions: 3
      qualifying_session_minimum_minutes: 20
      eligible_actual_modes:
      - outdoor_running
      - treadmill_running
      - recorded_run_walk
      unknown_week_counts_as_zero: false
      explicit_zero_week_included_in_statistics: true
      symptom_or_nonmedical_interruption_reassessed: true
    reported_bridge:
      requires:
      - adult_nonclinical_confirmation
      - current_symptom_stop_false
      - athlete_confirms_running_at_least_twice_in_each_last_four_weeks
      - athlete_confirms_each_typical_session_at_least_20_minutes
      - athlete_confirms_no_current_limiting_symptoms
      - athlete_confirms_no_unassessed_illness_injury_return
      confirmation_maximum_age_days: 7
      first_seven_days_running_sessions: 2
      session_minutes: 20
      all_running_easy: true
      all_numeric_history_caps: unavailable_until_sufficient_observed_or_separately_reviewed_provenance
      athlete_reported_is_not_observed: true
      bridge_feedback_required: each_completed_session_and_next_day
      review_after_days: 7
      repeat_bridge_maximum_blocks: 2
      if_still_unverified_after_two_blocks: reconfirm_base_and_keep_limited_or_request_individual_review_no_automatic_upgrade
      successful_bridge_proves_race_readiness: false
      new_strength_introduction: optional_with_own_gate_and_shared_novelty_budget
    no_running_base_or_unknown_base: general_running_module_unavailable_request_base_confirmation_or_separate_beginner_policy
    strength_familiarity:
    - never_or_unknown
    - familiar
    missing_strength_history: use_introductory_template_not_observed_strength_cap
    descent_history: independent_never_derived_from_general_running_or_strength
  classification: guardrail
  evidence_claim_ids: *id002
  rationale: The four-week and six-session observed gate and the two 20-minute reported bridge are deliberate
    low-complexity candidate guardrails. They are not published eligibility or safety thresholds. Reported
    history keeps its provenance and enables limited basic support; it never supplies measured descent
    or a full race plan.
  applies_to: New draft review candidates only; runtime inactive; no predecessor authority reused
- name: basic_running
  value:
    effort: comfortable_full_sentences_with_self_selected_pace; slow_or_walk_if_not_comfortable
    prescribed_power_or_hr_zone: null
    intensity_uses_activity_avg_power: false
    intensity_sources:
    - activity_splits
    - activity_samples
    observed_weekly_reference: original_running_reference_R0 = median(actual_running_minutes_in_each_of_four_complete_original_admission_weeks_including_explicit_zero)
    observed_frequency_reference: floor(median(running_session_count_in_each_of_four_complete_weeks_including_explicit_zero))
    initial_sessions_per_seven_days: min(observed_frequency_reference,confirmed_running_days,5); if less
      than 2 use bridge_or_limited_schedule
    initial_running_minutes_per_seven_days: min(R0,confirmed_running_time_budget); initial_progression_offset_P_is_zero
    minimum_planned_session_minutes: 20
    regular_session_maximum_minutes: 60
    single_session_cap: min(60,original_median_total_duration_of_last_four_qualifying_easy_sessions,available_slot_minutes);
      weekly_actual_and_total_budgets_checked_separately
    template:
      warmup_walk_minutes: 5
      easy_running_minutes: session_minutes_minus_10
      cooldown_walk_minutes: 5
      walking_counts_in_total_time: true
      walking_excluded_from_running_minutes_if_step_data_available: true
      unknown_running_fraction: retain_total_run_walk_time_separately_no_invented_running_minutes
    history_repeat_extended_session:
      requires: at_least_two_comparable_completed_sessions_in_28_days_with_known_duration_and_tolerance
      frequency_maximum_per_seven_days: 1
      duration_minutes: min(last_two_comparable_total_durations,available_slot_minutes,remaining_weekly_total_run_walk_budget,120)
      no_distance_or_vertical_increase: true
      above_120_minutes: long_duration_dose_unavailable
      purpose: repeat_observed_practice_not_a_new_long_run_target
      outdoor_terrain_requires_independent_module_gate: true
    new_quality_intervals_or_race_pace: unavailable_in_this_candidate
    if_full_budget_does_not_fit: shorten_or_omit_low_priority_session_with_explicit_gap_never_compress_recovery_or_add_catchup
    observed_weekly_total_run_walk_reference: original_total_reference_T0 = median(total_run_walk_minutes_in_same_four_complete_original_admission_weeks_including_explicit_zero)
    weekly_total_run_walk_budget: min(T0+P,confirmed_running_type_time_budget,remaining_shared_calendar_time_after_other_sessions_and_transit);
