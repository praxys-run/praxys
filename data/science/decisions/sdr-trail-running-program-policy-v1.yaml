applicability:
- Adults with an existing running base in a nonclinical context; source directness and module admission
  remain explicit
- Daily development, first-finish and performance intent; single-day goals up to and including 50,000
  m, with incomplete race-specific support clearly labelled
- Editable resource contexts including no gym and no special equipment; unknown resource or history limits
  only dependent modules unless a shared safety/admission input is missing
- Draft review candidates only; neither accepted science nor production planning
user_facing_claim_limits:
- Call home strength a general strength/control module, not descent-equivalent, injury-preventing or proven
  to improve trail race performance.
- Call the reported bridge athlete-reported limited support; do not present it as measured history or
  validated readiness.
- Do not promise first finish, completion probability, safe dose, optimal ratio, fourteen-day adaptation
  or complete first-50-km preparation.
- Explain published source ranges separately from all candidate prescription numbers.
- A roadmap or tapered general module does not fill unresolved long-run, technical, nutrition or environmental
  coverage.
safety_implications:
- Symptoms or unclear medical return suspend automated exercise candidates; no diagnosis or medical clearance
  is generated.
- No new outdoor descent without comparable exposure, no negative-incline prescription, no failure/maximal/ballistic
  strength and no catch-up workload.
- Soreness, mechanical exposure and running intensity are distinct; no activity-average power, equivalent
  descent credit or safe ACWR threshold.
- Fuel practice never forces intake, lengthens the session or supplies a clinical hydration/GI protocol.
privacy_implications:
- Collect only structured context needed for qualified modules and feedback; retain athlete-reported versus
  observed provenance without converting client assertions into observations.
- No weights, 1RM, diagnosis narrative, GPS/routes, provider credentials, additional demographic profiling
  or cross-user training telemetry is required by this science candidate.
- Architecture/Trust own exact production schema, access, retention and data rights; this SDR grants no
  authority beyond its science parameters.
validation_plan:
- Validate Evidence Review, citations, SDR schema, every decision-item-to-parameter mapping, inactive
  machine contract and exact generated review packet digests.
- Independently review all source levels and the important non-transfer claims, especially ACSM bodyweight
  limits, laboratory descent, run/walk and 50-km coverage.
- 'Exercise candidate arithmetic: treadmill 20/24 minutes, run/walk 20 minutes, stairs 15 minutes plus
  return transit, unilateral balance and strength reserves, no duplicate multi-purpose time.'
- Replay daily/no date, first finish, performance, exactly 50000 m and 50001 m, all resource presets and
  no gym, sparse/unknown/reported/observed-zero histories, same-day sessions and timezone/spacing conflicts.
- Verify regression/restart, incomplete feedback, missed work, one-variable progression, new resource
  revisions, taper crossing block boundaries and preservation of completed sessions.
- Reject complete-first-50-km coverage, activation and provider behavior from draft/inactive contracts,
  including candidate_supported receipts.
- 'Reject acquired-strength template reset: two 1x6 introductory sessions do not yield 2x6 across all
  three dynamic patterns; reject second weekly intro session before day14 and reject simultaneous frequency/dose
  progression.'
- 'Replay original total150/actual-running120 minutes with three50-minute sessions: one plus5 transition
  permits ceilings155/125 only when capacity and single-session caps fit; refresh/restart/new proposal
  cannot reset cumulative10-per14-day or20-lifetime ceilings.'
- 'Check symmetric end-to-start spacing in both orders: strength/extended and strength/terrain48h; terrain/new-eccentric72h;
  highest matching rule wins across date/block boundaries.'
falsification_conditions:
- The bridge or a resource preset manufactures observed exposure or measured zero.
- Any 50,000-m goal is silently routed through the old 49,999-m contract or an incomplete general plan
  is presented as full preparation.
- A same-day pair violates elapsed spacing, doubles time, overwrites independent completion, or turns
  strength minutes into running/vertical allowance.
- The generated candidate exceeds its guardrail ceilings, repeats progression indefinitely, schedules
  catch-up or hides unsupported course dimensions.
- No-soreness feedback triggers new downhill exposure, an injury-prevention guarantee or medical clearance.
- Source access is overstated, numeric guardrails are called published, or an inactive draft reaches production
  behavior.
- Introductory completions select the familiar template, template refresh loses acquired dose state, or
  frequency rises outside the one authoritative progression transition.
- A positive running-duration transition changes only one of total/actual-running ceilings, or refreshed
  history resets original references/cumulative progression.
- Spacing is start-to-start, directional-only, calendar-day-only, reset at a block boundary, or uses48h
  where a matching72h rule applies.
