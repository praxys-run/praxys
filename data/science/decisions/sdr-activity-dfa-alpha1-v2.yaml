- PDR logical digest sha256:086c52e80679e9d0a89a6f28ba70bda7d351076ed4c8933b77e32ca8b6f2501c verified.
  User Product implementation approval does not originate scientific signatures.
- Work classification sha256:1f80b1e4ff20a296d77cc15154af9d8826ea75e8d9726f2be624eb6292c11cff;route sha256:a45599ca884e6edfe42e642bddbf2026d027776c58081de6e35ec91f59892904.
- Existing v1EvidenceReview and SDR are draft/inactive here. This proposed v2 successor uses no active
  supersession links; baseline is not rewritten.
- 'Transitional strategy: manual uses its separately active v1contract; automatic requires separately
  active v2contract and servergate. If an eventual approved lifecycle supersedes v1, atomically migrate
  manual lookup to v2user_confirmed branch and all v1links before disabling v1; no partialtransition.'
- Reuse existing baselineEvidenceReview; source inference parameters are explicit operational guardrails,
  not new published physiological validation. Five reviewed papers/source limits in the earlier research
  bundle remain contextual.
- The3%/5%corrected-method candidate record is a different inactive research object and is excluded from
