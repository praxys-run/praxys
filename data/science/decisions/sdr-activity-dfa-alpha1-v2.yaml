schema_version: 1
id: sdr-activity-dfa-alpha1-v2
version: 2
title: Conditional automatic raw DFA admission with metadata-inferred source
status: draft
approval_mode: artifact
decision_date: '2026-10-02'
owners:
- agent:science
human_reviewers: []
model_version: dfa-alpha1-raw120-v1
evidence_review_ids:
- evidence-activity-dfa-alpha1-v1
evidence_claim_ids: &id001
- dfa.recording-artifacts
- dfa.short-scale-method
- dfa.threshold-transfer-limited
accepted_interpretation: 'DRAFT INACTIVE PROPOSAL: preserve the complete dfa-alpha1-raw120-v1 numerical
  method. Conditionally allow automatic completed-sync analysis under an independently active source/admission
  contract and default-off server gate, using metadata_inferred source assurance for the specified recorded
  ECG-type/model predicate. Such recordings compute without a per-activity human assertion. Manual owner-confirmed
  analysis remains a distinct branch; neither inference nor flag evaluation proves per-interval sensor
  provenance or individual accuracy.'
rejected_alternatives:
- alternative: Infer RR from sampled BPM or AlphaHRV developer alpha fields.
  rationale: Neither supplies the required raw beat sequence.
- alternative: Apply universal0.75/0.5 physiological thresholds or silently correct artifacts.
  rationale: Unsupported transfer and processing differences would widen the approved claim.
model_parameters:
