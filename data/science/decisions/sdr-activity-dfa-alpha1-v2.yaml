    invalid_raw: 65535
    zero_or_interior_invalid: break_chain
    range_ms:
    - 250
    - 2000
    neighbor_each_side: 5
    minimum_neighbors: 5
    relative_median_deviation: 0.2
    correction: none
    resampling: none
