accepted_interpretation: 'DRAFT INACTIVE PROPOSAL: retain the exact dfa-alpha1-raw120-v1 numerical recipe and existing supported-window descriptive claim. Conditionally admit automatic newly completed sync analysis using the all-candidate compatible ECG metadata predicate, labelled metadata_inferred. Manual analysis separately requires the exact factual activity owner confirmation, labelled user_confirmed. Both branches require their own current processing authority and the separately approved active designated V2 contract. Neither source category proves per-interval source, physiological accuracy or numerical equivalence. V1 remains terminally stopped.'
decision_review:
  reviewer_task: Review the exact retained raw method and evidence, distinct branch-specific source assurance, designated amendment pins, conditional admission and explicit physiology/implementation deferrals as one inactive Science decision. Product value, final Design, Trust, Architecture, Operations and independent implementation validation remain separate.
  approval_statement: Approve only this named Science decision and displayed immutable decision digest, including its interpretation, mapped guardrails, applicability, claim limits, safety/privacy and conditional activation boundary. This is inactive decision approval, not new Evidence approval, implementation approval, runtime activation, gate enablement or V1 revival.
  items:
  - id: unchanged-raw-method
    title: Retain the complete pinned raw numerical method
    disposition: approve
    question: Retain the complete pinned raw numerical method?
    proposed_decision: Retain every exact baseline group value and model version. Independent numerical equivalence remains to be demonstrated; no corrected method is admitted.
    approval_effect:
    - Accept only the mapped scientific interpretation and guardrail values for the named inactive decision after authenticated digest-bound decision_approver approval.
    does_not_authorize:
    - Runtime activation, deployment, gate mutation, implementation approval, evidence renewal, V1 revival, new physiology/device-accuracy claims or acceptance of other roles' decisions.
    parameter_names:
    - window
    - rr_quality
    - time_alignment
    - dfa
    - context
    evidence_claim_ids:
    - dfa.recording-artifacts
    - dfa.short-scale-method
    - dfa.threshold-transfer-limited
  - id: distinct-source-assurance
    title: Allow bounded metadata inference and separate factual owner confirmation
    disposition: approve
    question: Allow bounded metadata inference and separate factual owner confirmation?
    proposed_decision: Accept the all-candidate same-ECG-rule automatic predicate and explicit eligible/unresolved/ineligible outcomes, with separately originated exact manual owner confirmation. Neither assurance category certifies beat-source attribution or accuracy.
    approval_effect:
    - Accept only the mapped scientific interpretation and guardrail values for the named inactive decision after authenticated digest-bound decision_approver approval.
    does_not_authorize:
    - Runtime activation, deployment, gate mutation, implementation approval, evidence renewal, V1 revival, new physiology/device-accuracy claims or acceptance of other roles' decisions.
    parameter_names:
    - source
    - source_assurance
    - automatic_source
    - manual_source
    evidence_claim_ids:
    - dfa.recording-artifacts
    - dfa.short-scale-method
    - dfa.threshold-transfer-limited
  - id: claim-boundaries
    title: Retain supported-window descriptive claims and physiology deferrals
    disposition: approve
    question: Retain supported-window descriptive claims and physiology deferrals?
    proposed_decision: Accept only descriptive supported windows and honest source labels; defer thresholds, aggregate alpha, fatigue/medical/training inference, accuracy percentages and cross-app equivalence. Product manual preference supplies no accuracy claim.
    approval_effect:
    - Accept only the mapped scientific interpretation and guardrail values for the named inactive decision after authenticated digest-bound decision_approver approval.
    does_not_authorize:
    - Runtime activation, deployment, gate mutation, implementation approval, evidence renewal, V1 revival, new physiology/device-accuracy claims or acceptance of other roles' decisions.
    parameter_names:
    - claim_limits
    evidence_claim_ids:
    - dfa.recording-artifacts
    - dfa.short-scale-method
    - dfa.threshold-transfer-limited
  - id: conditional-v2-admission
    title: Require separate current V2 authority for both origins
    disposition: approve
    question: Require separate current V2 authority for both origins?
    proposed_decision: Both manual and automatic future branches require separately active V2; V1 remains terminally denied. Automatic work is newly completed sync only and gate/rights/source fences cover admission, execution, publication and numeric-context reads with no conversion to manual authority.
    approval_effect:
    - Accept only the mapped scientific interpretation and guardrail values for the named inactive decision after authenticated digest-bound decision_approver approval.
    does_not_authorize:
    - Runtime activation, deployment, gate mutation, implementation approval, evidence renewal, V1 revival, new physiology/device-accuracy claims or acceptance of other roles' decisions.
    parameter_names:
    - activation
    - binding_and_versions
    evidence_claim_ids:
    - dfa.recording-artifacts
    - dfa.short-scale-method
    - dfa.threshold-transfer-limited
  - id: physical-execution-prerequisites
    title: Require accepted physical execution and measured capacity boundaries
    disposition: approve
    question: Require accepted physical execution and measured capacity boundaries?
    proposed_decision: Retain one physical computation and require automatic yield within 5 seconds, where preemption is required, measured from durable accepted manual admission through actual old automatic process-group retirement and slot availability under documented healthy measured capacity. Measure manual admission and start latencies separately; accept no universal manual-start SLO. Separate accepted Architecture/Operations and independent Quality evidence must establish the boundary.
    approval_effect:
    - Accept only the mapped scientific interpretation and guardrail values for the named inactive decision after authenticated digest-bound decision_approver approval.
    does_not_authorize:
    - Runtime activation, deployment, gate mutation, implementation approval, evidence renewal, V1 revival, new physiology/device-accuracy claims or acceptance of other roles' decisions.
    parameter_names:
    - execution_boundary
    evidence_claim_ids:
    - dfa.recording-artifacts
    - dfa.short-scale-method
    - dfa.threshold-transfer-limited
  - id: designated-history-pins
    title: Preserve exact accepted Evidence and stopped baseline lineage
    disposition: approve
    question: Preserve exact accepted Evidence and stopped baseline lineage?
    proposed_decision: Use only the canonical designated amendment with exact immutable Evidence, decision, contract, envelope, STOP, numerical groups, model, manual statement and modality pins. No supersession, general successor path, renewal or revival is approved.
    approval_effect:
    - Accept only the mapped scientific interpretation and guardrail values for the named inactive decision after authenticated digest-bound decision_approver approval.
    does_not_authorize:
    - Runtime activation, deployment, gate mutation, implementation approval, evidence renewal, V1 revival, new physiology/device-accuracy claims or acceptance of other roles' decisions.
    parameter_names:
    - admission_amendment
    evidence_claim_ids:
    - dfa.recording-artifacts
    - dfa.short-scale-method
    - dfa.threshold-transfer-limited
rejected_alternatives:
- alternative: Infer RR from sampled BPM or AlphaHRV developer alpha fields.
  rationale: Neither supplies the required raw beat sequence.
- alternative: Apply universal0.75/0.5 physiological thresholds or silently correct artifacts.
  rationale: Unsupported transfer and processing differences would widen the approved claim.
- alternative: Keep manual runtime on stopped V1 or revive V1 approval.
  rationale: The terminal STOP remains effective; both future branches require separately accepted and active V2.
- alternative: Treat automatic metadata inference as owner confirmation or accuracy certification.
  rationale: Neither inventory inference nor a factual owner statement establishes native per-interval attribution or personal accuracy.
- alternative: Allow partial source inventory, merge same-model handles into one physical strap, or let owner confirmation override positive contradiction.
  rationale: Such behavior exceeds the bounded source assurance categories and selected compatible ECG scope.
- alternative: Convert automatic result/proof/receipt/rights into manual authority after the gate closes.
  rationale: Manual source evidence and processing authority must arise independently for the exact owner and input.
