  classification: guardrail
  rationale: Distinct immutable source and contract digests prevent inferred/manual authority mixing while
    the full fixed numerical recipe remains unchanged. Trust/Architecture own lifecycle persistence and
    rights fences.
  evidence_claim_ids: *id001
  applies_to: conditional automatic admission only; no numerical change
applicability:
- Exactly one native running FIT session under the existing Garmin archive adapter with unchanged raw
  RR timing/QC; source qualification is branch-specific.
- 'Automatic: each explicitly recorded external HR handle has coherent ANT+/HR or BLE/HR metadata and
  an unchanged supported ECG compatibility rule; all candidates share that rule, including same-model
  separate radio handles.'
- Unknown external HR, missing transport/class, different supported ECG models or explicit local wrist-HR
  inventory produce source_unresolved; ordinary watch optical capability does not.
- Known external optical identity, source-handle identity contradiction or positive mixed/switching source
  evidence remains ineligible.
- Source assurance is a modality/model inference from recording metadata, never a guarantee of the exact
  physical or per-interval native RR source.
user_facing_claim_limits:
- 'Metadata-inferred output: Source inferred from recording metadata; no source confirmed by you or verified-source
  label.'
- 'User-confirmed output: preserve the existing factual owner-confirmation label and exact statement revision.'
- Same-model multiple recorded handles may represent radio connections or separate devices; do not merge
  physical identities or promise one strap.
- Preserve estimated time alignment, availability-not-accuracy, no overall score, no threshold lines,
  no individual threshold, no diagnosis/training change or cross-app equivalence.
safety_implications:
- Descriptive post-run analysis does not clear exercise safety or change training.
privacy_implications:
- Owner-only inferred proof and result; no automatic human confirmation row, serial/address persistence,
  private raw metadata duplication or RR/source data in gate telemetry.
- Source evidence binding, deletion/revocation/reparse/restore, processing consent, feature-gate fences
  and retained proof schema require the separate Trust/Architecture acceptance.
validation_plan:
- Golden numeric fixture outputs under v1manual and v2automatic are identical except typed assurance/provenance
  metadata; frozen numerical parameter digest must match.
- 'Synthetic native FIT source matrix: eligible oneANT+ECG, oneBLEECG, twoANT+/BLEsame-model handles without
  physical merge, repeated coherent handle descriptions, generic optically capable watch plus supported
  externalECG.'
- 'Source-unresolved cases: differentcompatibleECGmodels, unknowncompetingexternalHR, missing source_type/device_type/index,
  explicit localwhr inventory, ambiguous handle transport reuse.'
- 'Ineligible cases: positively knownexternalopticalHRidentity, samehandle identitycontradiction, positiveoptical/external
  switching or mixedRRsourceevidence.'
- Positive source inference completes automatic numerical phase without any Confirmation row, per-activity
  click or confirmed:true. Baseline raw QC can still produce no_valid_windows or timing failures truthfully.
- GateOFF, failing gate wrapper or inactive/wrong science contract never admit/execute/publishautomaticresults;
  manual existing authority remains independent.
- Independent Science/Trust/Quality review tests exact source-proof binding and stale/input/gate/rights
  fences before production activation.
falsification_conditions:
- Automation fabricates a factual owner confirmation or labels metadata_inferred as user_confirmed/verified.
- Known contradictory/optical source admitted; ambiguous inventory silently claimed to be physically one
  sensor or direct native RR provenance.
- A positive eligible metadata predicate invariably requires another manual confirmation/start rather
  than completing.
- Any numerical/QC/formula/timing/coverage correction changes under this source-only amendment.
- DefaultOFF, inactive science or processing/gate revocation permits new automatic work/publication.
