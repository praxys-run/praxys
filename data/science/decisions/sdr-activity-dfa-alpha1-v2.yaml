applicability:
- Exactly one native running FIT session under the existing Garmin archive adapter with retained native RR, unchanged registered ECG compatibility rules and exact raw timing/QC.
- Automatic admission uses all coherent recorded native external HR candidates sharing one compatible ECG rule; same-model handles remain distinct recording-local handles.
- Different supported models, unknown external HR, missing/uninterpretable transport or recording-local handle, ambiguous handle reuse, or explicit local wrist HR inventory are source_unresolved. Generic watch optical capability alone does not block.
- Known optical external HR identity, positive optical/mixed/switching RR evidence or same-handle identity contradiction remains ineligible in both branches.
- Manual source_unresolved handling requires the selected recorded compatible ECG candidate and the exact factual per-activity owner statement; it cannot override a positive contradiction.
- The source categories report modality/model metadata inference or an owner statement, not validated physical or per-beat RR source. Passing raw QC does not prove absence of artifacts.
user_facing_claim_limits:
- Describe only supported windows; retain estimated time alignment, actual availability/coverage and missing-window reasons. No aggregate alpha/overall score, threshold lines, personal threshold, fatigue diagnosis, training prescription, exercise clearance, accuracy percentage or Kubios/application equivalence.
- Metadata-inferred output must say Source inferred from recording metadata; it must not say Source confirmed by you, verified source or one physical strap.
- User-confirmed output must say Source confirmed by you and preserve the exact activity statement revision; it must not imply measured source accuracy.
- The Product draft manual-preferred display choice means user control only, not greater scientific accuracy. Final selection and complete inline Activity Report Field Lab experience belong to Product and Design.
- No source or physiological guarantee follows from gate ON, accepted/inactive Science, exact inherited numerical values, synthetic fixtures or a tooling protocol PASS.
safety_implications:
- Descriptive post-run analysis does not clear exercise safety or change training.
- This source/admission proposal changes no CP, load, race forecast, diagnosis or canonical Today verdict and authorizes no new safety or medical claim.
privacy_implications:
- Owner-only origin-bound proofs, receipts and results; automatic inference creates no human confirmation, serial/address persistence, duplicated private RR/raw-source metadata or numeric telemetry.
- Manual and automatic processing authority is distinct; gate OFF/unavailable cannot convert automatic proof, result, receipt or rights into manual consent.
- Trust acceptance must bind account/activity/source deletion, revocation, export, retention, reparse, restore and current owner/source/sync/processing-rights generations. Science proposes no persistence/restore authority.
validation_plan:
- Registry validation must use the pinned canonical designated helper and preserve every historical Science byte and mode, including shared accepted Evidence, approvals and real V1 STOP. Verify exact affected-model pins and full frozen numerical group values.
- Numerical inheritance is an input constraint, not a completed equivalence result. Independently compare the fixed double-direction raw method against the reference with absolute error <=1e-9; compare both V2 branches on exact common fixtures and preserve failed/skipped/unknown outcomes.
- Source matrix must cover single supported ANT+ and BLE ECG, separate same-model handles, coherent repeated descriptions and a generic optically capable watch; distinguish unresolved missing transport/handle, different ECG models, unknown competing HR, ambiguous reuse and explicit local wrist inventory from positive optical/mixed/switching/identity contradictions.
- Automatic eligible newly completed sync must complete without a per-activity owner assertion, while producing typed metadata_inferred proof with no confirmation row. Manual source proof must contain the exact current owner statement and selected recorded ECG rule; neither branch may manufacture direct per-beat provenance.
- Test draft and accepted-inactive denial for both actual V2 guards, projected-active exact V2 return from both guards, and separate perpetual actual V1 STOP denial. Missing actual guards, simulated protocol output and tooling PASS are not runtime evidence.
- Verify gate OFF/unavailable and source/sync/owner/rights changes at admission, execution, publication and numeric-context read. Test race winners, no automatic-to-manual consent conversion, current independent manual authority and origin-specific stale-result denial.
- Independent Architecture/Operations/Quality evidence must demonstrate at most one physical computation and complete old actor exit before slot reuse. Where accepted manual admission requires automatic preemption, measure durable accepted manual admission through actual old automatic process-group retirement and slot availability within 5 seconds under documented healthy measured capacity. Measure manual admission and start latencies separately; no universal manual-start SLO is approved. Lease clearing, logical cancellation or elapsed polling alone is insufficient.
- Design/Quality must verify complete inline Activity Report Field Lab on web and WeChat, assurance labels, unsupported/empty/failed/stale states and accessibility. This read-only Science stage performs no rendering.
- No fresh literature verification is claimed; preserve existing rapid-review dates and per-source access levels. New device accuracy, threshold, corrected-method or physiological claims require a newly bounded evidence review and independent Science review.
- Where Architecture proposes shared physical numerical results, independently validate exact input/method/numerical-contract identity and separate current manual/automatic grants. Reuse may attach independently authorized manual work; it must not reuse automatic consent or source proof. Failed equivalence keeps sharing unavailable.
falsification_conditions:
- Either branch changes any frozen window, RR quality, alignment, DFA or context value or disagrees with the approved raw numerical method/reference.
- Known optical/contradictory source is admitted, inventory uncertainty becomes physical/per-beat certainty, or source_unresolved is silently declared supported.
- Automation creates a human statement/confirmation or any automatic proof/receipt/result/rights is relabelled or converted into manual authority.
- Gate OFF/unavailable, stale source/sync/owner/rights or wrong/inactive contract permits automatic admission, execution, publication or numeric-context reads.
- Stopped V1 is admitted, V2 is admitted while draft/accepted-inactive, or synthetic/tooling output is presented as actual runtime approval or numerical equivalence.
- A second physical computation starts before the first exits, or required automatic preemption exceeds 5 seconds from durable accepted manual admission to actual old automatic process-group retirement and slot availability under documented healthy measured capacity. Escalate the affected Architecture/Operations acceptance rather than reinterpret alpha or source accuracy.
- Users interpret source assurance, coverage or alpha as accuracy, physiology thresholds, diagnosis or a training/safety prescription; reassess labels and claim presentation.
