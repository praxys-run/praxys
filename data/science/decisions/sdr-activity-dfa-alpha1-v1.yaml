- dfa.threshold-transfer-limited
accepted_interpretation: 'Proposed scientific boundary: native ECG chest-strap RR
  can support descriptive post-run short-scale DFA when source, timer alignment and
  conservative uncorrected-RR QC pass. Results characterize supported windows only;
  no personal threshold, fatigue diagnosis or training prescription is inferred. This
  draft does not activate runtime.'
rejected_alternatives:
- alternative: Infer RR from sampled BPM or AlphaHRV developer alpha fields.
  rationale: Neither supplies the required raw beat sequence.
- alternative: Apply universal0.75/0.5 physiological thresholds or silently correct
    artifacts.
  rationale: Unsupported transfer and processing differences would widen the approved
    claim.
model_parameters:
