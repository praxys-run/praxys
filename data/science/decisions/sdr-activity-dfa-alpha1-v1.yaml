applicability:
- Exactly one native running FIT session with retained raw RR and compatible ECG metadata.
- Per-activity factual owner confirmation; no automatic source assurance in native
  v1.
- Existing Garmin-platform archive adapter, device-neutral pure core.
user_facing_claim_limits:
- Label estimated time alignment and source confirmed by you.
- No accuracy percentage, zero-artifact claim, physiological threshold, whole-activity
  score or medical inference.
- At least200 complete intervals excludes some low-heart-rate windows without implying
  sensor failure.
safety_implications:
- Descriptive post-run analysis does not clear exercise safety or change training.
privacy_implications:
- Owner-only results and activity confirmations; no serials, raw RR duplication or
  numeric telemetry.
- Revocation, source deletion, reparse, retention, export and restore manifests follow
  the approved Trust contract.
validation_plan:
- Independent numerical reference absolute error<=1e-9.
- Synthetic native FIT, timing/QC boundaries, source attestations, deletion races
  and both-client accessibility.
- Cross-device physiological claims require new prospective evidence and review.
falsification_conditions:
- Any optical or known contradictory source accepted.
- Numerical implementation disagrees with the fixed double-direction method.
- Users interpret availability or alpha as accuracy, fatigue diagnosis or an individual
  threshold.
