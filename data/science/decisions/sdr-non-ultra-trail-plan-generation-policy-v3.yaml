accepted_interpretation: 'Proposed interpretation, not accepted: Allow a three-context fourteen-day basic
  proposal with structured gym work and explicit specialty gaps; use independent module gates and calendar-aware
  observed exposure rather than mandatory weekly uphill and positive vertical medians. Exact behavior-driving
  numbers are new Praxys guardrails unless explicitly classified as published study context. The currently
  accepted v2 decisions and contracts remain unchanged and inactive. This draft permits review-only candidate
  validation and does not return runtime eligibility or authorize production execution.'
decision_review:
  reviewer_task: Review each action and deferral against the linked verified sources, uncertainty and
    exact inactive contract. The decision sheet is a proposal; no human approval is recorded.
  approval_statement: I approve the scientific interpretation and exact parameters in sdr-non-ultra-trail-plan-generation-policy-v3
    for preparation and review of an inactive v3 implementation. I understand that the proposed exercise,
    calendar and history values are guardrails rather than proven individual safe doses or performance
    guarantees. I do not approve runtime activation, production use, pilot, deployment, provider behavior
    or predecessor supersession.
  items:
  - id: v3-review-scope
    title: V3 review scope
    disposition: approve
    question: Allow a three-context fourteen-day basic proposal with structured gym work and explicit
      specialty gaps; use independent module gates and calendar-aware observed exposure rather than mandatory
      weekly uphill and positive vertical medians.
    proposed_decision: Reuse the Product-selected two-week proposal and advisory review cadence while
      adding explicitly limited base preparation. The stage is a review package, not an active scheduler.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_review_scope
    evidence_claim_ids:
    - trail-resource.strength-support-not-short-block-promise
    - trail-resource.resource-frequency-does-not-prove-capacity
    - trail-ontology.course-demand-is-multidimensional
    - non-ultra-trail.course-specific-policy-required
    - eligibility.recent-history-anchor-without-universal-threshold
  - id: v3-basic-history-and-running-envelope
    title: V3 basic history and running envelope
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: General running must be supported independently. Three running days, a 20-minute
      minimum and the retained history envelope are reviewable operational choices, not sufficient/optimal
      training laws. Qualified treadmill running broadens mode provenance without granting outdoor exposure.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_basic_history_and_running_envelope
    evidence_claim_ids:
    - trail-resource.treadmill-is-context-not-terrain-equivalence
    - trail-resource.resource-frequency-does-not-prove-capacity
  - id: v3-joint-schedule-and-recovery
    title: V3 joint schedule and recovery
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: Joint time accounting follows the actual single-session/day scope. Spacing is a
      conservative planning buffer informed by concurrent-training context, not a validated individual
      recovery interval.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_joint_schedule_and_recovery
    evidence_claim_ids:
    - trail-resource.concurrent-scheduling-requires-context
    - trail-resource.downhill-adaptation-not-clearance
  - id: v3-schedule-capacity-tradeoff
    title: Expose the four-day minimum imposed by three runs, one gym and one session per day
    disposition: approve
    question: Should this first version require at least four distinct available days for a complete base-plus-gym
      schedule, with an explicit limited review when it cannot fit?
    proposed_decision: Three running sessions and at least one gym session require at least four distinct
      days under the current one-session/day interface. Five is the target for two gym sessions. This
      explicit Product/service tradeoff is not a biological readiness threshold; insufficient capacity
      preserves reviewable module content with schedule reasons rather than a false complete proposal.
    approval_effect:
    - Makes the capacity tradeoff visible to Product and the athlete without claiming a physiological
      prerequisite.
    does_not_authorize:
    - Multiple same-day sessions, silent gym omission, fewer running days, or a promise that running history
      alone guarantees availability.
    parameter_names:
    - v3_schedule_capacity_tradeoff
    evidence_claim_ids: []
  - id: v3-gym-templates
    title: V3 gym templates
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: Choose four reproducible lower-body movements and a low-volume first block. Source
      studies often start at 1–2 sets and use 2–3 minute rests, but these exercises, 8 repetitions, 25/35-minute
      reserves and RIR cues are new Praxys guardrails. They are an introduction/support module, not the
      high-load protocols shown to improve running or a validated safe-dose regimen.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_gym_templates
    evidence_claim_ids:
    - trail-resource.introductory-dose-is-a-guardrail
    - trail-resource.strength-does-not-guarantee-injury-prevention
  - id: v3-treadmill-template
    title: V3 treadmill template
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: An optional short, low-gradient candidate separates treadmill practice from outdoor
      specificity. The 2% gradient, six graded minutes and 20-minute session are explicit Praxys choices;
      reviewed uphill trials do not validate this exact prescription or an equivalent outdoor dose.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_treadmill_template
    evidence_claim_ids:
    - trail-resource.treadmill-is-context-not-terrain-equivalence
    - trail-resource.uphill-downhill-specific-and-dose-uncertain
    - trail-resource.subjective-effort-is-not-a-universal-zone
  - id: v3-outdoor-exposure-budget
    title: V3 outdoor exposure budget
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: Use explicit dates and cumulative observed budgets instead of treating sparse weekly
      medians as capacity. Every 56/42/28-day/count/floor rule is a falsifiable guardrail, not a validated
      readiness or adaptation threshold. Include zero exposure periods and preserve missingness.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_outdoor_exposure_budget
    evidence_claim_ids:
    - trail-resource.resource-frequency-does-not-prove-capacity
    - trail-resource.downhill-adaptation-not-clearance
  - id: v3-blockers-and-module-limits
    title: V3 blockers and module limits
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: Keep meaningful basic output while naming unsupported specialty coverage. A missing
      core gym input remains an explicit incomplete module; it cannot be advertised as a completed base-plus-gym
      proposal. Seven days is an advisory review point, not demonstrated adaptation.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_blockers_and_module_limits
    evidence_claim_ids:
    - trail-resource.strength-support-not-short-block-promise
    - trail-resource.downhill-adaptation-not-clearance
  - id: v3-published-reference-context
    title: V3 published reference context
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: These are source study ranges for reviewer context only. They must not be used
      as generated personal exercise targets.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_published_reference_context
    evidence_claim_ids:
    - trail-resource.strength-support-not-short-block-promise
  - id: v3-deferred-policy-and-authority
    title: V3 deferred policy and authority
    disposition: defer
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: The evidence supports a reviewable basic-plus-gym candidate now, but does not supply
      these distinct doses or originate Product/Trust/Operations/human authority.
    approval_effect:
    - Keep every literal not_accepted behavior unavailable.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_deferred_policy_and_authority
    evidence_claim_ids: []
rejected_alternatives:
- alternative: Reuse the accepted v2 approval for new strength, treadmill and low-trail-history prescriptions
  rationale: V2 explicitly deferred these modules and assumed history-rich terrain access; its decision
    does not authorize the new scope.
- alternative: Block all training when trail exposure is missing, or silently replace missing specialty
    with equivalent road/gym dose
  rationale: A distinct basic mode can provide bounded general running and gym value while retaining uncertainty
    and unsupported course-specific coverage.
- alternative: Treat missing descent as zero or fix sparse history by taking a positive-weeks-only median
  rationale: Both erase provenance or exposure frequency and can manufacture unsupported capacity or dose.
