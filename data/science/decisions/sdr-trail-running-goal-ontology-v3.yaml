applicability:
- Nonclinical adults with sufficient recent general running, single-day non-ultra performance goals
- Three resource contexts with explicit availability and complete known core inputs
- Basic proposals with clear specialty gaps; course-specific modules only when their independent inputs
  and history qualify
- Draft/offline review candidates only
user_facing_claim_limits:
- Do not call any count, window, set, repetition, rest, RIR, gradient or duration a validated safe dose
  or optimum.
- Do not promise a fourteen-day performance change, injury prevention, descent readiness, finish probability
  or equivalence between treadmill, gym, stairs and outdoor trail.
- A basic proposal with specialty limits is not a complete race-preparation or race-readiness verdict.
- Gym familiarity is an athlete statement, not observed dose history; resource presets are not athlete
  ability categories.
safety_implications:
- Current symptoms stop performance optimization without diagnosis or clearance.
- Absence of observed descent does not block supported basic work but cannot authorize new descent exposure.
- New strength and incline exposure remain separately bounded; no catch-up, failure training or target-gap
  escalation.
- Unsupported event scope and unapproved taper windows remain explicit.
privacy_implications:
- Use only closed context values, resource dates and owner-scoped source revisions; reject client observed-history
  assertions.
- Do not collect kilograms, 1RM, raw activity/GPS/provider payloads, free text or unnecessary clinical/profile
  details.
- Preserve unknown quantities and server-derived provenance.
validation_plan:
- Validate evidence/SDR schemas, citation identity reuse, per-source verification notes and complete decision-item
  coverage.
- Validate generated inactive JSON and review packets; candidate checks must reject every numeric, enum,
  provenance and date boundary escape.
- Replay all three presets; monthly clustered versus evenly spaced dates; zero-week median with genuine
  observations; unknown versus observed zero descent; unknown race descent; and cancelled/tentative access.
- Check three-running-plus-two-gym and limited three-plus-one feasibility, single-session days, rest spacing,
  weekly time and running-only intensity denominators.
- Reject runtime adoption/generation from any draft or inactive contract; review_valid must never be treated
  as eligible_proposal.
falsification_conditions:
- Any basic candidate requires positive weekly vertical or mandatory uphill quality despite this contract.
- Missing course/history descent becomes zero, or resource/athlete-stated context supplies observed exposure.
- Gym/treadmill is counted as outdoor descent or unapproved strength/vertical progression appears.
- A gym requirement is silently omitted, time/day constraints are exceeded, rest is compressed, or missed
  work is added later.
- Dose/gradient/RIR claims become guarantees or a draft review receipt authorizes live behavior.
