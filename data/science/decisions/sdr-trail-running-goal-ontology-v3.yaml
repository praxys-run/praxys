accepted_interpretation: 'Proposed interpretation, not accepted: Allow a new bounded resource context
  and basic-mode materiality while preserving distinct course demand, observed history, structured workout
  input and inactive authority. Exact behavior-driving numbers are new Praxys guardrails unless explicitly
  classified as published study context. The currently accepted v2 decisions and contracts remain unchanged
  and inactive. This draft permits review-only candidate validation and does not return runtime eligibility
  or authorize production execution.'
decision_review:
  reviewer_task: Review each action and deferral against the linked verified sources, uncertainty and
    exact inactive contract. The decision sheet is a proposal; no human approval is recorded.
  approval_statement: I approve the scientific interpretation and exact parameters in sdr-trail-running-goal-ontology-v3
    for preparation and review of an inactive v3 implementation. I understand that the proposed exercise,
    calendar and history values are guardrails rather than proven individual safe doses or performance
    guarantees. I do not approve runtime activation, production use, pilot, deployment, provider behavior
    or predecessor supersession.
  items:
  - id: v3-inherited-course-boundary
    title: V3 inherited course boundary
    disposition: approve
    question: Allow a new bounded resource context and basic-mode materiality while preserving distinct
      course demand, observed history, structured workout input and inactive authority.
    proposed_decision: Preserve the accepted course vocabulary and provenance without copying the v2 all-or-nothing
      materiality into the new basic mode.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
    parameter_names:
    - v3_inherited_course_boundary
    evidence_claim_ids:
    - trail-resource.resource-frequency-does-not-prove-capacity
    - trail-ontology.course-demand-is-multidimensional
    - non-ultra-trail.course-specific-policy-required
    - eligibility.recent-history-anchor-without-universal-threshold
  - id: v3-course-materiality
    title: V3 course materiality
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: A basic proposal organizes general running and bounded gym work while explicitly
      withholding unsupported race-specific coverage. Unknown race descent is distinct from absent descent
      history.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
      implementation.
    does_not_authorize:
    - Runtime activation, production data use, owner pilot, provider delivery, deployment, self-approval
      or lifecycle transition.
