    - trail-resource.resource-frequency-does-not-prove-capacity
  - id: v3-resource-context-schema
    title: V3 resource context schema
    disposition: approve
    question: Should this exact parameter group and its stated limits be adopted as the proposed v3 boundary?
    proposed_decision: These limits implement the proposed Architecture/Trust resource calendar and data-minimization
      boundary. Dates, payload limits and machine capabilities are structural constraints, not exercise
      dose or proof of access quality.
    approval_effect:
    - Bind only this exact scientific interpretation and parameter group for a separately reviewed inactive
