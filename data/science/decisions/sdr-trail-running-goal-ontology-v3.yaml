rejected_alternatives:
- alternative: Reuse the accepted v2 approval for new strength, treadmill and low-trail-history prescriptions
  rationale: V2 explicitly deferred these modules and assumed history-rich terrain access; its decision
    does not authorize the new scope.
- alternative: Block all training when trail exposure is missing, or silently replace missing specialty
    with equivalent road/gym dose
  rationale: A distinct basic mode can provide bounded general running and gym value while retaining uncertainty
    and unsupported course-specific coverage.
- alternative: Treat missing descent as zero or fix sparse history by taking a positive-weeks-only median
  rationale: Both erase provenance or exposure frequency and can manufacture unsupported capacity or dose.
