decision_notes:
  - This policy was accepted by github:dddtc2005 on 2026-08-10; it is not an implemented protocol or authorization to collect pilot data.
  - "The accepted policy is history-first: a new test is optional fallback evidence, not a prerequisite for every athlete."
  - No parameter in this accepted policy is presented as a published universal threshold; the candidate choice and retest interval are estimates, and product, freshness, comparability, safety, and no-test values are guardrails.
  - The exact warm-up script, environment tolerances, precision acceptance threshold, and pilot operations require pre-registration and a new reviewed policy before they can govern behavior.
  - Race goals, trail goals, treadmill goals, other distances, children, clinical testing, and return-to-sport remain outside the initial scope.
  - "Impact map: accepted Evidence Review -> accepted SDR -> future goal baseline policy -> future persistence/retention/access/deletion -> future ingestion and pure analysis -> future API -> future web type/UI and English/Chinese localization -> future miniapp parity -> future plugin/MCP parity -> future private telemetry/aggregate analytics -> future ScienceNote -> future tests -> prospective validation/falsification."
  - Existing draft Evidence Reviews and sdr-adaptive-plan-feasibility-and-adjustment-v1 remain unchanged and unaccepted.
