supersedes: []
superseded_by:
decision_notes:
  - This is a decision proposal for #640, not an accepted policy, implemented protocol, or authorization to collect pilot data.
  - No parameter in this proposal is presented as a published universal threshold; the candidate choice and retest interval are estimates, and product, freshness, comparability, safety, and no-test values are guardrails.
  - The exact warm-up script, environment tolerances, precision acceptance threshold, and pilot operations require pre-registration and human review before implementation.
  - Race goals, trail goals, treadmill goals, other distances, children, clinical testing, and return-to-sport remain outside the initial scope.
  - "Impact map: Evidence Review -> draft SDR -> future goal baseline policy -> future persistence/retention/access/deletion -> future ingestion and pure analysis -> future API -> future web type/UI and English/Chinese localization -> future miniapp parity -> future plugin/MCP parity -> future private telemetry/aggregate analytics -> future ScienceNote -> future tests -> prospective validation/falsification."
  - Existing draft Evidence Reviews and sdr-adaptive-plan-feasibility-and-adjustment-v1 remain unchanged and unaccepted.
