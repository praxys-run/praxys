approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
hooks = true
multi_agent = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false

[shell_environment_policy.filters]
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"ARM_*" = "exclude"
"GOOGLE_*" = "exclude"
"GCP_*" = "exclude"
"GCLOUD_*" = "exclude"
"OPENAI_*" = "exclude"
"ANTHROPIC_*" = "exclude"
"GITHUB_TOKEN" = "exclude"
"GH_TOKEN" = "exclude"
"COPILOT_*" = "exclude"
"*_PASSWORD*" = "exclude"
"*_CREDENTIAL*" = "exclude"
"DATABASE_URL" = "exclude"
"POSTGRES_*" = "exclude"
"GARMIN_*" = "exclude"
"STRAVA_*" = "exclude"
"OURA_*" = "exclude"
"STRYD_*" = "exclude"
"WECHAT_*" = "exclude"
"STATSIG_*" = "exclude"
"SMTP_*" = "exclude"
"RESEND_*" = "exclude"

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.6.0", "--headless", "--isolated", "--no-usage-statistics", "--no-performance-crux", "--redact-network-headers", "--screenshot-format=webp", "--screenshot-max-width=1600", "--screenshot-max-height=1200"]
enabled = false
required = false
enabled_tools = ["click", "drag", "fill", "fill_form", "handle_dialog", "hover", "press_key", "type_text", "close_page", "list_pages", "navigate_page", "new_page", "select_page", "wait_for", "emulate", "resize_page", "get_network_request", "list_network_requests", "evaluate_script", "get_console_message", "lighthouse_audit", "list_console_messages", "take_screenshot", "take_snapshot"]
env_vars = []

[mcp_servers.praxys-local]
command = "node"
args = ["scripts/run_praxys_mcp.cjs", "local"]
enabled = false
required = false
enabled_tools = ["get_daily_brief", "get_training_review", "get_race_forecast", "get_training_context", "get_settings", "get_sync_settings", "get_connections", "get_managed_plan_status", "get_sync_status", "whoami"]
env_vars = []

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"
enabled = false
required = false
enabled_tools = ["microsoft_docs_search", "microsoft_docs_fetch", "microsoft_code_sample_search"]
default_tools_approval_mode = "auto"

[mcp_servers.azure-mcp]
command = "npx"
args = ["-y", "@azure/mcp@2.0.5", "server", "start", "--mode", "all", "--read-only", "--tool", "azmcp_subscription_list", "--tool", "azmcp_group_list"]
enabled = false
required = false
enabled_tools = ["azmcp_subscription_list", "azmcp_group_list"]
env_vars = []
default_tools_approval_mode = "prompt"
