name: Pre-merge CI

# Unified pre-merge validation gate (issues #361 and #377). Runs independent
# backend and frontend checks on every PR targeting main so regressions are
# caught before merge and downstream review automation gets one completion
# event.
#
# `backend-tests` and `frontend-quality` are independent required contexts.
#
# Intentionally has NO `paths:` filter. This job is a *required* status check on
# main, and a required check that a path filter skips is reported as permanently
# "pending", which blocks the PR forever. Running every gate on every PR keeps
# the required context always-reporting and protects cross-surface changes.

on:
  pull_request:
    branches: [main]
    # `edited` reruns the UI evidence gate when an agent corrects the PR body
    # after rendered review, without requiring an empty source commit.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      test_mode:
        description: Backend execution mode (serial remains the default pending measured review)
        type: choice
        options: [serial, sharded, compare]
        default: serial
        required: true

# One in-flight run per PR; cancel the previous when new commits land.
concurrency:
  group: pre-merge-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: python-tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.test_mode == 'compare' && '[{"label":"serial","count":1,"index":0},{"label":"shard-0","count":2,"index":0},{"label":"shard-1","count":2,"index":1}]' || inputs.test_mode == 'sharded' && '[{"label":"shard-0","count":2,"index":0},{"label":"shard-1","count":2,"index":1}]' || '[{"label":"serial","count":1,"index":0}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Detect private Stryd client access
        id: stryd-client
        env:
          WHEEL_B64: ${{ secrets.STRYD_CLIENT_WHEEL_B64 }}
        run: |
          if [ -n "$WHEEL_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize private Stryd client
        if: steps.stryd-client.outputs.available == 'true'
        env:
          WHEEL_B64: ${{ secrets.STRYD_CLIENT_WHEEL_B64 }}
        run: |
          mkdir -p .private-deps
          printf '%s' "$WHEEL_B64" \
            | base64 --decode \
            > .private-deps/stryd_client-0.2.0-py3-none-any.whl
          echo "d5ecc8c14beafe1cf2df6e5021b0bee71094b15cf14dfc039f0652c8c9c030e4  .private-deps/stryd_client-0.2.0-py3-none-any.whl" \
            | sha256sum --check

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "${{ steps.stryd-client.outputs.available }}" = "true" ]; then
            pip install .private-deps/stryd_client-0.2.0-py3-none-any.whl
          fi

      - name: Run backend tests
        run: >-
          python scripts/ci_pytest.py --output-dir "$RUNNER_TEMP/pytest"
          --shard-count "${{ matrix.count }}" --shard-index "${{ matrix.index }}"

      - name: Retain backend test timing and completeness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-pytest-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.label }}
          path: ${{ runner.temp }}/pytest/
          retention-days: 30
          if-no-files-found: error

      - name: Validate selective-review promotions
        run: python scripts/validate_review_policy.py

      - name: Validate AI-native operations runbooks
        run: python scripts/validate_ops_runbooks.py

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build web bundle
        working-directory: web
        run: npm run build

  miniapp-legal:
    name: miniapp-legal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json

      - name: Install Miniapp synchronization dependencies
        working-directory: miniapp
        run: npm ci --no-audit --no-fund

      - name: Verify canonical Miniapp contract and generated sources
        working-directory: miniapp
        run: |
          npm run typecheck
          git diff --exit-code -- \
            types/api.ts \
            utils/i18n-catalog.ts \
            utils/legal.ts

      - name: Check miniapp pages, components, and source size
        working-directory: miniapp
        run: bash ../scripts/check_miniapp_source.sh

  ui-quality:
    name: ui-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check changed UI files and PR evidence
        if: github.event_name == 'pull_request'
        env:
          UI_PR_BODY: ${{ github.event.pull_request.body }}
          UI_DRAFT_EVIDENCE_FLAG: ${{ github.event.pull_request.draft && github.event.pull_request.user.login == 'Copilot' && '--allow-unverified-draft' || '' }}
        run: >-
          python scripts/check_ui_quality.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --pr-body-env UI_PR_BODY
          $UI_DRAFT_EVIDENCE_FLAG

      - name: Smoke-test the gate on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/check_ui_quality.py --base HEAD^ --head HEAD --skip-evidence

  frontend-quality:
    name: frontend-quality
    if: always()
    needs: [web-build, miniapp-legal, ui-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Require web build, legal sync, and UI quality
        env:
          WEB_RESULT: ${{ needs.web-build.result }}
          LEGAL_RESULT: ${{ needs.miniapp-legal.result }}
          UI_RESULT: ${{ needs.ui-quality.result }}
        run: |
          set -euo pipefail
          test "$WEB_RESULT" = "success"
          test "$LEGAL_RESULT" = "success"
          test "$UI_RESULT" = "success"

  backend-tests:
    name: backend-tests
    if: always()
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require backend tests
        env:
          PYTHON_RESULT: ${{ needs.python-tests.result }}
        run: |
          set -euo pipefail
          test "$PYTHON_RESULT" = "success"

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download only this run and attempt's backend evidence
        uses: actions/download-artifact@v8
        with:
          pattern: backend-pytest-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/backend-evidence
      - name: Require complete same-head backend execution evidence
        env:
          TEST_MODE: ${{ inputs.test_mode || 'serial' }}
        run: >-
          python scripts/verify_ci_pytest.py
          --artifacts "$RUNNER_TEMP/backend-evidence" --mode "$TEST_MODE"
          --expected-sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/backend-verification.json"
      - name: Retain backend verification result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-verification.json
          retention-days: 30
          if-no-files-found: warn
