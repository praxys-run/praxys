name: Selective review issue guard

on:
  issues:
    types: [closed, reopened, assigned, unassigned, labeled, unlabeled, transferred]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: selective-review-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      pr_numbers: ${{ steps.linked.outputs.pr_numbers }}
    steps:
      - name: Find linked open pull requests
        id: linked
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          timeline="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/timeline?per_page=100" \
              --paginate --slurp
          )"
          pull_prefix="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/"
          pr_numbers="$(
            jq -r --arg prefix "$pull_prefix" \
              '.[][] | select(.event == "cross-referenced") | .source.issue | select((.pull_request.url // "") | startswith($prefix)) | .number' \
              <<< "$timeline" |
              sort -u
          )"
          open_prs=()
          while IFS= read -r pr_number; do
            [[ -n "$pr_number" ]] || continue
            state="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq .state
            )"
            [[ "$state" == "open" ]] || continue
            open_prs+=("$pr_number")
          done <<< "$pr_numbers"
          printf '%s\n' "${open_prs[@]}" |
            jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)' \
            > "$RUNNER_TEMP/linked-prs.json"
          echo "pr_numbers=$(cat "$RUNNER_TEMP/linked-prs.json")" >> "$GITHUB_OUTPUT"

  reevaluate:
    needs: discover
    if: needs.discover.outputs.pr_numbers != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.discover.outputs.pr_numbers) }}
    concurrency:
      group: selective-review-${{ matrix.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Mark issue invalidation pending
        id: gate-status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha
          )"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state=pending \
            -f context=selective-review-policy \
            -f description="Linked issue changed; selective review must reevaluate." \
            --silent

      - name: Dispatch reevaluation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ matrix.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run selective-review.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUMBER"
