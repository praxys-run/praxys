name: Deploy Backend to Azure App Service

on:
  workflow_dispatch:
    inputs:
      sync_config:
        description: Reconcile App Service settings, telemetry, and alerts
        required: true
        default: true
        type: boolean
      run_tests:
        description: Run the full backend suite before deploying
        required: true
        default: false
        type: boolean
      recover_dfa_cutover_842:
        description: One authorized incident recovery attempt for the pre-repair PR842 source
        required: true
        default: false
        type: boolean
      recover_readiness_timing_00577:
        description: One separately authorized diagnostic delivery from exact PR845 source
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'analysis/**'
      - 'sync/**'
      - 'db/**'
      - 'alembic/**'
      - 'config/agent-loop-policies.json'
      - 'data/science/**'
      - 'requirements.txt'
      - 'scripts/appinsights_boundary.sh'
      - 'scripts/provision_labs_worker_db.py'
      - '.github/azure-observability.env'
      - '.github/workflows/deploy-backend.yml'

concurrency:
  # Backend deploys are state-preserving; emergency China disable must never
  # wait behind or be replaced by this deployment queue.
  group: praxys-backend-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main' && inputs.run_tests == true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Materialize private Stryd client
        env:
          WHEEL_B64: ${{ secrets.STRYD_CLIENT_WHEEL_B64 }}
        run: |
          if [ -z "$WHEEL_B64" ]; then
            echo "::error::STRYD_CLIENT_WHEEL_B64 is required for backend deployment"
            exit 1
          fi
          mkdir -p .private-deps
          printf '%s' "$WHEEL_B64" \
            | base64 --decode \
            > .private-deps/stryd_client-0.2.0-py3-none-any.whl
          echo "d5ecc8c14beafe1cf2df6e5021b0bee71094b15cf14dfc039f0652c8c9c030e4  .private-deps/stryd_client-0.2.0-py3-none-any.whl" \
            | sha256sum --check
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install .private-deps/stryd_client-0.2.0-py3-none-any.whl
      - name: Run tests
        run: python -m pytest tests/ -v

  deploy:
    needs: test
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_BACKEND_APP_NAME: trainsight-app
      AZURE_RESOURCE_GROUP: rg-trainsight
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine deployment mode
        id: mode
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SYNC_CONFIG_INPUT: ${{ inputs.sync_config }}
        run: |
          set -euo pipefail
          sync_config=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            sync_config="${SYNC_CONFIG_INPUT:-false}"
          elif [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            if [[ ! "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ ||
                  "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              sync_config=true
            else
              changed_files="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")"
              if grep -Eq \
                '^(\.github/azure-observability\.env|\.github/workflows/deploy-backend\.yml|scripts/appinsights_boundary\.sh)$' \
                <<< "${changed_files}"; then
                sync_config=true
              fi
            fi
          fi
          echo "sync_config=${sync_config}" >> "$GITHUB_OUTPUT"
          echo "Reconcile Azure configuration: ${sync_config}"

      - name: Load observability resource names
        shell: bash
        run: cat .github/azure-observability.env >> "$GITHUB_ENV"

      - name: Stamp build version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^api-([0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]{1,4})$ ]]; then
              echo "::error::API release tag is not an exact supported CalVer tag."
              exit 1
            fi
            VERSION="${BASH_REMATCH[1]}"
          else
            [[ "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]]
            VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "${VERSION}" > api/_build_version.txt
          echo "${GITHUB_SHA}" > api/_build_sha.txt
          echo "PRAXYS_EXPECTED_API_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PRAXYS_EXPECTED_API_SOURCE_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Materialize private Stryd client for Oryx
        env:
          WHEEL_B64: ${{ secrets.STRYD_CLIENT_WHEEL_B64 }}
        run: |
          if [ -z "$WHEEL_B64" ]; then
            echo "::error::STRYD_CLIENT_WHEEL_B64 is required for backend deployment"
            exit 1
          fi
          mkdir -p .private-deps
          wheel=".private-deps/stryd_client-0.2.0-py3-none-any.whl"
          printf '%s' "$WHEEL_B64" | base64 --decode > "$wheel"
          echo "d5ecc8c14beafe1cf2df6e5021b0bee71094b15cf14dfc039f0652c8c9c030e4  $wheel" \
            | sha256sum --check
          printf '\n%s\n' "$wheel" >> requirements.txt

      - name: Azure Login (OIDC)
        id: azure_login
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Capture state preserved by deployment
        id: preserved
        env:
          SYNC_CONFIG: ${{ steps.mode.outputs.sync_config }}
          CONFIGURED_FEEDBACK_PUBLICATION: ${{ vars.PRAXYS_ENABLE_FEEDBACK_PUBLICATION || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az webapp config appsettings list \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" -o json)"
          read_setting() {
            jq -er --arg name "$1" \
              '[.[] | select(.name == $name) | .value]
               | if length == 1 then .[0] else error("setting not singular") end' \
              <<< "${settings}"
          }
          cn_disabled="$(read_setting PRAXYS_DISABLE_CN_PROCESSING)"
          miniapp_values="$(jq -c '[.[] | select(
            .name == "PRAXYS_DISABLE_MINIAPP_PROCESSING") | .value]' \
            <<< "${settings}")"
          case "$(jq length <<< "${miniapp_values}")" in
            0)
              miniapp_disabled=false
              miniapp_configured=false
              ;;
            1)
              miniapp_disabled="$(jq -er '.[0]' <<< "${miniapp_values}")"
              miniapp_configured=true
              ;;
            *)
              echo "::error::PRAXYS_DISABLE_MINIAPP_PROCESSING is duplicated."
              exit 1
              ;;
          esac
          ai_disabled="$(read_setting PRAXYS_DISABLE_BACKGROUND_AI)"
          feedback_publication_positive_values="$(jq -c '[.[] | select(
            .name == "PRAXYS_ENABLE_FEEDBACK_PUBLICATION") | .value]' \
            <<< "${settings}")"
          case "$(jq length <<< "${feedback_publication_positive_values}")" in
            0)
              feedback_publication_positive=false
              ;;
            1)
              feedback_publication_positive="$(jq -er '.[0]' \
                <<< "${feedback_publication_positive_values}")"
              ;;
            *)
              echo "::error::PRAXYS_ENABLE_FEEDBACK_PUBLICATION is duplicated."
              exit 1
              ;;
          esac
          feedback_publication_disabled="$(
            read_setting PRAXYS_DISABLE_FEEDBACK_PUBLICATION
          )"
          [[ "${cn_disabled}" == "true" || "${cn_disabled}" == "false" ]]
          [[ "${miniapp_disabled}" == "true" \
            || "${miniapp_disabled}" == "false" ]]
          [[ "${ai_disabled}" == "true" || "${ai_disabled}" == "false" ]]
          [[ "${feedback_publication_positive}" == "true" \
            || "${feedback_publication_positive}" == "false" ]]
          [[ "${feedback_publication_disabled}" == "true" \
            || "${feedback_publication_disabled}" == "false" ]]
          [[ "${CONFIGURED_FEEDBACK_PUBLICATION}" == "true" \
            || "${CONFIGURED_FEEDBACK_PUBLICATION}" == "false" ]]
          feedback_publication_restore="${feedback_publication_positive}"
          if [[ "${SYNC_CONFIG}" == "true" ]]; then
            feedback_publication_restore="${CONFIGURED_FEEDBACK_PUBLICATION}"
          fi
          cors="$(az webapp cors show \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query allowedOrigins -o json)"
          jq -e 'type == "array"' <<< "${cors}" >/dev/null
          {
            echo "cn_disabled=${cn_disabled}"
            echo "miniapp_disabled=${miniapp_disabled}"
            echo "miniapp_configured=${miniapp_configured}"
            echo "ai_disabled=${ai_disabled}"
            echo "feedback_publication_restore=${feedback_publication_restore}"
            echo "feedback_publication_original=${feedback_publication_positive}"
            echo "cors=$(jq -c sort <<< "${cors}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Quiesce feedback publication before deployment
        timeout-minutes: ${{ (inputs.recover_dfa_cutover_842 == true || inputs.recover_readiness_timing_00577 == true) && 9 || 5 }}
        env:
          RECOVER_DFA_CUTOVER_842: ${{ inputs.recover_dfa_cutover_842 == true && 'true' || 'false' }}
          RECOVER_READINESS_TIMING_00577: ${{ inputs.recover_readiness_timing_00577 == true && 'true' || 'false' }}
          ORIGINAL_FEEDBACK_PUBLICATION: ${{ steps.preserved.outputs.feedback_publication_original }}
          SYNC_CONFIG: ${{ steps.mode.outputs.sync_config }}
          CONFIGURED_FEEDBACK_PUBLICATION: ${{ vars.PRAXYS_ENABLE_FEEDBACK_PUBLICATION || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          attempts=36
          [[ "${RECOVER_DFA_CUTOVER_842}" == "true" || "${RECOVER_DFA_CUTOVER_842}" == "false" ]]
          [[ "${RECOVER_READINESS_TIMING_00577}" == "true" || "${RECOVER_READINESS_TIMING_00577}" == "false" ]]
          if [[ "${RECOVER_DFA_CUTOVER_842}" == "true" && "${RECOVER_READINESS_TIMING_00577}" == "true" ]]; then
            exit 1
          fi
          recovery=false
          if [[ "${RECOVER_DFA_CUTOVER_842}" == "true" || "${RECOVER_READINESS_TIMING_00577}" == "true" ]]; then
            recovery=true
            [[ "${GITHUB_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            {
              echo "### Incident recovery ir-dfa-readiness-recovery-20260928"
              echo "Dispatch run: ${GITHUB_RUN_ID}; attempt: ${GITHUB_RUN_ATTEMPT}"
              echo "Selected option: PR842=${RECOVER_DFA_CUTOVER_842}; timing00577=${RECOVER_READINESS_TIMING_00577}"
              echo "This request consumes the one-off authorization even on failure or ambiguous completion."
            } >> "${GITHUB_STEP_SUMMARY}"
            test "${GITHUB_EVENT_NAME}" = workflow_dispatch
            test "${GITHUB_REF}" = refs/heads/main
            test "${GITHUB_RUN_ATTEMPT}" = 1
            test "${SYNC_CONFIG}" = true
            test "${CONFIGURED_FEEDBACK_PUBLICATION}" = true
            incident_source=bafd1714df108747758bd58273578be3613b7bd0
            if [[ "${RECOVER_READINESS_TIMING_00577}" == "true" ]]; then
              test "${ORIGINAL_FEEDBACK_PUBLICATION}" = true
              incident_source=00577ce859ff90bbdf50a90e8ba00c4822243ec4
            fi
            incident_version="$(curl -fsS --connect-timeout 5 --max-time 8 \
              -H 'Cache-Control: no-cache' https://api.praxys.run/api/version)"
            jq -e --arg source "${incident_source}" '.source_sha == $source' \
              <<< "${incident_version}" >/dev/null
            attempts=2
          else
            test "${RECOVER_DFA_CUTOVER_842}" = false
          fi
          az webapp config appsettings set \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --settings "PRAXYS_ENABLE_FEEDBACK_PUBLICATION=false" \
            --output none
          settings="$(az webapp config appsettings list \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" -o json)"
          read_setting() {
            jq -er --arg name "$1" \
              '[.[] | select(.name == $name) | .value]
               | if length == 1 then .[0] else error("setting not singular") end' \
              <<< "${settings}"
          }
          test "$(read_setting PRAXYS_ENABLE_FEEDBACK_PUBLICATION)" = false
          kill_switch="$(read_setting PRAXYS_DISABLE_FEEDBACK_PUBLICATION)"
          [[ "${kill_switch}" == "true" || "${kill_switch}" == "false" ]]
          quiesced=false
          for ((attempt=1; attempt<=attempts; attempt++)); do
            if [[ "${recovery}" == "true" ]]; then
              if ! ready_payload="$(curl -fsS --connect-timeout 5 --max-time 210 \
                -H 'Cache-Control: no-cache' \
                https://api.praxys.run/api/health/ready 2>/dev/null)"; then
                if [[ "${attempt}" -lt "${attempts}" ]]; then
                  sleep 5
                fi
                continue
              fi
            else
              ready_payload="$(curl -fsS --max-time 8 \
                -H 'Cache-Control: no-cache' \
                https://api.praxys.run/api/health/ready 2>/dev/null || true)"
            fi
            if jq -e \
              '.status == "ready"
               and .optional_processing.feedback_publication_positive_enable
                 == false
               and (.optional_processing.feedback_publication_kill_switch
                 | type == "boolean")
               and .optional_processing.feedback_publication_enabled == false' \
              <<< "${ready_payload}" >/dev/null 2>&1; then
              quiesced=true
              break
            fi
            if [[ "${recovery}" == "false" || "${attempt}" -lt "${attempts}" ]]; then
              sleep 5
            fi
          done
          test "${quiesced}" = true

      - name: Validate production deployment settings
        if: steps.mode.outputs.sync_config == 'true'
        env:
          PRAXYS_LABS_EXECUTION_MODE: ${{ vars.PRAXYS_LABS_EXECUTION_MODE || 'inline' }}
          PRAXYS_LABS_WORKER_DEPLOY_ENABLED: ${{ vars.PRAXYS_LABS_WORKER_DEPLOY_ENABLED || 'false' }}
          PRAXYS_ENABLE_FEEDBACK_PUBLICATION: ${{ vars.PRAXYS_ENABLE_FEEDBACK_PUBLICATION || 'false' }}
          WECHAT_MINIAPP_APPID: ${{ secrets.WECHAT_MINIAPP_APPID }}
          WECHAT_MINIAPP_SECRET: ${{ secrets.WECHAT_MINIAPP_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WECHAT_MINIAPP_APPID}" \
                && -z "${WECHAT_MINIAPP_SECRET}" ]] \
            || [[ -z "${WECHAT_MINIAPP_APPID}" \
                  && -n "${WECHAT_MINIAPP_SECRET}" ]]; then
            echo "::error::Set both WeChat Miniapp secrets or neither."
            exit 1
          fi
          if [[ "${PRAXYS_LABS_EXECUTION_MODE}" == "service_bus" \
                && "${PRAXYS_LABS_WORKER_DEPLOY_ENABLED}" != "true" ]]; then
            echo "::error::service_bus mode requires the Labs worker deployment gate."
            exit 1
          fi
          [[ "${PRAXYS_LABS_EXECUTION_MODE}" == "inline" ||
             "${PRAXYS_LABS_EXECUTION_MODE}" == "service_bus" ||
             "${PRAXYS_LABS_EXECUTION_MODE}" == "disabled" ]]
          [[ "${PRAXYS_ENABLE_FEEDBACK_PUBLICATION}" == "true" \
            || "${PRAXYS_ENABLE_FEEDBACK_PUBLICATION}" == "false" ]]

      - name: Enforce backend telemetry trust boundary
        if: steps.mode.outputs.sync_config == 'true'
        shell: bash
        run: bash scripts/appinsights_boundary.sh backend-preflight

      - name: Sync App Service settings
        if: steps.mode.outputs.sync_config == 'true'
        env:
          AZURE_AI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          KEY_VAULT_URL: ${{ vars.KEY_VAULT_URL }}
          KEY_VAULT_KEY_NAME: ${{ vars.KEY_VAULT_KEY_NAME }}
          PRAXYS_JWT_SECRET: ${{ secrets.PRAXYS_JWT_SECRET }}
          STATSIG_SDK_KEY: ${{ secrets.STATSIG_SDK_KEY }}
          STATSIG_ENV: ${{ vars.STATSIG_ENV || 'production' }}
          PRAXYS_DATABASE_URL: ${{ secrets.PRAXYS_DATABASE_URL }}
          PRAXYS_DB_AUTH: ${{ vars.PRAXYS_DB_AUTH }}
          PRAXYS_LABS_EXECUTION_MODE: ${{ vars.PRAXYS_LABS_EXECUTION_MODE || 'inline' }}
          PRAXYS_LABS_SERVICE_BUS_CLIENT_ID: ${{ vars.PRAXYS_LABS_SERVICE_BUS_CLIENT_ID }}
          PRAXYS_GARMIN_PLAN_DELIVERY_ENABLED: ${{ vars.PRAXYS_GARMIN_PLAN_DELIVERY_ENABLED || 'false' }}
          WECHAT_MINIAPP_APPID: ${{ secrets.WECHAT_MINIAPP_APPID }}
          WECHAT_MINIAPP_SECRET: ${{ secrets.WECHAT_MINIAPP_SECRET }}
          PRAXYS_GITHUB_APP_ID: ${{ vars.PRAXYS_GITHUB_APP_ID }}
          PRAXYS_GITHUB_APP_INSTALLATION_ID: ${{ vars.PRAXYS_GITHUB_APP_INSTALLATION_ID }}
          PRAXYS_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PRAXYS_GITHUB_APP_PRIVATE_KEY }}
          PRAXYS_FEEDBACK_GITHUB_REPO: ${{ vars.PRAXYS_FEEDBACK_GITHUB_REPO }}
          PRAXYS_FEEDBACK_GITHUB_LABELS: ${{ vars.PRAXYS_FEEDBACK_GITHUB_LABELS }}
          PRAXYS_FEEDBACK_GITHUB_ASSIGNEES: ${{ vars.PRAXYS_FEEDBACK_GITHUB_ASSIGNEES }}
          PRAXYS_AGENT_READY_SHADOW: ${{ vars.PRAXYS_AGENT_READY_SHADOW }}
          PRAXYS_AGENT_READY_CHALLENGER_PROMPT_VERSION: ${{ vars.PRAXYS_AGENT_READY_CHALLENGER_PROMPT_VERSION }}
          PRAXYS_FEEDBACK_BLOB_ACCOUNT_URL: ${{ vars.PRAXYS_FEEDBACK_BLOB_ACCOUNT_URL }}
          PRAXYS_FEEDBACK_BLOB_CONTAINER: ${{ vars.PRAXYS_FEEDBACK_BLOB_CONTAINER }}
          PRAXYS_SMTP_HOST: ${{ vars.PRAXYS_SMTP_HOST }}
          PRAXYS_SMTP_PORT: ${{ vars.PRAXYS_SMTP_PORT }}
          PRAXYS_SMTP_USER: ${{ vars.PRAXYS_SMTP_USER }}
          PRAXYS_SMTP_PASSWORD: ${{ secrets.PRAXYS_SMTP_PASSWORD }}
          PRAXYS_SMTP_FROM: ${{ vars.PRAXYS_SMTP_FROM }}
          PRAXYS_SMTP_STARTTLS: ${{ vars.PRAXYS_SMTP_STARTTLS }}
          PRAXYS_APP_BASE_URL: ${{ vars.PRAXYS_APP_BASE_URL }}
          PRESERVED_MINIAPP_DISABLED: ${{ steps.preserved.outputs.miniapp_disabled }}
          PRESERVED_MINIAPP_CONFIGURED: ${{ steps.preserved.outputs.miniapp_configured }}
        shell: bash
        run: |
          set -euo pipefail
          for var in AZURE_AI_ENDPOINT KEY_VAULT_URL KEY_VAULT_KEY_NAME \
                     APPLICATIONINSIGHTS_CONNECTION_STRING BACKEND_APPINSIGHTS_RESOURCE_ID \
                     PRAXYS_JWT_SECRET; do
            [[ -n "${!var}" ]] || exit 1
          done
          LABS_SERVICE_BUS_FQDN=""
          LABS_SERVICE_BUS_QUEUE="labs-environment-response"
          if [[ "${PRAXYS_LABS_EXECUTION_MODE}" == "service_bus" ]]; then
            LABS_SERVICE_BUS_NAMESPACE="$(
              az servicebus namespace list \
                --resource-group "${AZURE_RESOURCE_GROUP}" \
                --query "[?tags.praxysComponent=='labs-analysis'].name | [0]" \
                -o tsv
            )"
            if [[ -z "${LABS_SERVICE_BUS_NAMESPACE}" ]]; then
              echo "::error::service_bus mode requires the deployed Labs namespace."
              exit 1
            fi
            LABS_SERVICE_BUS_FQDN="${LABS_SERVICE_BUS_NAMESPACE}.servicebus.windows.net"
          elif [[ "${PRAXYS_LABS_EXECUTION_MODE}" != "inline" \
                  && "${PRAXYS_LABS_EXECUTION_MODE}" != "disabled" ]]; then
            echo "::error::Invalid PRAXYS_LABS_EXECUTION_MODE."
            exit 1
          fi
          app_settings=(
            "AZURE_AI_ENDPOINT=${AZURE_AI_ENDPOINT}"
            "KEY_VAULT_URL=${KEY_VAULT_URL}"
            "KEY_VAULT_KEY_NAME=${KEY_VAULT_KEY_NAME}"
            "PRAXYS_JWT_SECRET=${PRAXYS_JWT_SECRET}"
            "STATSIG_SDK_KEY=${STATSIG_SDK_KEY}"
            "STATSIG_ENV=${STATSIG_ENV}"
            "PRAXYS_DATABASE_URL=${PRAXYS_DATABASE_URL}"
            "PRAXYS_DB_AUTH=${PRAXYS_DB_AUTH}"
            "PRAXYS_LABS_EXECUTION_MODE=${PRAXYS_LABS_EXECUTION_MODE}"
            "PRAXYS_LABS_SERVICE_BUS_FQDN=${LABS_SERVICE_BUS_FQDN}"
            "PRAXYS_LABS_SERVICE_BUS_QUEUE=${LABS_SERVICE_BUS_QUEUE}"
            "PRAXYS_LABS_SERVICE_BUS_CLIENT_ID=${PRAXYS_LABS_SERVICE_BUS_CLIENT_ID}"
            "PRAXYS_GARMIN_PLAN_DELIVERY_ENABLED=${PRAXYS_GARMIN_PLAN_DELIVERY_ENABLED}"
            "PRAXYS_GITHUB_APP_ID=${PRAXYS_GITHUB_APP_ID}"
            "PRAXYS_GITHUB_APP_INSTALLATION_ID=${PRAXYS_GITHUB_APP_INSTALLATION_ID}"
            "PRAXYS_GITHUB_APP_PRIVATE_KEY=${PRAXYS_GITHUB_APP_PRIVATE_KEY}"
            "PRAXYS_FEEDBACK_GITHUB_REPO=${PRAXYS_FEEDBACK_GITHUB_REPO}"
            "PRAXYS_FEEDBACK_GITHUB_LABELS=${PRAXYS_FEEDBACK_GITHUB_LABELS}"
            "PRAXYS_FEEDBACK_GITHUB_ASSIGNEES=${PRAXYS_FEEDBACK_GITHUB_ASSIGNEES}"
            "PRAXYS_FEEDBACK_AUTOFILE_WITHOUT_AI=false"
            "PRAXYS_AGENT_READY_SHADOW=${PRAXYS_AGENT_READY_SHADOW}"
            "PRAXYS_AGENT_READY_CHALLENGER_PROMPT_VERSION=${PRAXYS_AGENT_READY_CHALLENGER_PROMPT_VERSION}"
            "PRAXYS_FEEDBACK_BLOB_ACCOUNT_URL=${PRAXYS_FEEDBACK_BLOB_ACCOUNT_URL}"
            "PRAXYS_FEEDBACK_BLOB_CONTAINER=${PRAXYS_FEEDBACK_BLOB_CONTAINER}"
            "PRAXYS_SMTP_HOST=${PRAXYS_SMTP_HOST}"
            "PRAXYS_SMTP_PORT=${PRAXYS_SMTP_PORT}"
            "PRAXYS_SMTP_USER=${PRAXYS_SMTP_USER}"
            "PRAXYS_SMTP_PASSWORD=${PRAXYS_SMTP_PASSWORD}"
            "PRAXYS_SMTP_FROM=${PRAXYS_SMTP_FROM}"
            "PRAXYS_SMTP_STARTTLS=${PRAXYS_SMTP_STARTTLS}"
            "PRAXYS_APP_BASE_URL=${PRAXYS_APP_BASE_URL}"
            "WEBSITES_PORT=8000"
            "DATA_DIR=/home/data"
            "SCM_DO_BUILD_DURING_DEPLOYMENT=true"
            "WEBSITE_HTTPLOGGING_RETENTION_DAYS=3"
          )
          if [[ "${PRESERVED_MINIAPP_CONFIGURED}" == "false" ]]; then
            app_settings+=("PRAXYS_DISABLE_MINIAPP_PROCESSING=false")
          fi
          if [[ -n "${WECHAT_MINIAPP_APPID}" ]]; then
            app_settings+=(
              "WECHAT_MINIAPP_APPID=${WECHAT_MINIAPP_APPID}"
              "WECHAT_MINIAPP_SECRET=${WECHAT_MINIAPP_SECRET}"
            )
          fi
          az webapp config appsettings set \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --settings "${app_settings[@]}" \
            --output none
          az webapp config set \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --always-on true

      - name: Verify production runtime controls
        shell: bash
        run: |
          set -euo pipefail
          settings="$(az webapp config appsettings list \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" -o json)"
          read_setting() {
            jq -er --arg name "$1" \
              '[.[] | select(.name == $name) | .value]
               | if length == 1 then .[0] else error("setting not singular") end' \
              <<< "${settings}"
          }
          labs_mode="$(read_setting PRAXYS_LABS_EXECUTION_MODE)"
          [[ "${labs_mode}" == "inline" \
            || "${labs_mode}" == "service_bus" \
            || "${labs_mode}" == "disabled" ]]
          [[ "$(read_setting PRAXYS_DISABLE_MINIAPP_PROCESSING)" \
            == "true" || "$(read_setting PRAXYS_DISABLE_MINIAPP_PROCESSING)" \
            == "false" ]]
          feedback_publication_kill="$(
            read_setting PRAXYS_DISABLE_FEEDBACK_PUBLICATION
          )"
          [[ "${feedback_publication_kill}" == "true" \
            || "${feedback_publication_kill}" == "false" ]]
          test "$(read_setting PRAXYS_ENABLE_FEEDBACK_PUBLICATION)" = false

      - name: Cut over backend telemetry and alerts
        if: steps.mode.outputs.sync_config == 'true'
        shell: bash
        run: bash scripts/appinsights_boundary.sh backend-cutover

      - name: Wait for App Service deployment endpoint to settle
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          sleep 90
          stable_probes=0
          for _ in {1..12}; do
            if timeout 20s az webapp log deployment list \
              --name "${AZURE_BACKEND_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query "[0].id" -o tsv 2>/dev/null | grep -q .; then
              stable_probes=$((stable_probes + 1))
              (( stable_probes >= 3 )) && exit 0
            else
              stable_probes=0
            fi
            sleep 10
          done
          exit 1

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_BACKEND_APP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Verify deployed backend cutover
        id: live
        timeout-minutes: 10
        env:
          EXPECTED_CN_DISABLED: ${{ steps.preserved.outputs.cn_disabled }}
          EXPECTED_AI_DISABLED: ${{ steps.preserved.outputs.ai_disabled }}
          EXPECTED_MINIAPP_DISABLED: ${{ steps.preserved.outputs.miniapp_disabled }}
          EXPECTED_CORS: ${{ steps.preserved.outputs.cors }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_ready() {
            version_payload="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' https://api.praxys.run/api/version 2>/dev/null || true)"
            ready_payload="$(curl -fsS --max-time 8 -H 'Cache-Control: no-cache' https://api.praxys.run/api/health/ready 2>/dev/null || true)"
            jq -e \
              --arg version "${PRAXYS_EXPECTED_API_VERSION}" \
              --arg sha "${PRAXYS_EXPECTED_API_SOURCE_SHA}" \
              '.version == $version and .source_sha == $sha' \
              <<< "${version_payload}" >/dev/null 2>&1 \
            && jq -e \
                --argjson expectedCnDisabled "${EXPECTED_CN_DISABLED}" \
                --argjson expectedMiniappDisabled "${EXPECTED_MINIAPP_DISABLED}" \
                --argjson expectedAiDisabled "${EXPECTED_AI_DISABLED}" \
                '.status == "ready"
                 and (.china_processing.enabled | type == "boolean")
                 and (.china_processing.disabled | type == "boolean")
                 and .china_processing.disabled == $expectedCnDisabled
                 and .china_processing.enabled == ($expectedCnDisabled | not)
                 and (.china_processing.enabled
                   == (.china_processing.disabled | not))
                 and .miniapp_processing.disabled == $expectedMiniappDisabled
                 and .miniapp_processing.enabled == ($expectedMiniappDisabled | not)
                 and (.optional_processing.background_ai_enabled
                   | type == "boolean")
                 and (.optional_processing.background_ai_kill_switch
                   | type == "boolean")
                 and .optional_processing.background_ai_kill_switch
                   == $expectedAiDisabled
                 and .optional_processing.background_ai_enabled
                   == ($expectedAiDisabled | not)
                 and (.optional_processing.background_ai_enabled
                   == (.optional_processing.background_ai_kill_switch
                     | not))
                 and .optional_processing.feedback_publication_positive_enable
                   == false
                 and (.optional_processing.feedback_publication_kill_switch
                   | type == "boolean")
                 and .optional_processing.feedback_publication_enabled
                   == false' \
                <<< "${ready_payload}" >/dev/null 2>&1
          }
          ready=false
          for _ in {1..6}; do
            if deployment_ready; then
              ready=true
              break
            fi
            sleep 10
          done
          if [[ "${ready}" != "true" ]]; then
            az webapp restart \
              --name "${AZURE_BACKEND_APP_NAME}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --only-show-errors
            for _ in {1..30}; do
              if deployment_ready; then
                ready=true
                break
              fi
              sleep 5
            done
          fi
          test "${ready}" = true
          settings="$(az webapp config appsettings list \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" -o json)"
          read_setting() {
            jq -er --arg name "$1" \
              '[.[] | select(.name == $name) | .value]
               | if length == 1 then .[0] else error("setting not singular") end' \
              <<< "${settings}"
          }
          test "$(read_setting PRAXYS_DISABLE_CN_PROCESSING)" \
            = "${EXPECTED_CN_DISABLED}"
          test "$(read_setting PRAXYS_DISABLE_BACKGROUND_AI)" \
            = "${EXPECTED_AI_DISABLED}"
          publication_kill="$(
            read_setting PRAXYS_DISABLE_FEEDBACK_PUBLICATION
          )"
          [[ "${publication_kill}" == "true" \
            || "${publication_kill}" == "false" ]]
          test "$(read_setting PRAXYS_ENABLE_FEEDBACK_PUBLICATION)" = false
          cors="$(az webapp cors show \
            --name "${AZURE_BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query allowedOrigins -o json)"
          test "$(jq -c sort <<< "${cors}")" = "${EXPECTED_CORS}"
          {
            echo "readiness=ready"
            echo "cn_enabled=$(jq -r .china_processing.enabled \
              <<< "${ready_payload}")"
            echo "miniapp_enabled=$(jq -r .miniapp_processing.enabled \
              <<< "${ready_payload}")"
            echo "ai_enabled=$(jq -r \
              .optional_processing.background_ai_enabled \
              <<< "${ready_payload}")"
            echo "ai_kill_switch=$(jq -r \
              .optional_processing.background_ai_kill_switch \
              <<< "${ready_payload}")"
            echo "feedback_publication_positive=false"
            echo "feedback_publication_kill_switch=${publication_kill}"
            echo "feedback_publication_enabled=false"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore reviewed feedback publication after verified cutover
        id: publication
        timeout-minutes: 8
        env:
          DESIRED_FEEDBACK_PUBLICATION: ${{ steps.preserved.outputs.feedback_publication_restore }}
        shell: bash
        run: |
          set -euo pipefail
          read -r PRAXYS_RESTORE_STARTED _ < /proc/uptime
          export PRAXYS_RESTORE_STARTED
          # Independent watchdog includes interpreter startup; runner timeout is not cleanup.
          exec timeout --signal=KILL 465s python3 - <<'PY'
          """Bounded restoration; no remote write is made certain by a local timeout."""
          import json
          import os
          import selectors
          import signal
          import subprocess
          import tempfile
          import time

          WORK_SECONDS = 360
          CLEANUP_SECONDS = 105
          END_SECONDS = 465
          GRACE_SECONDS = 2
          LOCAL_RESERVE_SECONDS = 1
          MAX_CAPTURE_BYTES = 262144
          WRITE_SECONDS = 45
          READ_SECONDS = 20
          HTTP_SECONDS = 8
          PREDICATE_SECONDS = 2
          OUTPUT_SECONDS = 5
          GAP_SECONDS = 5


          class Failure(Exception):
              def __init__(self, code=1):
                  self.code = code


          def now():
              return time.clock_gettime(time.CLOCK_BOOTTIME)


          started = float(os.environ['PRAXYS_RESTORE_STARTED'])
          phase_deadline = started + WORK_SECONDS
          hard_deadline = started + END_SECONDS
          expired = False
          conflicting_write = False
          mutation_started = False
          cleanup_started = False
          verified = False
          observation = 'unknown'
          original_failure = 1


          def emit(phase, *, outcome, elapsed_ms=0, exit_class=None):
              # Bounded enum metadata only. Never print provider responses or exceptions.
              payload = json.dumps({'phase': phase, 'outcome': outcome,
                                    'elapsed_ms': max(0, int(elapsed_ms)),
                                    'exit_class': exit_class}) + '\n'
              try:
                  os.set_blocking(1, False)
                  os.write(1, payload.encode())
              except (OSError, ValueError):
                  pass


          def interrupt(signum, _frame):
              global expired
              expired = signum == signal.SIGALRM
              raise Failure(124 if expired else 128 + signum)


          for signum in (signal.SIGALRM, signal.SIGTERM, signal.SIGINT):
              signal.signal(signum, interrupt)


          def arm(deadline):
              signal.setitimer(signal.ITIMER_REAL, max(0.001, deadline - now()))


          def stop_tree(process, *, immediate=False):
              # Kill the whole owned process group, even after its leader exits: a
              # descendant may still retain stdout. Never wait for pipe EOF during reap.
              try:
                  os.killpg(process.pid, signal.SIGKILL if immediate else signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  if not immediate:
                      try:
                          process.wait(timeout=GRACE_SECONDS)
                      except subprocess.TimeoutExpired:
                          pass
              finally:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.stdout.close()
                  try:
                      process.wait(timeout=0.1)
                  except subprocess.TimeoutExpired:
                      pass


          def command(phase, argv, seconds, *, payload=None, write=False):
              """Cap startup, pipes and descendants; the phase watchdog also bounds reap."""
              global conflicting_write, mutation_started
              begin = now()
              if begin + seconds + GRACE_SECONDS + LOCAL_RESERVE_SECONDS > phase_deadline:
                  emit(phase, outcome='not_admitted', exit_class='deadline')
                  raise Failure(124)
              process = None
              completed = False
              result = bytearray()
              arm(min(phase_deadline, begin + seconds + GRACE_SECONDS))
              try:
                  if write:
                      mutation_started = True
                  emit(phase, outcome='started')
                  # A regular temporary stdin avoids blocking while feeding jq or output.
                  with tempfile.TemporaryFile() as source:
                      if payload is not None:
                          source.write(payload)
                          source.seek(0)
                      process = subprocess.Popen(argv, stdin=source, stdout=subprocess.PIPE,
                                                 stderr=subprocess.DEVNULL, start_new_session=True)
                      os.set_blocking(process.stdout.fileno(), False)
                      with selectors.DefaultSelector() as selector:
                          selector.register(process.stdout, selectors.EVENT_READ)
                          eof = False
                          while not (eof and process.poll() is not None):
                              remaining = begin + seconds - now()
                              if remaining <= 0:
                                  raise Failure(124)
                              for key, _ in selector.select(min(remaining, 0.05)):
                                  chunk = os.read(key.fd, 8192)
                                  if not chunk:
                                      selector.unregister(key.fileobj)
                                      eof = True
                                  else:
                                      result.extend(chunk)
                                      if len(result) > MAX_CAPTURE_BYTES:
                                          raise Failure(1)
                          if now() > begin + seconds:
                              raise Failure(124)
                          code = process.wait(timeout=0)
                          if code:
                              raise Failure(code if code > 0 else 128 - code)
                          completed = True
                          emit(phase, outcome='completed', elapsed_ms=(now() - begin) * 1000,
                               exit_class='success')
                          return bytes(result)
              except Failure as failure:
                  classification = ('deadline' if failure.code == 124 else
                                    'signal' if failure.code in (130, 143) else 'nonzero')
                  emit(phase, outcome='failed', elapsed_ms=(now() - begin) * 1000,
                       exit_class=classification)
                  raise
              except BaseException:
                  emit(phase, outcome='failed', elapsed_ms=(now() - begin) * 1000,
                       exit_class='internal')
                  raise
              finally:
                  if write and not completed:
                      # A timed-out/failed control-plane write may still complete remotely.
                      # Later samples cannot resolve an outstanding conflicting operation.
                      conflicting_write = True
                  if process is not None:
                      stop_tree(process, immediate=expired or completed)
                  if not expired and now() < phase_deadline:
                      arm(phase_deadline)
                  else:
                      signal.setitimer(signal.ITIMER_REAL, 0)


          def check(predicate, payload, *, args=()):
              command('predicate', ['jq', '-e', *args, predicate], PREDICATE_SECONDS, payload=payload)


          app = os.environ['AZURE_BACKEND_APP_NAME']
          group = os.environ['AZURE_RESOURCE_GROUP']
          az_base = ['az', 'webapp', 'config', 'appsettings']
          az_target = ['--name', app, '--resource-group', group]


          def set_positive(value, phase):
              command(phase, [*az_base, 'set', *az_target, '--settings',
                             'PRAXYS_ENABLE_FEEDBACK_PUBLICATION=' + value, '--output', 'none'],
                      WRITE_SECONDS, write=True)


          def settings():
              payload = command('settings_read', [*az_base, 'list', *az_target, '-o', 'json'], READ_SECONDS)
              # Only two booleans leave this process; no raw settings reach logs or outputs.
              result = command('settings_parse', ['jq', '-ec', '''
                def flag($name): [.[] | select(.name == $name) | .value]
                  | if length == 1 and (.[0] == "true" or .[0] == "false")
                    then .[0] == "true" else error("invalid flag") end;
                {positive: flag("PRAXYS_ENABLE_FEEDBACK_PUBLICATION"),
                 kill: flag("PRAXYS_DISABLE_FEEDBACK_PUBLICATION")}
              '''], PREDICATE_SECONDS, payload=payload)
              return json.loads(result)


          def read_runtime(positive, kill):
              version = command('version', ['curl', '-fsS', '--max-time', '8', '-H',
                  'Cache-Control: no-cache', 'https://api.praxys.run/api/version'], HTTP_SECONDS)
              ready = command('readiness', ['curl', '-fsS', '--max-time', '8', '-H',
                  'Cache-Control: no-cache', 'https://api.praxys.run/api/health/ready'], HTTP_SECONDS)
              check('.version == $version and .source_sha == $sha', version, args=(
                  '--arg', 'version', os.environ['PRAXYS_EXPECTED_API_VERSION'],
                  '--arg', 'sha', os.environ['PRAXYS_EXPECTED_API_SOURCE_SHA']))
              check('''.status == "ready"
                and .optional_processing.feedback_publication_positive_enable == $positive
                and .optional_processing.feedback_publication_kill_switch == $kill
                and .optional_processing.feedback_publication_enabled == $effective''', ready,
                args=('--argjson', 'positive', json.dumps(positive), '--argjson', 'kill', json.dumps(kill),
                      '--argjson', 'effective', json.dumps(positive and not kill)))


          def outputs(state, *, positive='unknown', kill='unknown', effective='unknown'):
              payload = (f'observation={state}\npositive={positive}\nkill_switch={kill}\n'
                         f'enabled={effective}\n').encode()
              command('outputs', ['bash', '-c', 'cat >> "$GITHUB_OUTPUT"'], OUTPUT_SECONDS, payload=payload)


          def restore():
              desired = os.environ['DESIRED_FEEDBACK_PUBLICATION']
              if desired not in ('true', 'false'):
                  raise Failure(1)
              set_positive(desired, 'restore_write')
              for attempt in range(36):
                  current = settings()  # Current control plane, then fresh runtime observations.
                  try:
                      read_runtime(desired == 'true', current['kill'])
                      if current['positive'] != (desired == 'true'):
                          raise Failure(1)
                  except Failure as failure:
                      if failure.code in (130, 143) or expired:
                          raise
                  else:
                      if conflicting_write:
                          raise Failure(1)
                      outputs('verified', positive=desired,
                              kill=str(current['kill']).lower(),
                              effective=str(current['positive'] and not current['kill']).lower())
                      return
                  if attempt < 35:
                      # Sleep itself is bounded by the same independent phase watchdog.
                      command('retry_gap', ['sleep', '5'], GAP_SECONDS + LOCAL_RESERVE_SECONDS)
              raise Failure(1)


          def cleanup():
              global cleanup_started, phase_deadline, expired, observation
              if cleanup_started or not mutation_started:
                  return
              cleanup_started = True
              expired = False
              phase_deadline = min(now() + CLEANUP_SECONDS, hard_deadline)
              arm(phase_deadline)
              emit('cleanup', outcome='started')
              try:
                  try:
                      set_positive('false', 'disable_write')
                  except Failure as failure:
                      if failure.code in (130, 143) or expired:
                          raise
                  current = settings()
                  if current['positive'] is False and not conflicting_write:
                      observation = 'control_plane_only'
                  try:
                      read_runtime(False, current['kill'])
                  except Failure as failure:
                      if failure.code in (130, 143) or expired:
                          raise
                  else:
                      if current['positive'] is False and not conflicting_write:
                          observation = 'verified_disabled'
                  if conflicting_write:
                      observation = 'unknown'
                  outputs(observation)
              except BaseException:
                  observation = 'unknown'
              emit('cleanup', outcome=observation)


          try:
              arm(phase_deadline)
              restore()
              verified = True
          except Failure as failure:
              original_failure = failure.code
          except BaseException:
              original_failure = 1
          finally:
              if not verified:
                  try:
                      cleanup()
                  except BaseException:
                      observation = 'unknown'
              emit('restoration', outcome='verified' if verified else observation)
              # os._exit avoids blocking on buffered stdout during interpreter teardown.
              # SIGKILL/runner loss can interrupt even cleanup; missing output means unknown.
              os._exit(0 if verified else original_failure or 1)
          PY

      - name: Set up source-policy observation interpreter after restoration
        if: success()
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install source-policy observation dependencies after restoration
        if: success()
        run: python -m pip install --quiet 'pydantic==2.13.4' 'pyyaml==6.0.3'

      - name: Observe exact DFA policy after normal publication restoration
        if: success()
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: >-
          python scripts/observe_dfa_policy.py
          --source-sha "$EXPECTED_SOURCE_SHA"
          --contract data/science/generated/contracts/sdr-activity-dfa-alpha1-v1.json
          --timeout-seconds 1200

      - name: Summarize backend deployment
        if: always()
        env:
          LIVE_RESULT: ${{ steps.live.outcome }}
          LIVE_READINESS: ${{ steps.live.outputs.readiness }}
          LIVE_CN_ENABLED: ${{ steps.live.outputs.cn_enabled }}
          LIVE_MINIAPP_ENABLED: ${{ steps.live.outputs.miniapp_enabled }}
          LIVE_AI_ENABLED: ${{ steps.live.outputs.ai_enabled }}
          LIVE_AI_KILL_SWITCH: ${{ steps.live.outputs.ai_kill_switch }}
          LIVE_FEEDBACK_PUBLICATION_OBSERVATION: ${{ steps.publication.outcome == 'success' && steps.publication.outputs.observation || 'unknown' }}
          LIVE_FEEDBACK_PUBLICATION_RESULT: ${{ steps.publication.outcome }}
          LIVE_FEEDBACK_PUBLICATION_POSITIVE: ${{ steps.publication.outcome == 'success' && steps.publication.outputs.positive || 'unknown' }}
          LIVE_FEEDBACK_PUBLICATION_KILL: ${{ steps.publication.outcome == 'success' && steps.publication.outputs.kill_switch || 'unknown' }}
          LIVE_FEEDBACK_PUBLICATION_ENABLED: ${{ steps.publication.outcome == 'success' && steps.publication.outputs.enabled || 'unknown' }}
        shell: bash
        run: |
          {
            echo "## Backend deployment"
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- API version: \`${PRAXYS_EXPECTED_API_VERSION:-unavailable}\`"
            echo "- Live verification: ${LIVE_RESULT:-not-run} / ${LIVE_READINESS:-unavailable}"
            echo "- China processing enabled: ${LIVE_CN_ENABLED:-unavailable}"
            echo "- Miniapp processing enabled: ${LIVE_MINIAPP_ENABLED:-unavailable}"
            echo "- Azure AI enabled: ${LIVE_AI_ENABLED:-unavailable}"
            echo "- Azure AI emergency stop: ${LIVE_AI_KILL_SWITCH:-unavailable}"
            echo "- Feedback publication observation: ${LIVE_FEEDBACK_PUBLICATION_OBSERVATION:-unknown}"
            echo "- Feedback publication restoration: ${LIVE_FEEDBACK_PUBLICATION_RESULT:-not-run}"
            echo "- Feedback publication positive enable: ${LIVE_FEEDBACK_PUBLICATION_POSITIVE:-unavailable}"
            echo "- Feedback publication emergency stop: ${LIVE_FEEDBACK_PUBLICATION_KILL:-unavailable}"
            echo "- Feedback publication effective: ${LIVE_FEEDBACK_PUBLICATION_ENABLED:-unavailable}"
          } >> "${GITHUB_STEP_SUMMARY}"
