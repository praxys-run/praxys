name: Selective review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_run:
    workflows: ["Pre-merge CI"]
    types: [completed]
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: false
        type: number

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: selective-review-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request number
        id: target
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$EVENT_PR_NUMBER" "$WORKFLOW_PR_NUMBER" "$INPUT_PR_NUMBER"; do
            if [[ -n "$value" && "$value" != "0" ]]; then
              echo "pr_number=$value" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "pr_number=" >> "$GITHUB_OUTPUT"

      - name: Mark policy gate pending
        if: steps.target.outputs.pr_number != ''
        id: gate-status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -r .head.sha <<< "$pull")"
          base_sha="$(jq -r .base.sha <<< "$pull")"
          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${head_sha}" \
            -f state=pending \
            -f context=selective-review-policy \
            -f description="Selective-review policy is evaluating this head." \
            --silent

      - name: Require translation validation for generated i18n PRs
        if: steps.target.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate-status.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r .user.login <<< "$pull")"
          head_ref="$(jq -r .head.ref <<< "$pull")"
          if [[ "$author" != "github-actions[bot]" || "$head_ref" != i18n/refresh-zh-* ]]; then
            exit 0
          fi
          translation_state="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '[.statuses[] | select(.context == "translation-validation")] | sort_by(.updated_at) | last | .state // empty'
          )"
          if [[ "$translation_state" != "success" ]]; then
            echo "::error::Generated i18n PR requires translation-validation=success on the exact head."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: always()
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install science approval verifier dependencies
        if: steps.target.outputs.pr_number != ''
        run: >-
          pip install --quiet --disable-pip-version-check
          'pydantic==2.13.4' 'pyyaml==6.0.3'

      - name: Checkout pull request base for science approval comparison
        if: steps.target.outputs.pr_number != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.gate-status.outputs.base_sha }}
          path: approval-base
          persist-credentials: false

      - name: Checkout pull request head without executing it
        if: steps.target.outputs.pr_number != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.gate-status.outputs.head_sha }}
          path: approval-head
          persist-credentials: false

      - name: Fetch science approval comments and reviewer permissions
        if: steps.target.outputs.pr_number != ''
        id: science-review-input
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          comments="$RUNNER_TEMP/science-comments-${PR_NUMBER}.json"
          permissions="$RUNNER_TEMP/science-permissions-${PR_NUMBER}.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            | jq -s 'add' > "$comments"
          printf '{}\n' > "$permissions"
          while IFS= read -r login; do
            encoded="$(jq -rn --arg value "$login" '$value | @uri')"
            permission="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/collaborators/${encoded}/permission" \
                --jq .permission 2>/dev/null || printf 'none'
            )"
            next="$permissions.next"
            jq --arg login "$login" --arg permission "$permission" \
              '. + {($login): $permission}' "$permissions" > "$next"
            mv "$next" "$permissions"
          done < <(jq -r '.[].user.login // empty' "$comments" | sort -u)
          {
            echo "comments=$comments"
            echo "permissions=$permissions"
          } >> "$GITHUB_OUTPUT"

      - name: Verify authenticated science approvals
        if: steps.target.outputs.pr_number != ''
        run: >-
          python scripts/verify_science_approval_sources.py
          --base-science-dir approval-base/data/science
          --head-science-dir approval-head/data/science
          --github-comments "${{ steps.science-review-input.outputs.comments }}"
          --github-permissions "${{ steps.science-review-input.outputs.permissions }}"

      - name: Evaluate deterministic review policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          SELECTIVE_REVIEW_ENABLED: ${{ vars.PRAXYS_SELECTIVE_REVIEW_ENABLED }}
          SELECTIVE_REVIEW_KILL_SWITCH: ${{ vars.PRAXYS_SELECTIVE_REVIEW_KILL_SWITCH }}
          POLICY_APP_SLUG: ${{ vars.PRAXYS_REVIEW_POLICY_APP_SLUG }}
        run: python scripts/selective_review_gate.py

      - name: Mint independent policy App token
        if: >-
          steps.policy.outputs.needs_policy_app == 'true' &&
          vars.PRAXYS_REVIEW_POLICY_APP_ID != '' &&
          vars.PRAXYS_REVIEW_POLICY_APP_SLUG != ''
        id: policy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PRAXYS_REVIEW_POLICY_APP_ID }}
          private-key: ${{ secrets.PRAXYS_REVIEW_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Require the policy App for autonomous action or cleanup
        id: policy-app
        if: always() && steps.policy.outputs.needs_policy_app == 'true'
        env:
          POLICY_APP_TOKEN: ${{ steps.policy-token.outputs.token }}
          POLICY_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          EXPECTED_POLICY_APP_SLUG: ${{ vars.PRAXYS_REVIEW_POLICY_APP_SLUG }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_POLICY_APP_SLUG" ]]; then
            echo "::error::PRAXYS_REVIEW_POLICY_APP_SLUG is required for autonomous action or cleanup."
            exit 1
          fi
          if [[ -z "$POLICY_APP_TOKEN" || -z "$POLICY_APP_SLUG" ]]; then
            echo "::error::The selective-review policy App is required for this candidate or stale-state cleanup."
            exit 1
          fi
          if [[ "$POLICY_APP_SLUG" != "$EXPECTED_POLICY_APP_SLUG" ]]; then
            echo "::error::The minted policy App identity does not match the configured slug."
            exit 1
          fi

      - name: Neutralize prior policy state before privileged action
        if: always() && steps.policy-app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          POLICY_APP_LOGIN: ${{ steps.policy-token.outputs.app-slug }}[bot]
          REQUIRE_POLICY_STATE: ${{ steps.policy.outputs.policy_state_present }}
        run: bash .github/scripts/revoke-selective-review.sh

      - name: Re-evaluate current policy state
        if: >-
          steps.policy.outputs.decision == 'auto-merge-candidate' &&
          steps.policy-app.outcome == 'success'
        id: final-policy
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ steps.policy.outputs.pr_number }}
          SELECTIVE_REVIEW_ENABLED: ${{ vars.PRAXYS_SELECTIVE_REVIEW_ENABLED }}
          SELECTIVE_REVIEW_KILL_SWITCH: ${{ vars.PRAXYS_SELECTIVE_REVIEW_KILL_SWITCH }}
          POLICY_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
        run: python scripts/selective_review_gate.py

      - name: Require the same exact refs after privileged setup
        if: steps.final-policy.outputs.decision == 'auto-merge-candidate'
        env:
          INITIAL_HEAD_SHA: ${{ steps.policy.outputs.head_sha }}
          INITIAL_BASE_REF: ${{ steps.policy.outputs.base_ref }}
          INITIAL_BASE_SHA: ${{ steps.policy.outputs.base_sha }}
          FINAL_HEAD_SHA: ${{ steps.final-policy.outputs.head_sha }}
          FINAL_BASE_REF: ${{ steps.final-policy.outputs.base_ref }}
          FINAL_BASE_SHA: ${{ steps.final-policy.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FINAL_HEAD_SHA" != "$INITIAL_HEAD_SHA" ||
            "$FINAL_BASE_REF" != "$INITIAL_BASE_REF" ||
            "$FINAL_BASE_SHA" != "$INITIAL_BASE_SHA" ]]; then
            echo "::error::Pull request refs changed during privileged policy setup."
            exit 1
          fi

      - name: Recheck runtime controls before approval
        if: >-
          steps.policy-app.outcome == 'success' &&
          steps.final-policy.outputs.decision == 'auto-merge-candidate'
        env:
          POLICY_APP_TOKEN: ${{ steps.policy-token.outputs.token }}
          POLICY_APP_SLUG: ${{ steps.policy-token.outputs.app-slug }}
          RUNTIME_ENABLED: ${{ vars.PRAXYS_SELECTIVE_REVIEW_ENABLED }}
          RUNTIME_KILL_SWITCH: ${{ vars.PRAXYS_SELECTIVE_REVIEW_KILL_SWITCH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$POLICY_APP_TOKEN" || -z "$POLICY_APP_SLUG" ]]; then
            echo "::error::The selective-review policy App is not configured."
            exit 1
          fi
          if [[ "${RUNTIME_ENABLED,,}" != "true" ||
            "${RUNTIME_KILL_SWITCH,,}" == "true" ]]; then
            echo "::error::Selective review was disabled after policy evaluation."
            exit 1
          fi

      - name: Approve through the independent policy App
        if: >-
          steps.policy-app.outcome == 'success' &&
          steps.final-policy.outputs.decision == 'auto-merge-candidate'
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          PR_NUMBER: ${{ steps.final-policy.outputs.pr_number }}
          POLICY_VERSION: ${{ steps.final-policy.outputs.policy_version }}
          HEAD_SHA: ${{ steps.final-policy.outputs.head_sha }}
          BASE_REF: ${{ steps.final-policy.outputs.base_ref }}
          BASE_SHA: ${{ steps.final-policy.outputs.base_sha }}
        run: |
          set -euo pipefail
          marker="selective-review:${POLICY_VERSION}:${HEAD_SHA}"
          current_pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head="$(jq -r '.head.sha' <<< "$current_pull")"
          current_base_ref="$(jq -r '.base.ref' <<< "$current_pull")"
          current_base_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" \
              --jq .object.sha
          )"
          if [[ "$current_head" != "$HEAD_SHA" ||
            "$current_base_ref" != "$BASE_REF" ||
            "$current_base_sha" != "$BASE_SHA" ]]; then
            echo "::error::Pull request refs changed after policy evaluation."
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f commit_id="$HEAD_SHA" \
            -f body="Approved by the independent selective-review policy App. (${marker})"

      - name: Recheck runtime controls before auto-merge
        if: steps.final-policy.outputs.decision == 'auto-merge-candidate'
        env:
          RUNTIME_ENABLED: ${{ vars.PRAXYS_SELECTIVE_REVIEW_ENABLED }}
          RUNTIME_KILL_SWITCH: ${{ vars.PRAXYS_SELECTIVE_REVIEW_KILL_SWITCH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNTIME_ENABLED,,}" != "true" ||
            "${RUNTIME_KILL_SWITCH,,}" == "true" ]]; then
            echo "::error::Selective review was disabled before auto-merge."
            exit 1
          fi

      - name: Enable normal squash auto-merge
        if: >-
          steps.policy-app.outcome == 'success' &&
          steps.final-policy.outputs.decision == 'auto-merge-candidate'
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          PR_NUMBER: ${{ steps.final-policy.outputs.pr_number }}
          HEAD_SHA: ${{ steps.final-policy.outputs.head_sha }}
          BASE_REF: ${{ steps.final-policy.outputs.base_ref }}
          BASE_SHA: ${{ steps.final-policy.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_pull="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head="$(jq -r '.head.sha' <<< "$current_pull")"
          current_base_ref="$(jq -r '.base.ref' <<< "$current_pull")"
          current_base_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_REF}" \
              --jq .object.sha
          )"
          if [[ "$current_head" != "$HEAD_SHA" ||
            "$current_base_ref" != "$BASE_REF" ||
            "$current_base_sha" != "$BASE_SHA" ]]; then
            echo "::error::Pull request refs changed before auto-merge."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --auto --squash --delete-branch --match-head-commit "$HEAD_SHA"

      - name: Mark policy gate safe
        if: success() && steps.gate-status.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate-status.outputs.head_sha }}
          RUNTIME_KILL_SWITCH: ${{ vars.PRAXYS_SELECTIVE_REVIEW_KILL_SWITCH }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNTIME_KILL_SWITCH,,}" == "true" ]]; then
            echo "::error::Selective review was emergency-stopped before policy completion."
            exit 1
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=selective-review-policy \
            -f description="Selective-review policy completed safely." \
            --silent

      - name: Revoke policy state after action failure
        if: failure() && steps.policy-app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.policy-token.outputs.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          POLICY_APP_LOGIN: ${{ steps.policy-token.outputs.app-slug }}[bot]
        run: bash .github/scripts/revoke-selective-review.sh

      - name: Mark policy gate failed
        if: failure() && steps.gate-status.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.gate-status.outputs.head_sha }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure \
            -f context=selective-review-policy \
            -f description="Selective-review policy failed; human intervention is required." \
            --silent
