name: Deploy Frontend (Azure + Tencent)

# Region-pinned static SPA host in East Asia (the "F4" perf fix —
# replaced the SWA-Amsterdam path that added 200-300ms RTT for CN
# users). Both this site and trainsight-app share plan-trainsight at
# $0 incremental.
#
# The same web/dist build can also deploy to the Tencent Lighthouse
# mainland-China static origin. That lane is gated by the
# TENCENT_LIGHTHOUSE_DEPLOY_ENABLED repository variable so Azure remains
# deployable while the server and ICP filing are being provisioned.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'frontend_server/**'
      - 'scripts/appinsights_boundary.sh'
      - '.github/azure-observability.env'
      - '.github/workflows/deploy-frontend-appservice.yml'
    tags:
      - 'web-*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install frontend_server deps + pytest
        # Only the static-server's runtime deps (~30 MB) plus pytest —
        # not the backend's full requirements. Keeps this job fast.
        run: |
          pip install -r frontend_server/requirements-frontend.txt
          pip install pytest httpx
      - name: Run frontend_server tests
        run: python -m pytest tests/test_frontend_server_spa.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Load observability resource names
        shell: bash
        run: cat .github/azure-observability.env >> "$GITHUB_ENV"

      - name: Azure Login for frontend telemetry (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve frontend telemetry resource
        shell: bash
        run: bash scripts/appinsights_boundary.sh frontend-resolve

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Compute build version
        # Synthetic CalVer-ish version baked into the bundle and
        # surfaced by the Settings footer. Matches the mini-program
        # publish workflow so all three surfaces (web / api /
        # miniapp) read identically. Tagged releases ``web-YYYY.MM.MICRO``
        # strip the prefix so the displayed string matches the tag.
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == web-* ]]; then
            VERSION="${GITHUB_REF_NAME#web-}"
          else
            VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${VERSION}"

      - name: Build web bundle
        working-directory: web
        # --legacy-peer-deps because vite-plugin-pwa@1.2 declares older
        # peer ranges than vite@8 (already documented in web/.npmrc).
        run: |
          npm ci --legacy-peer-deps
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENV: ${{ vars.STATSIG_ENV || 'production' }}

      - name: Stamp static health metadata
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > web/dist/deployed_sha.txt
          printf '{"ok":true,"service":"praxys-frontend","deployed_sha":"%s"}\n' \
            "${GITHUB_SHA}" > web/dist/healthz

      - name: Stage Azure deploy package
        # The deploy zip mirrors the repo layout that frontend_server.main
        # expects: ``frontend_server/`` and ``web/dist/`` as siblings of
        # ``requirements.txt`` so Oryx installs only the static-server's
        # minimal deps (FastAPI + uvicorn), not the backend's full set.
        run: |
          mkdir -p deploy-pkg/web
          cp -r frontend_server deploy-pkg/
          cp -r web/dist deploy-pkg/web/dist
          cp frontend_server/requirements-frontend.txt deploy-pkg/requirements.txt
          printf '%s\n' "${GITHUB_SHA}" > deploy-pkg/frontend_server/_deployed_sha.txt
          ls -R deploy-pkg | head -50

      - name: Stage Tencent static package
        shell: bash
        run: tar -C web/dist -czf praxys-web.tgz .

      - name: Upload Azure package
        uses: actions/upload-artifact@v7
        with:
          name: frontend-azure-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-pkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload Tencent package
        uses: actions/upload-artifact@v7
        with:
          name: frontend-tencent-${{ github.run_id }}-${{ github.run_attempt }}
          path: praxys-web.tgz
          if-no-files-found: error
          retention-days: 7

  deploy_azure:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Azure package
        uses: actions/download-artifact@v8
        with:
          name: frontend-azure-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-pkg

      - name: Deploy to praxys-frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: praxys-frontend
          resource-group-name: rg-trainsight
          package: deploy-pkg

  deploy_tencent:
    if: >-
      vars.TENCENT_LIGHTHOUSE_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on:
      group: praxys-production
      labels: praxys-cn-frontend
    steps:
      - name: Download Tencent package
        uses: actions/download-artifact@v8
        with:
          name: frontend-tencent-${{ github.run_id }}-${{ github.run_attempt }}
          path: china-package

      - name: Activate static release
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root="/var/www/praxys"
          archive="${GITHUB_WORKSPACE}/china-package/praxys-web.tgz"
          release="${root}/releases/${release_id}"
          activated=0

          cleanup() {
            rm -f -- "${archive}"
            if [[ "${activated}" -eq 0 ]]; then
              rm -rf -- "${release}"
            fi
          }
          trap cleanup EXIT

          test -f "${archive}"
          mkdir -p "${release}"
          tar -xzf "${archive}" -C "${release}"
          test -s "${release}/index.html"
          test "$(cat "${release}/deployed_sha.txt")" = "${GITHUB_SHA}"

          ln -sfn "${release}" "${root}/current.next"
          mv -Tf "${root}/current.next" "${root}/current"
          activated=1

          find "${root}/releases" -mindepth 1 -maxdepth 1 -type d \
            -printf '%T@ %p\n' \
            | sort -nr \
            | awk 'NR > 5 {sub(/^[^ ]+ /, ""); print}' \
            | xargs -r rm -rf --

      - name: Verify Lighthouse deployment
        shell: bash
        run: |
          set -euo pipefail
          deployed_sha="$(cat /var/www/praxys/current/deployed_sha.txt)"
          test "${deployed_sha}" = "${GITHUB_SHA}"
          curl --fail --silent --show-error --max-time 10 \
            --header 'Host: www.praxys.run' \
            http://127.0.0.1/healthz >/dev/null
