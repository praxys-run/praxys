name: Deploy Frontend to Azure

# Azure receives the filing-free .run package. EdgeOne's credential-free native
# Git integration builds protected main independently. This workflow only
# validates that regional build after staging the Azure package.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'frontend_server/**'
      - 'scripts/appinsights_boundary.sh'
      - '.github/azure-observability.env'
      - '.github/workflows/deploy-frontend-appservice.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install frontend_server deps + pytest
        run: |
          pip install -r frontend_server/requirements-frontend.txt
          pip install pytest httpx
      - name: Run frontend_server tests
        run: >-
          python -m pytest
          tests/test_frontend_server_spa.py
          tests/test_regional_frontend_config.py
          -v

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_FRONTEND_APP_NAME: praxys-frontend
      AZURE_RESOURCE_GROUP: rg-trainsight
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Load observability resource names
        shell: bash
        run: cat .github/azure-observability.env >> "$GITHUB_ENV"

      - name: Validate Azure deployment identifiers
        shell: bash
        run: |
          set -euo pipefail
          uuid_re="^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ "${!name}" =~ ${uuid_re} ]] || exit 1
          done
          [[ "${AZURE_FRONTEND_APP_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,58}[A-Za-z0-9]$ ]]
          [[ "${AZURE_RESOURCE_GROUP}" =~ ^[A-Za-z0-9._()-]{0,89}[A-Za-z0-9_()-]$ ]]

      - name: Azure Login for frontend telemetry (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve frontend telemetry resource
        shell: bash
        run: bash scripts/appinsights_boundary.sh frontend-resolve

      - uses: actions/setup-node@v7
        with:
          node-version: '24.11.0'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Compute build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" =~ ^web-([0-9]{4}\.(0[1-9]|1[0-2])\.[0-9]{1,4})$ ]]
            VERSION="${BASH_REMATCH[1]}"
          else
            [[ "${GITHUB_RUN_NUMBER}" =~ ^[0-9]+$ ]]
            VERSION="$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build web bundle
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
          VITE_SOURCE_SHA: ${{ github.sha }}
          VITE_STATSIG_CLIENT_KEY: ${{ vars.VITE_STATSIG_CLIENT_KEY }}
          VITE_STATSIG_ENV: ${{ vars.STATSIG_ENV || 'production' }}
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Stamp static health metadata
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > web/dist/deployed_sha.txt
          printf '{"ok":true,"service":"praxys-frontend","deployed_sha":"%s"}\n' \
            "${GITHUB_SHA}" > web/dist/healthz

      - name: Verify shared build is filing-free
        shell: bash
        run: |
          set -euo pipefail
          for forbidden in \
            '沪ICP备2025109616号-2' \
            'name="praxys-deployment-region" content="cn"'; do
            if grep -R --binary-files=text -Fq "${forbidden}" web/dist; then
              echo "The shared Azure build contains China-only metadata: ${forbidden}" >&2
              exit 1
            fi
          done

      - name: Stage Azure deploy package
        run: |
          mkdir -p deploy-pkg/web
          cp -r frontend_server deploy-pkg/
          cp -r web/dist deploy-pkg/web/dist
          cp frontend_server/requirements-frontend.txt deploy-pkg/requirements.txt
          printf '%s\n' "${GITHUB_SHA}" > deploy-pkg/frontend_server/_deployed_sha.txt

      - name: Validate EdgeOne regional build
        shell: bash
        run: npm --prefix web run build:edgeone

      - name: Upload Azure package
        uses: actions/upload-artifact@v7
        with:
          name: frontend-azure-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-pkg
          if-no-files-found: error
          retention-days: 30

  deploy_azure:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_FRONTEND_APP_NAME: praxys-frontend
      AZURE_RESOURCE_GROUP: rg-trainsight
    steps:
      - name: Initialize Azure deployment evidence
        shell: bash
        run: |
          jq -n \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg startedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{status: "started", sourceSha: $sourceSha, startedAt: $startedAt}' \
            > "${RUNNER_TEMP}/azure-frontend-deployment.json"

      - name: Validate Azure deployment identifiers
        shell: bash
        run: |
          set -euo pipefail
          uuid_re="^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            [[ "${!name}" =~ ${uuid_re} ]] || exit 1
          done
          [[ "${AZURE_FRONTEND_APP_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,58}[A-Za-z0-9]$ ]]
          [[ "${AZURE_RESOURCE_GROUP}" =~ ^[A-Za-z0-9._()-]{0,89}[A-Za-z0-9_()-]$ ]]

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Download Azure package
        uses: actions/download-artifact@v8
        with:
          name: frontend-azure-${{ github.run_id }}-${{ github.run_attempt }}
          path: deploy-pkg

      - name: Deploy to praxys-frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_FRONTEND_APP_NAME }}
          resource-group-name: ${{ env.AZURE_RESOURCE_GROUP }}
          package: deploy-pkg

      - name: Verify Azure deployment
        shell: bash
        run: |
          set -euo pipefail
          fetch_matching_health() {
            local url="$1" output="$2"
            for _ in {1..12}; do
              if curl --fail --silent --show-error \
                --connect-timeout 5 --max-time 15 "${url}" > "${output}" \
                && test "$(jq -r '.deployed_sha // empty' "${output}")" = "${GITHUB_SHA}"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }
          origin_health="${RUNNER_TEMP}/azure-origin-health.json"
          public_health="${RUNNER_TEMP}/azure-public-health.json"
          fetch_matching_health "https://praxys-frontend.azurewebsites.net/healthz" "${origin_health}"
          fetch_matching_health "https://www.praxys.run/healthz" "${public_health}"
          jq -n \
            --arg status success \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg checkedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile origin "${origin_health}" \
            --slurpfile public "${public_health}" \
            '{
              status: $status,
              sourceSha: $sourceSha,
              checkedAt: $checkedAt,
              origin: $origin[0],
              public: $public[0]
            }' > "${RUNNER_TEMP}/azure-frontend-deployment.json"

      - name: Finalize Azure deployment evidence
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          evidence="${RUNNER_TEMP}/azure-frontend-deployment.json"
          jq \
            --arg workflowStatus "${JOB_STATUS}" \
            --arg finishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {workflowStatus: $workflowStatus, finishedAt: $finishedAt}
             | if .status == "success" then . else .status = $workflowStatus end' \
            "${evidence}" > "${evidence}.tmp"
          mv "${evidence}.tmp" "${evidence}"

      - name: Upload Azure deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azure-frontend-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azure-frontend-deployment.json
          if-no-files-found: error
          retention-days: 90
