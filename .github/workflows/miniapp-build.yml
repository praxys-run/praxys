name: Miniapp build

# Native WeChat Mini Program validation for main pushes and manual runs.
# PR validation uses the same checks in ci-premerge.yml.
# Does NOT upload to WeChat — uploading is `miniapp-publish.yml`'s job. This
# workflow exists so PRs get a typecheck signal: it runs the `pretypecheck`
# chain (sync-types + sync-i18n + sync-legal) followed by `tsc --noEmit`, then
# sanity-checks the on-disk miniapp/ tree against the page list declared in
# app.json.
#
# i18n note: the miniapp consumes `web/src/locales/{en,zh}/messages.po` via
# `scripts/sync-i18n.cjs` (run by `pretypecheck`). The translation pipeline
# itself lives in `.github/workflows/i18n.yml` — that workflow extracts and
# fills the canonical .po files; the miniapp inherits them at typecheck/build
# time. There is intentionally no separate i18n workflow for `miniapp/`.

on:
  push:
    branches: [main]
    paths:
      - 'miniapp/**'
      - 'web/src/locales/**'
      - 'web/src/types/api.ts'
      - 'web/src/lib/legal.ts'
      - '.github/workflows/miniapp-build.yml'
      - 'scripts/check_miniapp_source.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: miniapp/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck (also runs source synchronization)
        run: npm run typecheck
      - name: Require generated miniapp sources to be committed
        run: |
          if ! git diff --exit-code -- \
            types/api.ts \
            utils/i18n-catalog.ts \
            utils/legal.ts; then
            echo "::error::Generated miniapp sources are stale."
            echo "::error::Run 'npm run typecheck' in miniapp/ and commit the result."
            exit 1
          fi
      - name: Check miniapp pages, components, and source size
        run: bash ../scripts/check_miniapp_source.sh
